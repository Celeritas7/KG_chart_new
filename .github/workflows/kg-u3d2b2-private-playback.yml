name: KG Chart U3D2B2 - private offline playback and worker denial (synthetic)

on:
  pull_request:
    paths:
      - 'js/kg-private-offline-playback.mjs'
      - 'js/kg-private-offline-media.mjs'
      - 'js/kg-audio.js'
      - 'js/kg-protected-image.mjs'
      - 'offline/runtime.js'
      - 'offline/sw.js'
      - 'tools/build-offline.mjs'
      - 'tools/tests/u3d2b2-private-playback.test.mjs'
      - 'tools/tests/u3d1-offline-policy.test.mjs'
      - 'tools/tests/u3c2b2-protected-media.test.mjs'
      - 'docs/U3D2B2-PRIVATE-OFFLINE-REVIEW.md'
      - '.github/workflows/kg-u3d2b2-private-playback.yml'
      - 'offline/access-outbox.js'
      - 'tools/tests/u3d3a-outbox-hold.test.mjs'
      - 'docs/U3D3A-OUTBOX-REVIEW.md'
      - '.github/workflows/kg-u3d3a-outbox-hold.yml'
      - '.github/workflows/kg-u3c1-learner-access.yml'
      - '.github/workflows/kg-u3c2b1-protected-player.yml'
      - '.github/workflows/kg-u3c2b2-protected-media.yml'
      - '.github/workflows/kg-u3d1-offline-policy.yml'
      - '.github/workflows/kg-u3d2a-scoped-pack.yml'
      - '.github/workflows/kg-u3d2b1-private-media-stage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-playback-authorization:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify isolated private worker / audio / image and previous source contracts
        run: |
          set -euo pipefail
          node --check js/kg-private-offline-playback.mjs
          node --check js/kg-audio.js
          node --check js/kg-protected-image.mjs
          node --check offline/access-outbox.js
          node --check offline/runtime.js
          node --check offline/sw.js
          node --test tools/tests/u3d2b2-private-playback.test.mjs tools/tests/u3c2b2-protected-media.test.mjs tools/tests/u3d2b1-private-media-stage.test.mjs tools/tests/u3d2a-scoped-pack.test.mjs tools/tests/u3d1-offline-policy.test.mjs offline/tests/private-lesson-privacy.test.mjs tools/tests/u3d3a-outbox-hold.test.mjs
      - name: Enforce default-OFF flags and exact source-only path allowlist
        run: |
          set -euo pipefail
          grep -Fq 'const U3C1_SCOPED_UI_ENABLED = false;' index.html
          grep -Fq 'const U3D1_OFFLINE_ACCESS_ENABLED = false;' offline/runtime.js
          grep -Fq 'const U3D2_SCOPED_PACK_PREVIEW_ENABLED = false;' offline/runtime.js
          grep -Fq 'const U3D2B1_PRIVATE_MEDIA_STAGE_ENABLED = false;' offline/runtime.js
          grep -Fq 'const U3D2B2_PRIVATE_OFFLINE_PLAYBACK_ENABLED = false;' offline/runtime.js
          grep -Fq 'const U3D3A_OUTBOX_HOLD_ENABLED = false;' offline/runtime.js
          BASE=$(git merge-base origin/main HEAD)
          git diff --name-only "$BASE" HEAD | tee /tmp/u3d2b2-reviewed.txt
          while IFS= read -r path; do
            case "$path" in
              js/kg-private-offline-playback.mjs|js/kg-audio.js|js/kg-protected-image.mjs|offline/runtime.js|offline/sw.js|tools/tests/u3d1-offline-policy.test.mjs|tools/tests/u3c2b2-protected-media.test.mjs|tools/build-offline.mjs|tools/tests/u3d2b2-private-playback.test.mjs|docs/U3D2B2-PRIVATE-OFFLINE-REVIEW.md|.github/workflows/kg-u3d2b2-private-playback.yml|offline/access-outbox.js|tools/tests/u3d3a-outbox-hold.test.mjs|tools/tests/u3d1-offline-policy.test.mjs|tools/tests/u3d2a-scoped-pack.test.mjs|docs/U3D3A-OUTBOX-REVIEW.md|.github/workflows/kg-u3d3a-outbox-hold.yml|.github/workflows/kg-u3c1-learner-access.yml|.github/workflows/kg-u3c2b1-protected-player.yml|.github/workflows/kg-u3c2b2-protected-media.yml|.github/workflows/kg-u3d1-offline-policy.yml|.github/workflows/kg-u3d2a-scoped-pack.yml|.github/workflows/kg-u3d2b1-private-media-stage.yml)
                ;;
              *)
                echo "Unreviewed U3D2B2 path: $path"
                exit 1
                ;;
            esac
          done < /tmp/u3d2b2-reviewed.txt
          if grep -Eq '^(sql/|supabase/|index.html|offline/pictures.js|offline/audio-manifest.js)' /tmp/u3d2b2-reviewed.txt; then
            echo 'No production SQL, Edge, online learner, or old media changes permitted'
            exit 1
          fi

# Source-only synthetic tests; the full dual-edition workflow performs real
# isolated Chromium migration/rollback and verifies existing owner media/outbox.
