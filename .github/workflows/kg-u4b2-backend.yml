name: KG Chart U4B2 - isolated database authorization
# Intentionally unfiltered: this fixture suite consumes SQL, Python, Edge,
# client helpers and shared prerequisites. A partial path allowlist can
# silently skip revocation/ownership checks on a dependency-only change.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-database:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify the unconditional PR trigger contract
        run: python3 tools/tests/u4b2-ci-trigger-contract.py
      - name: Recheck synthetic Edge authorization contracts
        run: node --experimental-strip-types --test tools/tests/u3b3b2-private-delivery.test.mjs tools/tests/u3b2-pronounce-preflight.test.mjs
      - name: Start disposable PostgreSQL 17 with disabled network
        run: |
          set -euo pipefail
          docker run -d --name kg-u4b2-test-db \
            --network none \
            -e POSTGRES_PASSWORD=synthetic-ci-only \
            -e POSTGRES_DB=kg_u4b2_fixture postgres:17-alpine
          for i in {1..50}; do
            if docker exec kg-u4b2-test-db psql -X -At -v ON_ERROR_STOP=1 \
               -U postgres -d kg_u4b2_fixture -c 'SELECT 1' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo 'Synthetic database not ready' >&2
          exit 1
      - name: Test RLS/group/topic grants against invented learner data
        run: |
          set -euo pipefail
          pgfixture() {
            docker exec -i kg-u4b2-test-db psql -X -v ON_ERROR_STOP=1 \
              -U postgres -d kg_u4b2_fixture
          }
          pgfixture < tools/tests/u1-access-fixture.sql
          pgfixture < sql/kg-chart-u1-access-foundation.sql
          pgfixture < tools/tests/u3a-access-fixture.sql
          pgfixture < tools/tests/u3b1-content-fixture.sql
          pgfixture < sql/kg-chart-u3a-access-snapshot.sql
          pgfixture < sql/kg-chart-u3b1-restrictive-content-rls.sql
          pgfixture < tools/tests/u3b2-write-fixture.sql
          pgfixture < sql/kg-chart-u3b2-write-rpc-guards.sql
          pgfixture < sql/kg-chart-u3b3a-private-records.sql
          pgfixture < tools/tests/u3b3a-private-fixture.sql
          pgfixture < sql/kg-chart-u3b3b1-legacy-private-write-rpc.sql
          pgfixture < sql/kg-chart-u3b3b2-private-media-registry.sql
          pgfixture < tools/tests/u3b3b2-private-media-fixture.sql
          pgfixture < sql/kg-chart-u3c2-sentence-topic-mapping.sql
          pgfixture < sql/kg-chart-u3c2-sentence-topic-mapping.sql
          pgfixture < tools/tests/u3c2-sentence-fixture.sql
          pgfixture < tools/tests/u3c2-sentence-assertions.sql
          pgfixture < tools/tests/u4b2-backend-assertions.sql
      - name: Characterize concurrent revocation (not release approval)
        run: timeout 60s python3 tools/tests/u4b2b-revocation-race.py
      - name: Test candidate revision guard against reproduced race
        run: |
          set -euo pipefail
          docker exec -i kg-u4b2-test-db psql -X -v ON_ERROR_STOP=1 -U postgres -d kg_u4b2_fixture < tools/tests/u4b2b-quiz-lock-prototype.sql
          timeout 60s python3 tools/tests/u4b2b-revocation-race.py --require-rejection
      - name: Verify quiz-answer ownership and revision guard
        run: |
          set -euo pipefail
          docker exec -i kg-u4b2-test-db psql -X -v ON_ERROR_STOP=1 -U postgres -d kg_u4b2_fixture < tools/tests/u4b2-3a-answer-guard.sql
          timeout 60s python3 tools/tests/u4b2-3a-answer-association.py
      - name: Verify vocabulary-rating ownership and revision guard
        run: |
          set -euo pipefail
          docker exec -i kg-u4b2-test-db psql -X -v ON_ERROR_STOP=1 -U postgres -d kg_u4b2_fixture < tools/tests/u4b2-3b-rating-guard.sql
          timeout 120s python3 tools/tests/u4b2-3b-rating-ownership.py
      - name: Verify topic-completion ownership and revision guard
        run: |
          set -euo pipefail
          docker exec -i kg-u4b2-test-db psql -X -v ON_ERROR_STOP=1 -U postgres -d kg_u4b2_fixture < tools/tests/u4b2-3c-completion-guard.sql
          timeout 120s python3 tools/tests/u4b2-3c-completion-ownership.py
      - name: Verify F2A existing-profile revision transaction candidate
        run: |
          set -euo pipefail
          pgfixture() {
            docker exec -i kg-u4b2-test-db psql -X -v ON_ERROR_STOP=1 -U postgres -d kg_u4b2_fixture
          }
          pgfixture < sql/kg-chart-u2-access-draft.sql
          pgfixture < tools/tests/u4b2-f2a-existing-profile-protocol.sql
          timeout 150s python3 tools/tests/u4b2-f2a-existing-profile-protocol.py
      - name: Verify F2B atomic restricted word and sentence quiz ingestion
        run: |
          set -euo pipefail
          docker exec -i kg-u4b2-test-db psql -X -v ON_ERROR_STOP=1 -U postgres -d kg_u4b2_fixture < tools/tests/u4b2-f2b-atomic-quiz.sql
          timeout 150s python3 tools/tests/u4b2-f2b-atomic-quiz.py
      - name: Verify F2C versioned ratings and topic completions
        run: |
          set -euo pipefail
          docker exec -i kg-u4b2-test-db psql -X -v ON_ERROR_STOP=1 -U postgres -d kg_u4b2_fixture < tools/tests/u4b2-f2c-versioned-progress.sql
          timeout 180s python3 tools/tests/u4b2-f2c-versioned-progress.py
      - name: Verify F2D1 coordinated private rules and sentence mappings
        run: |
          set -euo pipefail
          docker exec -i kg-u4b2-test-db psql -X -v ON_ERROR_STOP=1 -U postgres -d kg_u4b2_fixture < tools/tests/u4b2-f2d1-shared-authorization.sql
          timeout 180s python3 tools/tests/u4b2-f2d1-shared-authorization.py
      - name: Verify F2D2 content and catalog authorization sources
        run: |
          set -euo pipefail
          docker exec -i kg-u4b2-test-db psql -X -v ON_ERROR_STOP=1 -U postgres -d kg_u4b2_fixture < tools/tests/u4b2-f2d2-content-authorization.sql
          timeout 240s python3 tools/tests/u4b2-f2d2-content-authorization.py
      - name: Verify F2D3A real F1 recovery quiz contract
        run: |
          set -euo pipefail
          docker exec -i kg-u4b2-test-db psql -X -v ON_ERROR_STOP=1 -U postgres -d kg_u4b2_fixture < tools/tests/u4b2-f2d3a-recovery-contract.sql
          timeout 180s python3 tools/tests/u4b2-f2d3a-recovery-contract.py
      - name: Verify F2D3B1 timed typing and speaking quizzes
        run: |
          set -euo pipefail
          docker exec -i kg-u4b2-test-db psql -X -v ON_ERROR_STOP=1 -U postgres -d kg_u4b2_fixture < tools/tests/u4b2-f2d3b1-timed-quizzes.sql
          timeout 180s python3 tools/tests/u4b2-f2d3b1-timed-quizzes.py
      - name: Verify F2D3B2 restricted colour quiz evidence
        run: |
          set -euo pipefail
          docker exec -i kg-u4b2-test-db psql -X -v ON_ERROR_STOP=1 -U postgres -d kg_u4b2_fixture < tools/tests/u4b2-f2d3b2-colour-evidence.sql
          timeout 240s python3 tools/tests/u4b2-f2d3b2-colour-evidence.py
      - name: Destroy synthetic database
        if: always()
        run: docker rm -f kg-u4b2-test-db || true

# No production keys, real sentence contents, Storage objects, browser
# profiles, public/private buckets or live student permission changes.
