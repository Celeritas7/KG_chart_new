name: KG Chart U3C1 - learner view permissions (no production)

on:
  pull_request:
    paths:
      - 'index.html'
      - 'js/kg-learner-access.js'
      - 'tools/build-offline.mjs'
      - 'offline/sw.js'
      - 'js/kg-private-offline-playback.mjs'
      - '.github/workflows/kg-u3d2b2-private-playback.yml'
      - 'tools/tests/u3c1-learner-permissions.test.mjs'
      - 'docs/U3C1-LEARNER-ACCESS-REVIEW.md'
      - '.github/workflows/kg-u3c1-learner-access.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-ui-permissions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test policy schema, legacy compatibility, restricted scopes and saved modes
        run: |
          set -euo pipefail
          node --check js/kg-learner-access.js
          node --test tools/tests/u3c1-learner-permissions.test.mjs
      - name: Verify only reviewed U3C2 mapping SQL is added outside the UI
        run: |
          set -euo pipefail
          BASE=$(git merge-base origin/main HEAD)
          git diff --name-only "$BASE" HEAD | tee /tmp/u3c-changes.txt
          if grep -Eq '^(supabase/)' /tmp/u3c-changes.txt; then
            echo 'U3C1/C2 must not alter Edge, offline service worker or Storage.'
            exit 1
          fi
          # Permit ONLY the separately reviewed source-disabled U3D1 offline
          # policy bridge. Re-run its contract tests if this runtime is edited.
          if grep -Fxq 'offline/runtime.js' /tmp/u3c-changes.txt; then
            grep -Fq 'const U3D1_OFFLINE_ACCESS_ENABLED = false;' offline/runtime.js
            node --test tools/tests/u3d1-offline-policy.test.mjs
          fi
          if grep -Fxq 'offline/sw.js' /tmp/u3c-changes.txt; then
            grep -Fq 'const U3D2B2_PRIVATE_OFFLINE_PLAYBACK_ENABLED = false;' offline/runtime.js
            node --test tools/tests/u3d2b2-private-playback.test.mjs
          fi
          if grep '^sql/' /tmp/u3c-changes.txt | grep -Ev '^sql/kg-chart-u3c2-sentence-topic-mapping[.]sql$'; then
            echo 'Only the reviewed U3C2 sentence mapping SQL is allowed in this stage.'
            exit 1
          fi

# Passing these tests does NOT activate production access enforcement.
# The default-OFF U3C1 gate remains disabled until U3D and hardware checks.
