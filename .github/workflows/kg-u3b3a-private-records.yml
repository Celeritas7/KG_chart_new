name: KG Chart U3B3A - private records and offline visibility (synthetic)

on:
  pull_request:
    paths:
      - '.github/workflows/kg-u3b3a-private-records.yml'
      - 'sql/kg-chart-u3b3a-private-records.sql'
      - 'tools/tests/u3b3a-private-*.sql'
      - 'offline/runtime.js'
      - 'offline/tests/private-lesson-privacy.test.mjs'
      - 'index.html'
      - 'docs/U3B3A-PRIVATE-RECORDS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-privacy-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test real online/offline private visibility wiring in isolation
        run: node --test offline/tests/private-lesson-privacy.test.mjs
      - name: Start fictional PostgreSQL with no external network
        run: |
          set -euo pipefail
          docker run -d --name kg-u3b3a-test-db \
            --network none \
            -e POSTGRES_PASSWORD=fictional-ci-only \
            -e POSTGRES_DB=kg_u3b3a_synthetic \
            postgres:17-alpine
          for i in {1..50}; do
            if docker exec kg-u3b3a-test-db psql -X -At -v ON_ERROR_STOP=1 \
              -U postgres -d kg_u3b3a_synthetic -c 'SELECT 1' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo 'Fictional PostgreSQL failed to become queryable' >&2
          exit 1
      - name: Test raw data denial, private lessons, flag ownership and legacy compatibility
        run: |
          set -euo pipefail
          pgfixture() {
            docker exec -i kg-u3b3a-test-db psql -X -v ON_ERROR_STOP=1 \
              -U postgres -d kg_u3b3a_synthetic
          }
          pgfixture < tools/tests/u1-access-fixture.sql
          pgfixture < sql/kg-chart-u1-access-foundation.sql
          pgfixture < tools/tests/u3a-access-fixture.sql
          pgfixture < tools/tests/u3b1-content-fixture.sql
          pgfixture < sql/kg-chart-u3b1-restrictive-content-rls.sql
          pgfixture < tools/tests/u3b2-write-fixture.sql
          pgfixture < sql/kg-chart-u3b2-write-rpc-guards.sql
          pgfixture < sql/kg-chart-u3b3a-private-records.sql
          pgfixture < sql/kg-chart-u3b3a-private-records.sql
          pgfixture < tools/tests/u3b3a-private-fixture.sql
          pgfixture < tools/tests/u3b3a-private-assertions.sql
      - name: Destroy fictional database
        if: always()
        run: docker rm -f kg-u3b3a-test-db || true

# No cloud credentials, no Supabase writes, no bucket or PWA deployment,
# and no access to real learners or existing offline packs.
