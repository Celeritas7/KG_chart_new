name: KG Chart U3D1 - offline verified access snapshots (synthetic)

on:
  pull_request:
    paths:
      - 'offline/access-policy.js'
      - 'offline/scoped-pack.js'
      - 'js/kg-private-offline-media.mjs'
      - 'js/kg-private-offline-playback.mjs'
      - 'js/kg-audio.js'
      - 'js/kg-protected-image.mjs'
      - 'offline/sw.js'
      - 'tools/tests/u3d2b2-private-playback.test.mjs'
      - 'tools/tests/u3c2b2-protected-media.test.mjs'
      - '.github/workflows/kg-u3d2b2-private-playback.yml'
      - 'offline/access-outbox.js'
      - 'tools/tests/u3d3a-outbox-hold.test.mjs'
      - 'docs/U3D3A-OUTBOX-REVIEW.md'
      - '.github/workflows/kg-u3d3a-outbox-hold.yml'
      - 'offline/restricted-packs.js'
      - 'tools/tests/u3d3b-restricted-bundles.test.mjs'
      - 'docs/U3D3B-RESTRICTED-BUNDLES-REVIEW.md'
      - '.github/workflows/kg-u3d3b-restricted-bundles.yml'
      - 'offline/restricted-sync.js'
      - 'tools/tests/u3d3c-restricted-sync.test.mjs'
      - 'docs/U3D3C-RESTRICTED-SYNC-REVIEW.md'
      - '.github/workflows/kg-u3d3c-restricted-sync.yml'
      - 'offline/device-acceptance.js'
      - 'tools/tests/u4a-device-acceptance.test.mjs'
      - 'docs/U4A-DEVICE-ACCEPTANCE-REVIEW.md'
      - '.github/workflows/kg-u4a-device-acceptance.yml'
      - 'docs/U3D2B2-PRIVATE-OFFLINE-REVIEW.md'
      - 'tools/tests/u3d2b1-private-media-stage.test.mjs'
      - 'docs/U3D2B1-PRIVATE-MEDIA-REVIEW.md'
      - '.github/workflows/kg-u3d2b1-private-media-stage.yml'
      - 'tools/tests/u3d2a-scoped-pack.test.mjs'
      - '.github/workflows/kg-u3d2a-scoped-pack.yml'
      - 'offline/runtime.js'
      - 'tools/build-offline.mjs'
      - 'tools/tests/u3d1-offline-policy.test.mjs'
      - 'offline/tests/private-lesson-privacy.test.mjs'
      - '.github/workflows/kg-u3c1-learner-access.yml'
      - '.github/workflows/kg-u3c2b1-protected-player.yml'
      - '.github/workflows/kg-u3c2b2-protected-media.yml'
      - 'docs/U3D1-OFFLINE-ACCESS-REVIEW.md'
      - '.github/workflows/kg-u3d1-offline-policy.yml'
      - 'tools/check-f1-review-scope.mjs'
      - 'tools/tests/u4b2b3d-review-scope.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-account-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test owner/revision/expiry/caller-bound policy contracts (no cloud)
        run: |
          set -euo pipefail
          node --check offline/access-policy.js
          node --check offline/scoped-pack.js
          node --check js/kg-private-offline-media.mjs
          node --check js/kg-private-offline-playback.mjs
          node --check offline/access-outbox.js
          node --check offline/restricted-packs.js
          node --check offline/restricted-sync.js
          node --check offline/device-acceptance.js
          node --check offline/runtime.js
          node --test tools/tests/u3d1-offline-policy.test.mjs tools/tests/u3d2a-scoped-pack.test.mjs tools/tests/u3d2b1-private-media-stage.test.mjs offline/tests/private-lesson-privacy.test.mjs tools/tests/u3d2b2-private-playback.test.mjs tools/tests/u3c2b2-protected-media.test.mjs tools/tests/u3d3a-outbox-hold.test.mjs tools/tests/u3d3b-restricted-bundles.test.mjs tools/tests/u3d3c-restricted-sync.test.mjs tools/tests/u4a-device-acceptance.test.mjs
      - name: Verify staged/off by default, no SQL/media/worker/production changes
        run: |
          set -euo pipefail
          grep -Fq 'const U3D1_OFFLINE_ACCESS_ENABLED = false;' offline/runtime.js
          grep -Fq 'const U3D2_SCOPED_PACK_PREVIEW_ENABLED = false;' offline/runtime.js
          grep -Fq 'const U3D2B1_PRIVATE_MEDIA_STAGE_ENABLED = false;' offline/runtime.js
          grep -Fq 'const U3D2B2_PRIVATE_OFFLINE_PLAYBACK_ENABLED = false;' offline/runtime.js
          grep -Fq 'const U3D3A_OUTBOX_HOLD_ENABLED = false;' offline/runtime.js
          grep -Fq 'const U3D3B_RESTRICTED_PACKS_ENABLED = false;' offline/runtime.js
          grep -Fq 'const U3D3C_RESTRICTED_SYNC_ENABLED = false;' offline/runtime.js
          grep -Fq 'const U3C1_SCOPED_UI_ENABLED = false;' index.html
          BASE=$(git merge-base origin/main HEAD)
          # Reviewed F1 extension: preserve every unrelated learner source region.
          node tools/check-f1-review-scope.mjs "$BASE"
          git diff --name-only "$BASE" HEAD | tee /tmp/u3d1-reviewed-files.txt
          # Explicit allowlist for U3D1 and the separately reviewed U3D2A source-disabled candidate.
          while IFS= read -r path; do
            case "$path" in
              offline/access-policy.js|offline/runtime.js|offline/scoped-pack.js|js/kg-private-offline-media.mjs|js/kg-private-offline-playback.mjs|js/kg-audio.js|js/kg-protected-image.mjs|offline/sw.js|tools/tests/u3d2b2-private-playback.test.mjs|tools/tests/u3c2b2-protected-media.test.mjs|docs/U3D2B2-PRIVATE-OFFLINE-REVIEW.md|.github/workflows/kg-u3d2b2-private-playback.yml|offline/access-outbox.js|tools/tests/u3d3a-outbox-hold.test.mjs|tools/tests/u3d1-offline-policy.test.mjs|tools/tests/u3d2a-scoped-pack.test.mjs|docs/U3D3A-OUTBOX-REVIEW.md|.github/workflows/kg-u3d3a-outbox-hold.yml|offline/restricted-packs.js|tools/tests/u3d3b-restricted-bundles.test.mjs|docs/U3D3B-RESTRICTED-BUNDLES-REVIEW.md|.github/workflows/kg-u3d3b-restricted-bundles.yml|offline/restricted-sync.js|tools/tests/u3d3c-restricted-sync.test.mjs|docs/U3D3C-RESTRICTED-SYNC-REVIEW.md|.github/workflows/kg-u3d3c-restricted-sync.yml|offline/device-acceptance.js|tools/tests/u4a-device-acceptance.test.mjs|docs/U4A-DEVICE-ACCEPTANCE-REVIEW.md|.github/workflows/kg-u4a-device-acceptance.yml|tools/tests/u3d1-offline-policy.test.mjs|tools/tests/u3d2a-scoped-pack.test.mjs|tools/tests/u3d3a-outbox-hold.test.mjs|tools/tests/u3d3b-restricted-bundles.test.mjs|tools/tests/u3d3c-restricted-sync.test.mjs|tools/tests/u3d1-offline-policy.test.mjs|tools/tests/u3d2a-scoped-pack.test.mjs|tools/tests/u3d3a-outbox-hold.test.mjs|tools/tests/u3d3b-restricted-bundles.test.mjs|tools/build-offline.mjs|tools/tests/u3d1-offline-policy.test.mjs|tools/tests/u3d2a-scoped-pack.test.mjs|tools/tests/u3d2b1-private-media-stage.test.mjs|offline/tests/private-lesson-privacy.test.mjs|docs/U3D1-OFFLINE-ACCESS-REVIEW.md|docs/U3D2A-SCOPED-PACK-REVIEW.md|docs/U3D2B1-PRIVATE-MEDIA-REVIEW.md|.github/workflows/kg-u3d1-offline-policy.yml|.github/workflows/kg-u3d2a-scoped-pack.yml|.github/workflows/kg-u3d2b1-private-media-stage.yml|.github/workflows/kg-u3c1-learner-access.yml|.github/workflows/kg-u3c2b1-protected-player.yml|.github/workflows/kg-u3c2b2-protected-media.yml|index.html|js/kg-quiz-save.js|offline/tests/quiz-save-queue.test.mjs|package.json|.github/workflows/kg-dual-edition.yml|docs/U4B2B3D-QUIZ-SAVE-CORRECTION.md|tools/tests/u4b2b3d-quiz-save.test.mjs|tools/tests/u4b2b3d-quiz-ui-browser.mjs|tools/check-f1-review-scope.mjs|tools/tests/u4b2b3d-review-scope.test.mjs)
                ;;
              *)
                echo "Unreviewed U3D1 file: $path"
                exit 1
                ;;
            esac
          done < /tmp/u3d1-reviewed-files.txt
          if grep -Eq '^(sql/|supabase/|offline/pictures.js|offline/audio-manifest.js)' /tmp/u3d1-reviewed-files.txt; then
            echo 'Unexpected backend, learner, service-worker, or media modification'
            exit 1
          fi

# The existing dual-edition workflow independently verifies source-matched
# builds, 82+ offline tests, 4 unified artifacts and network-isolated Chromium
# separate->unified->compatible rollback without production credentials.
