name: KG Chart - both editions

on:
  pull_request:
  push:
    branches: [main]
    tags: [kg-v*]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Compile and test both editions from the same SHA
        run: npm run check:unified
      - name: Read-only C4A release artifact contract (no deployment)
        run: node tools/audit-c4a-artifacts.mjs
      - name: C3C isolated Chromium migration and rollback (container has no network)
        run: |
          # Docker --network none prevents ALL external network traffic, including
          # Chromium service-worker fetches not covered by Playwright page.route.
          # Repository mounted read-only; only disposable /tmp is writable.
          docker run --rm --pull=always \
            --network none --read-only --tmpfs /tmp:rw,exec,size=1024m \
            --shm-size=1g \
            --mount type=bind,source="$GITHUB_WORKSPACE",target=/work,readonly \
            --workdir /work \
            -e CI=true -e HOME=/tmp -e PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            mcr.microsoft.com/playwright:v1.56.1-noble \
            npm run test:browser-migration
      - name: Verify online source remains unchanged by the offline build
        run: git diff --exit-code -- index.html sw.js manifest.webmanifest js/
      - name: Package the existing online edition
        uses: actions/upload-artifact@v4
        with:
          name: kg-chart-online-${{ github.sha }}
          path: dist-online/
          retention-days: 14
      - name: Package the separate offline edition
        uses: actions/upload-artifact@v4
        with:
          name: kg-chart-offline-${{ github.sha }}
          path: dist-offline/
          retention-days: 14

      - name: Package unified candidate for review
        uses: actions/upload-artifact@v4
        with:
          name: kg-chart-unified-${{ github.sha }}
          path: dist-unified/
          retention-days: 14

# This pipeline creates reviewable, matching release artifacts; it intentionally does not
# publish to the current online origin. Production offline hosting requires its own origin,
# configured OAuth redirect allowlist and real installed-app acceptance tests.
