name: KG Chart - both editions

on:
  pull_request:
  push:
    branches: [main]
    tags: [kg-v*]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Compile and test both editions from the same SHA
        run: npm run check:unified
      - name: Verify recoverable word and sentence quiz saving with fictional records
        run: npm run test:quiz-saving
      - name: Read-only C4A release artifact contract (no deployment)
        run: node tools/audit-c4a-artifacts.mjs
      - name: C3C isolated Chromium migration and rollback (container has no network)
        run: |
          # Docker --network none prevents ALL external network traffic, including
          # Chromium service-worker fetches not covered by Playwright page.route.
          # Repository mounted read-only; only disposable /tmp is writable.
          docker run --rm --pull=always \
            --network none --read-only --tmpfs /tmp:rw,exec,size=1024m \
            --shm-size=1g \
            --mount type=bind,source="$GITHUB_WORKSPACE",target=/work,readonly \
            --workdir /work \
            -e CI=true -e HOME=/tmp -e PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            mcr.microsoft.com/playwright:v1.56.1-noble \
            npm run test:browser-migration
      - name: F1 real quiz UI and recovery in isolated Chromium
        run: |
          docker run --rm \
            --network none --read-only --tmpfs /tmp:rw,exec,size=1024m \
            --shm-size=1g \
            --mount type=bind,source="$GITHUB_WORKSPACE",target=/work,readonly \
            --workdir /work \
            -e CI=true -e HOME=/tmp -e PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            mcr.microsoft.com/playwright:v1.56.1-noble \
            npm run test:quiz-saving-ui
      - name: Verify online source remains unchanged by the offline build
        run: git diff --exit-code -- index.html sw.js manifest.webmanifest js/
      - name: Package the existing online edition
        uses: actions/upload-artifact@v4
        with:
          name: kg-chart-online-${{ github.sha }}
          path: dist-online/
          retention-days: 14
      - name: Package the separate offline edition
        uses: actions/upload-artifact@v4
        with:
          name: kg-chart-offline-${{ github.sha }}
          path: dist-offline/
          retention-days: 14

      - name: Package unified candidate for review
        uses: actions/upload-artifact@v4
        with:
          name: kg-chart-unified-${{ github.sha }}
          path: dist-unified/
          retention-days: 14

  # Only the C4C draft PR receives this extra job. PR jobs normally test a
  # temporary merge SHA; the release archives MUST come from the actual PR
  # head commit, not the disposable refs/pull/*/merge revision.
  c4c-source-pinned-release-pair:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/stage-c4c-')
    needs: build-and-test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout immutable PR head with converter submodule
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify C4C packaging safeguards with fictional fixtures
        run: python3 -m unittest discover -s tools/tests -p 'test_c4c_release.py' -v
      - name: Rebuild, audit, pin and independently verify release+rollback archives
        env:
          C4C_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$C4C_SOURCE_SHA"
          # Deterministic generatedAt for source-reproducible archive bytes.
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          npm run check:unified
          node tools/audit-c4a-artifacts.mjs
          git diff --exit-code -- index.html sw.js manifest.webmanifest js/
          python3 tools/c4c_release.py pack --source-sha "$C4C_SOURCE_SHA" --out c4c-bundles
          python3 tools/c4c_release.py verify --source-sha "$C4C_SOURCE_SHA" --out c4c-bundles
          cat c4c-bundles/SHA256SUMS
      - name: Upload source-pinned pair and verification receipt (temporary CI copy)
        uses: actions/upload-artifact@v4
        with:
          name: kg-chart-c4c-pinned-${{ github.event.pull_request.head.sha }}
          path: c4c-bundles/
          if-no-files-found: error
          retention-days: 30

# NO deployment. The C4C job uploads reviewable artifacts only. CI retention
# is temporary and cannot satisfy the off-CI immutable-copy C4D gate.
# Cloudflare's separately configured Git integration may create its own PR
# preview; this workflow does not alter Cloudflare or switch production.
