name: KG Chart U3D3C - restricted server-confirmed sync (synthetic)

on:
  pull_request:
    paths:
      - 'offline/restricted-sync.js'
      - 'offline/runtime.js'
      - 'tools/build-offline.mjs'
      - 'tools/tests/u3d3c-restricted-sync.test.mjs'
      - 'tools/tests/u3d1-offline-policy.test.mjs'
      - 'tools/tests/u3d2a-scoped-pack.test.mjs'
      - 'tools/tests/u3d3a-outbox-hold.test.mjs'
      - 'tools/tests/u3d3b-restricted-bundles.test.mjs'
      - 'docs/U3D3C-RESTRICTED-SYNC-REVIEW.md'
      - '.github/workflows/kg-u3d3c-restricted-sync.yml'
      - 'offline/device-acceptance.js'
      - 'tools/tests/u4a-device-acceptance.test.mjs'
      - 'docs/U4A-DEVICE-ACCEPTANCE-REVIEW.md'
      - '.github/workflows/kg-u4a-device-acceptance.yml'
      - '.github/workflows/kg-u3d1-offline-policy.yml'
      - '.github/workflows/kg-u3d2a-scoped-pack.yml'
      - '.github/workflows/kg-u3d2b1-private-media-stage.yml'
      - '.github/workflows/kg-u3d2b2-private-playback.yml'
      - '.github/workflows/kg-u3d3a-outbox-hold.yml'
      - '.github/workflows/kg-u3d3b-restricted-bundles.yml'
      - 'tools/check-f1-review-scope.mjs'
      - 'tools/tests/u4b2b3d-review-scope.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revision-account-verified-outbox:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fake-account server/RLS evidence, grant races, ACK and outbox recovery
        run: |
          set -euo pipefail
          node --check offline/restricted-sync.js
          node --check offline/device-acceptance.js
          node --check offline/runtime.js
          node --check tools/build-offline.mjs
          node --test tools/tests/u3d3c-restricted-sync.test.mjs tools/tests/u3d3b-restricted-bundles.test.mjs tools/tests/u3d3a-outbox-hold.test.mjs tools/tests/u3d2b2-private-playback.test.mjs tools/tests/u3d2b1-private-media-stage.test.mjs tools/tests/u3d2a-scoped-pack.test.mjs tools/tests/u3d1-offline-policy.test.mjs offline/tests/private-lesson-privacy.test.mjs tools/tests/u4a-device-acceptance.test.mjs
      - name: Enforce OFF flags, only reviewed sources and no production data
        run: |
          set -euo pipefail
          grep -Fq 'const U3C1_SCOPED_UI_ENABLED = false;' index.html
          for flag in U3D1_OFFLINE_ACCESS_ENABLED U3D2_SCOPED_PACK_PREVIEW_ENABLED U3D2B1_PRIVATE_MEDIA_STAGE_ENABLED U3D2B2_PRIVATE_OFFLINE_PLAYBACK_ENABLED U3D3A_OUTBOX_HOLD_ENABLED U3D3B_RESTRICTED_PACKS_ENABLED U3D3C_RESTRICTED_SYNC_ENABLED; do
            grep -Fq "const $flag = false;" offline/runtime.js
          done
          BASE=$(git merge-base origin/main HEAD)
          # Reviewed F1 extension: preserve every unrelated learner source region.
          node tools/check-f1-review-scope.mjs "$BASE"
          git diff --name-only "$BASE" HEAD | tee /tmp/u3d3c-changed.txt
          while IFS= read -r path; do
            case "$path" in
              offline/restricted-sync.js|offline/runtime.js|tools/build-offline.mjs|tools/tests/u3d3c-restricted-sync.test.mjs|tools/tests/u3d1-offline-policy.test.mjs|tools/tests/u3d2a-scoped-pack.test.mjs|tools/tests/u3d3a-outbox-hold.test.mjs|tools/tests/u3d3b-restricted-bundles.test.mjs|docs/U3D3C-RESTRICTED-SYNC-REVIEW.md|.github/workflows/kg-u3d3c-restricted-sync.yml|offline/device-acceptance.js|tools/tests/u4a-device-acceptance.test.mjs|docs/U4A-DEVICE-ACCEPTANCE-REVIEW.md|.github/workflows/kg-u4a-device-acceptance.yml|tools/tests/u3d1-offline-policy.test.mjs|tools/tests/u3d2a-scoped-pack.test.mjs|tools/tests/u3d3a-outbox-hold.test.mjs|tools/tests/u3d3b-restricted-bundles.test.mjs|tools/tests/u3d3c-restricted-sync.test.mjs|.github/workflows/kg-u3d1-offline-policy.yml|.github/workflows/kg-u3d2a-scoped-pack.yml|.github/workflows/kg-u3d2b1-private-media-stage.yml|.github/workflows/kg-u3d2b2-private-playback.yml|.github/workflows/kg-u3d3a-outbox-hold.yml|.github/workflows/kg-u3d3b-restricted-bundles.yml|index.html|js/kg-quiz-save.js|offline/tests/quiz-save-queue.test.mjs|package.json|.github/workflows/kg-dual-edition.yml|docs/U4B2B3D-QUIZ-SAVE-CORRECTION.md|tools/tests/u4b2b3d-quiz-save.test.mjs|tools/tests/u4b2b3d-quiz-ui-browser.mjs|tools/check-f1-review-scope.mjs|tools/tests/u4b2b3d-review-scope.test.mjs)
                ;;
              *)
                echo "Unreviewed U3D3C file: $path"
                exit 1
                ;;
            esac
          done < /tmp/u3d3c-changed.txt
          if grep -Eq '^(sql/|supabase/|offline/sw.js|offline/pictures.js|offline/audio-manifest.js|js/kg-audio.js|js/kg-protected-image.mjs|js/kg-private-offline-media.mjs|js/kg-private-offline-playback.mjs)' /tmp/u3d3c-changed.txt; then
            echo 'U3D3C must not change production authorization, media or old worker'
            exit 1
          fi

# Real authenticated SQL/RLS backend remains a separate explicit release
# gate. This workflow uses only fictional accounts and fake Supabase results.
# Both-editions CI independently runs real network-disabled Chromium rollback.
