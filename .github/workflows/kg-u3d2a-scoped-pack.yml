name: KG Chart U3D2A - restricted offline scoped content (synthetic)

on:
  pull_request:
    paths:
      - 'offline/scoped-pack.js'
      - 'js/kg-private-offline-media.mjs'
      - 'js/kg-private-offline-playback.mjs'
      - 'js/kg-audio.js'
      - 'js/kg-protected-image.mjs'
      - 'offline/sw.js'
      - 'tools/tests/u3d2b2-private-playback.test.mjs'
      - 'tools/tests/u3c2b2-protected-media.test.mjs'
      - '.github/workflows/kg-u3d2b2-private-playback.yml'
      - 'offline/access-outbox.js'
      - 'tools/tests/u3d3a-outbox-hold.test.mjs'
      - 'docs/U3D3A-OUTBOX-REVIEW.md'
      - '.github/workflows/kg-u3d3a-outbox-hold.yml'
      - 'offline/restricted-packs.js'
      - 'tools/tests/u3d3b-restricted-bundles.test.mjs'
      - 'docs/U3D3B-RESTRICTED-BUNDLES-REVIEW.md'
      - '.github/workflows/kg-u3d3b-restricted-bundles.yml'
      - 'offline/restricted-sync.js'
      - 'tools/tests/u3d3c-restricted-sync.test.mjs'
      - 'docs/U3D3C-RESTRICTED-SYNC-REVIEW.md'
      - '.github/workflows/kg-u3d3c-restricted-sync.yml'
      - 'offline/device-acceptance.js'
      - 'tools/tests/u4a-device-acceptance.test.mjs'
      - 'docs/U4A-DEVICE-ACCEPTANCE-REVIEW.md'
      - '.github/workflows/kg-u4a-device-acceptance.yml'
      - 'docs/U3D2B2-PRIVATE-OFFLINE-REVIEW.md'
      - 'tools/tests/u3d2b1-private-media-stage.test.mjs'
      - 'docs/U3D2B1-PRIVATE-MEDIA-REVIEW.md'
      - '.github/workflows/kg-u3d2b1-private-media-stage.yml'
      - 'offline/runtime.js'
      - 'tools/build-offline.mjs'
      - 'tools/tests/u3d2a-scoped-pack.test.mjs'
      - 'tools/tests/u3d1-offline-policy.test.mjs'
      - '.github/workflows/kg-u3d1-offline-policy.yml'
      - '.github/workflows/kg-u3d2a-scoped-pack.yml'
      - 'docs/U3D2A-SCOPED-PACK-REVIEW.md'
      - 'tools/check-f1-review-scope.mjs'
      - 'tools/tests/u4b2b3d-review-scope.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoped-pack-no-production:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Synthetic owner/language/private lesson/sentence/media-source validation
        run: |
          set -euo pipefail
          node --check offline/scoped-pack.js
          node --check js/kg-private-offline-media.mjs
          node --check js/kg-private-offline-playback.mjs
          node --check offline/access-outbox.js
          node --check offline/restricted-packs.js
          node --check offline/restricted-sync.js
          node --check offline/device-acceptance.js
          node --check offline/runtime.js
          node --test tools/tests/u3d2a-scoped-pack.test.mjs tools/tests/u3d1-offline-policy.test.mjs tools/tests/u3d2b1-private-media-stage.test.mjs offline/tests/private-lesson-privacy.test.mjs tools/tests/u3d2b2-private-playback.test.mjs tools/tests/u3c2b2-protected-media.test.mjs tools/tests/u3d3a-outbox-hold.test.mjs tools/tests/u3d3b-restricted-bundles.test.mjs tools/tests/u3d3c-restricted-sync.test.mjs tools/tests/u4a-device-acceptance.test.mjs
      - name: Enforce draft-only feature gates and exact source allowlist
        run: |
          set -euo pipefail
          grep -Fq 'const U3D1_OFFLINE_ACCESS_ENABLED = false;' offline/runtime.js
          grep -Fq 'const U3D2_SCOPED_PACK_PREVIEW_ENABLED = false;' offline/runtime.js
          grep -Fq 'const U3D2B1_PRIVATE_MEDIA_STAGE_ENABLED = false;' offline/runtime.js
          grep -Fq 'const U3D2B2_PRIVATE_OFFLINE_PLAYBACK_ENABLED = false;' offline/runtime.js
          grep -Fq 'const U3D3A_OUTBOX_HOLD_ENABLED = false;' offline/runtime.js
          grep -Fq 'const U3D3B_RESTRICTED_PACKS_ENABLED = false;' offline/runtime.js
          grep -Fq 'const U3D3C_RESTRICTED_SYNC_ENABLED = false;' offline/runtime.js
          grep -Fq 'const U3C1_SCOPED_UI_ENABLED = false;' index.html
          BASE=$(git merge-base origin/main HEAD)
          # Reviewed F1 extension: preserve every unrelated learner source region.
          node tools/check-f1-review-scope.mjs "$BASE"
          git diff --name-only "$BASE" HEAD | tee /tmp/u3d2a-changed-files.txt
          while IFS= read -r path; do
            case "$path" in
              offline/scoped-pack.js|offline/runtime.js|js/kg-private-offline-media.mjs|js/kg-private-offline-playback.mjs|js/kg-audio.js|js/kg-protected-image.mjs|offline/sw.js|tools/tests/u3d2b2-private-playback.test.mjs|tools/tests/u3c2b2-protected-media.test.mjs|docs/U3D2B2-PRIVATE-OFFLINE-REVIEW.md|.github/workflows/kg-u3d2b2-private-playback.yml|offline/access-outbox.js|tools/tests/u3d3a-outbox-hold.test.mjs|tools/tests/u3d1-offline-policy.test.mjs|tools/tests/u3d2a-scoped-pack.test.mjs|docs/U3D3A-OUTBOX-REVIEW.md|.github/workflows/kg-u3d3a-outbox-hold.yml|offline/restricted-packs.js|tools/tests/u3d3b-restricted-bundles.test.mjs|docs/U3D3B-RESTRICTED-BUNDLES-REVIEW.md|.github/workflows/kg-u3d3b-restricted-bundles.yml|offline/restricted-sync.js|tools/tests/u3d3c-restricted-sync.test.mjs|docs/U3D3C-RESTRICTED-SYNC-REVIEW.md|.github/workflows/kg-u3d3c-restricted-sync.yml|offline/device-acceptance.js|tools/tests/u4a-device-acceptance.test.mjs|docs/U4A-DEVICE-ACCEPTANCE-REVIEW.md|.github/workflows/kg-u4a-device-acceptance.yml|tools/tests/u3d1-offline-policy.test.mjs|tools/tests/u3d2a-scoped-pack.test.mjs|tools/tests/u3d3a-outbox-hold.test.mjs|tools/tests/u3d3b-restricted-bundles.test.mjs|tools/tests/u3d3c-restricted-sync.test.mjs|tools/tests/u3d1-offline-policy.test.mjs|tools/tests/u3d2a-scoped-pack.test.mjs|tools/tests/u3d3a-outbox-hold.test.mjs|tools/tests/u3d3b-restricted-bundles.test.mjs|.github/workflows/kg-u3c1-learner-access.yml|.github/workflows/kg-u3c2b1-protected-player.yml|.github/workflows/kg-u3c2b2-protected-media.yml|tools/build-offline.mjs|tools/tests/u3d2a-scoped-pack.test.mjs|tools/tests/u3d1-offline-policy.test.mjs|tools/tests/u3d2b1-private-media-stage.test.mjs|.github/workflows/kg-u3d1-offline-policy.yml|.github/workflows/kg-u3d2a-scoped-pack.yml|.github/workflows/kg-u3d2b1-private-media-stage.yml|docs/U3D2A-SCOPED-PACK-REVIEW.md|docs/U3D2B1-PRIVATE-MEDIA-REVIEW.md|index.html|js/kg-quiz-save.js|offline/tests/quiz-save-queue.test.mjs|offline/tests/typing-topic.test.mjs|package.json|.github/workflows/kg-dual-edition.yml|docs/U4B2B3D-QUIZ-SAVE-CORRECTION.md|tools/tests/u4b2b3d-quiz-save.test.mjs|tools/tests/u4b2b3d-quiz-ui-browser.mjs|tools/check-f1-review-scope.mjs|tools/tests/u4b2b3d-review-scope.test.mjs|tools/tests/u4b2-f2e2b-topic-completion.sql|tools/tests/u4b2-f2e2b-topic-completion.py|.github/workflows/kg-u4b2-backend.yml)
                ;;
              *)
                echo "Unreviewed U3D2A path: $path"
                exit 1
                ;;
            esac
          done < /tmp/u3d2a-changed-files.txt
          if grep -Eq '^(sql/|supabase/|offline/audio-manifest.js|offline/pictures.js)' /tmp/u3d2a-changed-files.txt; then
            echo 'U3D2A must not mutate backend, installed worker, media or online learner'
            exit 1
          fi

# The dual-edition pipeline tests no-network Chromium recovery separately.
# No secret keys, real learner data, production database, OAuth, Cloudflare,
# private media files or live external requests are used in these tests.
