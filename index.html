        const g = c.getContext('2d');
        g.font = '128px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
        g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText(emoji, size / 2, size / 2 + 8);
        const img = g.getImageData(0, 0, size, size), d = img.data;
        const lums = [];
        for (let i = 0; i < d.length; i += 4) if (d[i + 3] > 40) lums.push((0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]) / 255);
        lums.sort((a, b) => a - b);
        const mid = Math.min(Math.max(lums[Math.floor(lums.length / 2)] || 0.5, 0.15), 0.85);
        const [R, G, B] = [1, 3, 5].map(k => parseInt(hex.slice(k, k + 2), 16));
        for (let i = 0; i < d.length; i += 4) {
          if (!d[i + 3]) continue;
          const l = (0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]) / 255;
          const t = l < mid ? 0.5 * l / mid : 0.5 + 0.5 * (l - mid) / (1 - mid);
          const f = (C) => (t < 0.5 ? C * (0.35 + 1.3 * t) : C + (255 - C) * (t - 0.5) * 1.1);
          d[i] = f(R); d[i + 1] = f(G); d[i + 2] = f(B);
        }
        g.putImageData(img, 0, 0);
        url = c.toDataURL('image/png');
      } catch (e) { url = null; }
      return (tintCache[key] = url);
    }

    function ColourPicture({ item, size = 'w-24 h-24' }) {
      const url = tintedEmojiUrl(item.picture, item.hex);
      return url
        ? <img src={url} alt="" className={`${size} object-contain mx-auto`} style={COLOUR_OUTLINE[item.colour] ? { filter: COLOUR_OUTLINE[item.colour] } : undefined} draggable={false} />
        : <div className={`${size} mx-auto rounded-2xl flex items-center justify-center text-5xl border-8`} style={{ borderColor: item.hex }}>{item.picture}</div>;
    }

    function ColourQuizView({ languageCode, user, modeToggle }) {
      const fontClass = LANGUAGE_FONTS[languageCode] || 'font-body';
      useAudioState();
      const saved0 = loadFromStorage(COLOUR_SETTINGS_KEY, {});
      const [phrases, setPhrases] = useState(null); // null = loading
      const [loadError, setLoadError] = useState(null);
      const [qType, setQType] = useState(() => (COLOUR_QUIZ_TYPES.some(t => t.id === saved0.type) ? saved0.type : 'phrase_to_picture'));
      const [count, setCount] = useState(() => ([5, 10, 15, 20, 0].includes(saved0.count) ? saved0.count : 10));
      const [items, setItems] = useState([]);
      const [idx, setIdx] = useState(0);
      const [picked, setPicked] = useState(null);
      const [score, setScore] = useState({ correct: 0, total: 0 });
      const [phase, setPhase] = useState('setup'); // setup | run | done
      const startedAt = React.useRef(0);
      const savedRun = React.useRef(false);

      useEffect(() => { saveToStorage(COLOUR_SETTINGS_KEY, { type: qType, count }); }, [qType, count]);
      useEffect(() => {
        let cancelled = false;
        setPhrases(null); setLoadError(null); setPhase('setup');
        supabase.from(TABLES.colourPhrases)
          .select('id, native_text, picture, colour:kg_chart_vocabulary!kg_chart_colour_phrases_colour_id_fkey(english_text, extra_data), noun:kg_chart_vocabulary!kg_chart_colour_phrases_noun_id_fkey(english_text)')
          .eq('language_code', languageCode)
          .then(({ data, error }) => {
            if (cancelled) return;
            if (error) { setLoadError(error); setPhrases([]); return; }
            const rows = (data || []).filter(p => p.native_text?.trim() && p.picture && p.colour && p.noun).map(p => ({
              id: p.id, native: p.native_text.trim(), picture: p.picture, colour: p.colour.english_text, noun: p.noun.english_text,
              hex: COLOUR_HEX[p.colour.english_text] || p.colour.extra_data?.colorCode || null, meaning: `${p.colour.english_text} ${p.noun.english_text}`.toLowerCase(),
            }));
            // A colour the app can't paint would come out grey, the same as any other such colour: leave those phrases out
            const painted = rows.filter(p => p.hex);
            if (painted.length < rows.length) console.warn('Colour quiz: no colour hex for', [...new Set(rows.filter(p => !p.hex).map(p => p.colour))].join(', '), '(add colorCode to that colour word)');
            setPhrases(painted);
          });
        return () => { cancelled = true; };
      }, [languageCode]);

      const all = phrases || [];
      // Blue hint line; none for Chinese (its converter reads pinyin, which phrases don't have)
      const hint = (text) => { if (getConverter(languageCode)?.usePronunciation) return ''; const h = convertToHint(text, languageCode); return h && h !== text ? h : ''; };
      const preview = useMemo(() => shuffleArr(phrases || []).slice(0, 4), [phrases]);
      const isListen = qType === 'listen_to_picture', toText = qType === 'picture_to_phrase';
      // Wrong choices: the same thing in another colour, the same colour on another thing, then anything
      const optionsFor = (p) => {
        const pick = (list, taken) => shuffleArr(list.filter(x => !taken.some(t => t.id === x.id)))[0];
        const out = [p];
        const add = (x) => { if (x && out.length < 4) out.push(x); };
        add(pick(all.filter(x => x.noun === p.noun && x.colour !== p.colour), out));
        add(pick(all.filter(x => x.colour === p.colour && x.noun !== p.noun), out));
        while (out.length < Math.min(4, all.length)) add(pick(all, out));
        return shuffleArr(out);
      };
      const start = () => {
        savedRun.current = false;
        const chosen = shuffleArr(all).slice(0, count || all.length);
        setItems(chosen.map(p => ({ p, options: optionsFor(p) })));
        setIdx(0); setPicked(null); setScore({ correct: 0, total: 0 });
        startedAt.current = Date.now();
        setPhase('run');
      };
      const item = items[idx];
      useEffect(() => { if (phase === 'run' && item && isListen && !picked) window.KGAudio.play(item.p.native, languageCode, { silent: true }); }, [phase, idx]);
      const choose = (o) => {
        if (picked || !item) return;
        setPicked(o);
        setScore(s => ({ correct: s.correct + (o.id === item.p.id ? 1 : 0), total: s.total + 1 }));
        window.KGAudio.autoPlay(item.p.native, languageCode);
      };
      const next = async () => {
        if (idx + 1 < items.length) { setIdx(i => i + 1); setPicked(null); return; }
        setPhase('done');
        window.KGAudio.stop();
        if (savedRun.current) return; // Enter held / double tap on the last question
        savedRun.current = true;
        if (user) await supabase.from(TABLES.quizSessions).insert({
          user_id: user.id, language_code: languageCode, topic_id: null, quiz_type: 'colour_phrase',
          total_questions: score.total, correct_answers: score.correct,
          time_spent_seconds: Math.round((Date.now() - startedAt.current) / 1000), completed_at: new Date().toISOString(),
        });
      };
      useEffect(() => {
        if (phase !== 'run') return;
        const onKey = (e) => {
          if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName) || kgModalOpen()) return;
          if (picked) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); next(); } return; }
          const n = parseInt(e.key);
          if (n >= 1 && n <= (item?.options.length || 0)) choose(item.options[n - 1]);
          if ((e.key === 'r' || e.key === 'R') && item) window.KGAudio.play(item.p.native, languageCode, { silent: true });
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [phase, idx, picked, items]);

      const PhraseText = ({ p, size = 'text-3xl' }) => (
        <>
          <div className={`${size} font-bold text-gray-800 ${fontClass}`}>{p.native}</div>
          {hint(p.native) && <div className="text-base text-blue-600 font-devanagari mt-1">{hint(p.native)}</div>}
        </>
      );

      // ---------- setup ----------
      if (phase === 'setup') {
        return (
          <div className="max-w-2xl mx-auto p-6">
            <div className="bg-white rounded-3xl shadow-xl p-8">
              <div className="text-center mb-8">
                <div className="w-20 h-20 bg-jade-100 rounded-full flex items-center justify-center mx-auto mb-4"><span className="text-4xl">🎨</span></div>
                <h2 className="text-3xl font-bold text-gray-800">Quiz Mode</h2>
              </div>
              {modeToggle}
              {phrases === null ? <LoadingSpinner /> : loadError ? (
                <div className="bg-yellow-50 text-yellow-800 rounded-2xl p-4 text-sm">Colour phrases aren't set up yet. Run <span className="font-mono">kg-chart-colour-phrases.sql</span> in the Supabase SQL editor, then reload.</div>
              ) : all.length < 4 ? (
                <div className="text-center text-gray-500 py-6"><div className="text-4xl mb-2">🎨</div>No colour phrases for {languageName(languageCode)} yet. Add them in admin → 🎨 Colour Phrases.</div>
              ) : (
                <div className="space-y-6">
                  <div className="flex justify-center gap-2 flex-wrap">
                    {preview.map(p => <div key={p.id} className="w-16 h-16 bg-slate-100 rounded-xl p-1"><ColourPicture item={p} size="w-14 h-14" /></div>)}
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-2">Quiz Type</label>
                    <div className="grid grid-cols-3 gap-3">
                      {COLOUR_QUIZ_TYPES.map(t => (
                        <button key={t.id} onClick={() => setQType(t.id)} className={`p-3 rounded-xl border-2 transition-all ${qType === t.id ? 'border-jade-500 bg-jade-50' : 'border-gray-200'}`}>
                          <div className="text-2xl mb-1">{t.icon}</div><div className="text-xs sm:text-sm font-medium">{t.label}</div>
                        </button>
                      ))}
                    </div>
                    <p className="text-xs text-gray-400 mt-2">{COLOUR_QUIZ_TYPES.find(t => t.id === qType).help}</p>
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-2">How many <span className="text-gray-400 font-normal ml-2">({all.length} phrases)</span></label>
                    <div className="grid grid-cols-5 gap-2">
                      {[5, 10, 15, 20, 0].map(c => (
                        <button key={c} onClick={() => setCount(c)} className={`py-3 rounded-xl border-2 font-medium ${count === c ? 'border-jade-500 bg-jade-50 text-jade-700' : 'border-gray-200'}`}>{c || 'All'}</button>
                      ))}
                    </div>
                  </div>
                  <button onClick={start} className="w-full py-4 bg-jade-600 text-white rounded-xl font-bold text-lg hover:bg-jade-700">Start Quiz ({Math.min(count || all.length, all.length)} phrases)</button>
                  <p className="text-xs text-gray-400 text-center">The wrong choices differ by colour or by thing. Doesn't count toward unlocking topics.</p>
                </div>
              )}
            </div>
          </div>
        );
      }

      // ---------- results ----------
      if (phase === 'done') {
        const pct = score.total ? Math.round((score.correct / score.total) * 100) : 0;
        return (
          <div className="max-w-2xl mx-auto p-6">
            <div className="bg-white rounded-3xl shadow-xl p-8 text-center">
              <div className="text-6xl mb-3">{pct >= 80 ? '🎉' : pct >= 50 ? '👏' : '💪'}</div>
              <h2 className="text-2xl font-bold text-gray-800 mb-1">{score.correct} / {score.total}</h2>
              <p className="text-gray-500 mb-6">{pct}% correct</p>
              <div className="flex gap-3 justify-center">
                <button onClick={() => setPhase('setup')} className="px-6 py-3 border-2 border-gray-200 rounded-full font-medium">Back to Setup</button>
                <button onClick={start} className="px-6 py-3 bg-jade-600 text-white rounded-full font-bold hover:bg-jade-700">↺ Again</button>
              </div>
            </div>
          </div>
        );
      }

      // ---------- question ----------
      const p = item.p, right = picked && picked.id === p.id;
      return (
        <div className="max-w-3xl mx-auto p-6">
          <div className="flex items-center justify-between mb-4">
            <button onClick={() => { window.KGAudio.stop(); setPhase('setup'); }} className="text-gray-500 hover:text-gray-700 font-medium">← Back</button>
            <div className="text-sm text-gray-500">{idx + 1} / {items.length} · ✓ {score.correct}</div>
          </div>
          <div className="bg-white rounded-3xl shadow-xl p-6 sm:p-8 mb-6 text-center">
            {toText ? (
              <div className="w-40 h-40 mx-auto bg-slate-100 rounded-3xl p-3"><ColourPicture item={p} size="w-32 h-32" /></div>
            ) : isListen && !picked ? (
              <button onClick={() => window.KGAudio.play(p.native, languageCode, { silent: true })} className="w-24 h-24 rounded-full bg-jade-600 text-white text-4xl shadow-lg hover:bg-jade-700" title="Play again (R)">🔊</button>
            ) : (
              <>
                <PhraseText p={p} />
                <div className="mt-3 flex justify-center gap-2"><SpeakButton text={p.native} lang={languageCode} /><SpeakButton text={p.native} lang={languageCode} slow /></div>
              </>
            )}
            <p className="text-sm text-gray-500 mt-4">{toText ? 'Which phrase is this?' : 'Which picture is it?'}</p>
          </div>
          <div className={`grid gap-3 ${toText ? 'grid-cols-1 sm:grid-cols-2' : 'grid-cols-2 sm:grid-cols-4'}`}>
            {item.options.map((o, i) => {
              const state = !picked ? 'border-gray-200 hover:border-jade-400' : o.id === p.id ? 'border-green-500 bg-green-50' : o.id === picked.id ? 'border-red-400 bg-red-50' : 'border-gray-100 opacity-60';
              return (
                <button key={o.id} onClick={() => choose(o)} disabled={!!picked} className={`relative rounded-2xl border-2 p-3 transition-all bg-white ${state}`}>
                  <span className="absolute top-1 left-2 text-xs text-gray-300">{i + 1}</span>
                  {toText ? <div className="py-2"><PhraseText p={o} size="text-xl" /></div> : <div className="bg-slate-100 rounded-xl p-2"><ColourPicture item={o} /></div>}
                  {picked && !toText && <div className="text-xs text-gray-500 mt-2">{o.meaning}</div>}
                </button>
              );
            })}
          </div>
          {picked && (
            <div className="text-center mt-6 animate-slide-up">
              <div className={`text-2xl font-bold mb-2 ${right ? 'text-green-600' : 'text-red-600'}`}>{right ? '✅ Correct!' : `❌ It was "${p.meaning}"`}</div>
              <div className="inline-block bg-white rounded-2xl shadow p-4 mb-4">
                <PhraseText p={p} size="text-2xl" />
                <div className="text-gray-500 text-sm mt-1">{p.meaning}</div>
                <div className="mt-2"><SpeakButton text={p.native} lang={languageCode} size="sm" /></div>
              </div>
              <div><button onClick={next} className="px-8 py-3 bg-blue-600 text-white rounded-full font-bold hover:bg-blue-700">{idx + 1 >= items.length ? 'See Results' : 'Next →'} <span className="text-blue-300 text-sm hidden sm:inline ml-1">↵</span></button></div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // TYPING TEST (timed)
    // ==========================================
    // Copy: see the word, type it (pure speed; doesn't touch word strength).
    // Recall: see the picture and meaning, type the word from memory (feeds the "Type from memory" strength column;
    // not needed for unlocking). Strict: a mistake must be fixed before the next item. Speed is characters per
    // minute, not words, because Thai, Burmese and Chinese don't put spaces between words.
    const TYPING_DURATIONS = [30, 60, 120];
    const TYPING_SETTINGS_KEY = 'kg_chart_typing';
    const TYPING_BEST_KEY = 'kg_chart_typing_best';
    // Personal bests ({ "lang|mode|source": { cpm, last, at } }) live on the device and on the account
    // (kg_chart_user_prefs.typing_best, kg-chart-polish.sql), so they follow the learner between phone and computer.
    // Merging keeps the highest cpm per key and the most recent run's "last".
    function mergeTypingBests(a, b) {
      const out = { ...(a || {}) };
      for (const [k, v] of Object.entries(b || {})) {
        if (!v || typeof v.cpm !== 'number') continue;
        const o = out[k];
        if (!o || typeof o.cpm !== 'number') { out[k] = v; continue; }
        const newer = (Date.parse(v.at) || 0) >= (Date.parse(o.at) || 0) ? v : o;
        out[k] = { cpm: Math.max(o.cpm, v.cpm), last: newer.last, at: newer.at };
      }
      return out;
    }
    async function syncTypingBests(user, local) {
      if (!user) return local;
      try {
        const { data, error } = await supabase.from('kg_chart_user_prefs').select('typing_best').eq('user_id', user.id).maybeSingle();
        if (error) return local; // before kg-chart-polish.sql: this device only
        const remote = data?.typing_best || {};
        const merged = mergeTypingBests(remote, local);
        if (JSON.stringify(merged) !== JSON.stringify(remote)) {
          const { error: e2 } = await supabase.from('kg_chart_user_prefs').upsert({ user_id: user.id, typing_best: merged, updated_at: new Date().toISOString() });
          if (e2) console.warn('Could not save typing best to the account:', e2.message);
        }
        return merged;
      } catch (e) { console.warn('Typing best: account not reachable, keeping this device\'s', e); return local; }
    }
    const TYPING_LANG_TAGS = { my: 'my-MM', ja: 'ja-JP', zh: 'zh-CN', si: 'si-LK', ko: 'ko-KR', ta: 'ta-IN', th: 'th-TH', ms: 'ms-MY', te: 'te-IN', mr: 'mr-IN', kn: 'kn-IN' };
    const typingNorm = (s) => (s || '').normalize('NFC').replace(/\s+/g, ' ').trim().toLowerCase();
    const typingChars = (s) => Array.from((s || '').normalize('NFC')).filter(c => !/\s/.test(c)).length;
    // How much of the typed text matches the start of the target (in code points of the normalised forms)
    function typingMatch(typed, target) {
      const a = Array.from(typingNorm(typed)), b = Array.from(typingNorm(target));
      let i = 0;
      while (i < a.length && i < b.length && a[i] === b[i]) i++;
      return { ok: i, total: a.length, wrong: a.length > i, done: a.length === b.length && i === b.length };
    }

    function TypingView({ vocabulary, languageCode, user, modeToggle, meaningName }) {
      const rules = React.useContext(RulesContext);
      const fontClass = LANGUAGE_FONTS[languageCode] || 'font-body';
      const saved0 = loadFromStorage(TYPING_SETTINGS_KEY, {});
      const [mode, setMode] = useState(saved0.mode === 'recall' ? 'recall' : 'copy');
      const [source, setSource] = useState(saved0.source === 'sentences' ? 'sentences' : 'words');
      const [duration, setDuration] = useState(TYPING_DURATIONS.includes(saved0.duration) ? saved0.duration : 60);
      const [sentences, setSentences] = useState(null);
      const [phase, setPhase] = useState('setup'); // setup | run | done
      const [items, setItems] = useState([]);
      const [idx, setIdx] = useState(0);
      const [typed, setTyped] = useState('');
      const [startedAt, setStartedAt] = useState(null);
      const [now, setNow] = useState(Date.now());
      const [stats, setStats] = useState({ chars: 0, errors: 0, done: 0, skipped: 0 });
      const [answers, setAnswers] = useState([]);
      const [reveal, setReveal] = useState(null);
      const [result, setResult] = useState(null);
      const composing = React.useRef(false);
      const wasWrong = React.useRef(false);
      const firstWrong = React.useRef(null); // what was typed when the current item first went wrong (shown in admin → Typed mistakes)
      const inputRef = React.useRef(null);
      const statsRef = React.useRef(stats); statsRef.current = stats;
      const answersRef = React.useRef(answers); answersRef.current = answers;

      useEffect(() => { saveToStorage(TYPING_SETTINGS_KEY, { mode, source, duration }); }, [mode, source, duration]);

      // Sentences come from the same table as the sentence quizzes
      useEffect(() => {
        if (source !== 'sentences') return;
        let cancelled = false;
        setSentences(null);
        supabase.from(TABLES.sentences).select('*').eq('language_code', languageCode).order('sort_order')
          .then(({ data, error }) => { if (!cancelled) setSentences(error ? [] : (data || []).filter(s => s.native_text?.trim())); });
        return () => { cancelled = true; };
      }, [source, languageCode]);

      const priv = React.useContext(PrivateLessonsContext);
      const pool = useMemo(() => {
        if (source === 'sentences') return (sentences || []).filter(s => !priv.groups.has(s.group_name)).map(s => ({ kind: 's', id: s.id, text: s.native_text, meaning: s.english_text }));
        return vocabulary.filter(v => v.translation?.native_text?.trim()).map(v => ({ kind: 'w', id: v.id, text: v.translation.native_text, meaning: v.display_text || v.english_text, hint: v.translation.devanagari, v }));
      }, [source, sentences, vocabulary, priv]);

      const bestKey = `${languageCode}|${mode}|${source}`;
      const [, setBestsSynced] = useState(0);
      useEffect(() => {
        let cancelled = false;
        syncTypingBests(user, loadFromStorage(TYPING_BEST_KEY, {})).then(m => { if (!cancelled) { saveToStorage(TYPING_BEST_KEY, m); setBestsSynced(n => n + 1); } });
        return () => { cancelled = true; };
      }, [user]);
      const bests = loadFromStorage(TYPING_BEST_KEY, {});
      const best = bests[bestKey];

      const start = () => {
        if (!pool.length) return;
        // Enough items for the whole run: reshuffle the pool as often as needed
        let list = [];
        while (list.length < 200) list = list.concat(shuffleArr(pool));
        setItems(list); setIdx(0); setTyped(''); setStartedAt(null); setNow(Date.now());
        setStats({ chars: 0, errors: 0, done: 0, skipped: 0 }); setAnswers([]); setReveal(null); setResult(null);
        wasWrong.current = false; firstWrong.current = null; composing.current = false;
        setPhase('run');
      };

      const elapsed = startedAt ? Math.min(duration, (now - startedAt) / 1000) : 0;
      const remaining = Math.max(0, Math.ceil(duration - elapsed));
      const cpmOf = (chars, secs) => (secs > 0 ? Math.round(chars / (secs / 60)) : 0);
      const accOf = (s) => (s.chars + s.errors > 0 ? Math.round((s.chars / (s.chars + s.errors)) * 100) : 100);

      // secs: the full time, or the time actually typed when leaving early
      const finish = useCallback(async (secs = duration) => {
        const s = statsRef.current, ans = answersRef.current;
        const cpm = cpmOf(s.chars, secs), acc = accOf(s);
        const prev = loadFromStorage(TYPING_BEST_KEY, {});
        const old = prev[bestKey];
        const isBest = !old || cpm > old.cpm;
        const next = { ...prev, [bestKey]: { cpm: isBest ? cpm : old.cpm, last: cpm, at: new Date().toISOString() } };
        saveToStorage(TYPING_BEST_KEY, next);
        syncTypingBests(user, next).then(m => saveToStorage(TYPING_BEST_KEY, mergeTypingBests(loadFromStorage(TYPING_BEST_KEY, {}), m)));
        setResult({ cpm, acc, done: s.done, skipped: s.skipped, isBest, prevBest: old?.cpm ?? null, prevLast: old?.last ?? null });
        setPhase('done');
        if (!user || s.done + s.skipped === 0) return;
        const { data: session, error } = await supabase.from(TABLES.quizSessions).insert({
          user_id: user.id, language_code: languageCode, topic_id: null,
          quiz_type: mode === 'recall' ? 'typing_recall' : 'typing_copy',
          total_questions: s.done + s.skipped, correct_answers: s.done,
          time_spent_seconds: Math.round(secs), completed_at: new Date().toISOString(),
        }).select('id').single();
        // Both modes save their answers (admin → Typed mistakes). Only recall counts toward word strength:
        // the learning path ignores typing_copy (STRENGTH_IGNORED_TYPES).
        if (!error && session && ans.length) {
          const rows = ans.map(a => ({ ...a, session_id: session.id }));
          const { error: e2 } = await supabase.from(TABLES.quizAnswers).insert(rows);
          if (e2) await supabase.from(TABLES.quizAnswers).insert(rows.map(({ sentence_id, ...r }) => r));
        }
      }, [duration, bestKey, user, languageCode, mode]);

      // Clock: starts on the first keystroke, ends the run when time is up
      useEffect(() => {
        if (phase !== 'run' || !startedAt) return;
        const t = setInterval(() => {
          const n = Date.now(); setNow(n);
          if ((n - startedAt) / 1000 >= duration) { clearInterval(t); finish(); }
        }, 200);
        return () => clearInterval(t);
      }, [phase, startedAt, duration, finish]);

      useEffect(() => { if (phase === 'run' && inputRef.current) inputRef.current.focus(); }, [phase, idx]);

      const item = items[idx];
      // selected_vocabulary_id = the item when it was typed to the end, null when skipped
      const record = (correct, typedText, finished) => {
        if (item.kind === 'w') setAnswers(a => [...a, { vocabulary_id: item.id, selected_vocabulary_id: finished ? item.id : null, is_correct: correct, answer_text: typedText, answered_at: new Date().toISOString() }]);
        else setAnswers(a => [...a, { vocabulary_id: null, sentence_id: item.id, selected_vocabulary_id: finished ? item.id : null, is_correct: correct, answer_text: typedText, answered_at: new Date().toISOString() }]);
      };
      const advance = () => { setIdx(i => i + 1); setTyped(''); wasWrong.current = false; firstWrong.current = null; };

      const evaluate = (value, isComposing) => {
        if (phase !== 'run' || !item) return;
        if (!startedAt && value) { setStartedAt(Date.now()); setNow(Date.now()); }
        const m = typingMatch(value, item.text);
        if (m.done) {
          setStats(s => ({ ...s, chars: s.chars + typingChars(item.text), done: s.done + 1 }));
          // Saved text = the first wrong attempt if there was one. Recall: finished = correct (strength);
          // copy: correct only without a mistake.
          record(mode === 'copy' ? firstWrong.current == null : true, firstWrong.current ?? value, true);
          setReveal(null);
          advance();
          return;
        }
        // An unfinished syllable in an input method (Korean, Chinese, phone keyboards) isn't a mistake yet
        const wrongNow = m.wrong && !(isComposing && m.ok >= m.total - 1);
        if (wrongNow && !wasWrong.current) setStats(s => ({ ...s, errors: s.errors + 1 }));
        if (wrongNow && firstWrong.current == null) firstWrong.current = value;
        wasWrong.current = wrongNow;
      };

      const onChange = (e) => {
        const value = e.target.value;
        setTyped(value);
        evaluate(value, composing.current || e.nativeEvent?.isComposing);
      };
      const skip = () => {
        if (!item) return;
        setStats(s => ({ ...s, skipped: s.skipped + 1 }));
        record(false, typed, false);
        setReveal(mode === 'recall' ? item : null);
        advance();
        if (inputRef.current) inputRef.current.focus();
      };
      const leave = () => { if (phase === 'run' && startedAt && elapsed >= 5) finish(elapsed); else setPhase('setup'); };

      // ---------- setup ----------
      if (phase === 'setup') {
        const lang = languageName(languageCode);
        const seg = (val, set, opts) => (
          <div className="flex bg-gray-100 rounded-xl p-1">
            {opts.map(([id, label]) => (
              <button key={id} onClick={() => set(id)}
                className={`flex-1 py-2 px-2 rounded-lg text-sm font-medium transition-all ${val === id ? 'bg-white shadow text-jade-700' : 'text-gray-500'}`}>{label}</button>
            ))}
          </div>
        );
        return (
          <div className="max-w-2xl mx-auto p-6">
            <div className="bg-white rounded-3xl shadow-xl p-8">
              <div className="text-center mb-8">
                <div className="w-20 h-20 bg-jade-100 rounded-full flex items-center justify-center mx-auto mb-4"><span className="text-4xl">⌨️</span></div>
                <h2 className="text-3xl font-bold text-gray-800">Quiz Mode</h2>
              </div>
              {modeToggle}
              <div className="space-y-5">
                <div>
                  <label className="block text-sm font-semibold text-gray-700 mb-2">Mode</label>
                  {seg(mode, setMode, [['copy', '👀 Copy the word'], ['recall', '🧠 Type from memory']])}
                  <p className="text-xs text-gray-400 mt-2">{mode === 'copy' ? 'You see the word and type it as fast as you can. Speed practice only.' : `You see the picture and the ${meaningName && meaningName !== 'English' ? meaningName : 'English'} meaning, and type the word. Counts toward word strength${rules.quizTypes.includes('typing_recall') ? ' and unlocking' : ''}.`}</p>
                </div>
                <div>
                  <label className="block text-sm font-semibold text-gray-700 mb-2">Type</label>
                  {seg(source, setSource, [['words', '🔤 Words'], ['sentences', '💬 Sentences']])}
                </div>
                <div>
                  <label className="block text-sm font-semibold text-gray-700 mb-2">Time</label>
                  {seg(duration, setDuration, TYPING_DURATIONS.map(d => [d, d < 60 ? `${d} s` : `${d / 60} min`]))}
                </div>
                <div className="bg-blue-50 text-blue-800 rounded-2xl p-4 text-sm">
                  You need a {lang} keyboard on this device. The clock starts on your first key. A mistake turns red and must be fixed before the next {source === 'words' ? 'word' : 'sentence'}.
                </div>
                {best && <div className="text-center text-sm text-gray-500">Your best: <b className="text-jade-700">{best.cpm}</b> characters/min{best.last != null ? ` · last time ${best.last}` : ''}</div>}
                <button onClick={start} disabled={!pool.length}
                  className="w-full py-4 bg-jade-600 text-white rounded-xl font-bold text-lg hover:bg-jade-700 disabled:opacity-50">
                  {source === 'sentences' && sentences === null ? 'Loading sentences…' : !pool.length ? (source === 'sentences' ? `No ${lang} sentences yet` : 'No words to type') : 'Start'}
                </button>
              </div>
            </div>
          </div>
        );
      }

      // ---------- results ----------
      if (phase === 'done' && result) {
        const delta = result.prevLast != null ? result.cpm - result.prevLast : null;
        return (
          <div className="max-w-2xl mx-auto p-6">
            <div className="bg-white rounded-3xl shadow-xl p-8 text-center">
              <div className="text-6xl mb-3">{result.isBest && result.prevBest != null ? '🏆' : '⌨️'}</div>
              <h2 className="text-2xl font-bold text-gray-800 mb-6">{result.isBest && result.prevBest != null ? 'New personal best!' : 'Time!'}</h2>
              <div className="grid grid-cols-2 gap-4 mb-4">
                <div className="bg-gradient-to-r from-jade-500 to-jade-600 text-white rounded-2xl p-5">
                  <div className="text-4xl font-bold">{result.cpm}</div><div className="text-sm opacity-90">characters / min</div>
                </div>
                <div className="bg-gray-50 rounded-2xl p-5">
                  <div className="text-4xl font-bold text-gray-800">{result.acc}%</div><div className="text-sm text-gray-500">accuracy</div>
                </div>
              </div>
              <p className="text-gray-500 mb-1">{result.done} typed{result.skipped ? ` · ${result.skipped} skipped` : ''}</p>
              {delta != null && <p className={`text-sm mb-1 ${delta >= 0 ? 'text-green-600' : 'text-gray-500'}`}>{delta >= 0 ? `+${delta}` : delta} since last time</p>}
              {result.prevBest != null && !result.isBest && <p className="text-sm text-gray-400 mb-1">Best: {result.prevBest}</p>}
              <div className="flex gap-4 justify-center mt-6">
                <button onClick={() => setPhase('setup')} className="px-6 py-3 bg-gray-100 rounded-xl font-medium hover:bg-gray-200">← Back to Setup</button>
                <button onClick={start} className="px-6 py-3 bg-jade-600 text-white rounded-xl font-bold hover:bg-jade-700">Try Again</button>
              </div>
            </div>
          </div>
        );
      }

      if (!item) return <LoadingSpinner />;
      // ---------- running ----------
      const m = typingMatch(typed, item.text);
      const target = Array.from(item.text.normalize('NFC'));
      const showTarget = mode === 'copy';
      const next = items[idx + 1];
      return (
        <div className="max-w-3xl mx-auto p-4">
          <div className="bg-white rounded-2xl shadow-lg p-4 mb-6 flex items-center justify-between gap-4">
            <button onClick={leave} className="px-4 py-2 bg-gray-100 rounded-xl hover:bg-gray-200 font-medium">← Back</button>
            <div className="flex items-center gap-3">
              <div className={`text-2xl font-bold tabular-nums ${remaining <= 5 && startedAt ? 'text-red-600' : 'text-gray-800'}`}>{startedAt ? `${remaining}s` : `${duration}s`}</div>
              <div className="bg-gradient-to-r from-jade-500 to-jade-600 text-white px-3 py-2 rounded-xl font-bold shadow-md text-sm">{cpmOf(stats.chars, elapsed)} cpm</div>
              <div className="text-sm text-gray-500">{accOf(stats)}%</div>
            </div>
          </div>

          <div className="bg-white rounded-2xl shadow-lg p-8 mb-4 text-center">
            {showTarget ? (
              <>
                <div className={`text-4xl font-bold mb-2 ${fontClass}`} aria-label={item.text}>
                  {/* typed part green, first mistake red, rest grey; NFC code points, so matching is exact */}
                  {target.map((c, i) => <span key={i} className={i < m.ok ? 'text-green-600' : (i === m.ok && m.wrong ? 'text-red-600 underline' : 'text-gray-800')}>{c}</span>)}
                </div>
                {item.hint && item.hint !== item.text && <div className="text-lg text-blue-600 font-devanagari">{item.hint}</div>}
                {next && <div className={`text-lg text-gray-300 mt-4 ${fontClass}`}>next: {next.text}</div>}
              </>
            ) : (
              <>
                {item.kind === 'w' && (
                  <div className="w-28 h-28 mx-auto flex items-center justify-center mb-3">
                    {item.v.extra_data?.colorCode ? <div className="w-24 h-24 rounded-xl shadow-lg" style={{ backgroundColor: item.v.extra_data.colorCode }} />
                      : item.v.image_filename ? <img src={getImageUrl(item.v.topic_id, item.v.image_filename)} alt="" className="max-w-full max-h-full object-contain" /> : null}
                  </div>
                )}
                <div className="text-2xl font-bold text-gray-800">{item.meaning}</div>
              </>
            )}
          </div>

          <input ref={inputRef} value={typed} onChange={onChange}
            onCompositionStart={() => { composing.current = true; }}
            onCompositionEnd={(e) => { composing.current = false; evaluate(e.target.value, false); }}
            lang={TYPING_LANG_TAGS[languageCode] || languageCode} autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck={false}
            placeholder={startedAt ? '' : 'Start typing…'} aria-label="Type here"
            className={`w-full px-5 py-4 text-2xl rounded-2xl border-4 outline-none ${fontClass} ${m.wrong && !composing.current ? 'border-red-400 bg-red-50' : 'border-jade-300 focus:border-jade-500'}`} />
          <div className="flex items-center justify-between mt-3 text-sm">
            <div className="text-gray-400">{stats.done} typed{stats.skipped ? ` · ${stats.skipped} skipped` : ''}</div>
            <button onClick={skip} className="px-4 py-2 bg-gray-100 rounded-xl hover:bg-gray-200 font-medium">{mode === 'recall' ? 'Show & skip' : 'Skip'}</button>
          </div>
          {reveal && <div className={`mt-3 text-center text-gray-500 ${fontClass}`}>It was <b className="text-gray-800">{reveal.text}</b> ({reveal.meaning})</div>}
        </div>
      );
    }

    function FlashcardView({ topics, vocabulary, ratings, onRate, languageCode, user }) {
      const [selectedTopic, setSelectedTopic] = useState('all');
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);
      const [flagCard, setFlagCard] = useState(null);

      const fontClass = LANGUAGE_FONTS[languageCode] || 'font-body';
      const filteredVocab = selectedTopic === 'all' ? vocabulary : vocabulary.filter(v => v.topic_id === selectedTopic);
      const currentItem = filteredVocab[currentIndex];
      const currentRating = currentItem ? getRatingById(ratings[currentItem.id]?.rating) : null;

      useEffect(() => { setCurrentIndex(0); setIsFlipped(false); }, [selectedTopic]);

      const goNext = () => { setIsFlipped(false); setTimeout(() => setCurrentIndex(prev => (prev + 1) % filteredVocab.length), 100); };
      const goPrev = () => { setIsFlipped(false); setTimeout(() => setCurrentIndex(prev => (prev - 1 + filteredVocab.length) % filteredVocab.length), 100); };
      const goRandom = () => { setIsFlipped(false); setTimeout(() => setCurrentIndex(Math.floor(Math.random() * filteredVocab.length)), 100); };
      const handleRate = (ratingId) => { if (currentItem && user) { onRate(currentItem.id, ratingId); } };

      // Keyboard support: ←/→ prev/next, Space flip, 1-5 rate, R random
      useEffect(() => {
        const handleKey = (e) => {
          if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName) || kgModalOpen()) return;
          switch (e.key) {
            case 'ArrowLeft': e.preventDefault(); goPrev(); break;
            case 'ArrowRight': e.preventDefault(); goNext(); break;
            case ' ': e.preventDefault(); setIsFlipped(f => !f); break;
            case 'r': case 'R': e.preventDefault(); goRandom(); break;
            default:
              const num = parseInt(e.key);
              if (num >= 1 && num <= 5 && user) handleRate(num);
          }
        };
        window.addEventListener('keydown', handleKey);
        return () => window.removeEventListener('keydown', handleKey);
      }, [currentItem, user, filteredVocab]);

                <div className={`text-5xl font-bold text-gray-800 mb-4 ${fontClass}`}>{currentItem.translation?.native_text}</div>
                <div className="text-3xl text-blue-600 font-devanagari mb-4">{currentItem.translation?.devanagari}</div>
                <div className="absolute bottom-6 text-gray-400 text-sm">👆 Tap to flip <span className="hidden sm:inline text-gray-300 ml-1">(Space)</span></div>
              </div>
              <div className="flip-card-back absolute inset-0 bg-gradient-to-br from-jade-50 to-white rounded-3xl shadow-xl p-8 flex flex-col items-center justify-center">
                <div className="w-32 h-32 mb-4 flex items-center justify-center">
                  {currentItem.extra_data?.colorCode ? (

                  ) : (

            <FlagButton onClick={() => setFlagCard(currentItem)} />

            <button onClick={goRandom} className="px-6 py-3 bg-purple-500 text-white rounded-xl hover:bg-purple-600 font-medium shadow-md">🎲 Random <span className="text-purple-300 text-xs hidden sm:inline">(R)</span></button>
            <button onClick={goNext} className="px-6 py-3 bg-gray-100 rounded-xl hover:bg-gray-200 font-medium">Next →</button>
          </div>

          {user ? (
            <div className="bg-white rounded-2xl shadow-lg p-4">
              <div className="text-center text-sm text-gray-500 mb-3">How well do you know this?</div>
              <div className="flex flex-wrap justify-center gap-2">
                {RATINGS.map((r) => (
                  <button key={r.id} onClick={() => handleRate(r.id)}
                    className={`px-4 py-2 rounded-xl text-sm font-medium transition-all ${
                      ratings[currentItem.id]?.rating === r.id ? r.color + ' text-white shadow-lg' : 'bg-gray-100 hover:bg-gray-200'
                    }`}>{r.emoji} {r.label}</button>
                ))}
              </div>
            </div>
          ) : (
            <div className="bg-amber-50 rounded-2xl p-4 text-center">
              <p className="text-amber-700 text-sm">Sign in to save your progress</p>
            </div>

      );
    }

    function ProgressView({ topics, vocabulary, ratings, languageCode, user, path , meaningName}) {
      const fontClass = LANGUAGE_FONTS[languageCode] || 'font-body';

      const stats = useMemo(() => {
        const result = { total: vocabulary.length, rated: 0, byRating: {}, byTopic: {} };
        RATINGS.forEach(r => { result.byRating[r.id] = 0; });
        topics.forEach(t => {
          result.byTopic[t.id] = { topic: t, total: 0, rated: 0, byRating: {} };
          RATINGS.forEach(r => { result.byTopic[t.id].byRating[r.id] = 0; });
        });
        vocabulary.forEach(vocab => {
          const rating = ratings[vocab.id]?.rating;
          if (result.byTopic[vocab.topic_id]) {
            result.byTopic[vocab.topic_id].total++;
            if (rating) { result.byTopic[vocab.topic_id].rated++; result.byTopic[vocab.topic_id].byRating[rating]++; }
          }
          if (rating) { result.rated++; result.byRating[rating]++; }
        });
        return result;
      }, [topics, vocabulary, ratings]);

      if (!user) {
        return (
          <div className="max-w-4xl mx-auto p-6 text-center">
            <div className="bg-white rounded-3xl shadow-xl p-8">
              <div className="w-24 h-24 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-6">
                <span className="text-5xl">📊</span>
              </div>
              <h2 className="text-2xl font-bold text-gray-800 mb-2">Track Your Progress</h2>
              <p className="text-gray-500">Sign in to track your vocabulary ratings.</p>
            </div>
          </div>
        );
      }

      const progressPercent = stats.total > 0 ? Math.round((stats.rated / stats.total) * 100) : 0;

      return (
        <div className="max-w-4xl mx-auto p-4 space-y-6">
          {path && <LearningPathCard path={path} vocabulary={vocabulary} ratings={ratings} fontClass={fontClass} languageCode={languageCode} meaningName={meaningName} />}
          <div className="bg-white rounded-3xl shadow-xl p-6">
            <h2 className="text-2xl font-bold text-gray-800 mb-6">Overall Progress</h2>
            <div className="mb-4">
              <div className="flex items-center justify-between mb-2">
                <span className="text-gray-600">Vocabulary Rated</span>
                <span className="font-bold text-jade-600">{progressPercent}%</span>
              </div>
              <div className="h-4 bg-gray-100 rounded-full overflow-hidden">
                <div className="h-full bg-gradient-to-r from-jade-400 to-jade-600 rounded-full" style={{ width: `${Math.max(progressPercent, 2)}%` }} />
              </div>
              <p className="text-sm text-gray-500 mt-2">{stats.rated} of {stats.total} items rated</p>
            </div>

            <div className="grid grid-cols-5 gap-3 mt-6">
              {RATINGS.map(r => (
                <div key={r.id} className={`p-4 rounded-xl text-center ${r.color} bg-opacity-10`}>
                  <div className="text-2xl mb-1">{r.emoji}</div>
                  <div className={`text-2xl font-bold ${r.textColor}`}>{stats.byRating[r.id]}</div>
                </div>
              ))}
            </div>
          </div>

          <div className="bg-white rounded-2xl shadow-lg p-6">
            <h3 className="text-lg font-bold text-gray-800 mb-4">Progress by Topic</h3>
            <div className="space-y-4">
              {Object.values(stats.byTopic).filter(ts => ts.total > 0).map(ts => {
                const topicPercent = Math.round((ts.rated / ts.total) * 100);
                return (
                  <div key={ts.topic.id} className="border-b border-gray-100 pb-4 last:border-b-0">
                    <div className="flex items-center justify-between mb-2">
                      <div className="flex items-center gap-2">
                        <span className="text-xl">{ts.topic.icon}</span>
                        <span className={`font-medium text-gray-800 ${fontClass}`}>{ts.topic.translation?.title_native}</span>
                      </div>
                      <div className="text-sm text-gray-500">{ts.rated}/{ts.total} ({topicPercent}%)</div>
                    </div>
                    <div className="h-3 bg-gray-100 rounded-full overflow-hidden flex">
                      {RATINGS.map(r => {
                        const percent = (ts.byRating[r.id] / ts.total) * 100;
                        return percent > 0 ? <div key={r.id} className={r.color} style={{ width: `${percent}%` }} /> : null;
                      })}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // LEARNING PATH (Phase 8): topic unlocking + word strength
    // ==========================================
    const STRENGTH_WINDOW = 5;
    const ratingScore = (r) => (r == null ? null : r <= 2 ? 1 : r === 3 ? 0.5 : 0);
    function strengthPct(list) {
      if (!list || !list.length) return null;
      const last = list.slice(-STRENGTH_WINDOW);
      return Math.round(100 * last.filter(a => a.c).length / last.length);
    }
    function overallPct(byType, rating) {
      const all = Object.values(byType || {}).flat().sort((a, b) => a.t - b.t).slice(-STRENGTH_WINDOW).map(a => (a.c ? 1 : 0));
      const rs = ratingScore(rating);
      if (rs != null) all.push(rs);
      return all.length ? Math.round(100 * all.reduce((s, x) => s + x, 0) / all.length) : null;
    }
    const strengthClass = (p) => (p == null ? 'bg-gray-100 text-gray-400' : p >= 80 ? 'bg-green-500 text-white' : p >= 40 ? 'bg-amber-400 text-gray-900' : 'bg-red-500 text-white');
    const topicTitle = (t) => t?.translation?.title_native || slugToLabel(t?.id || '');

    // ==========================================
    // PRIVATE LESSONS (kg_chart_settings 'private_lessons')
    // ==========================================
    // [{ language_code, topic_id, sentence_groups: [...], emails: [...] }]: only those accounts and admins see that
    // topic and those sentence groups. Everyone else gets them filtered out here.
    const PrivateLessonsContext = React.createContext({ topics: new Set(), groups: new Set(), loaded: true });

    function usePrivateLessons(user, languageCode) {
      const [rows, setRows] = useState(null); // null = loading
      const [isAdmin, setIsAdmin] = useState(false);
      useEffect(() => {
        if (!user) { setRows([]); return; }
        let cancelled = false;
        Promise.all([
          supabase.from(TABLES.settings).select('value').eq('key', 'private_lessons').maybeSingle(),
          supabase.rpc('kg_chart_is_admin'),
        ]).then(([set, adm]) => {
          if (cancelled) return;
          setRows(Array.isArray(set.data?.value) ? set.data.value : []);
          setIsAdmin(adm.data === true);
        }, () => { if (!cancelled) setRows([]); });
        return () => { cancelled = true; };
      }, [user]);
      return useMemo(() => {
        const email = (user?.email || '').toLowerCase();
        const hidden = isAdmin ? [] : (rows || []).filter(r =>
          (!r.language_code || r.language_code === languageCode) && !(r.emails || []).some(e => String(e).toLowerCase() === email));
        return {
          topics: new Set(hidden.map(r => r.topic_id).filter(Boolean)),
          groups: new Set(hidden.flatMap(r => r.sentence_groups || [])),
          loaded: rows !== null,
        };
      }, [rows, isAdmin, user, languageCode]);
    }

    function useLearningPath({ user, languageCode, topics, vocabulary, rules }) {
      const [raw, setRaw] = useState(null);
      const [tick, setTick] = useState(0);
      const [celebration, setCelebration] = useState(null);
      const recordedRef = React.useRef(new Set());
      const refresh = useCallback(() => setTick(n => n + 1), []);

      useEffect(() => { setRaw(null); recordedRef.current = new Set(); }, [user?.id, languageCode]);

      useEffect(() => {
        if (!user || !languageCode) return;
        let cancelled = false;
        const email = (user.email || '').toLowerCase();
        Promise.all([
          supabase.rpc('kg_chart_my_answers', { p_lang: languageCode }),
          supabase.from(TABLES.topicUnlocks).select('topic_id').eq('email', email).in('language_code', [languageCode, '*']),
          supabase.from(TABLES.progressResets).select('*').in('language_code', [languageCode, '*']),
          supabase.from(TABLES.topicCompletions).select('*').eq('user_id', user.id).eq('language_code', languageCode),
          supabase.from(TABLES.settings).select('value').eq('key', 'admin_bypass_lock').maybeSingle(),
          supabase.rpc('kg_chart_is_admin'),
        ]).then(([ans, unl, rst, cmp, set, adm]) => {
          if (cancelled) return;
          const failed = [ans, unl, rst, cmp].find(r => r.error);
          if (failed) console.warn('Learning path is off until kg-chart-phase8.sql is run:', failed.error.message);
          setRaw({
            ready: !failed,
            answers: ans.data || [],
            unlocks: new Set((unl.data || []).map(u => u.topic_id)),
            resetAt: Math.max(0, ...(rst.data || []).filter(r => !r.email || r.email === email).map(r => Date.parse(r.reset_at) || 0)),
            completions: cmp.data || [],
            bypass: adm.data === true && set.data?.value === true,
          });
        });
        return () => { cancelled = true; };
      }, [user, languageCode, tick]);

      const computed = useMemo(() => {
        const visible = topics.filter(t => !t.is_hidden);
        const visibleIds = new Set(visible.map(t => t.id));
        const visibleVocab = vocabulary.filter(v => visibleIds.has(v.topic_id));
        const resetAt = raw?.resetAt || 0;
        const attempts = {};
        const counts = {}; // word id -> quiz type -> answers since last reset (drives unlocking)
        (raw?.answers || []).forEach(a => {
          if (STRENGTH_IGNORED_TYPES.includes(a.quiz_type)) return;
          const id = String(a.vocabulary_id);
          const ts = Date.parse(a.answered_at) || 0;
          const w = (attempts[id] = attempts[id] || {});
          (w[a.quiz_type] = w[a.quiz_type] || []).push({ c: !!a.is_correct, t: ts });
          if (ts > resetAt) { const c = (counts[id] = counts[id] || {}); c[a.quiz_type] = (c[a.quiz_type] || 0) + 1; }
        });
        const stepsPerWord = rules.quizTypes.length * rules.minAttempts;
        const wordSteps = (id) => rules.quizTypes.reduce((s, q) => s + Math.min(counts[id]?.[q] || 0, rules.minAttempts), 0);
        const wordDone = (id) => wordSteps(id) === stepsPerWord;
        const open = !raw?.ready || raw?.bypass;
        const done = new Set((raw?.completions || []).filter(c => (Date.parse(c.completed_at) || 0) > resetAt).map(c => c.topic_id));
        const status = {};
        const newlyComplete = [];
        let prevComplete = true;
        visible.forEach(t => {
          const words = visibleVocab.filter(v => v.topic_id === t.id);
          if (!words.length) { status[t.id] = { unlocked: true, complete: true, faced: 0, total: 0, steps: 0, stepsTotal: 0, empty: true }; return; }
          const facedCount = words.filter(w => wordDone(String(w.id))).length;
          const steps = words.reduce((s, w) => s + wordSteps(String(w.id)), 0);
          const nowComplete = raw?.ready && facedCount === words.length;
          const complete = done.has(t.id) || !!nowComplete;
          const manual = !!raw?.unlocks?.has(t.id);
          if (nowComplete && !done.has(t.id)) newlyComplete.push(t.id);
          status[t.id] = { unlocked: open || prevComplete || manual || complete, complete, faced: facedCount, total: words.length, steps, stepsTotal: words.length * stepsPerWord, manual };
          prevComplete = complete;
        });
        const annotated = visible.map(t => ({ ...t, locked: !status[t.id].unlocked }));
        const unlockedIds = new Set(annotated.filter(t => !t.locked).map(t => t.id));
        const unlockedVocab = visibleVocab.filter(v => unlockedIds.has(v.topic_id));
        return { topics: annotated, status, attempts, counts, visibleVocab, unlockedVocab, newlyComplete, enabled: !!raw?.ready && !raw?.bypass, bypass: !!raw?.bypass };
      }, [topics, vocabulary, raw, rules]);

      useEffect(() => {
        if (!user || !computed.newlyComplete.length) return;
        const fresh = computed.newlyComplete.filter(id => !recordedRef.current.has(id));
        if (!fresh.length) return;
        fresh.forEach(id => recordedRef.current.add(id));
        const now = new Date().toISOString();
        supabase.from(TABLES.topicCompletions)
          .upsert(fresh.map(topic_id => ({ user_id: user.id, language_code: languageCode, topic_id, completed_at: now })), { onConflict: 'user_id,language_code,topic_id' })
          .then(({ error }) => { if (error) console.warn('Could not save topic completion:', error.message); });
        const idx = computed.topics.findIndex(t => t.id === fresh[fresh.length - 1]);
        const next = computed.topics.slice(idx + 1).find(t => !computed.status[t.id].complete && !computed.status[t.id].empty);
        setCelebration({ topic: computed.topics[idx], next });
      }, [computed]);

      return { ...computed, loading: !!user && !raw, refresh, celebration, dismissCelebration: () => setCelebration(null) };
    }

    function LockedTopicPanel({ topic, prevTopic, prevStatus, fontClass, onGoQuiz }) {
      const rules = React.useContext(RulesContext);
      const pct = prevStatus?.stepsTotal ? Math.round(100 * prevStatus.steps / prevStatus.stepsTotal) : 0;
      return (
        <div className="max-w-xl mx-auto p-6">
          <div className="bg-white rounded-3xl shadow-xl p-8 text-center">
            <div className="text-5xl mb-3">🔒</div>
            <h2 className="text-2xl font-bold text-gray-800 mb-2">{topic.icon} <span className={fontClass}>{topicTitle(topic)}</span> is locked</h2>
            {prevTopic ? (
              <>
                <p className="text-gray-500 mb-5">Answer every word in <b className={fontClass}>{topicTitle(prevTopic)}</b> {ruleText(rules)} to unlock it. Right or wrong both count.</p>
                <div className="h-3 bg-gray-100 rounded-full overflow-hidden mb-2"><div className="h-full bg-jade-500 rounded-full" style={{ width: Math.max(pct, 2) + '%' }} /></div>
                <p className="text-sm text-gray-500 mb-6">{prevStatus.faced} of {prevStatus.total} words done · {prevStatus.steps}/{prevStatus.stepsTotal} answers</p>
                <button onClick={onGoQuiz} className="px-6 py-3 bg-jade-600 text-white rounded-xl font-bold hover:bg-jade-700">Go to Quiz →</button>
              </>
            ) : <p className="text-gray-500">Ask the admin to unlock this topic.</p>}
          </div>
        </div>
      );
    }

    function CelebrationModal({ topic, next, fontClass, onOpen, onClose }) {
      const rules = React.useContext(RulesContext);
      const [secs, setSecs] = useState(6);
      useEffect(() => {
        if (!next) return;
        if (secs <= 0) { onOpen(); return; }
        const id = setTimeout(() => setSecs(s => s - 1), 1000);
        return () => clearTimeout(id);
      }, [secs, next]);
      return (
        <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
          <div className="bg-white rounded-3xl shadow-2xl p-8 max-w-md w-full text-center animate-slide-up">
            <div className="text-6xl mb-3">🎉</div>
            <h2 className="text-2xl font-bold text-gray-800 mb-1">Topic complete!</h2>
            <p className="text-gray-500 mb-6">{topic?.icon} <span className={fontClass}>{topicTitle(topic)}</span>: every word answered {ruleText(rules)}.</p>
            {next ? (
              <>
                <div className="bg-jade-50 rounded-2xl p-4 mb-6">
                  <div className="text-xs font-semibold text-jade-700 uppercase tracking-wide mb-1">Unlocked</div>
                  <div className="text-xl font-bold text-gray-800">{next.icon} <span className={fontClass}>{topicTitle(next)}</span></div>
                </div>
                <div className="flex gap-3 justify-center">
                  <button onClick={onClose} className="px-5 py-3 bg-gray-100 rounded-xl font-medium hover:bg-gray-200">Stay here</button>
                  <button onClick={onOpen} className="px-5 py-3 bg-jade-600 text-white rounded-xl font-bold hover:bg-jade-700">Open now ({secs})</button>
                </div>
              </>
            ) : (
              <>
                <p className="text-gray-700 font-medium mb-6">You've completed every topic.</p>
                <button onClick={onClose} className="px-6 py-3 bg-jade-600 text-white rounded-xl font-bold hover:bg-jade-700">Close</button>
              </>
            )}
          </div>
        </div>
      );
    }

    function WordStrengthModal({ item, byType, rating, fontClass, onClose, languageCode, meaningName }) {
      const r = getRatingById(rating);
      const overall = overallPct(byType, rating);
      return (
        <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
          <div className="bg-white rounded-3xl shadow-2xl p-6 max-w-md w-full max-h-[90vh] overflow-y-auto">
            <div className="flex items-start justify-between gap-4 mb-5">
              <div>
                <div className={'text-3xl font-bold text-gray-800 ' + fontClass}>{item.translation?.native_text}</div>
                <div className="text-gray-500">{item.display_text}</div>
              </div>
              <div className={'w-16 h-16 rounded-2xl flex flex-col items-center justify-center shrink-0 ' + strengthClass(overall)}>
                <div className="text-lg font-bold leading-none">{overall == null ? '–' : overall + '%'}</div>
                <div className="text-[10px] mt-1 opacity-80">overall</div>
              </div>
            </div>
            <div className="space-y-2">
              {STRENGTH_TYPES.map(q0 => quizTypeLabel(q0, languageCode, meaningName)).map(q => {
                const list = byType?.[q.id] || [];
                const pct = strengthPct(list);
                const last = list.slice(-STRENGTH_WINDOW);
                return (
                  <div key={q.id} className="flex items-center gap-3 p-3 bg-gray-50 rounded-xl">
                    <span className="text-xl w-7 text-center">{q.icon}</span>
                    <div className="flex-1 min-w-0">
                      <div className="text-sm font-medium text-gray-800">{q.label}</div>
                      <div className="text-xs text-gray-400">{list.length ? list.length + ' attempt' + (list.length === 1 ? '' : 's') : 'Not faced yet'}</div>
                    </div>
                    <div className="flex gap-1">{last.map((a, i) => <span key={i} className={'w-2.5 h-2.5 rounded-full ' + (a.c ? 'bg-green-500' : 'bg-red-500')} />)}</div>
                    <span className={'w-12 text-center text-xs font-bold py-1 rounded-lg ' + strengthClass(pct)}>{pct == null ? '–' : pct + '%'}</span>
                  </div>
                );
              })}
              <div className="flex items-center gap-3 p-3 bg-gray-50 rounded-xl">
                <span className="text-xl w-7 text-center">🃏</span>
                <div className="flex-1 min-w-0">
                  <div className="text-sm font-medium text-gray-800">Flashcard rating</div>
                  <div className="text-xs text-gray-400">{r ? r.label : 'Not rated'}</div>
                </div>
                <span className="text-lg">{r?.emoji || ''}</span>
              </div>
            </div>
            <p className="text-xs text-gray-400 mt-4">Strength = % correct over the last {STRENGTH_WINDOW} attempts. Overall mixes all quiz types with the flashcard rating counted as one attempt.</p>
            <button onClick={onClose} className="w-full mt-4 py-3 bg-gray-100 rounded-xl font-medium hover:bg-gray-200">Close</button>
          </div>
        </div>
      );
    }

    function LearningPathCard({ path, vocabulary, ratings, fontClass, languageCode, meaningName }) {
      const rules = React.useContext(RulesContext);
      const firstOpen = path.topics.find(t => !t.locked && !path.status[t.id].complete && !path.status[t.id].empty);
      const [open, setOpen] = useState(firstOpen?.id || null);
      const [word, setWord] = useState(null);
      const rows = path.topics.filter(t => !path.status[t.id].empty);
      return (
        <div className="bg-white rounded-3xl shadow-xl p-6">
          <div className="flex flex-wrap items-center justify-between gap-2 mb-4">
            <h2 className="text-2xl font-bold text-gray-800">Learning Path</h2>
            {path.bypass && <span className="text-xs font-semibold px-2 py-1 rounded-lg bg-amber-100 text-amber-800">Admin bypass on: all topics open</span>}
          </div>
          <div className="flex flex-wrap gap-3 text-xs text-gray-500 mb-4">
            {[[null, 'Not faced'], [20, '<40%'], [60, '40–79%'], [90, '≥80%']].map(([p, l]) => (
              <span key={l} className="flex items-center gap-1.5"><span className={'w-3 h-3 rounded ' + strengthClass(p)} />{l}</span>
            ))}
            <span>· last {STRENGTH_WINDOW} attempts</span>
            <span>· unlock: every word {ruleText(rules)} (★ = done)</span>
          </div>
          <div className="space-y-2">
            {rows.map(t => {
              const st = path.status[t.id];
              const isOpen = open === t.id && !t.locked;
              const words = vocabulary.filter(v => v.topic_id === t.id);
              return (
                <div key={t.id} className={'border rounded-2xl ' + (t.locked ? 'bg-gray-50 border-gray-100' : 'border-gray-200')}>
                  <button disabled={t.locked} onClick={() => setOpen(isOpen ? null : t.id)} className="w-full flex items-center gap-3 p-3 text-left disabled:cursor-not-allowed">
                    <span className={'text-xl ' + (t.locked ? 'grayscale opacity-50' : '')}>{t.locked ? '🔒' : t.icon}</span>
                    <span className={'flex-1 font-medium ' + fontClass + (t.locked ? ' text-gray-400' : ' text-gray-800')}>{topicTitle(t)}</span>
                    <span className={'text-xs font-semibold px-2 py-1 rounded-lg ' + (st.complete ? 'bg-green-100 text-green-700' : t.locked ? 'bg-gray-100 text-gray-400' : 'bg-jade-50 text-jade-700')}>
                      {st.complete ? '✓ Complete' : t.locked ? 'Locked · ' + st.total + ' words' : st.faced + '/' + st.total + ' done'}
                    </span>
                    {!t.locked && <span className="text-gray-400 text-sm">{isOpen ? '▲' : '▼'}</span>}
                  </button>
                  {isOpen && (
                    <div className="px-3 pb-3 overflow-x-auto">
                      <table className="w-full text-sm border-separate" style={{ borderSpacing: '4px' }}>
                        <thead><tr>
                          <th className="text-left text-xs font-semibold text-gray-400 px-1">Word</th>
                          {STRENGTH_TYPES.map(q => <th key={q.id} title={q.label} className="text-center text-base w-12">{q.icon}</th>)}
                          <th className="text-center text-xs font-semibold text-gray-400 w-14">Overall</th>
                        </tr></thead>
                        <tbody>
                          {words.map(w => {
                            const byType = path.attempts[String(w.id)];
                            const cnt = path.counts[String(w.id)] || {};
                            const ov = overallPct(byType, ratings[w.id]?.rating);
                            return (
                              <tr key={w.id} onClick={() => setWord(w)} className="cursor-pointer hover:opacity-80">
                                <td className="px-1 py-1"><div className={'font-medium text-gray-800 ' + fontClass}>{w.translation?.native_text}</div><div className="text-xs text-gray-400">{w.display_text}</div></td>
                                {STRENGTH_TYPES.map(q => { const p = strengthPct(byType?.[q.id]); const req = rules.quizTypes.includes(q.id); const n = cnt[q.id] || 0; return <td key={q.id} title={req ? n + '/' + rules.minAttempts + ' answers toward unlock' : n + ' answers (not needed to unlock)'} className={'text-center text-xs font-bold rounded-lg ' + strengthClass(p)}>{p == null ? '' : p}{req && n >= rules.minAttempts ? '★' : ''}</td>; })}
                                <td className={'text-center text-xs font-bold rounded-lg ' + strengthClass(ov)}>{ov == null ? '–' : ov + '%'}</td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
          {word && <WordStrengthModal item={word} byType={path.attempts[String(word.id)]} rating={ratings[word.id]?.rating} fontClass={fontClass} onClose={() => setWord(null)} languageCode={languageCode} meaningName={meaningName} />}
        </div>
      );
    }

    function AppContent() {
      const { user } = useAuth();
      const [currentLanguage, setCurrentLanguage] = useState(() => loadFromStorage(STORAGE_KEYS.language, 'my'));
      const [activeView, setActiveView] = useState(() => loadFromStorage(STORAGE_KEYS.view, 'chart'));
      const [activeTopic, setActiveTopic] = useState(() => loadFromStorage(STORAGE_KEYS.topic, null));
      const [showEnglish, setShowEnglish] = useState(() => loadFromStorage(STORAGE_KEYS.showEnglish, true));
      const [meaningsInEnglish, setMeaningsInEnglish] = useState(() => loadFromStorage(MEANING_STORAGE_KEY, false));
      const meaningName = meaningNameFor(currentLanguage, meaningsInEnglish);

      const { languages, loading: loadingLangs } = useLanguages();
      const { topics: allTopics, loading: loadingTopics } = useTopics(currentLanguage, meaningsInEnglish);
      const { vocabulary: allVocabulary, loading: loadingVocab } = useVocabulary(currentLanguage, meaningsInEnglish);
      const priv = usePrivateLessons(user, currentLanguage);
      const rules = useRules(user, currentLanguage);
      const topics = useMemo(() => allTopics.filter(t => !priv.topics.has(t.id)), [allTopics, priv]);
      const vocabulary = useMemo(() => allVocabulary.filter(v => !priv.topics.has(v.topic_id)), [allVocabulary, priv]);
      const { ratings, updateRating } = useUserRatings(currentLanguage);
      const path = useLearningPath({ user, languageCode: currentLanguage, topics, vocabulary, rules });
      const visibleTopics = path.topics;
      const fontClassApp = LANGUAGE_FONTS[currentLanguage] || 'font-body';

      useEffect(() => { saveToStorage(STORAGE_KEYS.language, currentLanguage); }, [currentLanguage]);
      useEffect(() => { saveToStorage(STORAGE_KEYS.view, activeView); }, [activeView]);
      useEffect(() => { saveToStorage(STORAGE_KEYS.topic, activeTopic); }, [activeTopic]);
      useEffect(() => { saveToStorage(STORAGE_KEYS.showEnglish, showEnglish); }, [showEnglish]);
      useEffect(() => { saveToStorage(MEANING_STORAGE_KEY, meaningsInEnglish); }, [meaningsInEnglish]);
      useEffect(() => { window.KGAudio.loadManifest(currentLanguage); }, [currentLanguage]);
      useEffect(() => { if (user) window.KGAudio.initPrefs(supabase, user.id); }, [user]);
      useEffect(() => { window.KGAudio.stop(); }, [activeView, currentLanguage]);

      useEffect(() => {
        if (visibleTopics.length > 0) {
          const savedTopicExists = visibleTopics.some(t => t.id === activeTopic);
          if (!activeTopic || !savedTopicExists) setActiveTopic((visibleTopics.find(t => !t.locked) || visibleTopics[0]).id);
        }
      }, [visibleTopics, activeTopic]);

      const topicVocabulary = activeTopic ? vocabulary.filter(v => v.topic_id === activeTopic) : [];
      const currentTopic = visibleTopics.find(t => t.id === activeTopic);
      const prevPathTopic = currentTopic?.locked
        ? visibleTopics.slice(0, visibleTopics.indexOf(currentTopic)).reverse().find(t => !path.status[t.id]?.empty)
        : null;

      if (loadingLangs) return <div className="min-h-screen flex items-center justify-center"><LoadingSpinner message="Loading..." /></div>;

      return (
        <RulesContext.Provider value={rules}>
        <div className="min-h-screen bg-gray-50">
          <Header currentLanguage={currentLanguage} languages={languages} onLanguageChange={setCurrentLanguage}
            activeView={activeView} onViewChange={setActiveView}
            meaning={MEANING_LANGS[currentLanguage] || null} meaningsInEnglish={meaningsInEnglish} onToggleMeanings={setMeaningsInEnglish} />

          {activeView === 'chart' && !loadingTopics && visibleTopics.length > 0 && (
            <TopicNav topics={visibleTopics} activeTopic={activeTopic} onSelect={setActiveTopic} showEnglish={showEnglish} pathStatus={path.enabled ? path.status : null} />
          )}

          <PrivateLessonsContext.Provider value={priv}>
          <main className="pb-8">
            {(loadingTopics || loadingVocab || path.loading || !priv.loaded || !rules.loaded) ? (
              <div className="py-12"><LoadingSpinner message="Loading vocabulary..." /></div>
            ) : (
              <>
                {activeView === 'chart' && currentTopic?.locked && (
                  <LockedTopicPanel topic={currentTopic} prevTopic={prevPathTopic} prevStatus={prevPathTopic ? path.status[prevPathTopic.id] : null}
                    fontClass={fontClassApp} onGoQuiz={() => setActiveView('quiz')} />
                )}
                {activeView === 'chart' && !currentTopic?.locked && (
                  <ChartView topic={currentTopic} vocabulary={topicVocabulary} ratings={ratings} onRate={updateRating}
                    languageCode={currentLanguage} showEnglish={showEnglish} onToggleEnglish={setShowEnglish} meaningName={meaningName} />
                )}
                {activeView === 'quiz' && (
                  <QuizView topics={visibleTopics} vocabulary={path.unlockedVocab} poolVocabulary={path.visibleVocab} ratings={ratings} onRate={updateRating} languageCode={currentLanguage} user={user} onSessionSaved={path.refresh} meaningName={meaningName} />
                )}
                {activeView === 'flashcard' && (
                  <FlashcardView topics={visibleTopics} vocabulary={path.unlockedVocab} ratings={ratings} onRate={updateRating} languageCode={currentLanguage} user={user} />
                )}
                {activeView === 'progress' && (
                  <ProgressView topics={visibleTopics} vocabulary={path.visibleVocab} ratings={ratings} languageCode={currentLanguage} user={user} path={path.enabled || path.bypass ? path : null} meaningName={meaningName} />
                )}
              </>
            )}
          </main>
          </PrivateLessonsContext.Provider>

          {path.celebration && (
            <CelebrationModal topic={path.celebration.topic} next={path.celebration.next} fontClass={fontClassApp}
              onClose={path.dismissCelebration}
              onOpen={() => { const n = path.celebration.next; path.dismissCelebration(); if (n) { setActiveTopic(n.id); setActiveView('chart'); } }} />
          )}

          <footer className="bg-gray-800 text-white py-6 px-4">
            <div className="max-w-7xl mx-auto text-center">
              <p className="text-gray-300 text-sm">KG Vocabulary Learning System</p>
              <p className="text-gray-400 text-xs mt-1">Multi-language vocabulary with Devanagari transliteration</p>
            </div>
          </footer>
        </div>
        </RulesContext.Provider>
      );
    }

    // Signed-out (or unapproved) visitors only see the sign-in card.
    function AuthGate({ children }) {
      const { user } = useAuth();
      if (user) return children;
      return <div className="min-h-screen bg-jade-700"><AuthModal onClose={() => {}} /></div>;
    }

    function App() {
      return (
        <AuthProvider>
          <AuthGate>
            <AppContent />
          </AuthGate>
        </AuthProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
