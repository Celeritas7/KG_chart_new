                  return <button key={id} onClick={() => removeTile(id)} className={`px-3 py-2 bg-white border-2 border-jade-300 rounded-xl text-xl ${fontClass}`}>{t.text}</button>;
                })}
              </div>
              <div className="flex flex-wrap gap-2 justify-center mb-4">
                {item.tiles.map(t => {
                  const used = placed.includes(t.id);
                  return (
                    <button key={t.id} onClick={() => placeTile(t.id)} disabled={used || showResult}
                      className={`px-3 py-2 rounded-xl border-2 text-xl transition-all ${fontClass} ${used ? 'opacity-25 border-gray-200' : 'border-gray-300 bg-gray-50 hover:border-jade-400'}`}>{t.text}</button>
                  );
                })}
              </div>
              {!showResult && (
                <div className="flex gap-3 justify-center">
                  <button onClick={() => setPlaced([])} disabled={!placed.length} className="px-4 py-2 bg-gray-100 rounded-xl font-medium hover:bg-gray-200 disabled:opacity-40">Clear</button>
                  <button onClick={giveUp} className="px-4 py-2 bg-gray-100 rounded-xl font-medium hover:bg-gray-200">Show answer</button>
                  <button onClick={checkBuild} disabled={placed.length !== item.tiles.length} className="px-6 py-2 bg-jade-600 text-white rounded-xl font-bold hover:bg-jade-700 disabled:opacity-50">Check</button>
                </div>
              )}
            </div>
          )}

          {showResult && (
            <div className="text-center animate-slide-up">
              <div className={`text-2xl font-bold mb-3 ${isRight ? 'text-green-600' : 'text-red-600'}`}>{isRight ? '✅ Correct!' : gaveUp ? '👀 Here it is:' : '❌ Not quite. The answer:'}</div>
              <div className="bg-white rounded-2xl shadow p-4 mb-4 inline-block max-w-full">
                <div className="flex items-center justify-center gap-3">
                  <div><NativeLine text={s.native_text} size="text-2xl" /></div>
                  <SpeakBtn text={s.native_text} small />
                </div>
                <div className="text-gray-600 mt-2">{s.display_text}</div>
                {s.notes && <div className="text-xs text-gray-400 mt-2">📝 {s.notes}</div>}
                <div className="mt-2"><FlagButton compact onClick={() => setFlagSentence(s)} /></div>
              </div>
              <div>
                <button onClick={next} className="px-8 py-3 bg-blue-600 text-white rounded-full font-bold hover:bg-blue-700">
                  {idx + 1 >= items.length ? 'See Results' : 'Next →'} <span className="text-blue-300 text-sm hidden sm:inline ml-1">↵</span>
                </button>
              </div>
            </div>
          )}
          {flagSentence && <FlagModal sentence={flagSentence} languageCode={languageCode} onClose={() => setFlagSentence(null)} />}
        </div>
      );
    }

    // ==========================================
    // SPEAK A PARAGRAPH (any sentence group, read in order)
    // ==========================================
    // 1 listen to every line · 2 line by line: see the meaning, say it, reveal, judge yourself · 3 the whole paragraph.
    // The learner judges their own speaking (an automatic pronunciation check is a later phase).
    // Saved as speak_lines / speak_paragraph sessions; sentence answers never touch word strength or unlocking.
    const SPEAK_KEY = 'kg_chart_speak';
    const SPEAK_STEPS = [
      { id: 'listen', n: 1, icon: '👂', label: 'Listen', help: 'Hear every line with its text and meaning.' },
      { id: 'lines', n: 2, icon: '🗣️', label: 'Line by line', help: 'See the meaning, say the line out loud, then check.' },
      { id: 'whole', n: 3, icon: '📜', label: 'Whole paragraph', help: 'Say it all from the meanings. Peek only if stuck.' },
    ];
    const SPEAK_SESSION_TYPES = { lines: 'speak_lines', whole: 'speak_paragraph' };
    // Conversations keep the speaker (A / B) in notes
    const speakerOf = (s) => { const n = (s.notes || '').trim(); return n && n.length <= 3 ? n : null; };
    // In a conversation, A speaks in the learner's chosen voice (♀/♂ in the header) and B in the other one
    const speakerVoice = (s) => {
      if ((speakerOf(s) || '').toUpperCase() !== 'B') return undefined;
      return window.KGAudio.prefs.voice === 'm' ? 'f' : 'm';
    };

    // ==========================================
    // 🎙️ PRONUNCIATION CHECK (Edge Function kg-pronounce → Azure pronunciation assessment; docs/pronunciation-design.md)
    // ==========================================
    // Record on the phone, turn it into a 16 kHz mono WAV here (Azure's format), send it with the text; get back
    // a 0–100 score, accuracy / fluency / completeness and each word's result. Only the scores are saved, never audio.
    const PRON_MAX_SECONDS = 15;
    const PRON_SUGGEST_RIGHT = 70; // Speak line by line: at or above this, "✓ I said it right" is suggested
    const PRON_NOTICE_KEY = 'kg_chart_pron_notice_seen';
    const pronCanRecord = () => !!(window.MediaRecorder && navigator.mediaDevices?.getUserMedia && (window.AudioContext || window.webkitAudioContext) && (window.OfflineAudioContext || window.webkitOfflineAudioContext));
    const pronLabel = (score) => (score >= 80 ? { text: 'Good', cls: 'text-green-700', ring: '#16a34a' }
      : score >= 60 ? { text: 'Getting there', cls: 'text-amber-600', ring: '#d97706' }
      : { text: 'Try again', cls: 'text-red-600', ring: '#dc2626' });

    // Any recording the browser can play (webm/opus, mp4/aac…) → { b64, seconds, peak } as 16 kHz 16-bit mono WAV
    async function recordingToWav16k(blob) {
      const AC = window.AudioContext || window.webkitAudioContext;
      const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
      const raw = await blob.arrayBuffer();
      const ctx = new AC();
      let decoded;
      try {
        decoded = await new Promise((resolve, reject) => { const p = ctx.decodeAudioData(raw, resolve, reject); if (p && p.then) p.then(resolve, reject); });
      } finally { try { ctx.close(); } catch (e) {} }
      const frames = Math.max(1, Math.ceil(decoded.duration * 16000));
      const off = new OAC(1, frames, 16000); // one channel: stereo is mixed down
      const src = off.createBufferSource();
      src.buffer = decoded; src.connect(off.destination); src.start();
      const pcm = (await off.startRendering()).getChannelData(0);
      let peak = 0;
      const bytes = new Uint8Array(44 + pcm.length * 2), v = new DataView(bytes.buffer);
      const tag = (o, s) => { for (let i = 0; i < 4; i++) bytes[o + i] = s.charCodeAt(i); };
      tag(0, 'RIFF'); v.setUint32(4, 36 + pcm.length * 2, true); tag(8, 'WAVE'); tag(12, 'fmt ');
      v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 16000, true);
      v.setUint32(28, 32000, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); tag(36, 'data'); v.setUint32(40, pcm.length * 2, true);
      for (let i = 0; i < pcm.length; i++) {
        const x = Math.max(-1, Math.min(1, pcm[i]));
        peak = Math.max(peak, Math.abs(x));
        v.setInt16(44 + i * 2, x < 0 ? x * 0x8000 : x * 0x7fff, true);
      }
      let bin = '';
      for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      return { b64: btoa(bin), seconds: pcm.length / 16000, peak };
    }

    // Send to kg-pronounce. → { ok: true, score, … } or { ok: false, message }
    async function checkPronunciation({ text, lang, wavB64, vocabularyId, sentenceId, source }) {
      const { data, error } = await supabase.functions.invoke('kg-pronounce', {
        body: { lang, text, audio: wavB64, vocabulary_id: vocabularyId || null, sentence_id: sentenceId || null, source },
      });
      if (!error) return data || { ok: false, message: 'No answer from the checker.' };
      // A non-2xx answer still carries { reason, message } from the function
      try { const body = await error.context.json(); if (body && body.message) return { ok: false, ...body }; } catch (e) {}
      return { ok: false, reason: 'network', message: "Couldn't reach the checker. Check your connection and try again." };
    }

    // The score card (one design for every language)
    function PronResult({ result, text, lang, fontClass, voice, onAgain }) {
      const L = pronLabel(result.score);
      const chip = (w) => {
        if (w.error === 'Omission') return 'border-2 border-red-300 text-red-700 bg-white';
        if (w.error === 'Insertion') return 'bg-gray-100 text-gray-400 line-through';
        const a = w.accuracy == null ? 100 : w.accuracy;
        return w.error === 'Mispronunciation' || a < 60 ? (a < 60 ? 'bg-red-100 text-red-800' : 'bg-amber-100 text-amber-800')
          : a < 80 ? 'bg-amber-100 text-amber-800' : 'bg-green-100 text-green-800';
      };
      const words = (result.words || []).filter(w => w.w);
      return (
        <div data-pron-result className="rounded-2xl border border-gray-100 bg-gray-50 p-4 text-left">
          <div className="flex items-center gap-4">
            <div className="w-16 h-16 rounded-full flex items-center justify-center shrink-0" style={{ background: `conic-gradient(${L.ring} ${result.score}%, #e5e7eb 0)` }}>
              <div className={`w-12 h-12 rounded-full bg-white flex items-center justify-center text-xl font-bold ${L.cls}`}>{result.score}</div>
            </div>
            <div className="min-w-0">
              <div className={`text-lg font-bold ${L.cls}`}>{L.text}</div>
              <div className="text-xs text-gray-600">Accuracy {result.accuracy ?? '–'} · Fluency {result.fluency ?? '–'} · Completeness {result.completeness ?? '–'}</div>
            </div>
          </div>
          {words.length > 0 && (
            <div className={`flex flex-wrap gap-1.5 mt-3 text-lg ${fontClass}`}>
              {words.map((w, i) => <span key={i} title={`${w.error === 'None' ? 'ok' : w.error}${w.accuracy != null ? ' · ' + w.accuracy : ''}`} className={`px-2.5 py-0.5 rounded-lg ${chip(w)}`}>{w.w}</span>)}
            </div>
          )}
          <div className="text-[11px] text-gray-400 mt-2">Green = good · amber = close · red = said differently · outlined = missed</div>
          <div className="flex flex-wrap gap-2 mt-3">
            <button onClick={() => window.KGAudio.play(text, lang, { voice })} className="px-3 py-1.5 rounded-full bg-white border text-sm hover:bg-gray-50">🔊 Hear it</button>
            <button onClick={onAgain} className="px-3 py-1.5 rounded-full bg-white border text-sm hover:bg-gray-50">↺ Again</button>
            {result.limit ? <span className="text-[11px] text-gray-400 self-center ml-auto">{result.used}/{result.limit} today</span> : null}
          </div>
        </div>
      );
    }

    // 🎙️ button + recording + checking + card. Hidden when signed out or the browser can't record.
    function PronounceCheck({ text, lang, fontClass, vocabularyId, sentenceId, source = 'word', voice, label = '🎙️ Say it', compact = false, onResult }) {
      const { user } = useAuth();
      const [state, setState] = useState('idle'); // idle | recording | checking | result | error
      const [result, setResult] = useState(null);
      const [message, setMessage] = useState('');
      const [secs, setSecs] = useState(0);
      const recRef = React.useRef(null);
      const timers = React.useRef([]);
      const alive = React.useRef(true);
      const [noticeSeen, setNoticeSeen] = useState(() => { try { return localStorage.getItem(PRON_NOTICE_KEY) === '1'; } catch (e) { return true; } });
      const clearTimers = () => { timers.current.forEach(t => clearInterval(t)); timers.current = []; };
      useEffect(() => () => { alive.current = false; clearTimers(); const r = recRef.current; if (r && r.state === 'recording') { r.onstop = null; r.stop(); r.stream?.getTracks().forEach(t => t.stop()); } }, []);
      // A new word / line starts fresh
      useEffect(() => { setState('idle'); setResult(null); setMessage(''); }, [text]);
      if (!user || !text || !pronCanRecord()) return null;

      const finish = async (blob) => {
        if (!alive.current) return;
        setState('checking');
        try {
          const wav = await recordingToWav16k(blob);
          if (wav.seconds < 0.5) throw Object.assign(new Error('short'), { msg: 'That was too short. Hold the button a little longer.' });
          if (wav.peak < 0.02) throw Object.assign(new Error('quiet'), { msg: "Didn't hear anything. Check the microphone and try again." });
          const r = await checkPronunciation({ text, lang, wavB64: wav.b64, vocabularyId, sentenceId, source });
          if (!alive.current) return;
          if (r.ok) {
            setResult(r); setState('result');
            if (r.saved !== false) window.dispatchEvent(new CustomEvent(PRON_EVENT, { detail: {
              id: 'new-' + Date.now(), created_at: new Date().toISOString(), language_code: lang, vocabulary_id: vocabularyId || null,
              sentence_id: vocabularyId ? null : (sentenceId || null), reference_text: text, score: r.score, source } }));
            try { localStorage.setItem(PRON_NOTICE_KEY, '1'); } catch (e) {}
            setNoticeSeen(true);
            if (onResult) onResult(r);
          } else { setMessage(r.message || 'Something went wrong. Try again.'); setState('error'); }
        } catch (e) {
          if (!alive.current) return;
          setMessage(e.msg || "Couldn't read the recording. Try again."); setState('error');
        }
      };
      const start = async () => {
        window.KGAudio.stop();
        setMessage(''); setResult(null);
        let stream;
        try { stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } }); }
        catch (e) { setMessage('Microphone not allowed. Allow it in the browser settings to check your pronunciation.'); setState('error'); return; }
        if (!alive.current) { stream.getTracks().forEach(t => t.stop()); return; }
        const rec = new MediaRecorder(stream), chunks = [];
        rec.stream = stream;
        rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
        rec.onstop = () => { clearTimers(); stream.getTracks().forEach(t => t.stop()); finish(new Blob(chunks, { type: rec.mimeType || 'audio/webm' })); };
        recRef.current = rec;
        rec.start();
        setSecs(0); setState('recording');
        const t0 = Date.now();
        timers.current.push(setInterval(() => {
          const s = (Date.now() - t0) / 1000;
          setSecs(Math.floor(s));
          if (s >= PRON_MAX_SECONDS && rec.state === 'recording') rec.stop();
        }, 250));
      };
      const stop = () => { const r = recRef.current; if (r && r.state === 'recording') r.stop(); };
      const again = () => { setState('idle'); setResult(null); setMessage(''); };

      const btn = compact ? 'h-11 px-4 text-base' : 'w-full py-3';
      return (
        <div className={compact ? (state === 'result' || state === 'error' ? 'basis-full' : '') : 'w-full'}>
          {state === 'recording' ? (
            <button onClick={stop} className={`${btn} rounded-full font-bold bg-red-500 text-white hover:bg-red-600 inline-flex items-center justify-center gap-2`}>
              <span className="w-2.5 h-2.5 rounded-full bg-white animate-pulse" /> Stop · {secs}s
            </button>
          ) : state === 'checking' ? (
            <button disabled className={`${btn} rounded-full font-bold bg-gray-100 text-gray-500 inline-flex items-center justify-center gap-2`}>Checking…</button>
          ) : state !== 'result' ? (
            <button onClick={start} className={`${btn} rounded-full font-bold border-2 border-jade-600 text-jade-700 bg-white hover:bg-jade-50 inline-flex items-center justify-center gap-2`}>{label}</button>
          ) : null}
          {state === 'idle' && !noticeSeen && <p className="text-[11px] text-gray-400 mt-1">Your recording is sent to Microsoft Azure to be checked and is not saved.</p>}
          {state === 'error' && <p role="alert" className="text-sm text-red-600 mt-2">{message}</p>}
          {state === 'result' && result && <div className="mt-2"><PronResult result={result} text={text} lang={lang} fontClass={fontClass} voice={voice} onAgain={again} /></div>}
        </div>
      );
    }

    // ---------- pronunciation history (Progress) ----------
    const PRON_EVENT = 'kg-pron-saved'; // a check was just saved (detail = the row), so lists update without a reload
    const pronTone = (score) => (score >= 80 ? 'bg-green-100 text-green-800' : score >= 60 ? 'bg-amber-100 text-amber-800' : 'bg-red-100 text-red-800');
    // The learner's own checks for one language, newest first (RLS: own rows only). null while loading.
    function usePronunciationHistory(user, languageCode) {
      const [rows, setRows] = useState(null);
      const uid = user?.id || null; // the id, not the object: a new user object for the same person must not reload (and drop new rows)
      useEffect(() => {
        if (!uid || !languageCode) { setRows([]); return; }
        let cancelled = false;
        setRows(null);
        supabase.from('kg_chart_pronunciation_attempts')
          .select('id, created_at, language_code, vocabulary_id, sentence_id, reference_text, score, source')
          .eq('user_id', uid).eq('language_code', languageCode)
          .order('created_at', { ascending: false }).limit(500)
          .then(({ data, error }) => { if (!cancelled) setRows(error ? [] : (data || [])); });
        return () => { cancelled = true; };
      }, [uid, languageCode]);
      useEffect(() => {
        const add = (e) => { const r = e.detail; if (r && r.language_code === languageCode) setRows(rs => [r, ...(rs || [])]); };
        window.addEventListener(PRON_EVENT, add);
        return () => window.removeEventListener(PRON_EVENT, add);
      }, [languageCode]);
      return rows;
    }
    const dayKey = (d) => `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
    const shortWhen = (iso) => {
      const d = new Date(iso), now = new Date();
      const time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      if (dayKey(d) === dayKey(now)) return 'today ' + time;
      const y = new Date(now); y.setDate(now.getDate() - 1);
      if (dayKey(d) === dayKey(y)) return 'yesterday ' + time;
      return d.toLocaleDateString([], { day: 'numeric', month: 'short' });
    };

    // Progress → 🎙️ Pronunciation: numbers for the last 7 days, daily average for 14 days, recent checks, what to practise
    function PronunciationCard({ rows, fontClass }) {
      const DAYS = 14;
      const [sel, setSel] = useState(null); // the day whose bar is tapped / hovered
      const data = useMemo(() => {
        const list = rows || [];
        const now = new Date(), start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - (DAYS - 1));
        const days = Array.from({ length: DAYS }, (_, i) => { const d = new Date(start); d.setDate(start.getDate() + i); return { key: dayKey(d), date: d, scores: [] }; });
        const byKey = new Map(days.map(d => [d.key, d]));
        list.forEach(r => { const d = byKey.get(dayKey(new Date(r.created_at))); if (d && r.score != null) d.scores.push(r.score); });
        days.forEach(d => { d.avg = d.scores.length ? Math.round(d.scores.reduce((a, b) => a + b, 0) / d.scores.length) : null; });
        const weekAgo = Date.now() - 7 * 864e5;
        const week = list.filter(r => new Date(r.created_at).getTime() >= weekAgo && r.score != null);
        const avg7 = week.length ? Math.round(week.reduce((a, r) => a + r.score, 0) / week.length) : null;
        const best = list.reduce((m, r) => (r.score != null && (m == null || r.score > m) ? r.score : m), null);
        // latest check per word / line; practise the ones under 70
        const latest = new Map();
        list.forEach(r => { const k = r.vocabulary_id || r.sentence_id || r.reference_text; if (!latest.has(k)) latest.set(k, { ...r, tries: 0 }); latest.get(k).tries++; });
        const practise = [...latest.values()].filter(r => r.score != null && r.score < 70).sort((a, b) => a.score - b.score).slice(0, 5);
        return { days, weekCount: week.length, avg7, best, practise, recent: list.slice(0, 8) };
      }, [rows]);

      return (
        <div data-pron-card className="bg-white rounded-2xl shadow-lg p-6">
          <h3 className="text-lg font-bold text-gray-800 mb-1">🎙️ Pronunciation</h3>
          <p className="text-xs text-gray-400 mb-4">Your 🎙️ checks in this language. They don't count toward unlocking.</p>
          {rows === null ? <div className="text-sm text-gray-400">Loading…</div> : !rows.length ? (
            <div className="text-sm text-gray-500">No checks yet. Tap a word and press <b>🎙️ Say it</b>, or try <b>🎙️ Check me</b> in Speak → Line by line.</div>
          ) : (
            <>
              <div className="grid grid-cols-3 gap-3 mb-5">
                {[['Checks', data.weekCount, 'last 7 days'], ['Average', data.avg7 == null ? '–' : data.avg7, 'last 7 days'], ['Best', data.best == null ? '–' : data.best, 'ever']].map(([label, value, sub]) => (
                  <div key={label} className="rounded-xl bg-gray-50 p-3 text-center">
                    <div className="text-2xl font-bold text-gray-800">{value}</div>
                    <div className="text-xs font-medium text-gray-600">{label}</div>
                    <div className="text-[10px] text-gray-400">{sub}</div>
                  </div>
                ))}
              </div>
              <div className="text-xs font-semibold text-gray-500 mb-1">Average score per day · last {DAYS} days</div>
              <div className="text-xs text-gray-600 h-4 mb-1" aria-live="polite">
                {sel ? `${sel.date.toLocaleDateString([], { day: 'numeric', month: 'short' })}: ${sel.avg == null ? 'no checks' : `average ${sel.avg} (${sel.scores.length} check${sel.scores.length === 1 ? '' : 's'})`}` : 'Tap a bar to see the day.'}
              </div>
              <div className="relative h-28 border-b border-gray-200" onMouseLeave={() => setSel(null)}>
                {[50, 100].map(g => <div key={g} className="absolute left-0 right-0 border-t border-dashed border-gray-100" style={{ bottom: `${g}%` }}><span className="absolute -top-2 right-0 text-[9px] text-gray-300 bg-white pl-1">{g}</span></div>)}
                <div className="absolute inset-0 flex items-end gap-0.5 pr-5">
                  {data.days.map(d => (
                    <button key={d.key} data-day={d.key} onClick={() => setSel(d)} onMouseEnter={() => setSel(d)} aria-label={`${d.date.toLocaleDateString()}: ${d.avg == null ? 'no checks' : 'average ' + d.avg}`}
                      className="flex-1 h-full flex items-end justify-center group">
                      {d.avg != null && <span className={`w-2.5 rounded-t ${sel && sel.key === d.key ? 'bg-jade-700' : 'bg-jade-500 group-hover:bg-jade-600'}`} style={{ height: `${Math.max(d.avg, 3)}%` }} />}
                    </button>
                  ))}
                </div>
              </div>
              <div className="flex pr-5 text-[9px] text-gray-400 mt-1">
                {data.days.map((d, i) => <span key={d.key} className="flex-1 text-center">{i % 3 === 1 || i === DAYS - 1 ? d.date.getDate() : ''}</span>)}
              </div>

              {data.practise.length > 0 && (
                <div className="mt-5">
                  <div className="text-xs font-semibold text-gray-500 mb-2">To practise (latest score under 70)</div>
                  <div className="space-y-1.5">
                    {data.practise.map(r => (
                      <div key={r.id} className="flex items-center gap-2">
                        <span className={`flex-1 min-w-0 truncate text-gray-800 ${fontClass}`}>{r.reference_text}</span>
                        <span className="text-[10px] text-gray-400">{r.tries}×</span>
                        <span className={`w-10 text-center text-xs font-bold py-0.5 rounded-lg ${pronTone(r.score)}`}>{r.score}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              <div className="mt-5">
                <div className="text-xs font-semibold text-gray-500 mb-2">Recent checks</div>
                <div className="space-y-1.5">
                  {data.recent.map(r => (
                    <div key={r.id} className="flex items-center gap-2">
                      <span className="text-sm w-5 text-center" title={r.source === 'speak_lines' ? 'Speak line' : 'Word'}>{r.source === 'speak_lines' ? '🗣️' : '🔤'}</span>
                      <span className={`flex-1 min-w-0 truncate text-gray-800 ${fontClass}`}>{r.reference_text}</span>
                      <span className="text-[10px] text-gray-400 whitespace-nowrap">{shortWhen(r.created_at)}</span>
                      <span className={`w-10 text-center text-xs font-bold py-0.5 rounded-lg ${r.score == null ? 'bg-gray-100 text-gray-400' : pronTone(r.score)}`}>{r.score ?? '–'}</span>
                    </div>
                  ))}
                </div>
              </div>
            </>
          )}
        </div>
      );
    }

    // Record yourself and play it back next to the real clip. Hidden where the browser can't record.
    function VoiceRecorder() {
      const [state, setState] = useState('idle'); // idle | recording | done | denied
      const [url, setUrl] = useState(null);
      const recRef = React.useRef(null);
      const audioRef = React.useRef(null);
      useEffect(() => () => { if (recRef.current?.state === 'recording') recRef.current.stop(); }, []);
      useEffect(() => () => { if (url) URL.revokeObjectURL(url); }, [url]);
      if (!(window.MediaRecorder && navigator.mediaDevices?.getUserMedia)) return null;

      const start = async () => {
        window.KGAudio.stop();
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const rec = new MediaRecorder(stream);
          const chunks = [];
          rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
          rec.onstop = () => {
            stream.getTracks().forEach(t => t.stop());
            setUrl(URL.createObjectURL(new Blob(chunks, { type: rec.mimeType || 'audio/webm' })));
            setState('done');
          };
          recRef.current = rec;
          rec.start();
          setState('recording');
        } catch (e) { setState('denied'); }
      };
      const stop = () => { if (recRef.current?.state === 'recording') recRef.current.stop(); };
      const playMine = () => {
        window.KGAudio.stop();
        if (audioRef.current) { audioRef.current.currentTime = 0; audioRef.current.play().catch(() => {}); }
      };
      const btn = 'px-4 py-2 rounded-full text-sm font-medium border-2 transition-all';
      return (
        <div className="flex items-center justify-center gap-2 flex-wrap">
          {state === 'recording'
            ? <button onClick={stop} className={`${btn} border-red-400 bg-red-50 text-red-600 animate-pulse`}>⏹ Stop recording</button>
            : <button onClick={start} className={`${btn} border-gray-200 text-gray-700 hover:border-gray-300`}>🎙️ {state === 'done' ? 'Record again' : 'Record yourself'}</button>}
          {state === 'done' && url && (
            <>
              <button onClick={playMine} className={`${btn} border-jade-300 text-jade-700 hover:border-jade-500`}>▶ My voice</button>
              <audio ref={audioRef} src={url} preload="auto" />
            </>
          )}
          {state === 'denied' && <span className="text-xs text-gray-400">Microphone not allowed</span>}
        </div>
      );
    }

    function SpeakView({ languageCode, user, meaningName, modeToggle }) {
      const fontClass = LANGUAGE_FONTS[languageCode] || 'font-body';
      const audioVersion = useAudioState();
      const priv = React.useContext(PrivateLessonsContext);
      const [sentences, setSentences] = useState(null); // null = loading
      const [loadError, setLoadError] = useState(null);
      const [group, setGroup] = useState(() => loadFromStorage(SPEAK_KEY, {})[languageCode] || '');
      const [step, setStep] = useState(null); // null = choose a step | 'listen' | 'lines' | 'whole'
      const [result, setResult] = useState(null); // { id, total, correct } once a step is finished
      const [playing, setPlaying] = useState(-1); // listen: line being played, -1 = stopped
      const [queue, setQueue] = useState([]); // lines: line indexes still to say (missed ones go to the back)
      const [revealed, setRevealed] = useState(false);
      const [pronSuggest, setPronSuggest] = useState(null); // 'right' | 'again' after a 🎙️ check of this line
      const [firstTry, setFirstTry] = useState({}); // lines: index -> right the first time?
      const [turn, setTurn] = useState(0); // lines: new recorder for every attempt
      const [flagLine, setFlagLine] = useState(null);
      const flagModal = flagLine && <FlagModal sentence={flagLine} languageCode={languageCode} onClose={() => setFlagLine(null)} />;
      const savedStep = React.useRef(null); // which step's result has been saved this attempt (a double tap must not save twice)
      const [peeked, setPeeked] = useState(() => new Set()); // whole: lines looked at
      const [showAll, setShowAll] = useState(false);
      const startedAt = React.useRef(0);
      const timerRef = React.useRef(null);
      const playStarted = React.useRef(false);

      useEffect(() => {
        let cancelled = false;
        setSentences(null); setLoadError(null); setStep(null); setResult(null);
        setGroup(loadFromStorage(SPEAK_KEY, {})[languageCode] || '');
        supabase.from(TABLES.sentences).select('*').eq('language_code', languageCode)
          .order('sort_order').order('created_at')
          .then(({ data, error }) => {
            if (cancelled) return;
            if (error) { setLoadError(error); setSentences([]); return; }
            setSentences((data || []).filter(x => x.native_text?.trim()));
          });
        return () => { cancelled = true; };
      }, [languageCode]);

      useEffect(() => () => { clearTimeout(timerRef.current); window.KGAudio.stop(); }, []);

      // A paragraph = a sentence group with 2+ lines, in sort order
      const groups = useMemo(() => {
        const by = new Map();
        (sentences || []).forEach(s => {
          if (!s.group_name || priv.groups.has(s.group_name)) return;
          if (!by.has(s.group_name)) by.set(s.group_name, []);
          by.get(s.group_name).push({ ...s, display_text: sentenceMeaning(s, meaningName) });
        });
        return [...by].filter(([, l]) => l.length >= 2).map(([name, lines]) => ({ name, lines }));
      }, [sentences, priv, meaningName]);
      const current = groups.find(g => g.name === group) || groups[0] || null;
      const lines = current ? current.lines : [];
      const chooseGroup = (name) => {
        setGroup(name);
        saveToStorage(SPEAK_KEY, { ...loadFromStorage(SPEAK_KEY, {}), [languageCode]: name });
      };

      // ---------- step 1: play every line, one after another ----------
      const playNextIn = (ms) => {
        clearTimeout(timerRef.current);
        timerRef.current = setTimeout(() => setPlaying(p => (p >= 0 ? p + 1 : p)), ms);
      };
      const stopAll = () => { clearTimeout(timerRef.current); playStarted.current = false; setPlaying(-1); window.KGAudio.stop(); };
      useEffect(() => {
        if (step !== 'listen' || playing < 0) return;
        const line = lines[playing];
        if (!line) { setPlaying(-1); return; }
        playStarted.current = false;
        // No clip yet: pause about as long as the line takes to say, so the highlight still moves on
        if (!window.KGAudio.play(line.native_text, languageCode, { silent: true, voice: speakerVoice(line) })) playNextIn(800 + 90 * line.native_text.length);
      }, [step, playing]);
      useEffect(() => {
        if (step !== 'listen' || playing < 0 || !lines[playing]) return;
        if (window.KGAudio.stateOf(lines[playing].native_text, languageCode, false)) { playStarted.current = true; return; }
        if (playStarted.current) { playStarted.current = false; playNextIn(500); }
      }, [audioVersion]);

      const startStep = (id) => {
        stopAll();
        setResult(null);
        savedStep.current = null;
        setStep(id);
        startedAt.current = Date.now();
        if (id === 'listen' && !window.KGAudio.prefs.muted) setPlaying(0);
        if (id === 'lines') { setQueue(lines.map((_, i) => i)); setRevealed(false); setFirstTry({}); setPronSuggest(null); }
        if (id === 'whole') { setPeeked(new Set()); setShowAll(false); }
      };

      const finish = async (id, rows) => {
        if (savedStep.current === id) return;
        savedStep.current = id;
        const total = rows.length, correct = rows.filter(r => r.ok).length;
        setResult({ id, total, correct });
        if (!user || !SPEAK_SESSION_TYPES[id]) return;
        const now = new Date().toISOString();
        const { data: session, error } = await supabase.from(TABLES.quizSessions).insert({
          user_id: user.id, language_code: languageCode, topic_id: null, quiz_type: SPEAK_SESSION_TYPES[id],
          total_questions: total, correct_answers: correct,
          time_spent_seconds: Math.round((Date.now() - startedAt.current) / 1000), completed_at: now,
        }).select('id').single();
        if (error || !session) return;
        await supabase.from(TABLES.quizAnswers).insert(rows.map(r => ({
          session_id: session.id, vocabulary_id: null, sentence_id: r.line.id, selected_vocabulary_id: null, is_correct: r.ok, answered_at: now,
        })));
      };

      // ---------- step 2: judge each line; a miss comes back at the end ----------
      const lineIdx = queue[0];
      const reveal = () => { setRevealed(true); window.KGAudio.autoPlay(lines[lineIdx].native_text, languageCode, speakerVoice(lines[lineIdx])); };
      const judge = (ok) => {
        const ft = lineIdx in firstTry ? firstTry : { ...firstTry, [lineIdx]: ok };
        const next = ok ? queue.slice(1) : [...queue.slice(1), lineIdx];
        setFirstTry(ft);
        setRevealed(false);
        setPronSuggest(null);
        setTurn(t => t + 1);
        window.KGAudio.stop();
        setQueue(next);
        if (!next.length) finish('lines', lines.map((line, i) => ({ line, ok: !!ft[i] })));
      };

      // ---------- step 3 ----------
      const peek = (i) => { setPeeked(p => new Set([...p, i])); window.KGAudio.autoPlay(lines[i].native_text, languageCode, speakerVoice(lines[i])); };

      const LineText = ({ s, size = 'text-xl' }) => {
        const dev = sentenceHint(s.native_text, languageCode);
        return (
          <>
            <div className={`${size} font-bold text-gray-800 ${fontClass}`}>{s.native_text}</div>
            {dev && <div className="text-sm text-blue-600 font-devanagari mt-0.5">{dev}</div>}
          </>
        );
      };
      const Speaker = ({ s }) => (speakerOf(s) ? <span className="inline-block text-xs font-bold bg-gray-200 text-gray-600 rounded-full px-2 py-0.5 mr-2">{speakerOf(s)}</span> : null);
      const stepInfo = SPEAK_STEPS.find(x => x.id === step);
      const nextStep = SPEAK_STEPS.find(x => x.n === (stepInfo?.n || 0) + 1);
      const header = (
        <div className="flex items-center justify-between mb-4 gap-2">
          <button onClick={() => { stopAll(); setStep(null); setResult(null); }} className="text-gray-500 hover:text-gray-700 font-medium shrink-0">← Steps</button>
          <div className="text-right min-w-0">
            <div className="text-sm font-bold text-gray-700">{stepInfo?.n} · {stepInfo?.icon} {stepInfo?.label}</div>
            <div className="text-xs text-gray-400 truncate">{current?.name}</div>
          </div>
        </div>
      );

      // ---------- choose a paragraph and a step ----------
      if (!step || !current) {
        return (
          <div className="max-w-2xl mx-auto p-6">
            <div className="bg-white rounded-3xl shadow-xl p-8">
              <div className="text-center mb-8">
                <div className="w-20 h-20 bg-jade-100 rounded-full flex items-center justify-center mx-auto mb-4">
                  <span className="text-4xl">🗣️</span>
                </div>
                <h2 className="text-3xl font-bold text-gray-800">Quiz Mode</h2>
              </div>
              {modeToggle}

              {sentences === null ? <LoadingSpinner /> : loadError ? (
                <div className="bg-yellow-50 text-yellow-800 rounded-2xl p-4 text-sm">
                  Sentences aren't set up yet. Run <span className="font-mono">kg-chart-sentences.sql</span> in the Supabase SQL editor, then reload.
                </div>
              ) : !current ? (
                <div className="text-center text-gray-500 py-6">
                  <div className="text-4xl mb-2">📭</div>
                  No paragraphs for {languageName(languageCode)} yet. A sentence group with 2 or more lines becomes one (admin → 💬 Sentences).
                </div>
              ) : (
                <div className="space-y-6">
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-2">Paragraph</label>
                    <select value={current.name} onChange={(e) => chooseGroup(e.target.value)} className="w-full px-4 py-3 border rounded-xl">
                      {groups.map(g => <option key={g.name} value={g.name}>{g.name} ({g.lines.length} lines)</option>)}
                    </select>
                    <ol className="mt-3 space-y-1 text-sm text-gray-500 list-decimal list-inside">
                      {lines.map(s => <li key={s.id}><Speaker s={s} />{s.display_text}</li>)}
                    </ol>
                  </div>
                  <div className="space-y-3">
                    {SPEAK_STEPS.map(x => (
                      <button key={x.id} onClick={() => startStep(x.id)}
                        className="w-full flex items-center gap-4 p-4 rounded-2xl border-2 border-gray-200 hover:border-jade-400 hover:bg-jade-50 text-left transition-all">
                        <div className="w-10 h-10 rounded-full bg-jade-600 text-white font-bold flex items-center justify-center shrink-0">{x.n}</div>
                        <div>
                          <div className="font-semibold text-gray-800">{x.icon} {x.label}</div>
                          <div className="text-xs text-gray-500">{x.help}</div>
                        </div>
                      </button>
                    ))}
                  </div>
                  <p className="text-xs text-gray-400 text-center">You judge your own speaking: 🎙️ record yourself to compare with the real voice. Doesn't count toward unlocking topics.</p>
                </div>
              )}
            </div>
          </div>
        );
      }

      // ---------- a finished step ----------
      if (result) {
        const pct = result.total ? Math.round((result.correct / result.total) * 100) : 0;
        const line = result.id === 'lines'
          ? `${result.correct} of ${result.total} lines right the first time`
          : result.correct === result.total ? 'The whole paragraph without peeking!' : `${result.correct} of ${result.total} lines without peeking`;
        return (
          <div className="max-w-2xl mx-auto p-6">
            <div className="bg-white rounded-3xl shadow-xl p-8 text-center">
              <div className="text-6xl mb-3">{pct === 100 ? '🎉' : pct >= 60 ? '👏' : '💪'}</div>
              <h2 className="text-2xl font-bold text-gray-800 mb-1">{stepInfo.label} done</h2>
              <p className="text-gray-600 mb-6">{line}</p>
              <div className="flex flex-col sm:flex-row gap-3 justify-center">
                <button onClick={() => startStep(step)} className="px-6 py-3 border-2 border-gray-200 rounded-full font-medium hover:border-gray-300">↺ Again</button>
                {nextStep && <button onClick={() => startStep(nextStep.id)} className="px-6 py-3 bg-jade-600 text-white rounded-full font-bold hover:bg-jade-700">Next: {nextStep.n} · {nextStep.label} →</button>}
                {!nextStep && <button onClick={() => { setStep(null); setResult(null); }} className="px-6 py-3 bg-jade-600 text-white rounded-full font-bold hover:bg-jade-700">Back to steps</button>}
              </div>
            </div>
          </div>
        );
      }

      // ---------- step 1 ----------
      if (step === 'listen') {
        return (
          <div className="max-w-2xl mx-auto p-6">
            <div className="bg-white rounded-3xl shadow-xl p-6 sm:p-8">
              {header}
              <div className="flex justify-center gap-3 mb-5">
                {playing >= 0
                  ? <button onClick={stopAll} className="px-6 py-3 bg-red-500 text-white rounded-full font-bold hover:bg-red-600">⏹ Stop</button>
                  : <button onClick={() => { stopAll(); setPlaying(0); }} className="px-6 py-3 bg-jade-600 text-white rounded-full font-bold hover:bg-jade-700">▶ Play all</button>}
              </div>
              <div className="space-y-2">
                {lines.map((s, i) => (
                  <div key={s.id} className={`flex items-start gap-3 p-3 rounded-xl border-2 transition-all ${playing === i ? 'border-jade-400 bg-jade-50' : 'border-transparent bg-gray-50'}`}>
                    <div className="text-xs text-gray-400 font-bold w-5 pt-1.5 shrink-0">{i + 1}</div>
                    <div className="flex-1 min-w-0">
                      <LineText s={s} />
                      <div className="text-sm text-gray-500 mt-1"><Speaker s={s} />{s.display_text}</div>
                      <div className="flex gap-1 items-center mt-2">
                        <SpeakButton text={s.native_text} lang={languageCode} slow size="sm" voice={speakerVoice(s)} />
                        <FlagButton compact onClick={() => { stopAll(); setFlagLine(s); }} />
                      </div>
                    </div>
                  </div>
                ))}
              </div>
              {flagModal}
              <button onClick={() => startStep('lines')} className="w-full mt-6 py-3 bg-jade-600 text-white rounded-xl font-bold hover:bg-jade-700">Next: 2 · Line by line →</button>
            </div>
          </div>
        );
      }

      // ---------- step 2 ----------
      if (step === 'lines') {
        const s = lines[lineIdx];
        if (!s) return null;
        const doneCount = lines.length - new Set(queue).size;
        return (
          <div className="max-w-2xl mx-auto p-6">
            <div className="bg-white rounded-3xl shadow-xl p-6 sm:p-8">
              {header}
              <div className="w-full bg-gray-200 rounded-full h-2 mb-6">
                <div className="bg-jade-500 h-2 rounded-full transition-all" style={{ width: `${(doneCount / lines.length) * 100}%` }} />
              </div>
              <div className="text-center">
                <div className="text-xs text-gray-400 mb-2">Line {lineIdx + 1} of {lines.length}{lineIdx in firstTry ? ' · again' : ''}</div>
                <div className="text-2xl font-semibold text-gray-800 mb-2"><Speaker s={s} />{s.display_text}</div>
                <p className="text-sm text-gray-500 mb-4">Say it out loud{revealed ? '' : ', then check'}.</p>
                <div className="flex justify-center gap-2 mb-4">
                  <SpeakButton text={s.native_text} lang={languageCode} slow voice={speakerVoice(s)} />
                </div>
                <div className="mb-4"><PronounceCheck key={turn} text={s.native_text} lang={languageCode} fontClass={fontClass} sentenceId={s.id} source="speak_lines"
                  voice={speakerVoice(s)} label="🎙️ Check me" onResult={(r) => { setPronSuggest(r.score >= PRON_SUGGEST_RIGHT ? 'right' : 'again'); setRevealed(true); }} /></div>
                <div className="mb-5"><VoiceRecorder key={turn} /></div>
                {revealed ? (
                  <>
                    <div className="bg-jade-50 rounded-2xl p-4 mb-5 relative">
                      <LineText s={s} size="text-2xl" />
                      <div className="absolute top-1 right-1"><FlagButton compact onClick={() => setFlagLine(s)} /></div>
                    </div>
                    {flagModal}
                    <div className="grid grid-cols-2 gap-3">
                      <button onClick={() => judge(false)} className={`py-3 border-2 border-orange-300 text-orange-700 rounded-xl font-bold hover:bg-orange-50 ${pronSuggest === 'again' ? 'ring-4 ring-orange-200' : ''}`}>↺ Not yet</button>
                      <button onClick={() => judge(true)} className={`py-3 bg-jade-600 text-white rounded-xl font-bold hover:bg-jade-700 ${pronSuggest === 'right' ? 'ring-4 ring-jade-200' : ''}`}>✓ I said it right</button>
                    </div>
                    {pronSuggest && <p className="text-xs text-gray-400 mt-2">The score suggests {pronSuggest === 'right' ? '✓' : '↺'}; you still choose.</p>}
                  </>
                ) : (
                  <button onClick={reveal} className="w-full py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700">Show the line</button>
                )}
              </div>
            </div>
          </div>
        );
      }

      // ---------- step 3 ----------
      const clean = lines.length - peeked.size;
      return (
        <div className="max-w-2xl mx-auto p-6">
          <div className="bg-white rounded-3xl shadow-xl p-6 sm:p-8">
            {header}
            <p className="text-sm text-gray-500 text-center mb-4">Say the whole paragraph from the meanings. Tap 💡 on a line only if you're stuck.</p>
            <div className="mb-5"><VoiceRecorder /></div>
            <div className="space-y-2">
              {lines.map((s, i) => {
                const open = showAll || peeked.has(i);
                return (
                  <div key={s.id} className={`flex items-start gap-3 p-3 rounded-xl ${peeked.has(i) ? 'bg-yellow-50' : 'bg-gray-50'}`}>
                    <div className="text-xs text-gray-400 font-bold w-5 pt-1 shrink-0">{i + 1}</div>
                    <div className="flex-1 min-w-0">
                      <div className="text-gray-700"><Speaker s={s} />{s.display_text}</div>
                      {open && <div className="mt-1"><LineText s={s} size="text-lg" /></div>}
                    </div>
                    <div className="shrink-0">
                      {open
                        ? <SpeakButton text={s.native_text} lang={languageCode} size="sm" voice={speakerVoice(s)} />
                        : <button onClick={() => peek(i)} title="Peek at this line" className="w-8 h-8 rounded-full bg-white border border-gray-200 hover:border-yellow-400">💡</button>}
                    </div>
                  </div>
                );
              })}
            </div>
            {showAll ? (
              <div className="grid grid-cols-2 gap-3 mt-6">
                <button onClick={() => startStep('whole')} className="py-3 border-2 border-orange-300 text-orange-700 rounded-xl font-bold hover:bg-orange-50">↺ Try again</button>
                <button onClick={() => finish('whole', lines.map((line, i) => ({ line, ok: !peeked.has(i) })))} className="py-3 bg-jade-600 text-white rounded-xl font-bold hover:bg-jade-700">✓ I said it all</button>
              </div>
            ) : (
              <button onClick={() => setShowAll(true)} className="w-full mt-6 py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700">
                Reveal all and check{peeked.size ? ` (${clean} of ${lines.length} without peeking)` : ''}
              </button>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // COLOUR + NOUN QUIZ (kg_chart_colour_phrases, kg-chart-colour-phrases.sql)
    // ==========================================
    // "red car": the phrase as said in each language is stored per language (word order and adjective forms differ).
    // Pictures are the noun's emoji recoloured on the device, so "blue car" and "red car" differ only in colour.
    // Saved as colour_phrase sessions; never part of word strength or unlocking.
    // Palette and outlines: js/kg-shared.js (admin → 🎨 Colour Phrases uses the same)
    const { COLOUR_HEX, COLOUR_OUTLINE } = window.KGShared;
    const COLOUR_QUIZ_TYPES = [
      { id: 'phrase_to_picture', label: 'Phrase → Picture', icon: '🎨', help: 'Read and hear the phrase, pick the picture.' },
      { id: 'listen_to_picture', label: 'Listen → Picture', icon: '🔊', help: 'Only hear it, pick the picture.' },
      { id: 'picture_to_phrase', label: 'Picture → Phrase', icon: '🖼️', help: 'See the picture, pick the phrase.' },
    ];
    const COLOUR_SETTINGS_KEY = 'kg_chart_colour_quiz';

    // The emoji redrawn in one colour, keeping its shading: its middle tone becomes the colour itself,
    // darker parts go toward black, lighter parts toward white (but never all the way, so the colour stays visible).
    const tintCache = {};
    function tintedEmojiUrl(emoji, hex) {
      const key = emoji + '|' + hex;
      if (key in tintCache) return tintCache[key];
      let url = null;
      try {
        const size = 160, c = document.createElement('canvas');
        c.width = c.height = size;
        const g = c.getContext('2d');
        g.font = '128px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
        g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText(emoji, size / 2, size / 2 + 8);
        const img = g.getImageData(0, 0, size, size), d = img.data;
        const lums = [];
        for (let i = 0; i < d.length; i += 4) if (d[i + 3] > 40) lums.push((0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]) / 255);
        lums.sort((a, b) => a - b);
        const mid = Math.min(Math.max(lums[Math.floor(lums.length / 2)] || 0.5, 0.15), 0.85);
        const [R, G, B] = [1, 3, 5].map(k => parseInt(hex.slice(k, k + 2), 16));
        for (let i = 0; i < d.length; i += 4) {
          if (!d[i + 3]) continue;
          const l = (0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]) / 255;
          const t = l < mid ? 0.5 * l / mid : 0.5 + 0.5 * (l - mid) / (1 - mid);
          const f = (C) => (t < 0.5 ? C * (0.35 + 1.3 * t) : C + (255 - C) * (t - 0.5) * 1.1);
          d[i] = f(R); d[i + 1] = f(G); d[i + 2] = f(B);
        }
        g.putImageData(img, 0, 0);
        url = c.toDataURL('image/png');
      } catch (e) { url = null; }
      return (tintCache[key] = url);
    }

    function ColourPicture({ item, size = 'w-24 h-24' }) {
      const url = tintedEmojiUrl(item.picture, item.hex);
      return url
        ? <img src={url} alt="" className={`${size} object-contain mx-auto`} style={COLOUR_OUTLINE[item.colour] ? { filter: COLOUR_OUTLINE[item.colour] } : undefined} draggable={false} />
        : <div className={`${size} mx-auto rounded-2xl flex items-center justify-center text-5xl border-8`} style={{ borderColor: item.hex }}>{item.picture}</div>;
    }

    function ColourQuizView({ languageCode, user, modeToggle }) {
      const fontClass = LANGUAGE_FONTS[languageCode] || 'font-body';
      useAudioState();
      const saved0 = loadFromStorage(COLOUR_SETTINGS_KEY, {});
      const [phrases, setPhrases] = useState(null); // null = loading
      const [loadError, setLoadError] = useState(null);
      const [qType, setQType] = useState(() => (COLOUR_QUIZ_TYPES.some(t => t.id === saved0.type) ? saved0.type : 'phrase_to_picture'));
      const [count, setCount] = useState(() => ([5, 10, 15, 20, 0].includes(saved0.count) ? saved0.count : 10));
      const [items, setItems] = useState([]);
      const [idx, setIdx] = useState(0);
      const [picked, setPicked] = useState(null);
      const [score, setScore] = useState({ correct: 0, total: 0 });
      const [phase, setPhase] = useState('setup'); // setup | run | done
      const startedAt = React.useRef(0);
      const savedRun = React.useRef(false);
      const [flagPhrase, setFlagPhrase] = useState(null);

      useEffect(() => { saveToStorage(COLOUR_SETTINGS_KEY, { type: qType, count }); }, [qType, count]);
      useEffect(() => {
        let cancelled = false;
        setPhrases(null); setLoadError(null); setPhase('setup');
        supabase.from(TABLES.colourPhrases)
          .select('id, native_text, picture, colour:kg_chart_vocabulary!kg_chart_colour_phrases_colour_id_fkey(english_text, extra_data), noun:kg_chart_vocabulary!kg_chart_colour_phrases_noun_id_fkey(english_text)')
          .eq('language_code', languageCode)
          .then(({ data, error }) => {
            if (cancelled) return;
            if (error) { setLoadError(error); setPhrases([]); return; }
            const rows = (data || []).filter(p => p.native_text?.trim() && p.picture && p.colour && p.noun).map(p => ({
              id: p.id, native: p.native_text.trim(), picture: p.picture, colour: p.colour.english_text, noun: p.noun.english_text,
              hex: COLOUR_HEX[p.colour.english_text] || p.colour.extra_data?.colorCode || null, meaning: `${p.colour.english_text} ${p.noun.english_text}`.toLowerCase(),
            }));
            // A colour the app can't paint would come out grey, the same as any other such colour: leave those phrases out
            const painted = rows.filter(p => p.hex);
            if (painted.length < rows.length) console.warn('Colour quiz: no colour hex for', [...new Set(rows.filter(p => !p.hex).map(p => p.colour))].join(', '), '(add colorCode to that colour word)');
            setPhrases(painted);
          });
        return () => { cancelled = true; };
      }, [languageCode]);

      const all = phrases || [];
      // Blue hint line; none for Chinese (its converter reads pinyin, which phrases don't have)
      const hint = (text) => { if (getConverter(languageCode)?.usePronunciation) return ''; const h = convertToHint(text, languageCode); return h && h !== text ? h : ''; };
      const preview = useMemo(() => shuffleArr(phrases || []).slice(0, 4), [phrases]);
      const isListen = qType === 'listen_to_picture', toText = qType === 'picture_to_phrase';
      // Wrong choices: the same thing in another colour, the same colour on another thing, then anything
      const optionsFor = (p) => {
        const pick = (list, taken) => shuffleArr(list.filter(x => !taken.some(t => t.id === x.id)))[0];
        const out = [p];
        const add = (x) => { if (x && out.length < 4) out.push(x); };
        add(pick(all.filter(x => x.noun === p.noun && x.colour !== p.colour), out));
        add(pick(all.filter(x => x.colour === p.colour && x.noun !== p.noun), out));
        while (out.length < Math.min(4, all.length)) add(pick(all, out));
        return shuffleArr(out);
      };
      const start = () => {
        savedRun.current = false;
        const chosen = shuffleArr(all).slice(0, count || all.length);
        setItems(chosen.map(p => ({ p, options: optionsFor(p) })));
        setIdx(0); setPicked(null); setScore({ correct: 0, total: 0 });
        startedAt.current = Date.now();
        setPhase('run');
      };
      const item = items[idx];
      useEffect(() => { if (phase === 'run' && item && isListen && !picked) window.KGAudio.play(item.p.native, languageCode, { silent: true }); }, [phase, idx]);
      const choose = (o) => {
        if (picked || !item) return;
        setPicked(o);
        setScore(s => ({ correct: s.correct + (o.id === item.p.id ? 1 : 0), total: s.total + 1 }));
        window.KGAudio.autoPlay(item.p.native, languageCode);
      };
      const next = async () => {
        if (idx + 1 < items.length) { setIdx(i => i + 1); setPicked(null); return; }
        setPhase('done');
        window.KGAudio.stop();
        if (savedRun.current) return; // Enter held / double tap on the last question
        savedRun.current = true;
        if (user) await supabase.from(TABLES.quizSessions).insert({
          user_id: user.id, language_code: languageCode, topic_id: null, quiz_type: 'colour_phrase',
          total_questions: score.total, correct_answers: score.correct,
          time_spent_seconds: Math.round((Date.now() - startedAt.current) / 1000), completed_at: new Date().toISOString(),
        });
      };
      useEffect(() => {
        if (phase !== 'run') return;
        const onKey = (e) => {
          if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName) || kgModalOpen()) return;
          if (picked) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); next(); } return; }
          const n = parseInt(e.key);
          if (n >= 1 && n <= (item?.options.length || 0)) choose(item.options[n - 1]);
          if ((e.key === 'r' || e.key === 'R') && item) window.KGAudio.play(item.p.native, languageCode, { silent: true });
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [phase, idx, picked, items]);

      const openFlag = (x) => { window.KGAudio.stop(); setFlagPhrase({ id: x.id, native: x.native, meaning: x.meaning, hint: hint(x.native) }); };
      const flagModal = flagPhrase && <FlagModal phrase={flagPhrase} languageCode={languageCode} defaultReason="wrong_word" onClose={() => setFlagPhrase(null)} />;

      const PhraseText = ({ p, size = 'text-3xl' }) => (
        <>
          <div className={`${size} font-bold text-gray-800 ${fontClass}`}>{p.native}</div>
          {hint(p.native) && <div className="text-base text-blue-600 font-devanagari mt-1">{hint(p.native)}</div>}
        </>
      );

      // ---------- setup ----------
      if (phase === 'setup') {
        return (
          <div className="max-w-2xl mx-auto p-6">
            <div className="bg-white rounded-3xl shadow-xl p-8">
              <div className="text-center mb-8">
                <div className="w-20 h-20 bg-jade-100 rounded-full flex items-center justify-center mx-auto mb-4"><span className="text-4xl">🎨</span></div>
                <h2 className="text-3xl font-bold text-gray-800">Quiz Mode</h2>
              </div>
              {modeToggle}
              {phrases === null ? <LoadingSpinner /> : loadError ? (
                <div className="bg-yellow-50 text-yellow-800 rounded-2xl p-4 text-sm">Colour phrases aren't set up yet. Run <span className="font-mono">kg-chart-colour-phrases.sql</span> in the Supabase SQL editor, then reload.</div>
              ) : all.length < 4 ? (
                <div className="text-center text-gray-500 py-6"><div className="text-4xl mb-2">🎨</div>No colour phrases for {languageName(languageCode)} yet. Add them in admin → 🎨 Colour Phrases.</div>
              ) : (
                <div className="space-y-6">
                  <div className="flex justify-center gap-2 flex-wrap">
                    {preview.map(p => <div key={p.id} className="w-16 h-16 bg-slate-100 rounded-xl p-1"><ColourPicture item={p} size="w-14 h-14" /></div>)}
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-2">Quiz Type</label>
                    <div className="grid grid-cols-3 gap-3">
                      {COLOUR_QUIZ_TYPES.map(t => (
                        <button key={t.id} onClick={() => setQType(t.id)} className={`p-3 rounded-xl border-2 transition-all ${qType === t.id ? 'border-jade-500 bg-jade-50' : 'border-gray-200'}`}>
                          <div className="text-2xl mb-1">{t.icon}</div><div className="text-xs sm:text-sm font-medium">{t.label}</div>
                        </button>
                      ))}
                    </div>
                    <p className="text-xs text-gray-400 mt-2">{COLOUR_QUIZ_TYPES.find(t => t.id === qType).help}</p>
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-2">How many <span className="text-gray-400 font-normal ml-2">({all.length} phrases)</span></label>
                    <div className="grid grid-cols-5 gap-2">
                      {[5, 10, 15, 20, 0].map(c => (
                        <button key={c} onClick={() => setCount(c)} className={`py-3 rounded-xl border-2 font-medium ${count === c ? 'border-jade-500 bg-jade-50 text-jade-700' : 'border-gray-200'}`}>{c || 'All'}</button>
                      ))}
                    </div>
                  </div>
                  <button onClick={start} className="w-full py-4 bg-jade-600 text-white rounded-xl font-bold text-lg hover:bg-jade-700">Start Quiz ({Math.min(count || all.length, all.length)} phrases)</button>
                  <p className="text-xs text-gray-400 text-center">The wrong choices differ by colour or by thing. Doesn't count toward unlocking topics.</p>
                </div>
              )}
            </div>
          </div>
        );
      }

      // ---------- results ----------
      if (phase === 'done') {
        const pct = score.total ? Math.round((score.correct / score.total) * 100) : 0;
        return (
          <div className="max-w-2xl mx-auto p-6">
            <div className="bg-white rounded-3xl shadow-xl p-8 text-center">
              <div className="text-6xl mb-3">{pct >= 80 ? '🎉' : pct >= 50 ? '👏' : '💪'}</div>
              <h2 className="text-2xl font-bold text-gray-800 mb-1">{score.correct} / {score.total}</h2>
              <p className="text-gray-500 mb-6">{pct}% correct</p>
              <div className="flex gap-3 justify-center">
                <button onClick={() => setPhase('setup')} className="px-6 py-3 border-2 border-gray-200 rounded-full font-medium">Back to Setup</button>
                <button onClick={start} className="px-6 py-3 bg-jade-600 text-white rounded-full font-bold hover:bg-jade-700">↺ Again</button>
              </div>
            </div>
          </div>
        );
      }

      // ---------- question ----------
      const p = item.p, right = picked && picked.id === p.id;
      return (
        <div className="max-w-3xl mx-auto p-6">
          <div className="flex items-center justify-between mb-4">
            <button onClick={() => { window.KGAudio.stop(); setPhase('setup'); }} className="text-gray-500 hover:text-gray-700 font-medium">← Back</button>
            <div className="text-sm text-gray-500">{idx + 1} / {items.length} · ✓ {score.correct}</div>
          </div>
          <div className="bg-white rounded-3xl shadow-xl p-6 sm:p-8 mb-6 text-center">
            {toText ? (
              <div className="w-40 h-40 mx-auto bg-slate-100 rounded-3xl p-3"><ColourPicture item={p} size="w-32 h-32" /></div>
            ) : isListen && !picked ? (
              <button onClick={() => window.KGAudio.play(p.native, languageCode, { silent: true })} className="w-24 h-24 rounded-full bg-jade-600 text-white text-4xl shadow-lg hover:bg-jade-700" title="Play again (R)">🔊</button>
            ) : (
              <>
                <PhraseText p={p} />
                <div className="mt-3 flex justify-center items-center gap-2"><SpeakButton text={p.native} lang={languageCode} slow /><FlagButton compact onClick={() => openFlag(p)} /></div>
              </>
            )}
            <p className="text-sm text-gray-500 mt-4">{toText ? 'Which phrase is this?' : 'Which picture is it?'}</p>
          </div>
          <div className={`grid gap-3 ${toText ? 'grid-cols-1 sm:grid-cols-2' : 'grid-cols-2 sm:grid-cols-4'}`}>
            {item.options.map((o, i) => {
              const state = !picked ? 'border-gray-200 hover:border-jade-400' : o.id === p.id ? 'border-green-500 bg-green-50' : o.id === picked.id ? 'border-red-400 bg-red-50' : 'border-gray-100 opacity-60';
              return (
                <button key={o.id} onClick={() => choose(o)} disabled={!!picked} className={`relative rounded-2xl border-2 p-3 transition-all bg-white ${state}`}>
                  <span className="absolute top-1 left-2 text-xs text-gray-300">{i + 1}</span>
                  {toText ? <div className="py-2"><PhraseText p={o} size="text-xl" /></div> : <div className="bg-slate-100 rounded-xl p-2"><ColourPicture item={o} /></div>}
                  {picked && !toText && <div className="text-xs text-gray-500 mt-2">{o.meaning}</div>}
                </button>
              );
            })}
          </div>
          {picked && (
            <div className="text-center mt-6 animate-slide-up">
              <div className={`text-2xl font-bold mb-2 ${right ? 'text-green-600' : 'text-red-600'}`}>{right ? '✅ Correct!' : `❌ It was "${p.meaning}"`}</div>
              <div className="inline-block bg-white rounded-2xl shadow p-4 mb-4">
                <PhraseText p={p} size="text-2xl" />
                <div className="text-gray-500 text-sm mt-1">{p.meaning}</div>
                <div className="mt-2 flex justify-center items-center gap-1"><SpeakButton text={p.native} lang={languageCode} size="sm" /><FlagButton compact onClick={() => openFlag(p)} /></div>
              </div>
              <div><button onClick={next} className="px-8 py-3 bg-blue-600 text-white rounded-full font-bold hover:bg-blue-700">{idx + 1 >= items.length ? 'See Results' : 'Next →'} <span className="text-blue-300 text-sm hidden sm:inline ml-1">↵</span></button></div>
            </div>
          )}
          {flagModal}
        </div>
      );
    }

    // ==========================================
    // TYPING TEST (timed)
    // ==========================================
    // Copy: see the word, type it (pure speed; doesn't touch word strength).
    // Recall: see the picture and meaning, type the word from memory (feeds the "Type from memory" strength column;
    // not needed for unlocking). Strict: a mistake must be fixed before the next item. Speed is characters per
    // minute, not words, because Thai, Burmese and Chinese don't put spaces between words.
    const TYPING_DURATIONS = [30, 60, 120];
    const TYPING_SETTINGS_KEY = 'kg_chart_typing';
    const TYPING_BEST_KEY = 'kg_chart_typing_best';
    // Personal bests ({ "lang|mode|source": { cpm, last, at } }) live on the device and on the account
    // (kg_chart_user_prefs.typing_best, kg-chart-polish.sql), so they follow the learner between phone and computer.
    // Merging keeps the highest cpm per key and the most recent run's "last".
    function mergeTypingBests(a, b) {
      const out = { ...(a || {}) };
      for (const [k, v] of Object.entries(b || {})) {
        if (!v || typeof v.cpm !== 'number') continue;
        const o = out[k];
        if (!o || typeof o.cpm !== 'number') { out[k] = v; continue; }
        const newer = (Date.parse(v.at) || 0) >= (Date.parse(o.at) || 0) ? v : o;
        out[k] = { cpm: Math.max(o.cpm, v.cpm), last: newer.last, at: newer.at };
      }
      return out;
    }
    async function syncTypingBests(user, local) {
      if (!user) return local;
      try {
        const { data, error } = await supabase.from('kg_chart_user_prefs').select('typing_best').eq('user_id', user.id).maybeSingle();
        if (error) return local; // before kg-chart-polish.sql: this device only
        const remote = data?.typing_best || {};
        const merged = mergeTypingBests(remote, local);
        if (JSON.stringify(merged) !== JSON.stringify(remote)) {
          const { error: e2 } = await supabase.from('kg_chart_user_prefs').upsert({ user_id: user.id, typing_best: merged, updated_at: new Date().toISOString() });
          if (e2) console.warn('Could not save typing best to the account:', e2.message);
        }
        return merged;
      } catch (e) { console.warn('Typing best: account not reachable, keeping this device\'s', e); return local; }
    }
    const TYPING_LANG_TAGS = { my: 'my-MM', ja: 'ja-JP', zh: 'zh-CN', si: 'si-LK', ko: 'ko-KR', ta: 'ta-IN', th: 'th-TH', ms: 'ms-MY', te: 'te-IN', mr: 'mr-IN', kn: 'kn-IN' };
    const typingNorm = (s) => mmCanon((s || '').normalize('NFC').replace(/[​-‍﻿]/g, '')).replace(/\s+/g, ' ').trim().toLowerCase();
    const typingChars = (s) => Array.from((s || '').normalize('NFC')).filter(c => !/\s/.test(c)).length;
    // How much of the typed text matches the start of the target (in code points of the normalised forms)
    function typingMatch(typed, target) {
      const a = Array.from(typingNorm(typed)), b = Array.from(typingNorm(target));
      let i = 0;
      while (i < a.length && i < b.length && a[i] === b[i]) i++;
      let wrong = a.length > i;
      // Burmese: marks of the syllable still being typed may come in any order (း before ်) — not a mistake
      // while every typed mark is one the target has there
      if (wrong) {
        let base = a.length - 1;
        while (base > 0 && MM_MARK_RANK[a[base]]) base--;
        if (base < a.length - 1 && i > base && a[base] === b[base]) {
          const want = []; for (let j = base + 1; j < b.length && MM_MARK_RANK[b[j]]; j++) want.push(b[j]);
          if (a.slice(base + 1).every(c => { const k = want.indexOf(c); if (k < 0) return false; want.splice(k, 1); return true; })) wrong = false;
        }
      }
      return { ok: i, total: a.length, wrong, done: a.length === b.length && i === b.length };
    }

    function TypingView({ vocabulary, languageCode, user, modeToggle, meaningName }) {
      const rules = React.useContext(RulesContext);
      const fontClass = LANGUAGE_FONTS[languageCode] || 'font-body';
      const saved0 = loadFromStorage(TYPING_SETTINGS_KEY, {});
      const [mode, setMode] = useState(saved0.mode === 'recall' ? 'recall' : 'copy');
      const [source, setSource] = useState(saved0.source === 'sentences' ? 'sentences' : 'words');
      const [duration, setDuration] = useState(TYPING_DURATIONS.includes(saved0.duration) ? saved0.duration : 60);
      const [sentences, setSentences] = useState(null);
      const [phase, setPhase] = useState('setup'); // setup | run | done
      const [items, setItems] = useState([]);
      const [idx, setIdx] = useState(0);
      const [typed, setTyped] = useState('');
      const [startedAt, setStartedAt] = useState(null);
      const [now, setNow] = useState(Date.now());
      const [stats, setStats] = useState({ chars: 0, errors: 0, done: 0, skipped: 0 });
      const [answers, setAnswers] = useState([]);
      const [reveal, setReveal] = useState(null);
      const [result, setResult] = useState(null);
      const composing = React.useRef(false);
      const wasWrong = React.useRef(false);
      const firstWrong = React.useRef(null); // what was typed when the current item first went wrong (shown in admin → Typed mistakes)
      const inputRef = React.useRef(null);
      const statsRef = React.useRef(stats); statsRef.current = stats;
      const answersRef = React.useRef(answers); answersRef.current = answers;

      useEffect(() => { saveToStorage(TYPING_SETTINGS_KEY, { mode, source, duration }); }, [mode, source, duration]);

      // Sentences come from the same table as the sentence quizzes
      useEffect(() => {
        if (source !== 'sentences') return;
        let cancelled = false;
        setSentences(null);
        supabase.from(TABLES.sentences).select('*').eq('language_code', languageCode).order('sort_order')
          .then(({ data, error }) => { if (!cancelled) setSentences(error ? [] : (data || []).filter(s => s.native_text?.trim())); });
        return () => { cancelled = true; };
      }, [source, languageCode]);

      const priv = React.useContext(PrivateLessonsContext);
      const pool = useMemo(() => {
        if (source === 'sentences') return (sentences || []).filter(s => !priv.groups.has(s.group_name)).map(s => ({ kind: 's', id: s.id, text: s.native_text, meaning: sentenceMeaning(s, meaningName) }));
        return vocabulary.filter(v => v.translation?.native_text?.trim()).map(v => ({ kind: 'w', id: v.id, text: v.translation.native_text, meaning: v.display_text || v.english_text, hint: v.translation.devanagari, v }));
      }, [source, sentences, vocabulary, priv, meaningName]);

      const bestKey = `${languageCode}|${mode}|${source}`;
      const [, setBestsSynced] = useState(0);
      useEffect(() => {
        let cancelled = false;
        syncTypingBests(user, loadFromStorage(TYPING_BEST_KEY, {})).then(m => { if (!cancelled) { saveToStorage(TYPING_BEST_KEY, m); setBestsSynced(n => n + 1); } });
        return () => { cancelled = true; };
      }, [user]);
      const bests = loadFromStorage(TYPING_BEST_KEY, {});
      const best = bests[bestKey];

      const start = () => {
        if (!pool.length) return;
        // Enough items for the whole run: reshuffle the pool as often as needed
        let list = [];
        while (list.length < 200) list = list.concat(shuffleArr(pool));
        setItems(list); setIdx(0); setTyped(''); setStartedAt(null); setNow(Date.now());
        setStats({ chars: 0, errors: 0, done: 0, skipped: 0 }); setAnswers([]); setReveal(null); setResult(null);
        wasWrong.current = false; firstWrong.current = null; composing.current = false;
        setPhase('run');
      };

      const elapsed = startedAt ? Math.min(duration, (now - startedAt) / 1000) : 0;
      const remaining = Math.max(0, Math.ceil(duration - elapsed));
      const cpmOf = (chars, secs) => (secs > 0 ? Math.round(chars / (secs / 60)) : 0);
      const accOf = (s) => (s.chars + s.errors > 0 ? Math.round((s.chars / (s.chars + s.errors)) * 100) : 100);

      // secs: the full time, or the time actually typed when leaving early
      const finish = useCallback(async (secs = duration) => {
        const s = statsRef.current, ans = answersRef.current;
        const cpm = cpmOf(s.chars, secs), acc = accOf(s);
        const prev = loadFromStorage(TYPING_BEST_KEY, {});
        const old = prev[bestKey];
        const isBest = !old || cpm > old.cpm;
        const next = { ...prev, [bestKey]: { cpm: isBest ? cpm : old.cpm, last: cpm, at: new Date().toISOString() } };
        saveToStorage(TYPING_BEST_KEY, next);
        syncTypingBests(user, next).then(m => saveToStorage(TYPING_BEST_KEY, mergeTypingBests(loadFromStorage(TYPING_BEST_KEY, {}), m)));
        setResult({ cpm, acc, done: s.done, skipped: s.skipped, isBest, prevBest: old?.cpm ?? null, prevLast: old?.last ?? null });
        setPhase('done');
        if (!user || s.done + s.skipped === 0) return;
        const { data: session, error } = await supabase.from(TABLES.quizSessions).insert({
          user_id: user.id, language_code: languageCode, topic_id: null,
          quiz_type: mode === 'recall' ? 'typing_recall' : 'typing_copy',
          total_questions: s.done + s.skipped, correct_answers: s.done,
          time_spent_seconds: Math.round(secs), completed_at: new Date().toISOString(),
        }).select('id').single();
        // Both modes save their answers (admin → Typed mistakes). Only recall counts toward word strength:
        // the learning path ignores typing_copy (STRENGTH_IGNORED_TYPES).
        if (!error && session && ans.length) {
          const rows = ans.map(a => ({ ...a, session_id: session.id }));
          const { error: e2 } = await supabase.from(TABLES.quizAnswers).insert(rows);
          if (e2) await supabase.from(TABLES.quizAnswers).insert(rows.map(({ sentence_id, ...r }) => r));
        }
      }, [duration, bestKey, user, languageCode, mode]);

      // Clock: starts on the first keystroke, ends the run when time is up
      useEffect(() => {
        if (phase !== 'run' || !startedAt) return;
        const t = setInterval(() => {
          const n = Date.now(); setNow(n);
          if ((n - startedAt) / 1000 >= duration) { clearInterval(t); finish(); }
        }, 200);
        return () => clearInterval(t);
      }, [phase, startedAt, duration, finish]);

      useEffect(() => { if (phase === 'run' && inputRef.current) inputRef.current.focus(); }, [phase, idx]);

      const item = items[idx];
      // selected_vocabulary_id = the item when it was typed to the end, null when skipped
      const record = (correct, typedText, finished) => {
        if (item.kind === 'w') setAnswers(a => [...a, { vocabulary_id: item.id, selected_vocabulary_id: finished ? item.id : null, is_correct: correct, answer_text: typedText, answered_at: new Date().toISOString() }]);
        else setAnswers(a => [...a, { vocabulary_id: null, sentence_id: item.id, selected_vocabulary_id: finished ? item.id : null, is_correct: correct, answer_text: typedText, answered_at: new Date().toISOString() }]);
      };
      const advance = () => { setIdx(i => i + 1); setTyped(''); wasWrong.current = false; firstWrong.current = null; };

      const evaluate = (value, isComposing) => {
        if (phase !== 'run' || !item) return;
        if (!startedAt && value) { setStartedAt(Date.now()); setNow(Date.now()); }
        const m = typingMatch(value, item.text);
        if (m.done) {
          setStats(s => ({ ...s, chars: s.chars + typingChars(item.text), done: s.done + 1 }));
          // Saved text = the first wrong attempt if there was one. Recall: finished = correct (strength);
          // copy: correct only without a mistake.
          record(mode === 'copy' ? firstWrong.current == null : true, firstWrong.current ?? value, true);
          setReveal(null);
          advance();
          return;
        }
        // An unfinished syllable in an input method (Korean, Chinese, phone keyboards) isn't a mistake yet
        const wrongNow = m.wrong && !(isComposing && m.ok >= m.total - 1);
        if (wrongNow && !wasWrong.current) setStats(s => ({ ...s, errors: s.errors + 1 }));
        if (wrongNow && firstWrong.current == null) firstWrong.current = value;
        wasWrong.current = wrongNow;
      };

      const onChange = (e) => {
        const value = e.target.value;
        setTyped(value);
        evaluate(value, composing.current || e.nativeEvent?.isComposing);
      };
      const skip = () => {
        if (!item) return;
        setStats(s => ({ ...s, skipped: s.skipped + 1 }));
        record(false, typed, false);
        setReveal(mode === 'recall' ? item : null);
        advance();
        if (inputRef.current) inputRef.current.focus();
      };
      const leave = () => { if (phase === 'run' && startedAt && elapsed >= 5) finish(elapsed); else setPhase('setup'); };

      // ---------- setup ----------
      if (phase === 'setup') {
        const lang = languageName(languageCode);
        const seg = (val, set, opts) => (
          <div className="flex bg-gray-100 rounded-xl p-1">
            {opts.map(([id, label]) => (
              <button key={id} onClick={() => set(id)}
                className={`flex-1 py-2 px-2 rounded-lg text-sm font-medium transition-all ${val === id ? 'bg-white shadow text-jade-700' : 'text-gray-500'}`}>{label}</button>
            ))}
          </div>
        );
        return (
          <div className="max-w-2xl mx-auto p-6">
            <div className="bg-white rounded-3xl shadow-xl p-8">
              <div className="text-center mb-8">
                <div className="w-20 h-20 bg-jade-100 rounded-full flex items-center justify-center mx-auto mb-4"><span className="text-4xl">⌨️</span></div>
                <h2 className="text-3xl font-bold text-gray-800">Quiz Mode</h2>
              </div>
              {modeToggle}
              <div className="space-y-5">
                <div>
                  <label className="block text-sm font-semibold text-gray-700 mb-2">Mode</label>
                  {seg(mode, setMode, [['copy', '👀 Copy the word'], ['recall', '🧠 Type from memory']])}
