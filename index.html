  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo, createContext, useContext } = React;

    // Convert slug to readable label (days_of_week → Days of the Week)
    const slugToLabel = (slug) => slug.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

    // Auto-generate image filename from English text (Tissue paper → tissue_paper.jpg)
    const toImageFilename = (text) => text.trim().toLowerCase().replace(/\s+/g, '_') + '.jpg';

    // Admin user ID
    const ADMIN_USER_ID = 'd469efb7-f9e1-4b49-8b14-75a42b4d22e0';

    const loadFromStorage = (key, defaultValue) => {
      try {
        const saved = localStorage.getItem(key);
        return saved ? JSON.parse(saved) : defaultValue;
      } catch (e) { return defaultValue; }
    };

    // ==========================================
    // LANGUAGE CONVERTER SYSTEM
    // ==========================================
    
    // Shared language-utils repo base URL
    const LANG_UTILS_BASE = 'https://celeritas7.github.io/language-utils';

    // Registry of language converters
    const LanguageConverters = {};

    // Language code → file name + type mapping
    const LANG_FILES = {
      my: { file: 'burmese', type: 'standard' },
      zh: { file: 'chinese', type: 'chinese' },
      si: { file: 'sinhala', type: 'standard' },
      te: { file: 'telugu', type: 'standard' },

      kn: { file: 'kannada', type: 'standard' },

    // Load a language converter from the shared repo via fetch
    async function loadLanguageConverter(langCode) {
      const info = LANG_FILES[langCode];
      if (!info) return null;
      if (LanguageConverters[langCode]) return LanguageConverters[langCode];

      try {
        const res = await fetch(`${LANG_UTILS_BASE}/${info.file}.js`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        let code = await res.text();
        // Strip ES module export keywords so code runs in browser
        code = code.replace(/export\s+function\s+/g, 'function ');
        code = code.replace(/export\s+\{[^}]*\};?/g, '');
        code = code.replace(/export\s+const\s+/g, 'const ');
        // Wrap and execute to extract toDev function
        const wrapper = new Function(`${code}\nreturn { toDev: typeof toDev === 'function' ? toDev : null, toRoman: typeof toRoman === 'function' ? toRoman : null, breakSyllables: typeof breakSyllables === 'function' ? breakSyllables : null };`);
        const mod = wrapper();
        const converter = {
          toDevanagari: mod.toDev || ((t) => t),
          toRoman: mod.toRoman || ((t) => t),
          breakSyllables: mod.breakSyllables || null,
          usePronunciation: info.type === 'chinese',
        };
        LanguageConverters[langCode] = converter;
        console.log(`✓ ${info.file} converter loaded from language-utils`);
        return converter;
      } catch (e) {
        console.warn(`⚠ Failed to load ${info.file}.js:`, e.message);
        return null;
      }
    }

    // Load all converters at startup
    async function loadAllConverters() {
      await Promise.all(Object.keys(LANG_FILES).map(loadLanguageConverter));
    }
    // The word and topic lists wait for this before building the blue line. Without it, a database answer that
    // beats the converter files shows the native text there until a reload. A converter that hangs is given up on
    // after 8 s (that language then falls back to the native text, as when its file fails to load).
    const convertersAll = loadAllConverters();
    let convertersLate = false; // the 8 s wait ran out before every converter had loaded
    const convertersReady = Promise.race([convertersAll.then(() => 'all'), new Promise(resolve => setTimeout(() => resolve('wait'), 8000))])
      .then(w => { if (w === 'wait') convertersLate = true; });
    // 0, then 1 once converters that missed the 8 s wait have loaded: the word and topic lists build the blue line again
    function useLateConverters() {
      const [late, setLate] = useState(0);
      useEffect(() => {
        let cancelled = false;
        convertersReady.then(() => { if (convertersLate) convertersAll.then(() => { if (!cancelled) setLate(1); }); });
        return () => { cancelled = true; };
      }, []);
      return late;
    }

    function getConverter(langCode) {
      return LanguageConverters[langCode] || null;

      const converter = getConverter(langCode);
      if (converter) {
        return converter.toDevanagari(text);

      return text;
    }

    // Convert text to Roman
    function convertToRoman(text, langCode) {
      const converter = getConverter(langCode);
      if (converter) {

    const MCQ_QUIZ_TYPES = window.KGShared.MCQ_QUIZ_TYPES; // js/kg-shared.js

    // They change the six multiple-choice quiz types. The next level unlocks when the most recent answers at the

    // runs in the database (kg_chart_check_level_up, kg-chart-levels.sql), which is what actually unlocks.
    const LEVELS = [
      { n: 1, name: 'Easy', icon: '🌱', choices: 4, seconds: 0, hint: true },

    const levelSummary = (L) => `${L.choices} choices · ${L.seconds ? `${L.seconds} s per question` : 'no timer'}${L.hint ? '' : ' · no hint line'}`;
    // ==========================================
    // RULES (admin → Rules; kg_chart_settings 'unlock_rules')
    // ==========================================
    // Topic unlock: a word is "done" once it has been answered, right or wrong, minAttempts times in EACH of
    // quizTypes (since the learner's last reset). Level up: levelUp.pct% over the last levelUp.answers answers.
    // { min_attempts, quiz_types, level_up: { answers, pct }, languages: { my: { …any of these… } } }
    // A language entry overrides the global value field by field. Out-of-range or missing values fall back to defaults.
    // Topics already completed stay completed when the rules change.
    // Defaults, limits and the reading itself live in js/kg-shared.js (shared with admin → Rules);
    // kg_chart_rule_int() in kg-chart-rules.sql reads level_up the same way.
    const DEFAULT_RULES = window.KGShared.RULE_DEFAULTS;
    function resolveRules(value, languageCode) {
      const r = window.KGShared.resolveRules(value, languageCode);
      return { minAttempts: r.min_attempts, quizTypes: r.quiz_types, levelUp: r.level_up };
    }
    const ruleText = (r) => `${r.minAttempts}× in each of the ${r.quizTypes.length} quiz type${r.quizTypes.length === 1 ? '' : 's'}`;
    const RulesContext = React.createContext(resolveRules(null));

    function useRules(user, languageCode) {
      const [value, setValue] = useState(undefined); // undefined = loading, null = no rules saved (defaults)
      useEffect(() => {
        if (!user) { setValue(null); return; }
        let cancelled = false;
        supabase.from(TABLES.settings).select('value').eq('key', 'unlock_rules').maybeSingle()
          .then(({ data }) => { if (!cancelled) setValue(data?.value ?? null); }, () => { if (!cancelled) setValue(null); });
        return () => { cancelled = true; };
      }, [user]);
      return useMemo(() => ({ ...resolveRules(value, languageCode), loaded: value !== undefined }), [value, languageCode]);
    }

    // Most recent quizzes at this level until they cover levelUp.answers; quizzes from before levels count as Easy
    function levelProgress(sessions, level, levelUp = DEFAULT_RULES.level_up) {
      let total = 0, correct = 0;
      for (const s of sessions || []) {
        if ((s.difficulty || 1) !== level || !MCQ_QUIZ_TYPES.includes(s.quiz_type)) continue;
        total += s.total_questions || 0;
        correct += s.correct_answers || 0;
        if (total >= levelUp.answers) break;
      }
      return { total, correct, pct: total ? Math.floor((correct * 100) / total) : 0, ready: total >= levelUp.answers && correct * 100 >= levelUp.pct * total };
    }

    const LANGUAGE_FONTS = {
      my: 'font-burmese',
      ja: 'font-japanese',
      zh: 'font-chinese',
      te: 'font-telugu',
      si: 'font-sinhala',
      ta: 'font-tamil',

    };

    // Word notes (kg_chart_vocabulary_translations.notes): English text with bits of the learner's script,
    // so English uses DM Sans and the script falls back to the language font
    const noteFontFamily = (languageCode) => {
      const key = (LANGUAGE_FONTS[languageCode] || '').replace('font-', '');
      const stack = (typeof tailwind !== 'undefined' && tailwind.config?.theme?.extend?.fontFamily?.[key]) || [];
      return ['DM Sans', ...stack.filter(f => f !== 'sans-serif'), 'sans-serif'].map(f => f.includes(' ') ? `'${f}'` : f).join(', ');

    function WordNote({ note, languageCode, className = '' }) {

    const getRatingById = (id) => RATINGS.find(r => r.id === id);

    // Cards buckets = these ratings (Cards view below; the word quiz's "Words from" uses them too)
    const BUCKET_ORDER = [5, 4, 3, 2, 1]; // ❌ on the left … ✓ on the right: drag right = "I know it"
    const UNKNOWN_IDS = [5, 4, 3], KNOWN_IDS = [2, 1];
    const CARDS_KEY = 'kg_chart_cards';
    const MIX_UNKNOWN_SHARE = 0.7;
    // Quiz, "Words from: All": how often a word is picked, by bucket (0 = not sorted yet)
    const BUCKET_WEIGHT = { 0: 3, 5: 4, 4: 3, 3: 3, 2: 2, 1: 1 };
    // Random order where a heavier item tends to come earlier (Efraimidis–Spirakis)
    const weightedShuffle = (arr, weightOf) => arr
      .map(v => ({ v, k: Math.pow(Math.random(), 1 / Math.max(weightOf(v) || 1, 0.001)) }))
      .sort((a, b) => b.k - a.k).map(x => x.v);


    // Meanings in the learner's own language instead of English (Marathi → Filipino). The meanings live in the
    // translations tables under a hidden language row, so they're edited in admin like any other translation.
    const MEANING_LANGS = window.KGShared.MEANING_LANGS; // js/kg-shared.js (admin and the review page read the same)
    const MEANING_STORAGE_KEY = 'kg_chart_meanings_in_english';
    const meaningNameFor = (langCode, inEnglish) => (MEANING_LANGS[langCode] && !inEnglish ? MEANING_LANGS[langCode].name : 'English');
    // Languages already written in Devanagari: the blue hint line shows a plain romanisation instead
    const ROMAN_HINT_LANGS = ['mr'];
    const convertToHint = (text, langCode) => (ROMAN_HINT_LANGS.includes(langCode) ? convertToRoman(text, langCode) : convertToDevanagari(text, langCode));
    // A sentence's meaning: its meaning_text column (Filipino for Marathi) unless switched to English or not filled in yet
    const sentenceMeaning = (s, meaningName) => (meaningName && meaningName !== 'English' && s.meaning_text?.trim()) || s.english_text;
    // Quiz tile wording per language: "Filipino → Native", "Pronunciation → Image"
    function quizTypeLabel(type, languageCode, meaningName) {
      if (type.id === 'english_to_native' && meaningName && meaningName !== 'English') return { ...type, label: `${meaningName} → Native` };
      if (type.id === 'devanagari_to_image' && ROMAN_HINT_LANGS.includes(languageCode)) return { ...type, label: 'Pronunciation → Image', icon: '🗣️' };
      return type;
    }

    // ==========================================

    // ==========================================
    const useAudioState = () => React.useSyncExternalStore(window.KGAudio.subscribe, window.KGAudio.getVersion);

    // 🔊 (+ optional 🐢). A span, not a button, so it can sit inside quiz option buttons and clickable cards.
    function SpeakButton({ text, lang, slow = false, size = 'md', className = '', voice }) {
      useAudioState();
      const A = window.KGAudio;
      if (!text) return null;
      const avail = A.has(text, lang);
      const dims = { sm: 'w-7 h-7 text-sm', md: 'w-9 h-9 text-base', lg: 'w-11 h-11 text-xl' }[size];
      const tap = (isSlow) => (e) => {
        e.stopPropagation(); e.preventDefault();
        if (avail === true) A.play(text, lang, { slow: isSlow, voice });
        else if (avail === false) A.toast('No audio for this yet');
      };
      const onKey = (isSlow) => (e) => { if (e.key === 'Enter' || e.key === ' ') tap(isSlow)(e); };
      const cls = (st) => `${dims} inline-flex items-center justify-center rounded-full select-none cursor-pointer transition-all ${
        avail === false ? 'border-2 border-dashed border-gray-300 text-gray-400 bg-white'
        : st === 'playing' ? 'bg-jade-600 text-white shadow-md scale-105'
        : (st === 'loading' || avail === 'loading') ? 'bg-jade-50 text-jade-400 animate-pulse'
        : 'bg-jade-50 text-jade-700 hover:bg-jade-100 active:scale-95'}`;
      return (
        <span className={`inline-flex items-center gap-1.5 align-middle ${className}`}>
          <span role="button" tabIndex={0} aria-label="Play audio" title={avail === false ? 'No audio for this yet' : 'Play'}
            onClick={tap(false)} onKeyDown={onKey(false)} className={cls(A.stateOf(text, lang, false))}>
            {avail === false ? '🔇' : '🔊'}
          </span>
          {slow && avail !== false && (
            <span role="button" tabIndex={0} aria-label="Play slowly" title="Play slowly"
              onClick={tap(true)} onKeyDown={onKey(true)} className={cls(A.stateOf(text, lang, true))}>🐢</span>

    // Header: ♀/♂ voice + auto-play mute. Saved on the account (kg_chart_user_prefs).
    function AudioControls() {

    // ==========================================
    // AUTH CONTEXT
    // ==========================================
    const AuthContext = createContext({});
    const useAuth = () => useContext(AuthContext);

    function AuthProvider({ children }) {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [authError, setAuthError] = useState('');
      const verifiedRef = React.useRef(null);

      // Only approved emails (kg_chart_allowed_emails) or the admin may stay signed in.
      const verify = async (session) => {
        const u = session?.user ?? null;
        if (!u) { verifiedRef.current = null; setUser(null); return; }
        if (verifiedRef.current === u.id) { setUser(u); return; }
        if (u.id !== ADMIN_USER_ID) {
          const { data, error } = await supabase.rpc('kg_chart_is_allowed');
          if (error || data !== true) {
            setAuthError(error
              ? `Couldn't verify access: ${error.message}`
              : `${u.email || 'This account'} isn't approved for KG Chart. Ask the admin to add your email.`);
            verifiedRef.current = null;
            setUser(null);
            await supabase.auth.signOut();
            return;
          }
        }
        verifiedRef.current = u.id;
        setAuthError('');
        setUser(u);
      };

      useEffect(() => {
        supabase.auth.getSession().then(async ({ data: { session } }) => {
          await verify(session);
          setLoading(false);
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setTimeout(() => verify(session), 0); // defer: no Supabase calls inside the auth callback
        });

        return () => subscription.unsubscribe();
      }, []);

      const signInWithEmail = async (email, password) => {
        return await supabase.auth.signInWithPassword({ email, password });
      };

      const signUpWithEmail = async (email, password) => {
        return await supabase.auth.signUp({ email, password });
      };

      const signOut = async () => {
        return await supabase.auth.signOut();
      };

      const signInWithGoogle = async () => {
        return await supabase.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: window.location.origin + window.location.pathname }
        });
      };

      return (
        <AuthContext.Provider value={{ user, loading, authError, signInWithEmail, signUpWithEmail, signOut, signInWithGoogle }}>
          {!loading && children}
        </AuthContext.Provider>
      );
    }

    // ==========================================
    // DATA HOOKS
    // ==========================================
    function useLanguages() {
      const [languages, setLanguages] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        supabase
          .from(TABLES.languages)
          .select('*')
          .eq('is_active', true)
          .order('sort_order')
          .then(({ data, error }) => {
            if (!error) setLanguages(data || []);
            setLoading(false);
          });

      return { languages, loading };
    }

    function useTopics(languageCode, meaningsInEnglish) {
      const [topics, setTopics] = useState([]);
      const [loading, setLoading] = useState(true);
      const lateConverters = useLateConverters();
      const lateSeen = React.useRef(0);

      useEffect(() => {
        if (!languageCode) return;
        let cancelled = false;
        // A late converter only rebuilds the list in place; a language or meaning switch shows the spinner
        if (lateSeen.current === lateConverters) setLoading(true);
        lateSeen.current = lateConverters;

        Promise.all([supabase
          .from(TABLES.topics)
          .select(`*, translations:${TABLES.topicTranslations}(*)`)
          .order('sort_order'), convertersReady])
          .then(([{ data, error }]) => {
            if (cancelled) return; // language or meanings switched while loading
            if (!error && data) {
              const meaningLang = MEANING_LANGS[languageCode];
              const mapped = data.map(topic => {
                const translation = topic.translations?.find(t => t.language_code === languageCode);
                if (!translation) return { ...topic, translation: null };
                const meaningRow = meaningLang && !meaningsInEnglish ? topic.translations?.find(t => t.language_code === meaningLang.code) : null;

                const converter = getConverter(languageCode);
                const usesPronunciation = converter?.usePronunciation;

                // Chinese: convert from pinyin column if available
                const titleSource = usesPronunciation
                  ? (translation.pinyin || translation.title_native)
                  : translation.title_native;

                // Chinese: the converter reads pinyin, so the question needs its own (question_pinyin column).
                // Without it, leave the line empty rather than repeating the characters.
                const questionSource = usesPronunciation
                  ? (translation.question_pinyin || '')
                  : translation.question_native;

                return {
                  ...topic,
                  translation: {
                    ...translation,
                    title_devanagari: convertToHint(titleSource, languageCode),
                    question_devanagari: convertToHint(questionSource, languageCode),
                    question_display: meaningRow?.question_native?.trim() || translation.question_english
                  }
                };
              }).filter(t => t.translation);
              setTopics(mapped);
            }
            setLoading(false);
          });
        return () => { cancelled = true; };
      }, [languageCode, meaningsInEnglish, lateConverters]);

      return { topics, loading };
    }

    // Chinese: convert from the pinyin pronunciation field; Burmese/others: from native_text
    function autoDevanagari(translation, languageCode) {
      const usesPronunciation = getConverter(languageCode)?.usePronunciation;
      const sourceText = usesPronunciation ? (translation?.pronunciation?.pinyin || '') : (translation?.native_text || '');
      return convertToHint(sourceText, languageCode);
    }

    function useVocabulary(languageCode, meaningsInEnglish) {
      const [vocabulary, setVocabulary] = useState([]);
      const [loading, setLoading] = useState(true);
      const lateConverters = useLateConverters();
      const lateSeen = React.useRef(0);

      useEffect(() => {
        if (!languageCode) return;
        let cancelled = false;
        // A late converter only rebuilds the list in place; a language or meaning switch shows the spinner
        if (lateSeen.current === lateConverters) setLoading(true);
        lateSeen.current = lateConverters;

        Promise.all([supabase
          .from(TABLES.vocabulary)
          .select(`*, translations:${TABLES.vocabularyTranslations}(*)`)
          .order('sort_order'), convertersReady])
          .then(([{ data, error }]) => {
            if (cancelled) return; // language or meanings switched while loading
            if (!error && data) {
              const meaningLang = MEANING_LANGS[languageCode];
              const mapped = data.map(vocab => {
                const translation = vocab.translations?.find(t => t.language_code === languageCode);
                if (!translation) return { ...vocab, translation: null };
                const meaningRow = meaningLang && !meaningsInEnglish ? vocab.translations?.find(t => t.language_code === meaningLang.code) : null;

                const converter = getConverter(languageCode);
                const usesPronunciation = converter?.usePronunciation;

                // DB override → converter fallback
                // If devanagari column has a human-verified value, use it.
                // Otherwise auto-generate from the JS converter.
                const generatedDev = autoDevanagari(translation, languageCode);
                const devanagari = translation.devanagari || generatedDev;
                const isDevOverridden = !!translation.devanagari;

                // Build pronunciation display
                // For pronunciation-based langs: keep DB pronunciation + add devanagari info
                // For char-based langs: generate roman from native text
                const pronunciation = usesPronunciation
                  ? { ...(translation.pronunciation || {}), roman: translation.pronunciation?.pinyin || '' }
                  : { roman: convertToRoman(translation.native_text, languageCode) };
                // Latin-script languages (Malay): the roman form is the word itself, so don't show it twice
                // Latin-script languages (Malay), and Devanagari-script ones whose blue line already is the roman form
                if (pronunciation.roman === translation.native_text || ROMAN_HINT_LANGS.includes(languageCode)) delete pronunciation.roman;

                return {
                  ...vocab,
                  // What the learner reads as the meaning: Filipino for Marathi (unless switched to English), else English
                  display_text: meaningRow?.native_text?.trim() || vocab.english_text,
                  translation: { ...translation, devanagari, isDevOverridden, pronunciation }
                };
              }).filter(v => v.translation);
              setVocabulary(mapped);
            }
            setLoading(false);
          });
        return () => { cancelled = true; };
      }, [languageCode, meaningsInEnglish, lateConverters]);

      return { vocabulary, loading };
    }

    function useUserRatings(languageCode) {
      const { user } = useAuth();
      const [ratings, setRatings] = useState({});
      // Which user + language `ratings` holds; until it matches, they are still loading (Cards waits for them)
      const [loadedFor, setLoadedFor] = useState(null);
      const want = user && languageCode ? `${user.id}|${languageCode}` : null;

      useEffect(() => {
        if (!want) return;
        let cancelled = false;
        setRatings({}); // not the previous language's ratings while this one loads

        supabase
          .from(TABLES.userRatings)
          .select('*')
          .eq('user_id', user.id)
          .eq('language_code', languageCode)
          .then(({ data }) => {
            if (cancelled) return; // switched language while loading
            const map = {};
            (data || []).forEach(r => { map[r.vocabulary_id] = r; });
            setRatings(map);
            setLoadedFor(want);
          });
        return () => { cancelled = true; };
      }, [want]);

      const updateRating = useCallback(async (vocabularyId, rating) => {
        if (!user) return false;

        const now = new Date().toISOString();
        const { error } = await supabase
          .from(TABLES.userRatings)
          .upsert({
            user_id: user.id,
            vocabulary_id: vocabularyId,
            language_code: languageCode,
            rating,
            last_reviewed_at: now,
          }, { onConflict: 'user_id,vocabulary_id,language_code' });

        if (!error) {
          setRatings(prev => ({
            ...prev,
            [vocabularyId]: { ...prev[vocabularyId], rating, last_reviewed_at: now }
          }));
        }
        return !error;
      }, [user, languageCode]);

      // Back to "not rated" (Cards: Undo of a word's first rating)
      const clearRating = useCallback(async (vocabularyId) => {
        if (!user) return false;
        const { error } = await supabase.from(TABLES.userRatings).delete()
          .eq('user_id', user.id).eq('vocabulary_id', vocabularyId).eq('language_code', languageCode);
        if (!error) setRatings(prev => { const next = { ...prev }; delete next[vocabularyId]; return next; });
        return !error;
      }, [user, languageCode]);

      return { ratings, ratingsLoaded: !want || loadedFor === want, updateRating, clearRating };
    }

      const checkScroll = useCallback(() => {
        const el = scrollRef.current;
        if (!el) return;
        setCanScrollLeft(el.scrollLeft > 10);
        setCanScrollRight(el.scrollLeft < el.scrollWidth - el.clientWidth - 10);
      }, []);

      useEffect(() => {
        checkScroll();
        const el = scrollRef.current;
        if (el) el.addEventListener('scroll', checkScroll);
        window.addEventListener('resize', checkScroll);
        return () => { if (el) el.removeEventListener('scroll', checkScroll); window.removeEventListener('resize', checkScroll); };
      }, [topics, checkScroll]);

      useEffect(() => {
        const el = scrollRef.current;
        if (!el) return;
        const activeBtn = el.querySelector('[data-active="true"]');
        if (activeBtn) activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });

          status: 'open',
          shown_devanagari: item.translation?.devanagari || null,

        let completed = 0, failed = 0, lastErr = null;
        // Insert in batches of 10

          let { error } = await supabase.from('kg_chart_flags').insert(batch);

          if (error) { console.error(error); failed += batch.length; lastErr = error; }

    // ==========================================
    // CHART AUTO-PLAY (revision): plays each card's clip N times, scrolls to it, moves on
    // ==========================================
    const AUTOPLAY_KEY = 'kg_chart_autoplay';
    const AUTOPLAY_MAX_TIMES = 10;
    const AUTOPLAY_GAP_MS = 700;      // between repeats of the same word
    const AUTOPLAY_NEXT_MS = 1200;    // before the next word
    const AUTOPLAY_NO_CLIP_MS = 1800; // a word without audio still gets its moment on screen

    function useChartAutoplay(items, languageCode) {
      const audioVersion = useAudioState();
      const saved = loadFromStorage(AUTOPLAY_KEY, {});
      const [settings, setSettings] = useState({
        times: Math.min(Math.max(Number(saved.times) || 2, 1), AUTOPLAY_MAX_TIMES),
        slow: !!saved.slow, loop: !!saved.loop,
      });
      const [open, setOpen] = useState(false);
      const [playing, setPlaying] = useState(false);
      const [pos, setPos] = useState({ idx: 0, rep: 0, n: 0 }); // n bumps on every play so a jump to the same card replays
      const timer = React.useRef(null);
      const started = React.useRef(false);
      const wake = React.useRef(null);
      const settingsRef = React.useRef(settings);
      settingsRef.current = settings;
      const itemsRef = React.useRef(items);
      itemsRef.current = items;
      const posRef = React.useRef(pos);
      posRef.current = pos;
      const itemsKey = items.map(v => v.id).join(',');

      useEffect(() => { saveToStorage(AUTOPLAY_KEY, settings); }, [settings]);
      const clear = () => { clearTimeout(timer.current); timer.current = null; };

      // After a word (or a repeat) ends: next repeat, next word, back to the start, or stop
      const advance = useCallback((ms) => {
        clear();
        timer.current = setTimeout(() => {
          const p = posRef.current;
          const { times, loop } = settingsRef.current;
          const len = itemsRef.current.length;
          if (p.rep + 1 < times) setPos({ idx: p.idx, rep: p.rep + 1, n: p.n + 1 });
          else if (p.idx + 1 < len) setPos({ idx: p.idx + 1, rep: 0, n: p.n + 1 });
          else if (loop && len) setPos({ idx: 0, rep: 0, n: p.n + 1 });
          else { setPlaying(false); setPos({ idx: 0, rep: 0, n: p.n }); }
        }, ms);
      }, []);

      // Play the current clip
      useEffect(() => {
        if (!playing) return;
        const item = items[pos.idx];
        if (!item) { setPlaying(false); return; }
        if (pos.rep === 0) document.getElementById(`chart-card-${item.id}`)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        started.current = false;
        const text = item.translation?.native_text;
        // KGAudio.play() toggles a clip OFF when that same clip is already playing (e.g. the card's own 🔊 was tapped): stop first so it always restarts
        window.KGAudio.stop();
        const ok = !!text && window.KGAudio.play(text, languageCode, { slow: settingsRef.current.slow, silent: true });
        if (!ok) advance(AUTOPLAY_NO_CLIP_MS);
      }, [playing, pos.n]);

      // Notice when the clip has finished
      useEffect(() => {
        if (!playing) return;
        const text = items[pos.idx]?.translation?.native_text;
        if (!text) return;
        if (window.KGAudio.stateOf(text, languageCode, settingsRef.current.slow)) { started.current = true; return; }
        if (started.current) {
          started.current = false;
          advance(pos.rep + 1 < settingsRef.current.times ? AUTOPLAY_GAP_MS : AUTOPLAY_NEXT_MS);
        }
      }, [audioVersion]);

      // Keep the screen on while playing (where the browser allows it)
      useEffect(() => {
        if (!playing) { wake.current?.release?.().catch(() => {}); wake.current = null; return; }
        let cancelled = false;
        navigator.wakeLock?.request?.('screen').then(l => {
          if (cancelled) { l.release?.().catch(() => {}); return; } // paused before the lock arrived
          wake.current?.release?.().catch(() => {});
          wake.current = l;
        }).catch(() => {});
        return () => { cancelled = true; };
      }, [playing]);

      // New topic or leaving the chart: stop
      useEffect(() => { clear(); setPlaying(false); setPos({ idx: 0, rep: 0, n: 0 }); }, [itemsKey]);
      useEffect(() => () => { clear(); window.KGAudio.stop(); wake.current?.release?.().catch(() => {}); }, []);

      const play = () => { if (!items.length) return; clear(); setPlaying(true); setPos(p => ({ ...p, rep: 0, n: p.n + 1 })); };
      const pause = () => { clear(); setPlaying(false); window.KGAudio.stop(); };
      const jump = (idx) => { clear(); window.KGAudio.stop(); setPlaying(true); setPos(p => ({ idx: (idx + items.length) % items.length, rep: 0, n: p.n + 1 })); };
      const close = () => { pause(); setOpen(false); };
      return { open, setOpen, playing, idx: pos.idx, rep: pos.rep, settings, setSettings, play, pause, jump, close, current: playing || open ? items[pos.idx] : null };
    }

      return (
        <div className="max-w-7xl mx-auto px-4 py-6">
          <div className="bg-white rounded-2xl shadow-lg mb-6 overflow-hidden border border-gray-100">
            <div className="grid grid-cols-1 md:grid-cols-4">
              <div className="bg-gradient-to-r from-jade-700 to-jade-800 p-6 flex items-center justify-center">
                <div className="text-5xl">{topic.icon}</div>
              </div>
              <div className="p-4 flex flex-col justify-center items-center border-b md:border-b-0 md:border-r border-gray-100">
                <div className={`text-2xl font-bold text-gray-800 ${fontClass}`}>{topic.translation?.title_native}</div>
                <div className="text-lg text-blue-600 font-devanagari mt-1">{topic.translation?.title_devanagari}</div>
              </div>
              <div className="p-4 flex items-center justify-center border-b md:border-b-0 md:border-r border-gray-100 bg-gray-50">
                <p className="text-center text-gray-700 font-medium">{topic.translation?.question_display}</p>
              </div>
              <div className="p-4 flex flex-col justify-center items-center">
                <div className={`text-sm text-red-700 text-center ${fontClass}`}>{topic.translation?.question_native}</div>
                <div className="text-xs text-red-500 text-center mt-1 font-devanagari">
                  {topic.translation?.question_devanagari}
                </div>
                <SpeakButton text={topic.translation?.question_native} lang={languageCode} slow size="sm" className="mt-2" />
              </div>
            </div>
          </div>

          <div className="flex items-center justify-between mb-4 bg-white rounded-xl p-3 shadow-sm">
            <div className="flex items-center gap-3 flex-wrap">
              <label className="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" checked={showEnglish} onChange={(e) => onToggleEnglish(e.target.checked)}
                  className="w-5 h-5 rounded border-gray-300 text-jade-600" />
                <span className="text-sm text-gray-700 font-medium">Show {meaningName || 'English'}</span>
              </label>
              <button onClick={() => { if (flagMode) exitFlagMode(); else { ap.close(); setFlagMode(true); } }}
                className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium transition-all ${
                  flagMode ? 'bg-red-500 text-white shadow-md' : 'bg-gray-100 text-gray-500 hover:bg-red-50 hover:text-red-500'
                }`}>
                🚩 {flagMode ? 'Exit Flag Mode' : 'Flag Mode'}
              </button>
              {!flagMode && vocabulary.length > 0 && (
                <button onClick={() => (ap.open ? ap.close() : (ap.setOpen(true), ap.play()))}
                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium transition-all ${
                    ap.open ? 'bg-jade-600 text-white shadow-md' : 'bg-gray-100 text-gray-500 hover:bg-jade-50 hover:text-jade-700'
                  }`}>
                  {ap.open ? '⏹ Stop auto-play' : '▶ Auto-play'}

              <div className="text-sm text-gray-500">{flagMode && flaggedIds.size > 0 ? <span className="text-red-500 font-semibold">{flaggedIds.size} selected · </span> : ''}{vocabulary.length} items</div>
              {user && user.id === ADMIN_USER_ID && !flagMode && (
                <button onClick={() => setShowAddWord(true)}
                  className="w-8 h-8 rounded-lg bg-jade-600 text-white flex items-center justify-center hover:bg-jade-700 transition shadow-sm text-lg font-bold" title="Add new word">+</button>
              )}

          {flagMode && (
            <div className="mb-4 bg-red-50 border border-red-200 rounded-xl p-3 text-sm text-red-700 flex items-center gap-2">
              <span className="text-lg">🚩</span>
              <span>Tap cards to select/deselect. Use "Select All" for bulk. Then hit <strong>Submit Flags</strong> below.</span>
            </div>
          )}

          <div className={`grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 ${ap.open ? 'pb-48' : ''}`}>
            {vocabulary.map((item, i) => (
              <div key={item.id} id={`chart-card-${item.id}`}
                className={`rounded-xl transition-all ${ap.current?.id === item.id ? 'ring-4 ring-jade-400 ring-offset-2 scale-[1.03]' : ''}`}>
                <VocabCard item={item} topicId={topic.id} rating={ratings[item.id]?.rating}
                  onRate={onRate} onClick={() => flagMode ? toggleFlag(item) : ap.open ? ap.jump(i) : setSelectedItem(item)}
                  showEnglish={showEnglish} fontClass={fontClass} flagMode={flagMode} flagSelected={flaggedIds.has(item.id)} languageCode={languageCode} />
              </div>
            ))}
          </div>

          {ap.open && !flagMode && (
            <div className="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-sm border-t border-jade-200 shadow-lg z-40 px-4 py-3">
              <div className="max-w-3xl mx-auto">
                <div className="flex items-center gap-3 mb-2 min-w-0">
                  <div className="min-w-0 flex-1">
                    <div className={`font-bold text-gray-800 truncate ${fontClass}`}>{ap.current?.translation?.native_text || '—'}</div>
                    <div className="text-xs text-gray-500 truncate">
                      {ap.idx + 1} / {vocabulary.length}{showEnglish && ap.current ? ` · ${ap.current.display_text || ap.current.english_text}` : ''}{ap.settings.times > 1 ? ` · ${ap.rep + 1}/${ap.settings.times}` : ''}

                  {ap.playing
                    ? <button onClick={ap.pause} title="Pause" className="w-12 h-12 rounded-full bg-jade-600 text-white text-xl shadow-md hover:bg-jade-700">⏸</button>
                    : <button onClick={ap.play} title="Play" className="w-12 h-12 rounded-full bg-jade-600 text-white text-xl shadow-md hover:bg-jade-700">▶</button>}
                  <button onClick={() => ap.jump(ap.idx + 1)} title="Next word" className="w-10 h-10 rounded-full bg-gray-100 hover:bg-gray-200 text-lg">⏭</button>
                  <button onClick={ap.close} title="Stop auto-play" className="w-10 h-10 rounded-full bg-gray-100 hover:bg-red-50 text-lg">✕</button>
                </div>
                <div className="flex items-center gap-2 flex-wrap text-sm">
                  <span className="text-gray-600">Each word</span>
                  <div className="flex items-center bg-gray-100 rounded-lg">
                    <button onClick={() => ap.setSettings(s => ({ ...s, times: Math.max(1, s.times - 1) }))} disabled={ap.settings.times <= 1}
                      className="w-8 h-8 font-bold text-gray-600 disabled:opacity-30">−</button>
                    <span className="w-8 text-center font-bold text-jade-700">{ap.settings.times}×</span>
                    <button onClick={() => ap.setSettings(s => ({ ...s, times: Math.min(AUTOPLAY_MAX_TIMES, s.times + 1) }))} disabled={ap.settings.times >= AUTOPLAY_MAX_TIMES}
                      className="w-8 h-8 font-bold text-gray-600 disabled:opacity-30">+</button>
                  </div>
                  <button onClick={() => ap.setSettings(s => ({ ...s, slow: !s.slow }))}
                    className={`px-3 py-1.5 rounded-lg font-medium ${ap.settings.slow ? 'bg-jade-100 text-jade-700' : 'bg-gray-100 text-gray-500'}`}>🐢 Slow</button>
                  <button onClick={() => ap.setSettings(s => ({ ...s, loop: !s.loop }))}
                    className={`px-3 py-1.5 rounded-lg font-medium ${ap.settings.loop ? 'bg-jade-100 text-jade-700' : 'bg-gray-100 text-gray-500'}`}>🔁 Loop topic</button>
                </div>
              </div>
            </div>
          )}

          {flagMode && flaggedIds.size > 0 && (
            <div className="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-sm border-t border-red-200 shadow-lg z-40 p-4">
              <div className="max-w-7xl mx-auto flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <span className="text-2xl">🚩</span>
                  <div>
                    <div className="font-bold text-gray-800">{flaggedIds.size} item{flaggedIds.size > 1 ? 's' : ''} selected</div>
                    <div className="text-xs text-gray-500">{vocabulary.filter(v => flaggedIds.has(v.id)).map(v => v.english_text).slice(0, 5).join(', ')}{flaggedIds.size > 5 ? ` +${flaggedIds.size - 5} more` : ''}</div>
                  </div>
                </div>
                <div className="flex gap-2">
                  <button onClick={deselectAll} className="px-4 py-2 bg-gray-100 text-gray-700 rounded-xl font-medium hover:bg-gray-200 transition text-sm">Clear</button>
                  <button onClick={() => setShowBatchFlag(true)} className="px-6 py-2 bg-red-500 text-white rounded-xl font-semibold hover:bg-red-600 transition shadow-md text-sm">
                    Submit Flags →
                  </button>
                </div>
              </div>
            </div>
          )}

          {selectedItem && (
            <DetailModal item={selectedItem} topicId={topic.id} rating={ratings[selectedItem.id]?.rating}
              onRate={onRate} onClose={() => setSelectedItem(null)} onFlag={(item) => { setSelectedItem(null); setFlagOne(item); }} fontClass={fontClass} languageCode={languageCode} />
          )}
          {flagOne && <FlagModal item={flagOne} languageCode={languageCode} onClose={() => setFlagOne(null)} />}

          {showBatchFlag && (
            <BatchFlagModal
              items={vocabulary.filter(v => flaggedIds.has(v.id))}
              languageCode={languageCode}
              onClose={() => setShowBatchFlag(false)}
              onDone={() => { setShowBatchFlag(false); exitFlagMode(); }}
            />
          )}

          {showAddWord && (
            <AddWordModal
              topicId={topic.id}
              languageCode={languageCode}
              fontClass={fontClass}
              onClose={() => setShowAddWord(false)}
              onAdded={() => { setShowAddWord(false); window.location.reload(); }}
            />
          )}
        </div>
      );
    }

    // ==========================================
    // LISTEN QUIZZES (Phase 9 step 3): clips come from js/kg-audio.js
    // ==========================================
    const LISTEN_TYPES = ['listen_to_image', 'listen_to_native'];
    const languageName = (langCode) => {
      try { return new Intl.DisplayNames(['en'], { type: 'language' }).of(langCode) || langCode; } catch (e) { return langCode; }
    };
    // Listen quizzes play even when auto-play is muted, and never toast
    const playListen = (text, lang, slow = false) => { if (text) window.KGAudio.play(text, lang, { slow, silent: true }); };

    // Level state for one learner in one language: kg_chart_user_levels when kg-chart-levels.sql has been run,
    // otherwise this device only (same formula, checked here).
    function useLevels(user, languageCode) {
      const rules = React.useContext(RulesContext);
      const email = (user?.email || '').toLowerCase();
      const localKey = `kg_chart_level_${languageCode}`;
      const [state, setState] = useState({ level: 1, unlocked: 1, loaded: false, db: false });
      const [sessions, setSessions] = useState([]);

      const loadSessions = useCallback(async () => {
        if (!user) return [];
        const { data } = await supabase.from(TABLES.quizSessions).select('difficulty, quiz_type, total_questions, correct_answers, created_at').eq('user_id', user.id).eq('language_code', languageCode)
          .in('quiz_type', MCQ_QUIZ_TYPES).order('created_at', { ascending: false }).limit(300);
        setSessions(data || []);
        return data || [];
      }, [user, languageCode]);

      useEffect(() => {
        let cancelled = false;
        (async () => {
          const local = loadFromStorage(localKey, { level: 1, unlocked: 1 });
          let next = { level: local.level || 1, unlocked: local.unlocked || 1, loaded: true, db: false };
          if (user && email) {
            const { data, error } = await supabase.from(TABLES.userLevels).select('*').eq('email', email).eq('language_code', languageCode).maybeSingle();
            if (!error) next = { level: data?.level || 1, unlocked: data?.unlocked || 1, loaded: true, db: true };
          }
          if (!cancelled) setState(next);
          if (!cancelled) await loadSessions();
        })();
        return () => { cancelled = true; };
      }, [user, email, languageCode]);

      const save = async (level, unlocked) => {
        saveToStorage(localKey, { level, unlocked });
        if (state.db && email) await supabase.from(TABLES.userLevels).upsert({ email, language_code: languageCode, level, updated_at: new Date().toISOString() });
      };
      const setLevel = (n) => {
        const level = Math.min(Math.max(n, 1), state.unlocked);
        setState(s => ({ ...s, level }));
        save(level, state.unlocked);
      };
      // After a multiple-choice quiz is saved: run the formula; returns the newly unlocked level, or null
      const afterQuiz = async () => {
        const fresh = await loadSessions();
        let unlocked = state.unlocked;
        if (state.db) {
          const { data, error } = await supabase.rpc('kg_chart_check_level_up', { p_lang: languageCode });
          if (!error && data) unlocked = data;
        } else if (state.unlocked < LEVELS.length && levelProgress(fresh, state.unlocked, rules.levelUp).ready) {
          unlocked = state.unlocked + 1;
        }
        if (unlocked > state.unlocked) {
          setState(s => ({ ...s, unlocked }));
          saveToStorage(localKey, { level: state.level, unlocked });
          return unlocked;
        }
        return null;
      };
      const progress = levelProgress(sessions, state.unlocked, rules.levelUp);
      return { ...state, setLevel, afterQuiz, progress, levelUp: rules.levelUp };
    }

    // ==========================================
    // WORD BUILDER QUIZ
    // ==========================================
    const WB_STORAGE_KEY = 'kg_chart_word_builder';
    const WB_DEFAULTS = { prompt: 'mix', split: 'chars', tiles: 'distractors', distractors: 4, feedback: 'end', hints: true };
    const isCombiningMark = (s) => /^\p{M}/u.test(s);
    const tileLabel = (s) => (isCombiningMark(s) ? '\u25CC' + s : s);
    const shuffleArr = (arr) => {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    };

    // Characters: one tile per code point (consonants, vowel signs, medials, asat…). ZWJ/ZWNJ stay on the previous piece.
    function splitIntoChars(text) {
      const out = [];
      for (const ch of Array.from((text || '').normalize('NFC'))) {
        if (/\s/.test(ch)) continue;
        if ((ch === '\u200D' || ch === '\u200C') && out.length) { out[out.length - 1] += ch; continue; }
        out.push(ch);
      }
      return out;
    }

    // Syllables: language-utils breakSyllables() when available, else grapheme clusters.
    function splitIntoSyllables(text, langCode) {
      const conv = getConverter(langCode);
      const words = (text || '').normalize('NFC').split(/\s+/).filter(Boolean);
      const out = [];
      for (const w of words) {
        let parts = null;
        if (conv?.breakSyllables) {
          try {
            const r = conv.breakSyllables(w);
            parts = Array.isArray(r) ? r : typeof r === 'string' ? r.split(/[\s·|\-]+/) : null;
            parts = parts ? parts.map(p => String(p)).filter(Boolean) : null;
            if (parts && parts.join('') !== w) parts = null; // must rebuild the exact word
          } catch (e) { parts = null; }
        }
        if (!parts && typeof Intl !== 'undefined' && Intl.Segmenter) {
          parts = Array.from(new Intl.Segmenter(undefined, { granularity: 'grapheme' }).segment(w), s => s.segment);
        }
        out.push(...(parts || splitIntoChars(w)));
      }
      return out;
    }

    const splitWord = (text, mode, langCode) => (mode === 'syllables' ? splitIntoSyllables(text, langCode) : splitIntoChars(text));

    function WbOption({ label, value, options, onChange }) {
      return (
        <div>
          <div className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">{label}</div>
          <div className="flex flex-wrap gap-2">
            {options.map(([v, l]) => (
              <button key={String(v)} type="button" onClick={() => onChange(v)}
                className={`px-3 py-2 rounded-lg border-2 text-sm font-medium transition-all ${value === v ? 'border-jade-500 bg-jade-50 text-jade-700' : 'border-gray-200 bg-white text-gray-600 hover:border-gray-300'}`}>{l}</button>
            ))}
          </div>
        </div>
      );
    }

    function WordBuilderRound({ item, index, total, score, settings, languageCode, unitPool, onBack, onAnswered, onNext }) {
      const fontClass = LANGUAGE_FONTS[languageCode] || 'font-body';
      const nativeText = item.translation?.native_text || '';
      const perTile = settings.feedback === 'tile';
      const [target] = useState(() => splitWord(nativeText, settings.split, languageCode));
      const hasImage = !!(item.extra_data?.colorCode || item.image_filename);
      const [promptKind] = useState(() =>
        settings.prompt === 'english' || !hasImage ? 'english'
          : settings.prompt === 'image' ? 'image'
          : (Math.random() < 0.5 ? 'image' : 'english'));
      const [imgFailed, setImgFailed] = useState(false);
      const showImage = promptKind === 'image' && !imgFailed;

      const [tiles] = useState(() => {
        const correct = target.map((t, i) => ({ key: 'c' + i, text: t }));
        let extra = [];
        if (settings.tiles === 'distractors') {
          const inWord = new Set(target);
          extra = shuffleArr(unitPool.filter(u => !inWord.has(u))).slice(0, Number(settings.distractors) || 0)
            .map((t, i) => ({ key: 'd' + i, text: t }));
        }
        let all = shuffleArr([...correct, ...extra]);
        for (let n = 0; n < 6 && all.length > 1 && all.map(t => t.text).join('') === target.join(''); n++) all = shuffleArr(all);
        return all;
      });
      const byKey = useMemo(() => Object.fromEntries(tiles.map(t => [t.key, t])), [tiles]);

      const [placed, setPlaced] = useState([]);
      const [hinted, setHinted] = useState([]);
      const [mistakes, setMistakes] = useState(0);
      const [result, setResult] = useState(null);

      const placedText = placed.map(k => byKey[k].text);
      const full = placed.length >= target.length;
      const rightAt = (i) => placedText[i] === target[i];

      // Any hint makes the word count as wrong, even if the finished word is right
      const finish = (correct, builtText, hintsUsed = hinted.length) => {
        if (result) return;
        const counted = correct && hintsUsed === 0;
        setResult({ correct: counted, solvedWithHints: correct && hintsUsed > 0 });
        onAnswered(counted, builtText);
        window.KGAudio.autoPlay(nativeText, languageCode);
      };

      const place = (key) => {
        if (result || full || placed.includes(key)) return;
        const next = [...placed, key];
        if (perTile && byKey[key].text !== target[placed.length]) setMistakes(m => m + 1);
        setPlaced(next);
        if (perTile && next.length === target.length && next.every((k, i) => byKey[k].text === target[i])) {
          finish(true, next.map(k => byKey[k].text).join(''));
        }
      };
      const remove = (key) => { if (!result) setPlaced(p => p.filter(k => k !== key)); };
      const clearAll = () => { if (!result) setPlaced([]); };
      const check = () => finish(placedText.length === target.length && placedText.every((t, i) => t === target[i]), placedText.join(''));
      const giveUp = () => finish(false, placedText.join(''));
      const hint = () => {
        if (result) return;
        let k = 0;
        while (k < placed.length && rightAt(k)) k++;
        if (k >= target.length) return;
        const keep = placed.slice(0, k);
        const tile = tiles.find(t => !keep.includes(t.key) && t.text === target[k]);
        if (!tile) return;
        const next = [...keep, tile.key];
        const nextHinted = [...hinted, tile.key];
        setPlaced(next);
        setHinted(nextHinted);
        if (next.length === target.length) finish(true, next.map(x => byKey[x].text).join(''), nextHinted.length);
      };

      useEffect(() => {
        const onKey = (e) => {
          if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName) || kgModalOpen()) return;
          if (result) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onNext(); } return; }
          if (e.key === 'Backspace' && placed.length) { e.preventDefault(); remove(placed[placed.length - 1]); }
          else if (e.key === 'Enter' && !perTile && full) { e.preventDefault(); check(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      });

      const slotClass = (i) => {
        const k = placed[i];
        if (!k) return 'border-dashed border-gray-300 bg-gray-50';
        const judged = perTile || result;
        if (judged) return rightAt(i) ? 'border-green-500 bg-green-50 text-green-800' : 'border-red-500 bg-red-50 text-red-700';
        if (hinted.includes(k)) return 'border-amber-400 bg-amber-50';
        return 'border-jade-500 bg-jade-50';
      };
      const hasWrong = perTile && placed.some((_, i) => !rightAt(i));

      return (
        <div className="max-w-3xl mx-auto p-4">
          <div className="bg-white rounded-2xl shadow-lg p-4 mb-4">
            <div className="flex flex-wrap items-center justify-between gap-4">
              <button onClick={onBack} className="px-4 py-2 bg-gray-100 rounded-xl hover:bg-gray-200 font-medium">← Back</button>
              <div className="flex items-center gap-4">
                <div className="text-sm text-gray-500">{index + 1} / {total}</div>
                <div className="w-32 h-2 bg-gray-200 rounded-full overflow-hidden">
                  <div className="h-full bg-jade-500 transition-all duration-300" style={{ width: `${((index + 1) / total) * 100}%` }} />
                </div>
                <div className="bg-gradient-to-r from-jade-500 to-jade-600 text-white px-4 py-2 rounded-xl font-bold shadow-md">{score.correct}/{score.total}</div>
              </div>
            </div>
          </div>

          <div className="bg-white rounded-2xl shadow-lg p-6 mb-4 text-center">
            <div className="text-sm text-gray-400 mb-3">Build the word for:</div>
            {showImage ? (
              item.extra_data?.colorCode ? (
                <div className="w-24 h-24 rounded-xl shadow-lg mx-auto" style={{ backgroundColor: item.extra_data.colorCode }} />
              ) : (
                <div className="w-40 h-40 mx-auto flex items-center justify-center">
                  <img src={getImageUrl(item.topic_id, item.image_filename)} alt="" onError={() => setImgFailed(true)} className="max-w-full max-h-full object-contain" />
                </div>
              )
            ) : (
              <div className="text-3xl font-bold text-gray-800">{item.display_text}</div>
            )}
          </div>

          <div className="bg-white rounded-2xl shadow-lg p-6 mb-4">
            <div className="flex flex-wrap justify-center gap-2">
              {target.map((_, i) => {
                const k = placed[i];
                return (
                  <button key={i} onClick={() => k && remove(k)} disabled={!k || !!result}
                    title={k ? 'Tap to remove' : ''}
                    className={`min-w-[3.5rem] h-16 px-2 rounded-xl border-2 flex items-center justify-center text-3xl transition-all ${fontClass} ${slotClass(i)}`}>
                    {k ? tileLabel(byKey[k].text) : ''}
                  </button>
                );
              })}
            </div>
            <div className={`text-center mt-4 min-h-[3rem] text-4xl font-bold text-gray-800 ${fontClass}`}>
              {placed.length ? placedText.join('') : <span className="text-base font-normal text-gray-400 font-body">Tap the pieces below in order</span>}
            </div>
            {hasWrong && !result && <div className="text-center text-sm text-red-500 mt-1">Tap a red piece to remove it</div>}
          </div>

          {!result && (
            <>
              <div className="flex flex-wrap justify-center gap-3 mb-6">
                {tiles.map(t => {
                  const used = placed.includes(t.key);
                  return (
                    <button key={t.key} onClick={() => place(t.key)} disabled={used || full}
                      className={`min-w-[3.5rem] h-16 px-3 rounded-xl border-2 bg-white text-3xl shadow-sm transition-all ${fontClass} ${used ? 'opacity-20 border-gray-200' : 'border-gray-200 hover:border-jade-400 hover:shadow-md active:scale-95'} ${!used && full ? 'opacity-50' : ''}`}>
                      {tileLabel(t.text)}
                    </button>
                  );
                })}
              </div>
              {hinted.length > 0 && (
                <p className="text-center text-sm text-amber-700 mb-3">Hint used: this word will count as wrong.</p>
              )}
              <div className="flex flex-wrap justify-center gap-3">
                {settings.hints && (
                  <button onClick={hint} title="Using a hint marks this word wrong" className="px-5 py-3 bg-amber-50 text-amber-700 border-2 border-amber-200 rounded-xl font-medium hover:bg-amber-100">
                    💡 Hint{hinted.length ? ` (${hinted.length})` : ''}
                  </button>
                )}
                <button onClick={clearAll} disabled={!placed.length} className="px-5 py-3 bg-gray-100 rounded-xl font-medium hover:bg-gray-200 disabled:opacity-40">Clear</button>
                <button onClick={giveUp} className="px-5 py-3 bg-gray-100 rounded-xl font-medium hover:bg-gray-200">Show answer</button>
                {!perTile && (
                  <button onClick={check} disabled={!full} className="px-8 py-3 bg-jade-600 text-white rounded-xl font-bold hover:bg-jade-700 disabled:opacity-40">
                    Check <span className="text-jade-200 text-sm hidden sm:inline ml-1">↵</span>
                  </button>
                )}
              </div>
            </>
          )}

          {result && (
            <div className="bg-white rounded-2xl shadow-lg p-6 text-center animate-slide-up">
              <div className={`text-2xl font-bold mb-3 ${result.correct ? 'text-green-600' : result.solvedWithHints ? 'text-amber-600' : 'text-red-600'}`}>
                {result.correct ? '✅ Correct!' : result.solvedWithHints ? '💡 Solved with hints' : '❌ Not quite'}
              </div>
              {result.solvedWithHints && <div className="text-sm text-gray-500 -mt-2 mb-3">Counted as wrong because a hint was used.</div>}
              <div className={`text-4xl font-bold text-gray-800 ${fontClass}`}>{nativeText}</div>
              <div className="mt-3"><SpeakButton text={nativeText} lang={languageCode} slow size="lg" /></div>
              {item.translation?.devanagari && <div className="text-xl text-blue-600 font-devanagari mt-1">{item.translation.devanagari}</div>}
              <div className="text-sm text-gray-500 mt-1">{item.display_text}</div>
              {(mistakes > 0 || hinted.length > 0) && (
                <div className="text-xs text-gray-400 mt-2">
                  {[mistakes > 0 && `${mistakes} wrong tile${mistakes > 1 ? 's' : ''}`, hinted.length > 0 && `${hinted.length} hint${hinted.length > 1 ? 's' : ''}`].filter(Boolean).join(' · ')}
                </div>
              )}
              <button onClick={onNext} className="mt-5 px-8 py-3 bg-blue-600 text-white rounded-full font-bold hover:bg-blue-700">
                {index + 1 >= total ? 'See Results' : 'Next Word →'} <span className="text-blue-300 text-sm hidden sm:inline ml-1">↵</span>
              </button>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // TYPE THE WORD (Phase 10): learner types with the phone's own keyboard
    // ==========================================
    const TW_STORAGE_KEY = 'kg_type_word_settings';
    const TW_DEFAULTS = { level: 'copy', prompt: 'mix', feedback: 'end', hints: true, sound: false };
    const TW_LEVELS = [['copy', 'Copy'], ['dev', 'From Devanagari'], ['memory', 'From memory']];
    const twLevelFor = (level, lang) => (level === 'dev' && NO_DEVANAGARI_LANGS.includes(lang) ? 'copy' : level);
    const twGraphemes = (s) => (typeof Intl !== 'undefined' && Intl.Segmenter)
      ? Array.from(new Intl.Segmenter(undefined, { granularity: 'grapheme' }).segment(s || ''), x => x.segment)
      : Array.from(s || '');
    // Burmese marks after a consonant in the standard (Unicode) order. Keyboards let you type them in another
    // order that looks the same on screen, e.g. \u1038 before \u103A (\u1019\u1038\u103A shows as \u1019\u103A\u1038). NFC fixes only \u1037/\u103A.
    // Medials \u103B \u103C \u103D \u103E, then \u1031, upper vowels, lower vowels, \u102B/\u102C, \u1036, \u1037, \u103A, \u1038. A stacked consonant (\u1039) ends the run.
    const MM_MARK_RANK = { '\u103B': 1, '\u103C': 2, '\u103D': 3, '\u103E': 4, '\u1031': 5, '\u102D': 6, '\u102E': 6, '\u1032': 6,
      '\u102F': 7, '\u1030': 7, '\u102B': 8, '\u102C': 8, '\u1036': 9, '\u1037': 10, '\u103A': 11, '\u1038': 12 };
    const mmCanon = (s) => (s || '').replace(/[\u102B-\u1032\u1036-\u1038\u103A-\u103E]{2,}/g, run =>
      Array.from(run).map((c, i) => [c, i]).sort((x, y) => (MM_MARK_RANK[x[0]] - MM_MARK_RANK[y[0]]) || (x[1] - y[1])).map(x => x[0]).join(''));
    // Same rule for typed text and the stored word
    function twNorm(s, lang) {
      let t = mmCanon((s || '').normalize('NFC').replace(/[\u200B-\u200D\uFEFF]/g, '')).trim().replace(/\s+/g, ' ');
      t = t.replace(/[\u104B\u104A\u0964\u0965.,!?\uFF01\uFF1F\u3002\u3001]+$/u, '').trim();
      // Marathi: nasal consonant + virama before a consonant = anusvara (सन्त्रे → संत्रे)
      if (NO_DEVANAGARI_LANGS.includes(lang)) t = t.replace(/[\u0919\u091E\u0923\u0928\u092E]\u094D(?=[\u0915-\u0939])/g, '\u0902');
      return t;
    }
    // Japanese: also accept a kana reading if the pronunciation data has one
    function twAccepted(translation, lang) {
      const out = [translation?.native_text || ''];
      if (lang === 'ja' && translation?.pronunciation && typeof translation.pronunciation === 'object') {
        Object.values(translation.pronunciation).forEach(v => { if (typeof v === 'string' && /[\p{Script=Hiragana}\p{Script=Katakana}]/u.test(v)) out.push(v); });
      }
      return out.filter(Boolean);
    }

    function TypeWordRound({ item, index, total, score, settings, languageCode, trailingWrong, onBack, onAnswered, onNext }) {
      const fontClass = LANGUAGE_FONTS[languageCode] || 'font-body';
      const nativeText = item.translation?.native_text || '';
      const devText = item.translation?.devanagari || '';
      const showDev = !!devText && !NO_DEVANAGARI_LANGS.includes(languageCode) && devText !== nativeText;
      const level = twLevelFor(settings.level, languageCode);
      const live = settings.feedback === 'live';
      const target = useMemo(() => twGraphemes(twNorm(nativeText, languageCode)), [nativeText, languageCode]);
      const hasImage = !!(item.extra_data?.colorCode || item.image_filename);
      const promptKind = useMemo(() =>
        settings.prompt === 'english' || !hasImage ? 'english'
          : settings.prompt === 'image' ? 'image'
          : (Math.random() < 0.5 ? 'image' : 'english'), [item.id, index]);
      const [imgFailed, setImgFailed] = useState(false);
      const [value, setValue] = useState('');
      const [composing, setComposing] = useState(false);
      const [hints, setHints] = useState(0);
      const [result, setResult] = useState(null);
      const [practice, setPractice] = useState(null); // null | 'typing' | 'ok' | 'wrong'
      const inputRef = React.useRef(null);

      // Same input element across words so the phone keyboard stays open
      useEffect(() => {
        setValue(''); setHints(0); setResult(null); setPractice(null); setImgFailed(false); setComposing(false);
        inputRef.current?.focus();
      }, [item.id, index]);

      const typedG = twGraphemes(twNorm(value, languageCode));
      const isRight = (txt) => twAccepted(item.translation, languageCode).some(a => twNorm(a, languageCode) === twNorm(txt, languageCode));

      const finish = (correct) => {
        if (result) return;
        const counted = correct && hints === 0;
        setResult({ correct: counted, solvedWithHints: correct && hints > 0, typed: value });
        onAnswered(counted, value);
        window.KGAudio.autoPlay(nativeText, languageCode);
      };
      const check = () => {
        if (practice === 'typing' || practice === 'wrong') { setPractice(isRight(value) ? 'ok' : 'wrong'); return; }
        if (result) { onNext(); return; }
        if (!value.trim()) return;
        finish(isRight(value));
      };
      const hint = () => {
        if (result) return;
        let k = 0;
        while (k < typedG.length && k < target.length && typedG[k] === target[k]) k++;
        if (k >= target.length) return;
        setValue(target.slice(0, k + 1).join(''));
        setHints(h => h + 1);
        inputRef.current?.focus();
      };
      const retype = () => { setPractice('typing'); setValue(''); inputRef.current?.focus(); };
      const onKeyDown = (e) => {
        if (e.key !== 'Enter' || composing || e.nativeEvent.isComposing) return;
        e.preventDefault();
        if (practice === 'ok') { onNext(); return; }
        check();
      };
      const keep = (e) => e.preventDefault(); // tapping a button must not close the keyboard

      const charClass = (i) => (i >= target.length || typedG[i] !== target[i]) ? 'text-red-600 bg-red-50' : 'text-green-700';
      const inputLocked = !!result && !practice;
      const zawgyiHint = languageCode === 'my' && level === 'copy' && trailingWrong >= 3;

      const prompt = () => {
        if (level === 'copy') return (
          <>
            <div className="text-sm text-gray-400 mb-3">Type this word:</div>
            <div className={`text-4xl font-bold text-gray-800 ${fontClass}`}>{nativeText}</div>
            {showDev && <div className="text-xl text-blue-600 font-devanagari mt-1">{devText}</div>}
            <div className="mt-3"><SpeakButton text={nativeText} lang={languageCode} slow size="lg" /></div>
          </>
        );
        if (level === 'dev') return (
          <>
            <div className="text-sm text-gray-400 mb-3">Type it in {languageName(languageCode)} script:</div>
            {devText ? <div className="text-4xl font-bold text-blue-600 font-devanagari">{devText}</div> : <div className="text-3xl font-bold text-gray-800">{item.display_text}</div>}
            {devText && <div className="text-sm text-gray-500 mt-1">{item.display_text}</div>}
            <div className="mt-3"><SpeakButton text={nativeText} lang={languageCode} slow size="lg" /></div>
          </>
        );
        return (
          <>
            <div className="text-sm text-gray-400 mb-3">Type the word for:</div>
            {promptKind === 'image' && !imgFailed ? (
              item.extra_data?.colorCode ? (
                <div className="w-24 h-24 rounded-xl shadow-lg mx-auto" style={{ backgroundColor: item.extra_data.colorCode }} />
              ) : (
                <div className="w-40 h-40 mx-auto flex items-center justify-center">
                  <img src={getImageUrl(item.topic_id, item.image_filename)} alt="" onError={() => setImgFailed(true)} className="max-w-full max-h-full object-contain" />
                </div>
              )
            ) : (
              <div className="text-3xl font-bold text-gray-800">{item.display_text}</div>
            )}
            {settings.sound && <div className="mt-3"><SpeakButton text={nativeText} lang={languageCode} slow size="lg" /></div>}
          </>
        );
      };

      return (
        <div className="max-w-3xl mx-auto p-4">
          <div className="bg-white rounded-2xl shadow-lg p-4 mb-4">
            <div className="flex flex-wrap items-center justify-between gap-4">
              <button onClick={onBack} className="px-4 py-2 bg-gray-100 rounded-xl hover:bg-gray-200 font-medium">← Back</button>
              <div className="flex items-center gap-4">
                <div className="text-sm text-gray-500">{index + 1} / {total}</div>
                <div className="w-32 h-2 bg-gray-200 rounded-full overflow-hidden">
                  <div className="h-full bg-jade-500 transition-all duration-300" style={{ width: `${((index + 1) / total) * 100}%` }} />
                </div>
                <div className="bg-gradient-to-r from-jade-500 to-jade-600 text-white px-4 py-2 rounded-xl font-bold shadow-md">{score.correct}/{score.total}</div>
              </div>
            </div>
          </div>

          {!result && <div className="bg-white rounded-2xl shadow-lg p-6 mb-4 text-center">{prompt()}</div>}

          <div className="bg-white rounded-2xl shadow-lg p-6 mb-4">
            <input ref={inputRef} autoFocus value={value} readOnly={inputLocked}
              onChange={e => setValue(e.target.value)} onKeyDown={onKeyDown}
              onCompositionStart={() => setComposing(true)} onCompositionEnd={e => { setComposing(false); setValue(e.target.value); }}
              lang={languageCode} type="text" inputMode="text" enterKeyHint={result && !practice ? 'next' : 'done'}
              autoComplete="off" autoCorrect="off" autoCapitalize="none" spellCheck={false}
              placeholder={inputLocked ? '' : `Type in ${languageName(languageCode)}…`}
              className={`w-full text-center text-4xl font-bold px-4 py-4 rounded-xl border-2 outline-none transition-all ${fontClass} ${
                result ? (result.correct ? 'border-green-500 bg-green-50' : 'border-red-400 bg-red-50') : 'border-gray-200 focus:border-jade-500'}`} />
            {live && !result && value && !composing && (
              <div className={`flex flex-wrap justify-center gap-0.5 mt-3 text-3xl ${fontClass}`}>
                {typedG.map((g, i) => <span key={i} className={`px-0.5 rounded ${charClass(i)}`}>{g}</span>)}
              </div>
            )}
            {hints > 0 && !result && <p className="text-center text-sm text-amber-700 mt-3">Hint used: this word will count as wrong.</p>}
            {zawgyiHint && !result && (
              <p className="text-center text-sm text-gray-500 mt-3">Keep getting it wrong while copying? Your keyboard may be Zawgyi. Switch to a Unicode Myanmar keyboard (e.g. Gboard → Burmese).</p>
            )}
          </div>

          {!result && (
            <div className="flex flex-wrap justify-center gap-3">
              {settings.hints && (
                <button onPointerDown={keep} onClick={hint} title="Using a hint marks this word wrong" className="px-5 py-3 bg-amber-50 text-amber-700 border-2 border-amber-200 rounded-xl font-medium hover:bg-amber-100">
                  💡 Hint{hints ? ` (${hints})` : ''}
                </button>
              )}
              <button onPointerDown={keep} onClick={() => finish(false)} className="px-5 py-3 bg-gray-100 rounded-xl font-medium hover:bg-gray-200">Show word</button>
              <button onPointerDown={keep} onClick={check} disabled={!value.trim()} className="px-8 py-3 bg-jade-600 text-white rounded-xl font-bold hover:bg-jade-700 disabled:opacity-40">
                Check <span className="text-jade-200 text-sm hidden sm:inline ml-1">↵</span>
              </button>
            </div>
          )}

          {result && (
            <div className="bg-white rounded-2xl shadow-lg p-6 text-center animate-slide-up">
              <div className={`text-2xl font-bold mb-3 ${result.correct ? 'text-green-600' : result.solvedWithHints ? 'text-amber-600' : 'text-red-600'}`}>
                {result.correct ? '✅ Correct!' : result.solvedWithHints ? '💡 Solved with hints' : '❌ Not quite'}
              </div>
              {result.solvedWithHints && <div className="text-sm text-gray-500 -mt-2 mb-3">Counted as wrong because a hint was used.</div>}
              {!result.correct && !result.solvedWithHints && result.typed.trim() && (
                <div className="mb-3">
                  <div className="text-xs text-gray-400 uppercase tracking-wide mb-1">You typed</div>
                  <div className={`flex flex-wrap justify-center gap-0.5 text-3xl ${fontClass}`}>
                    {twGraphemes(twNorm(result.typed, languageCode)).map((g, i) => <span key={i} className={`px-0.5 rounded ${(i >= target.length || g !== target[i]) ? 'text-red-600 bg-red-50' : 'text-green-700'}`}>{g}</span>)}
                  </div>
                  <div className="text-xs text-gray-400 uppercase tracking-wide mt-3 mb-1">Correct</div>
                </div>
              )}
              <div className={`text-4xl font-bold text-gray-800 ${fontClass}`}>{nativeText}</div>
              <div className="mt-3"><SpeakButton text={nativeText} lang={languageCode} slow size="lg" /></div>
              {showDev && <div className="text-xl text-blue-600 font-devanagari mt-1">{devText}</div>}
              <div className="text-sm text-gray-500 mt-1">{item.display_text}</div>
              {practice === 'ok' && <div className="text-green-600 font-medium mt-3">✓ Typed correctly. Practice only, the score stays.</div>}
              {practice === 'wrong' && <div className="text-red-600 font-medium mt-3">Not yet. Try again or go on.</div>}
              <div className="flex flex-wrap justify-center gap-3 mt-5">
                {!result.correct && level !== 'copy' && practice !== 'ok' && (
                  practice ? (
                    <button onPointerDown={keep} onClick={check} disabled={!value.trim()} className="px-6 py-3 bg-jade-600 text-white rounded-full font-bold hover:bg-jade-700 disabled:opacity-40">Check retype</button>
                  ) : (
                    <button onPointerDown={keep} onClick={retype} className="px-6 py-3 bg-gray-100 rounded-full font-medium hover:bg-gray-200">✏️ Retype</button>
                  )
                )}
                <button onPointerDown={keep} onClick={onNext} className="px-8 py-3 bg-blue-600 text-white rounded-full font-bold hover:bg-blue-700">
                  {index + 1 >= total ? 'See Results' : 'Next Word →'} <span className="text-blue-300 text-sm hidden sm:inline ml-1">↵</span>
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function WordQuizView({ topics, vocabulary, poolVocabulary, ratings, onRate, languageCode, user, onSessionSaved, modeToggle, meaningName }) {
      const rules = React.useContext(RulesContext);
      const [flagItem, setFlagItem] = useState(null);
      const flagModal = flagItem && <FlagModal item={flagItem} languageCode={languageCode} onClose={() => setFlagItem(null)} />;
      // The blue line with a 🚩 next to it, so a wrong Devanagari line can be flagged before answering too
      const hintLine = (item, cls) => item?.translation?.devanagari ? (
        <div className="flex items-center justify-center gap-1">
          <div className={`text-blue-600 font-devanagari ${cls}`}>{item.translation.devanagari}</div>
          <FlagButton compact onClick={() => setFlagItem(item)} />
        </div>
      ) : null;
      const pool = poolVocabulary || vocabulary;
      useAudioState();
      const savingRef = React.useRef(false);
      const [quizTopic, setQuizTopic] = useState('all'); // 'all' = unlocked topics, 'everything' = locked ones too, or a topic id
      const [quizBucket, setQuizBucket] = useState('all'); // 'all' | 0 (not sorted yet) | 1..5 (a Cards bucket)
      const [quizType, setQuizType] = useState('native_to_image');
      const isListen = LISTEN_TYPES.includes(quizType);
      const [dailyTarget, setDailyTarget] = useState(() => loadFromStorage(STORAGE_KEYS.quizTarget, 10));
      const [currentQuestion, setCurrentQuestion] = useState(null);
      const [options, setOptions] = useState([]);
      const [selectedAnswer, setSelectedAnswer] = useState(null);
      const [showResult, setShowResult] = useState(false);
      const [score, setScore] = useState({ correct: 0, total: 0 });
      const [quizStarted, setQuizStarted] = useState(false);
      const [quizWords, setQuizWords] = useState([]);
      const [currentWordIndex, setCurrentWordIndex] = useState(0);
      const [quizCompleted, setQuizCompleted] = useState(false);
      const [quizAnswers, setQuizAnswers] = useState([]);
      const [recentSessions, setRecentSessions] = useState([]);
      const [sessionSaved, setSessionSaved] = useState(false);

      const lv = useLevels(user, languageCode);
      const isMcq = MCQ_QUIZ_TYPES.includes(quizType);
      const [quizLevelN, setQuizLevelN] = useState(1);
      // Frozen when the quiz starts, so a level that loads late (or is changed in admin) can't alter a quiz in progress
      const L = levelOf(quizStarted ? quizLevelN : (isMcq ? lv.level : 1));
      const [timeLeft, setTimeLeft] = useState(null);
      const [levelUp, setLevelUp] = useState(null);
      const showHint = L.hint || showResult;

      const [wb, setWb] = useState(() => ({ ...WB_DEFAULTS, ...loadFromStorage(WB_STORAGE_KEY, {}) }));
      const setWbKey = (k, v) => setWb(s => ({ ...s, [k]: v }));
      const [tw, setTw] = useState(() => ({ ...TW_DEFAULTS, ...loadFromStorage(TW_STORAGE_KEY, {}) }));
      const setTwKey = (k, v) => setTw(s => ({ ...s, [k]: v }));
      const twLevel = twLevelFor(tw.level, languageCode);
      const isTyped = quizType === 'word_builder' || quizType === 'type_word';

      const fontClass = LANGUAGE_FONTS[languageCode] || 'font-body';
      // Topic: the unlocked ones (default), every topic, or one topic (locked ones too). Then the Cards bucket, if one is picked.
      const topicVocab = useMemo(() => (quizTopic === 'all' ? vocabulary : quizTopic === 'everything' ? pool : pool.filter(v => v.topic_id === quizTopic)), [vocabulary, pool, quizTopic]);
      const bucketOf = (v) => ratings[v.id]?.rating || 0;
      const filteredVocab = useMemo(() => (quizBucket === 'all' ? topicVocab : topicVocab.filter(v => bucketOf(v) === quizBucket)), [topicVocab, quizBucket, ratings]);
      const playableVocab = useMemo(() => isTyped ? filteredVocab.filter(v => v.translation?.native_text?.trim()) : filteredVocab, [filteredVocab, quizType]);
      const [quizOptions, setQuizOptions] = useState([]);

      const wbUnitPool = useMemo(() => {
        if (quizType !== 'word_builder') return [];
        const set = new Set();
        pool.forEach(v => splitWord(v.translation?.native_text || '', wb.split, languageCode).forEach(u => set.add(u)));
        return [...set];
      }, [quizType, pool, wb.split, languageCode]);

      useEffect(() => { saveToStorage(STORAGE_KEYS.quizTarget, dailyTarget); }, [dailyTarget]);
      useEffect(() => { saveToStorage(WB_STORAGE_KEY, wb); }, [wb]);
      useEffect(() => { saveToStorage(TW_STORAGE_KEY, tw); }, [tw]);

      // Load recent quiz sessions
      useEffect(() => {
        if (!user) return;
        supabase
          .from(TABLES.quizSessions)
          .select('*')
          .eq('user_id', user.id)
          .eq('language_code', languageCode)
          .in('quiz_type', QUIZ_TYPES.map(q => q.id))
          .order('created_at', { ascending: false })
          .limit(5)
          .then(({ data }) => { if (data) setRecentSessions(data); });
      }, [user, languageCode, sessionSaved]);
