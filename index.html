          if (showResult) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); nextQuestion(); }
          } else {
            const num = parseInt(e.key);
            if (num >= 1 && num <= options.length && options[num - 1]) handleAnswer(options[num - 1]);
          }
          if ((e.key === 'r' || e.key === 'R') && isListen && currentQuestion) playListen(currentQuestion.translation?.native_text, languageCode);
        };
        window.addEventListener('keydown', handleKey);
        return () => window.removeEventListener('keydown', handleKey);
      }, [quizStarted, quizCompleted, showResult, options, currentQuestion]);

      if (!quizStarted) {
        return (
          <div className="max-w-2xl mx-auto p-6">
            <div className="bg-white rounded-3xl shadow-xl p-8">
              <div className="text-center mb-8">
                <div className="w-20 h-20 bg-jade-100 rounded-full flex items-center justify-center mx-auto mb-4">
                  <span className="text-4xl">🎯</span>
                </div>
                <h2 className="text-3xl font-bold text-gray-800">Quiz Mode</h2>
              </div>
              {modeToggle}

              <div className="space-y-6">
                <div>
                  <label className="block text-sm font-semibold text-gray-700 mb-2">Topic</label>
                  <select value={quizTopic} onChange={(e) => setQuizTopic(e.target.value)} className="w-full px-4 py-3 border rounded-xl">
                    <option value="all">{topics.some(t => t.locked) ? 'All unlocked topics' : 'All Topics'} ({vocabulary.length} words)</option>
                    {topics.map(t => {
                      const count = vocabulary.filter(v => v.topic_id === t.id).length;
                      return <option key={t.id} value={t.id} disabled={t.locked}>{t.locked ? '🔒' : t.icon} {t.translation?.title_native} {t.locked ? '(locked)' : `(${count})`}</option>;
                    })}
                  </select>
                </div>

                <div>
                  <label className="block text-sm font-semibold text-gray-700 mb-2">
                    Daily Target <span className="text-gray-400 font-normal ml-2">({dailyTarget === 0 ? 'All' : dailyTarget} words)</span>
                  </label>
                  <div className="grid grid-cols-4 gap-2">
                    {DAILY_TARGET_OPTIONS.map(target => (
                      <button key={target} onClick={() => setDailyTarget(target)}
                        className={`py-3 rounded-xl border-2 font-medium transition-all ${
                          dailyTarget === target ? 'border-jade-500 bg-jade-50 text-jade-700' : 'border-gray-200 hover:border-gray-300'
                        }`}>{target === 0 ? 'All' : target}</button>
                    ))}
                  </div>
                </div>

                <div>
                  <label className="block text-sm font-semibold text-gray-700 mb-2">Quiz Type</label>
                  <div className="grid grid-cols-2 gap-3">
                    {QUIZ_TYPES.map(t0 => quizTypeLabel(t0, languageCode, meaningName)).map(type => (
                      <button key={type.id} onClick={() => setQuizType(type.id)}
                        className={`p-4 rounded-xl border-2 transition-all ${quizType === type.id ? 'border-jade-500 bg-jade-50' : 'border-gray-200'}`}>
                        <div className="text-2xl mb-1">{type.icon}</div>
                        <div className="text-sm font-medium">{type.label}</div>
                      </button>
                    ))}
                  </div>
                </div>

                {isMcq && (
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-2">
                      Level <span className="text-gray-400 font-normal ml-2">({languageName(languageCode)})</span>
                    </label>
                    <div className="grid grid-cols-4 gap-2">
                      {LEVELS.map(l => {
                        const locked = l.n > lv.unlocked;
                        return (
                          <button key={l.n} onClick={() => !locked && lv.setLevel(l.n)} disabled={locked} title={locked ? 'Locked' : levelSummary(l)}
                            className={`py-2 rounded-xl border-2 text-sm font-medium transition-all ${lv.level === l.n ? 'border-jade-500 bg-jade-50 text-jade-700' : locked ? 'border-gray-100 text-gray-300' : 'border-gray-200 hover:border-gray-300'}`}>
                            <div className="text-lg">{locked ? '🔒' : l.icon}</div>{l.name}
                          </button>
                        );
                      })}
                    </div>
                    <p className="text-xs text-gray-500 mt-2">{levelSummary(L)}</p>
                    {lv.unlocked < LEVELS.length && user && (
                      <p className="text-xs text-gray-400 mt-1">
                        {levelOf(lv.unlocked + 1).icon} {levelOf(lv.unlocked + 1).name} unlocks at {lv.levelUp.pct}% over your last {lv.levelUp.answers} answers on {levelOf(lv.unlocked).name}:
                        {' '}<b className="text-gray-600">{lv.progress.total < lv.levelUp.answers ? `${lv.progress.total}/${lv.levelUp.answers} answers so far` : `${lv.progress.pct}% now`}</b>
                      </p>
                    )}
                  </div>
                )}

                {isListen && (() => {
                  const sample = playableVocab.find(v => v.translation?.native_text);
                  const avail = sample ? window.KGAudio.has(sample.translation.native_text, languageCode) : false;
                  return avail === false ? (
                    <div className="bg-yellow-50 text-yellow-800 rounded-2xl p-4 text-sm">
                      No recordings for {languageName(languageCode)} yet, so you'll {quizType === 'listen_to_image' ? 'read the word' : 'see the English word or picture'} instead of hearing it. Answers still count.
                    </div>
                  ) : (
                    <div className="bg-blue-50 text-blue-800 rounded-2xl p-4 text-sm">
                      🔊 You hear the word, then pick {quizType === 'listen_to_image' ? 'its picture' : 'how it is written'}. Turn your sound on. Plays even when auto-play is muted.
                    </div>
                  );
                })()}

                {quizType === 'word_builder' && (
                  <div className="bg-gray-50 rounded-2xl p-4 space-y-4">
                    <WbOption label="Prompt" value={wb.prompt} onChange={v => setWbKey('prompt', v)}
                      options={[['image', 'Image'], ['english', 'English word'], ['mix', 'Mix']]} />
                    <WbOption label="Split into" value={wb.split} onChange={v => setWbKey('split', v)}
                      options={[['chars', 'Characters'], ['syllables', 'Syllables']]} />
                    <WbOption label="Tiles" value={wb.tiles} onChange={v => setWbKey('tiles', v)}
                      options={[['exact', 'Correct pieces only'], ['distractors', 'Correct + extra tiles']]} />
                    {wb.tiles === 'distractors' && (
                      <WbOption label="Extra tiles" value={wb.distractors} onChange={v => setWbKey('distractors', v)}
                        options={[2, 3, 4, 5, 6].map(n => [n, String(n)])} />
                    )}
                    <WbOption label="Feedback" value={wb.feedback} onChange={v => setWbKey('feedback', v)}
                      options={[['end', 'Check at the end'], ['tile', 'Mark each tile']]} />
                    <WbOption label="Hint button" value={wb.hints} onChange={v => setWbKey('hints', v)}
                      options={[[true, 'On'], [false, 'Off']]} />
                  </div>
                )}

                {quizType === 'type_word' && (
                  <div className="bg-gray-50 rounded-2xl p-4 space-y-4">
                    <WbOption label="Level" value={twLevel} onChange={v => setTwKey('level', v)}
                      options={TW_LEVELS.filter(([v]) => !(v === 'dev' && NO_DEVANAGARI_LANGS.includes(languageCode)))} />
                    <div className="text-xs text-gray-500 -mt-2">
                      {twLevel === 'copy' ? 'See the word and copy it. Learns the keyboard.' : twLevel === 'dev' ? 'See only the Devanagari, type it in the native script.' : 'See a picture or English word. Type it from memory.'}
                    </div>
                    {twLevel === 'memory' && (
                      <>
                        <WbOption label="Prompt" value={tw.prompt} onChange={v => setTwKey('prompt', v)}
                          options={[['image', 'Image'], ['english', 'English word'], ['mix', 'Mix']]} />
                        <WbOption label="Sound button (plays the answer)" value={tw.sound} onChange={v => setTwKey('sound', v)}
                          options={[[true, 'On'], [false, 'Off']]} />
                      </>
                    )}
                    <WbOption label="Feedback" value={tw.feedback} onChange={v => setTwKey('feedback', v)}
                      options={[['end', 'Check at the end'], ['live', 'Mark as you type']]} />
                    <WbOption label="Hint button" value={tw.hints} onChange={v => setTwKey('hints', v)}
                      options={[[true, 'On'], [false, 'Off']]} />
                    <div className="text-xs text-gray-500">⌨️ Add the {languageName(languageCode)} keyboard in your phone settings first. {rules.quizTypes.includes('type_word') ? 'Counts toward unlocking topics.' : "Typing doesn't count toward unlocking topics."}</div>
                  </div>
                )}

                <button onClick={startQuiz} disabled={playableVocab.length < 1 || pool.length < 4 || (isMcq && !lv.loaded)}
                  className="w-full py-4 bg-jade-600 text-white rounded-xl font-bold text-lg hover:bg-jade-700 disabled:opacity-50">
                  {isMcq && !lv.loaded ? 'Loading your level…' : pool.length < 4 ? 'Need 4+ words total' : playableVocab.length < 1 ? 'No words in topic' : `Start Quiz (${dailyTarget === 0 ? playableVocab.length : Math.min(dailyTarget, playableVocab.length)} words)`}
                </button>
              </div>
            </div>

            {recentSessions.length > 0 && (
              <div className="bg-white rounded-2xl shadow-lg p-6 mt-6">
                <h3 className="text-lg font-bold text-gray-800 mb-4">Recent Quizzes</h3>
                <div className="space-y-3">
                  {recentSessions.map(s => {
                    const pct = s.total_questions > 0 ? Math.round((s.correct_answers / s.total_questions) * 100) : 0;
                    const topicObj = topics.find(t => t.id === s.topic_id);
                    const topicLabel = s.topic_id ? (topicObj ? `${topicObj.icon} ${topicObj.translation?.title_native}` : s.topic_id) : 'All Topics';
                    const date = new Date(s.completed_at || s.created_at);
                    const dateStr = date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
                    const timeStr = date.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
                    return (
                      <div key={s.id} className="flex items-center justify-between p-3 bg-gray-50 rounded-xl">
                        <div className="flex items-center gap-3">
                          <div className={`w-10 h-10 rounded-full flex items-center justify-center text-white text-sm font-bold ${
                            pct >= 80 ? 'bg-green-500' : pct >= 60 ? 'bg-yellow-500' : 'bg-red-500'
                          }`}>{pct}%</div>
                          <div>
                            <div className="text-sm font-medium text-gray-800">{topicLabel}</div>
                            <div className="text-xs text-gray-400">{dateStr} {timeStr}{s.difficulty > 1 ? ` · ${levelOf(s.difficulty).icon} ${levelOf(s.difficulty).name}` : ''}</div>
                          </div>
                        </div>
                        <div className="text-sm text-gray-600 font-medium">{s.correct_answers}/{s.total_questions}</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </div>
        );
      }

      if (quizCompleted) {
        const percentage = score.total > 0 ? Math.round(score.correct / score.total * 100) : 0;
        let message = '', emoji = '';
        if (percentage >= 90) { message = 'Excellent!'; emoji = '🏆'; }
        else if (percentage >= 70) { message = 'Great job!'; emoji = '🌟'; }
        else if (percentage >= 50) { message = 'Good effort!'; emoji = '👍'; }
        else { message = 'Keep practicing!'; emoji = '💪'; }

        return (
          <div className="max-w-2xl mx-auto p-6">
            <div className="bg-white rounded-3xl shadow-xl p-8 text-center">
              <div className="text-6xl mb-4">{emoji}</div>
              <h2 className="text-3xl font-bold text-gray-800 mb-2">{message}</h2>
              <p className="text-gray-500 mb-6">Quiz Completed!</p>
              <div className="bg-gradient-to-r from-jade-500 to-jade-600 text-white rounded-2xl p-6 mb-6">
                <div className="text-5xl font-bold mb-2">{score.correct}/{score.total}</div>
                <div className="text-xl opacity-90">{percentage}% Correct</div>
              </div>
              {user && (
                <p className={`text-sm mb-4 ${sessionSaved ? 'text-green-600' : 'text-gray-400'}`}>
                  {sessionSaved ? '✓ Results saved' : 'Saving...'}
                </p>
              )}
              {levelUp && (
                <div className="bg-amber-50 border-2 border-amber-300 rounded-2xl p-4 mb-5">
                  <div className="text-lg font-bold text-amber-800">🎉 {levelOf(levelUp).icon} {levelOf(levelUp).name} unlocked!</div>
                  <div className="text-sm text-amber-700 mb-3">{levelSummary(levelOf(levelUp))}</div>
                  <button onClick={() => { lv.setLevel(levelUp); setLevelUp(null); setQuizStarted(false); setQuizCompleted(false); }}
                    className="px-4 py-2 bg-amber-500 text-white rounded-xl font-bold hover:bg-amber-600">Switch to {levelOf(levelUp).name}</button>
                </div>
              )}
              {isMcq && !levelUp && user && sessionSaved && lv.unlocked < LEVELS.length && (
                <p className="text-xs text-gray-400 mb-4">Toward {levelOf(lv.unlocked + 1).name}: {lv.progress.total < lv.levelUp.answers ? `${lv.progress.total}/${lv.levelUp.answers} answers` : `${lv.progress.pct}% (need ${lv.levelUp.pct}%)`}</p>
              )}
              <div className="flex gap-4 justify-center">
                <button onClick={() => { setQuizStarted(false); setQuizCompleted(false); }}
                  className="px-6 py-3 bg-gray-100 rounded-xl font-medium hover:bg-gray-200">← Back to Setup</button>
                <button onClick={startQuiz}
                  className="px-6 py-3 bg-jade-600 text-white rounded-xl font-bold hover:bg-jade-700">Try Again</button>
              </div>
            </div>
          </div>
        );
      }

      if (quizType === 'word_builder') {
        const wbItem = quizWords[currentWordIndex];
        if (!wbItem) return <LoadingSpinner />;
        return (
          <>
            <WordBuilderRound key={`${wbItem.id}-${currentWordIndex}`} item={wbItem} index={currentWordIndex} total={quizWords.length}
              score={score} settings={wb} languageCode={languageCode} unitPool={wbUnitPool}
              onBack={leaveQuiz} onAnswered={handleWbAnswer} onNext={nextQuestion} />
            {quizAnswers.length > currentWordIndex && <div className="flex justify-center -mt-4 mb-6"><FlagButton onClick={() => setFlagItem(wbItem)} /></div>}
            {flagModal}
          </>
        );
      }

      if (quizType === 'type_word') {
        const twItem = quizWords[currentWordIndex];
        if (!twItem) return <LoadingSpinner />;
        let trailingWrong = 0;
        for (let i = quizAnswers.length - 1; i >= 0 && !quizAnswers[i].is_correct; i--) trailingWrong++;
        // No key: the same input stays mounted so the phone keyboard doesn't close between words
        return (
          <>
            <TypeWordRound item={twItem} index={currentWordIndex} total={quizWords.length}
              score={score} settings={tw} languageCode={languageCode} trailingWrong={trailingWrong}
              onBack={leaveQuiz} onAnswered={handleWbAnswer} onNext={nextQuestion} />
            {quizAnswers.length > currentWordIndex && <div className="flex justify-center -mt-4 mb-6"><FlagButton onClick={() => setFlagItem(twItem)} /></div>}
            {flagModal}
          </>
        );
      }

      if (!currentQuestion) return <LoadingSpinner />;

      return (
        <div className="max-w-4xl mx-auto p-4">
          <div className="bg-white rounded-2xl shadow-lg p-4 mb-6">
            <div className="flex flex-wrap items-center justify-between gap-4">
              <button onClick={leaveQuiz} className="px-4 py-2 bg-gray-100 rounded-xl hover:bg-gray-200 font-medium">← Back</button>
              <div className="flex items-center gap-4">
                <div className="text-sm text-gray-500">{currentWordIndex + 1} / {quizWords.length}</div>
                <div className="w-32 h-2 bg-gray-200 rounded-full overflow-hidden">
                  <div className="h-full bg-jade-500 transition-all duration-300" style={{ width: `${((currentWordIndex + 1) / quizWords.length) * 100}%` }} />
                </div>
                <div className="bg-gradient-to-r from-jade-500 to-jade-600 text-white px-4 py-2 rounded-xl font-bold shadow-md">
                  {score.correct}/{score.total}
                </div>
              </div>
            </div>
          </div>

          <div className="bg-white rounded-2xl shadow-lg p-8 mb-6 text-center relative overflow-hidden">
            {isMcq && L.n > 1 && <div className="absolute top-2 right-3 text-xs text-gray-400">{L.icon} {L.name}</div>}
            {timed && timeLeft != null && !showResult && (
              <div className="absolute top-0 left-0 right-0 h-1.5 bg-gray-100">
                <div className={`h-full transition-all duration-100 ${timeLeft < 3 ? 'bg-red-500' : 'bg-jade-500'}`} style={{ width: `${(timeLeft / L.seconds) * 100}%` }} />
              </div>
            )}
            <div className="text-sm text-gray-400 mb-4">Find the matching answer:{timed && timeLeft != null && !showResult ? <span className={`ml-2 font-bold tabular-nums ${timeLeft < 3 ? 'text-red-500' : 'text-gray-500'}`}>{Math.ceil(timeLeft)}s</span> : null}</div>
            {quizType === 'native_to_image' && (
              <>
                <div className={`text-4xl font-bold text-gray-800 mb-2 ${fontClass}`}>{currentQuestion.translation?.native_text}</div>
                {showHint && <div className="text-xl text-blue-600 font-devanagari">{currentQuestion.translation?.devanagari}</div>}
                <div className="mt-4"><SpeakButton text={currentQuestion.translation?.native_text} lang={languageCode} slow size="lg" /></div>
              </>
            )}
            {quizType === 'image_to_native' && (
              <div className="w-32 h-32 mx-auto flex items-center justify-center">
                {currentQuestion.extra_data?.colorCode ? (
                  <div className="w-24 h-24 rounded-xl shadow-lg" style={{ backgroundColor: currentQuestion.extra_data.colorCode }} />
                ) : (
                  <img src={getImageUrl(currentQuestion.topic_id, currentQuestion.image_filename)} alt="" className="max-w-full max-h-full object-contain" />
                )}
              </div>
            )}
            {quizType === 'devanagari_to_image' && (
              <div className="text-4xl text-blue-600 font-devanagari">{currentQuestion.translation?.devanagari}</div>
            )}
            {isListen && (() => {
              const text = currentQuestion.translation?.native_text;
              const avail = window.KGAudio.has(text, languageCode);
              if (avail === false) {
                // No clip yet: show something else to answer from; the answer still counts
                return quizType === 'listen_to_image' ? (
                  <>
                    <div className="text-xs text-gray-400 mb-2">No recording for this word yet</div>
                    <div className={`text-4xl font-bold text-gray-800 mb-2 ${fontClass}`}>{text}</div>
                    {showHint && <div className="text-xl text-blue-600 font-devanagari">{currentQuestion.translation?.devanagari}</div>}
                  </>
                ) : (
                  <>
                    <div className="text-xs text-gray-400 mb-2">No recording for this word yet</div>
                    {currentQuestion.image_filename || currentQuestion.extra_data?.colorCode ? (
                      <div className="w-28 h-28 mx-auto flex items-center justify-center mb-2">
                        {currentQuestion.extra_data?.colorCode
                          ? <div className="w-24 h-24 rounded-xl shadow-lg" style={{ backgroundColor: currentQuestion.extra_data.colorCode }} />
                          : <img src={getImageUrl(currentQuestion.topic_id, currentQuestion.image_filename)} alt="" className="max-w-full max-h-full object-contain" />}
                      </div>
                    ) : null}
                    <div className="text-2xl font-bold text-gray-800">{currentQuestion.display_text}</div>
                  </>
                );
              }
              const st = window.KGAudio.stateOf(text, languageCode, false);
              return (
                <>
                  <div className="flex items-center justify-center gap-4">
                    <button onClick={() => playListen(text, languageCode)} title="Play (R)" disabled={avail === 'loading'}
                      className={`w-20 h-20 rounded-full text-white text-3xl shadow-lg active:scale-95 transition-all ${st === 'playing' ? 'bg-jade-700 scale-105' : 'bg-jade-600 hover:bg-jade-700'} ${avail === 'loading' ? 'opacity-50 animate-pulse' : ''}`}>🔊</button>
                    <button onClick={() => playListen(text, languageCode, true)} title="Play slowly" disabled={avail === 'loading'}
                      className="w-14 h-14 rounded-full bg-gray-100 text-2xl hover:bg-gray-200 active:scale-95 transition-transform">🐢</button>
                  </div>
                  <div className="text-xs text-gray-400 mt-3">Tap 🔊 to hear it again<span className="hidden sm:inline"> (R)</span></div>
                  {showResult && quizType === 'listen_to_image' && (
                    <div className="mt-4">
                      <div className={`text-3xl font-bold text-gray-800 ${fontClass}`}>{text}</div>
                      <div className="text-lg text-blue-600 font-devanagari">{currentQuestion.translation?.devanagari}</div>
                    </div>
                  )}
                </>
              );
            })()}
            {quizType === 'english_to_native' && (
              <div className="text-3xl font-bold text-gray-800">{currentQuestion.display_text}</div>
            )}
          </div>

          <div className={`grid grid-cols-2 ${options.length > 4 ? 'md:grid-cols-3' : 'md:grid-cols-4'} gap-4 mb-6`}>
            {options.map((opt, idx) => {
              let borderClass = 'border-gray-200 hover:border-jade-300 hover:shadow-lg';
              if (showResult) {
                if (opt.id === currentQuestion.id) borderClass = 'border-green-500 border-4 bg-green-50';
                else if (selectedAnswer?.id === opt.id) borderClass = 'border-red-500 border-4 bg-red-50';
              }
              return (
                <button key={opt.id} onClick={() => { if (!showResult) handleAnswer(opt); }} aria-disabled={showResult}
                  className={`p-4 rounded-xl border-2 transition-all relative ${borderClass}`}>
                  <span className="absolute top-1.5 left-2 text-xs text-gray-300 font-mono hidden sm:inline">{idx + 1}</span>
                  {(quizType === 'native_to_image' || quizType === 'devanagari_to_image' || quizType === 'listen_to_image') ? (
                    <>
                      <div className="w-20 h-20 mx-auto flex items-center justify-center mb-2">
                        {opt.extra_data?.colorCode ? (
                          <div className="w-14 h-14 rounded-lg shadow" style={{ backgroundColor: opt.extra_data.colorCode }} />
                        ) : (
                          <img src={getImageUrl(opt.topic_id, opt.image_filename)} alt="" className="max-w-full max-h-full object-contain" />
                        )}
                      </div>
                      <div className="text-xs text-gray-500">{opt.display_text}</div>
                    </>
                  ) : (
                    <>
                      <div className={`text-lg font-semibold text-gray-800 ${fontClass}`}>{opt.translation?.native_text}</div>
                      {showHint && <div className="text-sm text-blue-600 font-devanagari mt-1">{opt.translation?.devanagari}</div>}
                      {(quizType !== 'listen_to_native' || showResult) && <div className="mt-2 flex justify-center"><SpeakButton text={opt.translation?.native_text} lang={languageCode} size="sm" /></div>}
                    </>
                  )}
                </button>
              );
            })}
          </div>

          {showResult && (
            <div className="text-center animate-slide-up">
              <div className={`text-2xl font-bold mb-4 ${selectedAnswer?.id === currentQuestion.id ? 'text-green-600' : 'text-red-600'}`}>
                {selectedAnswer?.id === currentQuestion.id ? '✅ Correct!' : selectedAnswer?.timeout ? `⏰ Time's up! It was "${currentQuestion.display_text}"` : `❌ Wrong! It was "${currentQuestion.display_text}"`}
              </div>
              <div className="flex items-center justify-center gap-3 mb-1">
                <span className={`text-2xl font-semibold text-gray-800 ${fontClass}`}>{currentQuestion.translation?.native_text}</span>
                <SpeakButton text={currentQuestion.translation?.native_text} lang={languageCode} slow />
              </div>
              <div className="flex items-center justify-center gap-2 mb-4 min-h-[2rem]">
                {currentQuestion.translation?.devanagari && <span className="text-lg text-blue-600 font-devanagari">{currentQuestion.translation.devanagari}</span>}
                <FlagButton compact onClick={() => setFlagItem(currentQuestion)} />
              </div>
              <button onClick={nextQuestion} className="px-8 py-3 bg-blue-600 text-white rounded-full font-bold hover:bg-blue-700">
                {currentWordIndex + 1 >= quizWords.length ? 'See Results' : 'Next Question →'} <span className="text-blue-300 text-sm hidden sm:inline ml-1">↵</span>
              </button>
            </div>
          )}
          {flagModal}
        </div>
      );
    }

    // ==========================================
    // SENTENCE QUIZ (kg_chart_sentences)
    // ==========================================
    // Sentence answers are saved with vocabulary_id = null, so they never count toward word strength or unlocking.
    const SENTENCE_QUIZ_TYPES = [
      { id: 'sentence_to_meaning', label: 'Sentence → Meaning', icon: '💬' },
      { id: 'meaning_to_sentence', label: 'Meaning → Sentence', icon: '🌐' },
      { id: 'build_sentence', label: 'Build the Sentence', icon: '🧩' },
    ];
    const QUIZ_MODE_KEY = 'kg_chart_quiz_mode';
    const SENTENCE_SETTINGS_KEY = 'kg_chart_sentence_quiz';
    // Scripts that don't put spaces between words: cut each chunk into words with Intl.Segmenter
    const NO_SPACE_LANGS = ['th', 'my', 'zh', 'ja', 'lo', 'km'];

    function splitSentence(text, langCode) {
      const t = (text || '').normalize('NFC').trim();
      if (!t) return [];
      let parts = t.split(/\s+/);
      if (NO_SPACE_LANGS.includes(langCode) && typeof Intl !== 'undefined' && Intl.Segmenter) {
        const seg = new Intl.Segmenter(langCode, { granularity: 'word' });
        parts = parts.flatMap(chunk => Array.from(seg.segment(chunk), x => x.segment).filter(x => x.trim()));
      }
      // Punctuation never gets a tile of its own: it sticks to the word before it
      const out = [];
      for (const p of parts) {
        if (out.length && /^[\p{P}\p{S}]+$/u.test(p)) out[out.length - 1] += p;
        else out.push(p);
      }
      return out;
    }

    const joinSentence = (pieces, langCode) => pieces.join(NO_SPACE_LANGS.includes(langCode) ? '' : ' ');

    function sentenceDevanagari(text, langCode) {
      const conv = getConverter(langCode);
      if (!conv || conv.usePronunciation || !text) return '';
      try { const d = conv.toDevanagari(text); return d && d !== text ? d : ''; } catch (e) { return ''; }
    }

    function QuizModeToggle({ mode, onChange }) {
      return (
        <div className="flex bg-gray-100 rounded-2xl p-1 mb-6">
          {[['words', '🔤', 'Words'], ['sentences', '💬', 'Sentences'], ['typing', '⌨️', 'Typing'], ['speak', '🗣️', 'Speak'], ['colours', '🎨', 'Colours']].map(([id, icon, label]) => (
            <button key={id} onClick={() => onChange(id)}
              className={`flex-1 py-2 px-1 rounded-xl font-medium transition-all ${mode === id ? 'bg-white shadow text-jade-700' : 'text-gray-500 hover:text-gray-700'}`}>
              <span className="block sm:inline">{icon}</span> <span className="text-xs sm:text-base">{label}</span>
            </button>
          ))}
        </div>
      );
    }

    function QuizView(props) {
      const [mode, setMode] = useState(() => { const m = loadFromStorage(QUIZ_MODE_KEY, 'words'); return ['sentences', 'typing', 'speak', 'colours'].includes(m) ? m : 'words'; });
      useEffect(() => { saveToStorage(QUIZ_MODE_KEY, mode); }, [mode]);
      const toggle = <QuizModeToggle mode={mode} onChange={setMode} />;
      if (mode === 'colours') return <ColourQuizView languageCode={props.languageCode} user={props.user} modeToggle={toggle} />;
      if (mode === 'speak') return <SpeakView languageCode={props.languageCode} user={props.user} modeToggle={toggle} />;
      if (mode === 'typing') return <TypingView vocabulary={props.vocabulary} languageCode={props.languageCode} user={props.user} meaningName={props.meaningName} modeToggle={toggle} />;
      return mode === 'sentences'
        ? <SentenceQuizView languageCode={props.languageCode} user={props.user} modeToggle={toggle} />
        : <WordQuizView {...props} modeToggle={toggle} />;
    }

    function SentenceQuizView({ languageCode, user, modeToggle }) {
      const [flagSentence, setFlagSentence] = useState(null);
      const fontClass = LANGUAGE_FONTS[languageCode] || 'font-body';
      useAudioState();
      const savingRef = React.useRef(false);
      const saved0 = loadFromStorage(SENTENCE_SETTINGS_KEY, {});
      const [sentences, setSentences] = useState(null); // null = loading
      const [loadError, setLoadError] = useState(null);
      const [group, setGroup] = useState('all');
      const [count, setCount] = useState(() => (DAILY_TARGET_OPTIONS.includes(saved0.count) ? saved0.count : 10));
      const [sType, setSType] = useState(() => (SENTENCE_QUIZ_TYPES.some(t => t.id === saved0.type) ? saved0.type : 'sentence_to_meaning'));
      const [started, setStarted] = useState(false);
      const [completed, setCompleted] = useState(false);
      const [items, setItems] = useState([]);
      const [idx, setIdx] = useState(0);
      const [selected, setSelected] = useState(null);
      const [showResult, setShowResult] = useState(false);
      const [placed, setPlaced] = useState([]); // tile ids, build mode
      const [gaveUp, setGaveUp] = useState(false);
      const [score, setScore] = useState({ correct: 0, total: 0 });
      const [answers, setAnswers] = useState([]);
      const [sessionSaved, setSessionSaved] = useState(false);
      const [recent, setRecent] = useState([]);

      useEffect(() => { saveToStorage(SENTENCE_SETTINGS_KEY, { count, type: sType }); }, [count, sType]);

      useEffect(() => {
        let cancelled = false;
        setSentences(null); setLoadError(null); setGroup('all');
        supabase.from(TABLES.sentences).select('*').eq('language_code', languageCode)
          .order('sort_order').order('created_at')
          .then(({ data, error }) => {
            if (cancelled) return;
            if (error) { setLoadError(error); setSentences([]); return; }
            setSentences((data || []).filter(x => x.native_text?.trim() && x.english_text?.trim()));
          });
        return () => { cancelled = true; };
      }, [languageCode]);

      useEffect(() => {
        if (!user) return;
        supabase.from(TABLES.quizSessions).select('*')
          .eq('user_id', user.id).eq('language_code', languageCode)
          .in('quiz_type', SENTENCE_QUIZ_TYPES.map(t => t.id))
          .order('created_at', { ascending: false }).limit(5)
          .then(({ data }) => { if (data) setRecent(data); });
      }, [user, languageCode, sessionSaved]);

      const priv = React.useContext(PrivateLessonsContext);
      const all = useMemo(() => (sentences || []).filter(x => !priv.groups.has(x.group_name)), [sentences, priv]);
      const groups = useMemo(() => [...new Set(all.map(x => x.group_name).filter(Boolean))], [all]);
      const filtered = useMemo(() => (group === 'all' ? all : all.filter(x => x.group_name === group)), [all, group]);
      const isBuild = sType === 'build_sentence';
      const needed = isBuild ? 1 : 4;
      const n = count === 0 ? filtered.length : Math.min(count, filtered.length);

      const persistSession = useCallback(async (sc, ans, type) => {
        if (!user || savingRef.current || sc.total === 0) return;
        savingRef.current = true;
        const { data: session, error } = await supabase.from(TABLES.quizSessions).insert({
          user_id: user.id,
          language_code: languageCode,
          topic_id: null,
          quiz_type: type,
          total_questions: sc.total,
          correct_answers: sc.correct,
          completed_at: new Date().toISOString(),
        }).select('id').single();
        if (!error && session && ans.length) {
          const rows = ans.map(a => ({ ...a, session_id: session.id }));
          const { error: ansErr } = await supabase.from(TABLES.quizAnswers).insert(rows);
          // Fallback if the sentence_id column hasn't been added yet (kg-chart-sentences.sql)
          if (ansErr) await supabase.from(TABLES.quizAnswers).insert(rows.map(({ sentence_id, ...r }) => r));
        }
        setSessionSaved(true);
      }, [user, languageCode]);

      useEffect(() => { if (completed && !sessionSaved) persistSession(score, answers, sType); }, [completed]);

      const pendingRef = React.useRef(null);
      pendingRef.current = started && !completed && answers.length ? { score, answers, sType, persistSession } : null;
      useEffect(() => () => { const p = pendingRef.current; if (p) p.persistSession(p.score, p.answers, p.sType); window.KGAudio.stop(); }, []);

      const startQuiz = () => {
        const picked = shuffleArr(filtered).slice(0, n);
        const frozen = picked.map(s => {
          if (isBuild) {
            let pieces = splitSentence(s.native_text, languageCode);
            if (pieces.length < 2) pieces = Array.from(s.native_text.trim()).filter(c => c.trim());
            const tiles = pieces.map((text, id) => ({ id, text }));
            let order = shuffleArr(tiles);
            for (let k = 0; k < 6 && order.length > 1 && order.every((t, i) => t.text === pieces[i]); k++) order = shuffleArr(tiles);
            return { s, pieces, tiles: order };
          }
          // Wrong options: same group first (same pattern, harder to guess), never two that read the same
          const key = sType === 'sentence_to_meaning' ? 'english_text' : 'native_text';
          const norm = x => (x[key] || '').trim().toLowerCase();
          const same = shuffleArr(all.filter(x => x.id !== s.id && s.group_name && x.group_name === s.group_name));
          const other = shuffleArr(all.filter(x => x.id !== s.id && !same.includes(x)));
          const seen = new Set([norm(s)]);
          const wrong = [];
          for (const x of [...same, ...other]) {
            const t = norm(x);
            if (!t || seen.has(t)) continue;
            seen.add(t);
            wrong.push(x);
            if (wrong.length === 3) break;
          }
          return { s, options: shuffleArr([s, ...wrong]) };
        });
        setItems(frozen);
        setIdx(0); setSelected(null); setShowResult(false); setPlaced([]); setGaveUp(false);
        setScore({ correct: 0, total: 0 }); setAnswers([]);
        savingRef.current = false; setSessionSaved(false);
        setCompleted(false); setStarted(true);
      };

      const item = items[idx];
      const record = (isCorrect, selectedId, answerText) => {
        setScore(prev => ({ correct: prev.correct + (isCorrect ? 1 : 0), total: prev.total + 1 }));
        setAnswers(prev => [...prev, {
          vocabulary_id: null,
          sentence_id: item.s.id,
          selected_vocabulary_id: selectedId,
          is_correct: isCorrect,
          answer_text: answerText,
          answered_at: new Date().toISOString(),
        }]);
      };

      const pick = (opt) => {
        if (showResult || !item) return;
        setSelected(opt);
        setShowResult(true);
        window.KGAudio.autoPlay(item.s.native_text, languageCode);
        record(opt.id === item.s.id, opt.id, sType === 'sentence_to_meaning' ? opt.english_text : opt.native_text);
      };

      const placeTile = (id) => { if (!showResult) setPlaced(p => (p.includes(id) ? p : [...p, id])); };
      const removeTile = (id) => { if (!showResult) setPlaced(p => p.filter(x => x !== id)); };
      const placedText = () => placed.map(id => item.tiles.find(t => t.id === id).text);
      const checkBuild = () => {
        if (showResult || !item || placed.length !== item.tiles.length) return;
        const built = placedText();
        const ok = built.length === item.pieces.length && built.every((t, i) => t === item.pieces[i]);
        setShowResult(true);
        window.KGAudio.autoPlay(item.s.native_text, languageCode);
        record(ok, ok ? item.s.id : null, joinSentence(built, languageCode));
      };
      const giveUp = () => {
        if (showResult || !item) return;
        setGaveUp(true);
        setShowResult(true);
        window.KGAudio.autoPlay(item.s.native_text, languageCode);
        record(false, null, joinSentence(placedText(), languageCode));
      };

      const next = () => {
        window.KGAudio.stop();
        if (idx + 1 >= items.length) { setCompleted(true); return; }
        setIdx(i => i + 1); setSelected(null); setShowResult(false); setPlaced([]); setGaveUp(false);
      };
      const leave = () => {
        window.KGAudio.stop();
        if (!completed && answers.length) persistSession(score, answers, sType);
        setStarted(false);
      };

      // Keyboard: 1-4 pick, Enter next (MCQ); Enter checks / next (build)
      useEffect(() => {
        if (!started || completed || !item) return;
        const onKey = (e) => {
          if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName) || kgModalOpen()) return;
          if (e.key === 'Enter' || (e.key === ' ' && showResult)) {
            e.preventDefault();
            if (showResult) next(); else if (isBuild) checkBuild();
            return;
          }
          if (!isBuild && !showResult) {
            const num = parseInt(e.key);
            if (num >= 1 && num <= 4 && item.options[num - 1]) pick(item.options[num - 1]);
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [started, completed, item, showResult, placed, isBuild]);

      // 🔊 only when this sentence has a clip (run tools/gen_kg_audio.py after adding sentences)
      const SpeakBtn = ({ text, small }) => (window.KGAudio.has(text, languageCode) === true
        ? <SpeakButton text={text} lang={languageCode} slow={!small} size={small ? 'sm' : 'lg'} />
        : null);

      const NativeLine = ({ text, size }) => {
        const dev = sentenceDevanagari(text, languageCode);
        return (
          <>
            <div className={`${size} font-bold text-gray-800 ${fontClass}`}>{text}</div>
            {dev && <div className="text-base text-blue-600 font-devanagari mt-1">{dev}</div>}
          </>
        );
      };

      // ---------- Setup ----------
      if (!started) {
        const typeHelp = {
          sentence_to_meaning: 'Read the sentence, pick what it means.',
          meaning_to_sentence: 'Read the English, pick the right sentence.',
          build_sentence: 'Read the English, tap the words into the right order.',
        }[sType];
        return (
          <div className="max-w-2xl mx-auto p-6">
            <div className="bg-white rounded-3xl shadow-xl p-8">
              <div className="text-center mb-8">
                <div className="w-20 h-20 bg-jade-100 rounded-full flex items-center justify-center mx-auto mb-4">
                  <span className="text-4xl">💬</span>
                </div>
                <h2 className="text-3xl font-bold text-gray-800">Quiz Mode</h2>
              </div>
              {modeToggle}

              {sentences === null ? <LoadingSpinner /> : loadError ? (
                <div className="bg-yellow-50 text-yellow-800 rounded-2xl p-4 text-sm">
                  Sentences aren't set up yet. Run <span className="font-mono">kg-chart-sentences.sql</span> in the Supabase SQL editor, then reload.
                </div>
              ) : all.length === 0 ? (
                <div className="text-center text-gray-500 py-6">
                  <div className="text-4xl mb-2">📭</div>
                  No sentences for {languageName(languageCode)} yet. Add some in the admin panel under 💬 Sentences.
                </div>
              ) : (
                <div className="space-y-6">
                  {groups.length > 0 && (
                    <div>
                      <label className="block text-sm font-semibold text-gray-700 mb-2">Group</label>
                      <select value={group} onChange={(e) => setGroup(e.target.value)} className="w-full px-4 py-3 border rounded-xl">
                        <option value="all">All sentences ({all.length})</option>
                        {groups.map(g => <option key={g} value={g}>{g} ({all.filter(x => x.group_name === g).length})</option>)}
                      </select>
                    </div>
                  )}

                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-2">
                      How many <span className="text-gray-400 font-normal ml-2">({count === 0 ? 'All' : count} sentences)</span>
                    </label>
                    <div className="grid grid-cols-4 gap-2">
                      {DAILY_TARGET_OPTIONS.map(c => (
                        <button key={c} onClick={() => setCount(c)}
                          className={`py-3 rounded-xl border-2 font-medium transition-all ${count === c ? 'border-jade-500 bg-jade-50 text-jade-700' : 'border-gray-200 hover:border-gray-300'}`}>{c === 0 ? 'All' : c}</button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-2">Quiz Type</label>
                    <div className="grid grid-cols-3 gap-3">
                      {SENTENCE_QUIZ_TYPES.map(t => (
                        <button key={t.id} onClick={() => setSType(t.id)}
                          className={`p-3 rounded-xl border-2 transition-all ${sType === t.id ? 'border-jade-500 bg-jade-50' : 'border-gray-200'}`}>
                          <div className="text-2xl mb-1">{t.icon}</div>
                          <div className="text-xs sm:text-sm font-medium">{t.label}</div>
                        </button>
                      ))}
                    </div>
                    <p className="text-xs text-gray-400 mt-2">{typeHelp}</p>
                  </div>

                  <button onClick={startQuiz} disabled={n < 1 || all.length < needed}
                    className="w-full py-4 bg-jade-600 text-white rounded-xl font-bold text-lg hover:bg-jade-700 disabled:opacity-50">
                    {all.length < needed ? `Need ${needed}+ sentences` : n < 1 ? 'No sentences in group' : `Start Quiz (${n} sentences)`}
                  </button>
                  <p className="text-xs text-gray-400 text-center">Sentence quizzes don't count toward unlocking topics.</p>
                </div>
              )}
            </div>

            {recent.length > 0 && (
              <div className="bg-white rounded-2xl shadow-lg p-6 mt-6">
                <h3 className="text-lg font-bold text-gray-800 mb-4">Recent Sentence Quizzes</h3>
                <div className="space-y-3">
                  {recent.map(r => {
                    const pct = r.total_questions > 0 ? Math.round((r.correct_answers / r.total_questions) * 100) : 0;
                    const t = SENTENCE_QUIZ_TYPES.find(x => x.id === r.quiz_type);
                    const date = new Date(r.completed_at || r.created_at);
                    return (
                      <div key={r.id} className="flex items-center justify-between p-3 bg-gray-50 rounded-xl">
                        <div className="flex items-center gap-3">
                          <div className={`w-10 h-10 rounded-full flex items-center justify-center text-white text-sm font-bold ${pct >= 80 ? 'bg-green-500' : pct >= 60 ? 'bg-yellow-500' : 'bg-red-500'}`}>{pct}%</div>
                          <div>
                            <div className="text-sm font-medium text-gray-800">{t ? `${t.icon} ${t.label}` : r.quiz_type}</div>
                            <div className="text-xs text-gray-400">{date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })} {date.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })}</div>
                          </div>
                        </div>
                        <div className="text-sm text-gray-600 font-medium">{r.correct_answers}/{r.total_questions}</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </div>
        );
      }

      // ---------- Done ----------
      if (completed) {
        const pct = score.total > 0 ? Math.round(score.correct / score.total * 100) : 0;
        const [msg, emoji] = pct >= 90 ? ['Excellent!', '🏆'] : pct >= 70 ? ['Great job!', '🌟'] : pct >= 50 ? ['Good effort!', '👍'] : ['Keep practicing!', '💪'];
        return (
          <div className="max-w-2xl mx-auto p-6">
            <div className="bg-white rounded-3xl shadow-xl p-8 text-center">
              <div className="text-6xl mb-4">{emoji}</div>
              <h2 className="text-3xl font-bold text-gray-800 mb-2">{msg}</h2>
              <p className="text-gray-500 mb-6">Sentence Quiz Completed!</p>
              <div className="bg-gradient-to-r from-jade-500 to-jade-600 text-white rounded-2xl p-6 mb-6">
                <div className="text-5xl font-bold mb-2">{score.correct}/{score.total}</div>
                <div className="text-xl opacity-90">{pct}% Correct</div>
              </div>
              {user && <p className={`text-sm mb-4 ${sessionSaved ? 'text-green-600' : 'text-gray-400'}`}>{sessionSaved ? '✓ Results saved' : 'Saving...'}</p>}
              <div className="flex gap-4 justify-center">
                <button onClick={() => { setStarted(false); setCompleted(false); }} className="px-6 py-3 bg-gray-100 rounded-xl font-medium hover:bg-gray-200">← Back to Setup</button>
                <button onClick={startQuiz} className="px-6 py-3 bg-jade-600 text-white rounded-xl font-bold hover:bg-jade-700">Try Again</button>
              </div>
            </div>
          </div>
        );
      }

      if (!item) return <LoadingSpinner />;
      const s = item.s;
      const isRight = showResult && (isBuild ? !gaveUp && answers[answers.length - 1]?.is_correct : selected?.id === s.id);

      // ---------- Question ----------
      return (
        <div className="max-w-3xl mx-auto p-4">
          <div className="bg-white rounded-2xl shadow-lg p-4 mb-6">
            <div className="flex flex-wrap items-center justify-between gap-4">
              <button onClick={leave} className="px-4 py-2 bg-gray-100 rounded-xl hover:bg-gray-200 font-medium">← Back</button>
              <div className="flex items-center gap-4">
                <div className="text-sm text-gray-500">{idx + 1} / {items.length}</div>
                <div className="w-32 h-2 bg-gray-200 rounded-full overflow-hidden">
                  <div className="h-full bg-jade-500 transition-all duration-300" style={{ width: `${((idx + 1) / items.length) * 100}%` }} />
                </div>
                <div className="bg-gradient-to-r from-jade-500 to-jade-600 text-white px-4 py-2 rounded-xl font-bold shadow-md">{score.correct}/{score.total}</div>
              </div>
            </div>
          </div>

          <div className="bg-white rounded-2xl shadow-lg p-8 mb-6 text-center">
            {s.group_name && <div className="text-xs text-gray-400 mb-2">{s.group_name}</div>}
            {sType === 'sentence_to_meaning' ? (
              <>
                <div className="text-sm text-gray-400 mb-4">What does this mean?</div>
                <NativeLine text={s.native_text} size="text-3xl" />
                <div className="mt-3"><SpeakBtn text={s.native_text} /></div>
              </>
            ) : (
              <>
                <div className="text-sm text-gray-400 mb-4">{isBuild ? 'Build this sentence:' : 'Which sentence says this?'}</div>
                <div className="text-2xl font-bold text-gray-800">{s.english_text}</div>
              </>
            )}
          </div>

          {!isBuild && (
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
              {item.options.map((opt, i) => {
                let cls = 'border-gray-200 hover:border-jade-300 hover:shadow-lg';
                if (showResult) {
                  if (opt.id === s.id) cls = 'border-green-500 border-4 bg-green-50';
                  else if (selected?.id === opt.id) cls = 'border-red-500 border-4 bg-red-50';
                }
                return (
                  <button key={opt.id} onClick={() => pick(opt)} disabled={showResult}
                    className={`p-4 rounded-xl border-2 transition-all relative text-left ${cls}`}>
                    <span className="absolute top-1.5 right-2 text-xs text-gray-300 font-mono hidden sm:inline">{i + 1}</span>
                    {sType === 'sentence_to_meaning'
                      ? <div className="text-base font-medium text-gray-800 pr-4">{opt.english_text}</div>
                      : <div className="pr-4"><NativeLine text={opt.native_text} size="text-lg" /></div>}
                  </button>
                );
              })}
            </div>
          )}

          {isBuild && (
            <div className="bg-white rounded-2xl shadow-lg p-6 mb-6">
              <div className={`min-h-[64px] rounded-xl border-2 border-dashed p-3 flex flex-wrap gap-2 mb-4 ${showResult ? (isRight ? 'border-green-400 bg-green-50' : 'border-red-400 bg-red-50') : 'border-gray-300'}`}>
                {placed.length === 0 && <span className="text-gray-400 text-sm self-center">Tap the words below in order</span>}
                {placed.map(id => {
                  const t = item.tiles.find(x => x.id === id);
                  return <button key={id} onClick={() => removeTile(id)} className={`px-3 py-2 bg-white border-2 border-jade-300 rounded-xl text-xl ${fontClass}`}>{t.text}</button>;
                })}
              </div>
              <div className="flex flex-wrap gap-2 justify-center mb-4">
                {item.tiles.map(t => {
                  const used = placed.includes(t.id);
                  return (
                    <button key={t.id} onClick={() => placeTile(t.id)} disabled={used || showResult}
                      className={`px-3 py-2 rounded-xl border-2 text-xl transition-all ${fontClass} ${used ? 'opacity-25 border-gray-200' : 'border-gray-300 bg-gray-50 hover:border-jade-400'}`}>{t.text}</button>
                  );
                })}
              </div>
              {!showResult && (
                <div className="flex gap-3 justify-center">
                  <button onClick={() => setPlaced([])} disabled={!placed.length} className="px-4 py-2 bg-gray-100 rounded-xl font-medium hover:bg-gray-200 disabled:opacity-40">Clear</button>
                  <button onClick={giveUp} className="px-4 py-2 bg-gray-100 rounded-xl font-medium hover:bg-gray-200">Show answer</button>
                  <button onClick={checkBuild} disabled={placed.length !== item.tiles.length} className="px-6 py-2 bg-jade-600 text-white rounded-xl font-bold hover:bg-jade-700 disabled:opacity-50">Check</button>
                </div>
              )}
            </div>
          )}

          {showResult && (
            <div className="text-center animate-slide-up">
              <div className={`text-2xl font-bold mb-3 ${isRight ? 'text-green-600' : 'text-red-600'}`}>{isRight ? '✅ Correct!' : gaveUp ? '👀 Here it is:' : '❌ Not quite. The answer:'}</div>
              <div className="bg-white rounded-2xl shadow p-4 mb-4 inline-block max-w-full">
                <div className="flex items-center justify-center gap-3">
                  <div><NativeLine text={s.native_text} size="text-2xl" /></div>
                  <SpeakBtn text={s.native_text} small />
                </div>
                <div className="text-gray-600 mt-2">{s.english_text}</div>
                {s.notes && <div className="text-xs text-gray-400 mt-2">📝 {s.notes}</div>}
                <div className="mt-2"><FlagButton compact onClick={() => setFlagSentence(s)} /></div>
              </div>
              <div>
                <button onClick={next} className="px-8 py-3 bg-blue-600 text-white rounded-full font-bold hover:bg-blue-700">
                  {idx + 1 >= items.length ? 'See Results' : 'Next →'} <span className="text-blue-300 text-sm hidden sm:inline ml-1">↵</span>
                </button>
              </div>
            </div>
          )}
          {flagSentence && <FlagModal sentence={flagSentence} languageCode={languageCode} onClose={() => setFlagSentence(null)} />}
        </div>
      );
    }

    // ==========================================
    // SPEAK A PARAGRAPH (any sentence group, read in order)
    // ==========================================
    // 1 listen to every line · 2 line by line: see the meaning, say it, reveal, judge yourself · 3 the whole paragraph.
    // The learner judges their own speaking (an automatic pronunciation check is a later phase).
    // Saved as speak_lines / speak_paragraph sessions; sentence answers never touch word strength or unlocking.
    const SPEAK_KEY = 'kg_chart_speak';
    const SPEAK_STEPS = [
      { id: 'listen', n: 1, icon: '👂', label: 'Listen', help: 'Hear every line with its text and meaning.' },
      { id: 'lines', n: 2, icon: '🗣️', label: 'Line by line', help: 'See the meaning, say the line out loud, then check.' },
      { id: 'whole', n: 3, icon: '📜', label: 'Whole paragraph', help: 'Say it all from the meanings. Peek only if stuck.' },
    ];
    const SPEAK_SESSION_TYPES = { lines: 'speak_lines', whole: 'speak_paragraph' };
    // Conversations keep the speaker (A / B) in notes
    const speakerOf = (s) => { const n = (s.notes || '').trim(); return n && n.length <= 3 ? n : null; };

    // Record yourself and play it back next to the real clip. Hidden where the browser can't record.
    function VoiceRecorder() {
      const [state, setState] = useState('idle'); // idle | recording | done | denied
      const [url, setUrl] = useState(null);
      const recRef = React.useRef(null);
      const audioRef = React.useRef(null);
      useEffect(() => () => { if (recRef.current?.state === 'recording') recRef.current.stop(); }, []);
      useEffect(() => () => { if (url) URL.revokeObjectURL(url); }, [url]);
      if (!(window.MediaRecorder && navigator.mediaDevices?.getUserMedia)) return null;

      const start = async () => {
        window.KGAudio.stop();
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const rec = new MediaRecorder(stream);
          const chunks = [];
          rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
          rec.onstop = () => {
            stream.getTracks().forEach(t => t.stop());
            setUrl(URL.createObjectURL(new Blob(chunks, { type: rec.mimeType || 'audio/webm' })));
            setState('done');
          };
          recRef.current = rec;
          rec.start();
          setState('recording');
        } catch (e) { setState('denied'); }
      };
      const stop = () => { if (recRef.current?.state === 'recording') recRef.current.stop(); };
      const playMine = () => {
        window.KGAudio.stop();
        if (audioRef.current) { audioRef.current.currentTime = 0; audioRef.current.play().catch(() => {}); }
      };
      const btn = 'px-4 py-2 rounded-full text-sm font-medium border-2 transition-all';
      return (
        <div className="flex items-center justify-center gap-2 flex-wrap">
          {state === 'recording'
            ? <button onClick={stop} className={`${btn} border-red-400 bg-red-50 text-red-600 animate-pulse`}>⏹ Stop recording</button>
            : <button onClick={start} className={`${btn} border-gray-200 text-gray-700 hover:border-gray-300`}>🎙️ {state === 'done' ? 'Record again' : 'Record yourself'}</button>}
          {state === 'done' && url && (
            <>
              <button onClick={playMine} className={`${btn} border-jade-300 text-jade-700 hover:border-jade-500`}>▶ My voice</button>
              <audio ref={audioRef} src={url} preload="auto" />
            </>
          )}
          {state === 'denied' && <span className="text-xs text-gray-400">Microphone not allowed</span>}
        </div>
      );
    }

    function SpeakView({ languageCode, user, modeToggle }) {
      const fontClass = LANGUAGE_FONTS[languageCode] || 'font-body';
      const audioVersion = useAudioState();
      const priv = React.useContext(PrivateLessonsContext);
      const [sentences, setSentences] = useState(null); // null = loading
      const [loadError, setLoadError] = useState(null);
      const [group, setGroup] = useState(() => loadFromStorage(SPEAK_KEY, {})[languageCode] || '');
      const [step, setStep] = useState(null); // null = choose a step | 'listen' | 'lines' | 'whole'
      const [result, setResult] = useState(null); // { id, total, correct } once a step is finished
      const [playing, setPlaying] = useState(-1); // listen: line being played, -1 = stopped
      const [queue, setQueue] = useState([]); // lines: line indexes still to say (missed ones go to the back)
      const [revealed, setRevealed] = useState(false);
      const [firstTry, setFirstTry] = useState({}); // lines: index -> right the first time?
      const [turn, setTurn] = useState(0); // lines: new recorder for every attempt
      const [flagLine, setFlagLine] = useState(null);
      const flagModal = flagLine && <FlagModal sentence={flagLine} languageCode={languageCode} onClose={() => setFlagLine(null)} />;
      const savedStep = React.useRef(null); // which step's result has been saved this attempt (a double tap must not save twice)
      const [peeked, setPeeked] = useState(() => new Set()); // whole: lines looked at
      const [showAll, setShowAll] = useState(false);
      const startedAt = React.useRef(0);
      const timerRef = React.useRef(null);
      const playStarted = React.useRef(false);

      useEffect(() => {
        let cancelled = false;
        setSentences(null); setLoadError(null); setStep(null); setResult(null);
        setGroup(loadFromStorage(SPEAK_KEY, {})[languageCode] || '');
        supabase.from(TABLES.sentences).select('*').eq('language_code', languageCode)
          .order('sort_order').order('created_at')
          .then(({ data, error }) => {
            if (cancelled) return;
            if (error) { setLoadError(error); setSentences([]); return; }
            setSentences((data || []).filter(x => x.native_text?.trim()));
          });
        return () => { cancelled = true; };
      }, [languageCode]);

      useEffect(() => () => { clearTimeout(timerRef.current); window.KGAudio.stop(); }, []);

      // A paragraph = a sentence group with 2+ lines, in sort order
      const groups = useMemo(() => {
        const by = new Map();
        (sentences || []).forEach(s => {
          if (!s.group_name || priv.groups.has(s.group_name)) return;
          if (!by.has(s.group_name)) by.set(s.group_name, []);
          by.get(s.group_name).push(s);
        });
        return [...by].filter(([, l]) => l.length >= 2).map(([name, lines]) => ({ name, lines }));
      }, [sentences, priv]);
      const current = groups.find(g => g.name === group) || groups[0] || null;
      const lines = current ? current.lines : [];
      const chooseGroup = (name) => {
        setGroup(name);
        saveToStorage(SPEAK_KEY, { ...loadFromStorage(SPEAK_KEY, {}), [languageCode]: name });
      };

      // ---------- step 1: play every line, one after another ----------
      const playNextIn = (ms) => {
        clearTimeout(timerRef.current);
        timerRef.current = setTimeout(() => setPlaying(p => (p >= 0 ? p + 1 : p)), ms);
      };
      const stopAll = () => { clearTimeout(timerRef.current); playStarted.current = false; setPlaying(-1); window.KGAudio.stop(); };
      useEffect(() => {
        if (step !== 'listen' || playing < 0) return;
        const line = lines[playing];
        if (!line) { setPlaying(-1); return; }
        playStarted.current = false;
        // No clip yet: pause about as long as the line takes to say, so the highlight still moves on
        if (!window.KGAudio.play(line.native_text, languageCode, { silent: true })) playNextIn(800 + 90 * line.native_text.length);
      }, [step, playing]);
      useEffect(() => {
        if (step !== 'listen' || playing < 0 || !lines[playing]) return;
        if (window.KGAudio.stateOf(lines[playing].native_text, languageCode, false)) { playStarted.current = true; return; }
        if (playStarted.current) { playStarted.current = false; playNextIn(500); }
      }, [audioVersion]);

      const startStep = (id) => {
        stopAll();
        setResult(null);
        savedStep.current = null;
        setStep(id);
        startedAt.current = Date.now();
        if (id === 'listen' && !window.KGAudio.prefs.muted) setPlaying(0);
        if (id === 'lines') { setQueue(lines.map((_, i) => i)); setRevealed(false); setFirstTry({}); }
        if (id === 'whole') { setPeeked(new Set()); setShowAll(false); }
      };

      const finish = async (id, rows) => {
        if (savedStep.current === id) return;
        savedStep.current = id;
        const total = rows.length, correct = rows.filter(r => r.ok).length;
        setResult({ id, total, correct });
        if (!user || !SPEAK_SESSION_TYPES[id]) return;
        const now = new Date().toISOString();
        const { data: session, error } = await supabase.from(TABLES.quizSessions).insert({
          user_id: user.id, language_code: languageCode, topic_id: null, quiz_type: SPEAK_SESSION_TYPES[id],
          total_questions: total, correct_answers: correct,
          time_spent_seconds: Math.round((Date.now() - startedAt.current) / 1000), completed_at: now,
        }).select('id').single();
        if (error || !session) return;
        await supabase.from(TABLES.quizAnswers).insert(rows.map(r => ({
          session_id: session.id, vocabulary_id: null, sentence_id: r.line.id, selected_vocabulary_id: null, is_correct: r.ok, answered_at: now,
        })));
      };

      // ---------- step 2: judge each line; a miss comes back at the end ----------
      const lineIdx = queue[0];
      const reveal = () => { setRevealed(true); window.KGAudio.autoPlay(lines[lineIdx].native_text, languageCode); };
      const judge = (ok) => {
        const ft = lineIdx in firstTry ? firstTry : { ...firstTry, [lineIdx]: ok };
        const next = ok ? queue.slice(1) : [...queue.slice(1), lineIdx];
        setFirstTry(ft);
        setRevealed(false);
        setTurn(t => t + 1);
        window.KGAudio.stop();
        setQueue(next);
        if (!next.length) finish('lines', lines.map((line, i) => ({ line, ok: !!ft[i] })));
      };

      // ---------- step 3 ----------
      const peek = (i) => { setPeeked(p => new Set([...p, i])); window.KGAudio.autoPlay(lines[i].native_text, languageCode); };

      const LineText = ({ s, size = 'text-xl' }) => {
        const dev = sentenceDevanagari(s.native_text, languageCode);
        return (
          <>
            <div className={`${size} font-bold text-gray-800 ${fontClass}`}>{s.native_text}</div>
            {dev && <div className="text-sm text-blue-600 font-devanagari mt-0.5">{dev}</div>}
          </>
        );
      };
      const Speaker = ({ s }) => (speakerOf(s) ? <span className="inline-block text-xs font-bold bg-gray-200 text-gray-600 rounded-full px-2 py-0.5 mr-2">{speakerOf(s)}</span> : null);
      const stepInfo = SPEAK_STEPS.find(x => x.id === step);
      const nextStep = SPEAK_STEPS.find(x => x.n === (stepInfo?.n || 0) + 1);
      const header = (
        <div className="flex items-center justify-between mb-4 gap-2">
          <button onClick={() => { stopAll(); setStep(null); setResult(null); }} className="text-gray-500 hover:text-gray-700 font-medium shrink-0">← Steps</button>
          <div className="text-right min-w-0">
            <div className="text-sm font-bold text-gray-700">{stepInfo?.n} · {stepInfo?.icon} {stepInfo?.label}</div>
            <div className="text-xs text-gray-400 truncate">{current?.name}</div>
          </div>
        </div>
      );

      // ---------- choose a paragraph and a step ----------
      if (!step || !current) {
        return (
          <div className="max-w-2xl mx-auto p-6">
            <div className="bg-white rounded-3xl shadow-xl p-8">
              <div className="text-center mb-8">
                <div className="w-20 h-20 bg-jade-100 rounded-full flex items-center justify-center mx-auto mb-4">
                  <span className="text-4xl">🗣️</span>
                </div>
                <h2 className="text-3xl font-bold text-gray-800">Quiz Mode</h2>
              </div>
              {modeToggle}

              {sentences === null ? <LoadingSpinner /> : loadError ? (
                <div className="bg-yellow-50 text-yellow-800 rounded-2xl p-4 text-sm">
                  Sentences aren't set up yet. Run <span className="font-mono">kg-chart-sentences.sql</span> in the Supabase SQL editor, then reload.
                </div>
              ) : !current ? (
                <div className="text-center text-gray-500 py-6">
                  <div className="text-4xl mb-2">📭</div>
                  No paragraphs for {languageName(languageCode)} yet. A sentence group with 2 or more lines becomes one (admin → 💬 Sentences).
                </div>
              ) : (
                <div className="space-y-6">
                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-2">Paragraph</label>
                    <select value={current.name} onChange={(e) => chooseGroup(e.target.value)} className="w-full px-4 py-3 border rounded-xl">
                      {groups.map(g => <option key={g.name} value={g.name}>{g.name} ({g.lines.length} lines)</option>)}
                    </select>
                    <ol className="mt-3 space-y-1 text-sm text-gray-500 list-decimal list-inside">
                      {lines.map(s => <li key={s.id}><Speaker s={s} />{s.english_text}</li>)}
                    </ol>
                  </div>
                  <div className="space-y-3">
                    {SPEAK_STEPS.map(x => (
                      <button key={x.id} onClick={() => startStep(x.id)}
                        className="w-full flex items-center gap-4 p-4 rounded-2xl border-2 border-gray-200 hover:border-jade-400 hover:bg-jade-50 text-left transition-all">
                        <div className="w-10 h-10 rounded-full bg-jade-600 text-white font-bold flex items-center justify-center shrink-0">{x.n}</div>
                        <div>
                          <div className="font-semibold text-gray-800">{x.icon} {x.label}</div>
                          <div className="text-xs text-gray-500">{x.help}</div>
                        </div>
                      </button>
                    ))}
                  </div>
                  <p className="text-xs text-gray-400 text-center">You judge your own speaking: 🎙️ record yourself to compare with the real voice. Doesn't count toward unlocking topics.</p>
                </div>
              )}
            </div>
          </div>
        );
      }

      // ---------- a finished step ----------
      if (result) {
        const pct = result.total ? Math.round((result.correct / result.total) * 100) : 0;
        const line = result.id === 'lines'
          ? `${result.correct} of ${result.total} lines right the first time`
          : result.correct === result.total ? 'The whole paragraph without peeking!' : `${result.correct} of ${result.total} lines without peeking`;
        return (
          <div className="max-w-2xl mx-auto p-6">
            <div className="bg-white rounded-3xl shadow-xl p-8 text-center">
              <div className="text-6xl mb-3">{pct === 100 ? '🎉' : pct >= 60 ? '👏' : '💪'}</div>
              <h2 className="text-2xl font-bold text-gray-800 mb-1">{stepInfo.label} done</h2>
              <p className="text-gray-600 mb-6">{line}</p>
              <div className="flex flex-col sm:flex-row gap-3 justify-center">
                <button onClick={() => startStep(step)} className="px-6 py-3 border-2 border-gray-200 rounded-full font-medium hover:border-gray-300">↺ Again</button>
                {nextStep && <button onClick={() => startStep(nextStep.id)} className="px-6 py-3 bg-jade-600 text-white rounded-full font-bold hover:bg-jade-700">Next: {nextStep.n} · {nextStep.label} →</button>}
                {!nextStep && <button onClick={() => { setStep(null); setResult(null); }} className="px-6 py-3 bg-jade-600 text-white rounded-full font-bold hover:bg-jade-700">Back to steps</button>}
              </div>
            </div>
          </div>
        );
      }

      // ---------- step 1 ----------
      if (step === 'listen') {
        return (
          <div className="max-w-2xl mx-auto p-6">
            <div className="bg-white rounded-3xl shadow-xl p-6 sm:p-8">
              {header}
              <div className="flex justify-center gap-3 mb-5">
                {playing >= 0
                  ? <button onClick={stopAll} className="px-6 py-3 bg-red-500 text-white rounded-full font-bold hover:bg-red-600">⏹ Stop</button>
                  : <button onClick={() => { stopAll(); setPlaying(0); }} className="px-6 py-3 bg-jade-600 text-white rounded-full font-bold hover:bg-jade-700">▶ Play all</button>}
              </div>
              <div className="space-y-2">
                {lines.map((s, i) => (
                  <div key={s.id} className={`flex items-start gap-3 p-3 rounded-xl border-2 transition-all ${playing === i ? 'border-jade-400 bg-jade-50' : 'border-transparent bg-gray-50'}`}>
                    <div className="text-xs text-gray-400 font-bold w-5 pt-1.5 shrink-0">{i + 1}</div>
                    <div className="flex-1 min-w-0">
                      <LineText s={s} />
                      <div className="text-sm text-gray-500 mt-1"><Speaker s={s} />{s.english_text}</div>
                    </div>
                    <div className="flex gap-1 shrink-0 items-center">
                      <SpeakButton text={s.native_text} lang={languageCode} size="sm" />
                      <SpeakButton text={s.native_text} lang={languageCode} slow size="sm" />
                      <FlagButton compact onClick={() => { stopAll(); setFlagLine(s); }} />
                    </div>
                  </div>
                ))}
              </div>
              {flagModal}
              <button onClick={() => startStep('lines')} className="w-full mt-6 py-3 bg-jade-600 text-white rounded-xl font-bold hover:bg-jade-700">Next: 2 · Line by line →</button>
            </div>
          </div>
        );
      }

      // ---------- step 2 ----------
      if (step === 'lines') {
        const s = lines[lineIdx];
        if (!s) return null;
        const doneCount = lines.length - new Set(queue).size;
        return (
          <div className="max-w-2xl mx-auto p-6">
            <div className="bg-white rounded-3xl shadow-xl p-6 sm:p-8">
              {header}
              <div className="w-full bg-gray-200 rounded-full h-2 mb-6">
                <div className="bg-jade-500 h-2 rounded-full transition-all" style={{ width: `${(doneCount / lines.length) * 100}%` }} />
              </div>
              <div className="text-center">
                <div className="text-xs text-gray-400 mb-2">Line {lineIdx + 1} of {lines.length}{lineIdx in firstTry ? ' · again' : ''}</div>
                <div className="text-2xl font-semibold text-gray-800 mb-2"><Speaker s={s} />{s.english_text}</div>
                <p className="text-sm text-gray-500 mb-4">Say it out loud{revealed ? '' : ', then check'}.</p>
                <div className="flex justify-center gap-2 mb-4">
                  <SpeakButton text={s.native_text} lang={languageCode} />
                  <SpeakButton text={s.native_text} lang={languageCode} slow />
                </div>
                <div className="mb-5"><VoiceRecorder key={turn} /></div>
                {revealed ? (
                  <>
                    <div className="bg-jade-50 rounded-2xl p-4 mb-5 relative">
                      <LineText s={s} size="text-2xl" />
                      <div className="absolute top-1 right-1"><FlagButton compact onClick={() => setFlagLine(s)} /></div>
                    </div>
                    {flagModal}
                    <div className="grid grid-cols-2 gap-3">
                      <button onClick={() => judge(false)} className="py-3 border-2 border-orange-300 text-orange-700 rounded-xl font-bold hover:bg-orange-50">↺ Not yet</button>
                      <button onClick={() => judge(true)} className="py-3 bg-jade-600 text-white rounded-xl font-bold hover:bg-jade-700">✓ I said it right</button>
                    </div>
                  </>
                ) : (
                  <button onClick={reveal} className="w-full py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700">Show the line</button>
                )}
              </div>
            </div>
          </div>
        );
      }

      // ---------- step 3 ----------
      const clean = lines.length - peeked.size;
      return (
        <div className="max-w-2xl mx-auto p-6">
          <div className="bg-white rounded-3xl shadow-xl p-6 sm:p-8">
            {header}
            <p className="text-sm text-gray-500 text-center mb-4">Say the whole paragraph from the meanings. Tap 💡 on a line only if you're stuck.</p>
            <div className="mb-5"><VoiceRecorder /></div>
            <div className="space-y-2">
              {lines.map((s, i) => {
                const open = showAll || peeked.has(i);
                return (
                  <div key={s.id} className={`flex items-start gap-3 p-3 rounded-xl ${peeked.has(i) ? 'bg-yellow-50' : 'bg-gray-50'}`}>
                    <div className="text-xs text-gray-400 font-bold w-5 pt-1 shrink-0">{i + 1}</div>
                    <div className="flex-1 min-w-0">
                      <div className="text-gray-700"><Speaker s={s} />{s.english_text}</div>
                      {open && <div className="mt-1"><LineText s={s} size="text-lg" /></div>}
                    </div>
                    <div className="shrink-0">
                      {open
                        ? <SpeakButton text={s.native_text} lang={languageCode} size="sm" />
                        : <button onClick={() => peek(i)} title="Peek at this line" className="w-8 h-8 rounded-full bg-white border border-gray-200 hover:border-yellow-400">💡</button>}
                    </div>
                  </div>
                );
              })}
            </div>
            {showAll ? (
              <div className="grid grid-cols-2 gap-3 mt-6">
                <button onClick={() => startStep('whole')} className="py-3 border-2 border-orange-300 text-orange-700 rounded-xl font-bold hover:bg-orange-50">↺ Try again</button>
                <button onClick={() => finish('whole', lines.map((line, i) => ({ line, ok: !peeked.has(i) })))} className="py-3 bg-jade-600 text-white rounded-xl font-bold hover:bg-jade-700">✓ I said it all</button>
              </div>
            ) : (
              <button onClick={() => setShowAll(true)} className="w-full mt-6 py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700">
                Reveal all and check{peeked.size ? ` (${clean} of ${lines.length} without peeking)` : ''}
              </button>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // COLOUR + NOUN QUIZ (kg_chart_colour_phrases, kg-chart-colour-phrases.sql)
    // ==========================================
    // "red car": the phrase as said in each language is stored per language (word order and adjective forms differ).
    // Pictures are the noun's emoji recoloured on the device, so "blue car" and "red car" differ only in colour.
    // Saved as colour_phrase sessions; never part of word strength or unlocking.
    const COLOUR_HEX = { Red: '#e53935', Blue: '#1e88e5', Green: '#43a047', Yellow: '#fdd835', Orange: '#fb8c00', Purple: '#8e24aa', Pink: '#f06292', Brown: '#795548', Black: '#262626', White: '#ececec' };
    // White things would vanish on the light tiles: give them a thin grey outline
    const COLOUR_OUTLINE = { White: 'drop-shadow(0 0 1px #64748b) drop-shadow(0 0 1px #64748b)' };
    const COLOUR_QUIZ_TYPES = [
      { id: 'phrase_to_picture', label: 'Phrase → Picture', icon: '🎨', help: 'Read and hear the phrase, pick the picture.' },
      { id: 'listen_to_picture', label: 'Listen → Picture', icon: '🔊', help: 'Only hear it, pick the picture.' },
      { id: 'picture_to_phrase', label: 'Picture → Phrase', icon: '🖼️', help: 'See the picture, pick the phrase.' },
    ];
    const COLOUR_SETTINGS_KEY = 'kg_chart_colour_quiz';

    // The emoji redrawn in one colour, keeping its shading: its middle tone becomes the colour itself,
    // darker parts go toward black, lighter parts toward white (but never all the way, so the colour stays visible).
    const tintCache = {};
    function tintedEmojiUrl(emoji, hex) {
      const key = emoji + '|' + hex;
      if (key in tintCache) return tintCache[key];
      let url = null;
      try {
        const size = 160, c = document.createElement('canvas');
        c.width = c.height = size;
