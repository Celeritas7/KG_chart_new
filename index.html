    const SUPABASE_URL = 'https://ulgrfumbwjovbjzjiems.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVsZ3JmdW1id2pvdmJqemppZW1zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczNzIyNjcsImV4cCI6MjA4Mjk0ODI2N30.ix5Vh4Y3GXNbQbzVtTD_WSko0L3cr5q_eCnTuDEMh7M';

    const TABLES = {

    // ==========================================
    // LOCAL STORAGE KEYS
    // ==========================================
    const STORAGE_KEYS = {
      language: 'kg_chart_language',

    const saveToStorage = (key, value) => {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}

    // Convert slug to readable label (days_of_week → Days of the Week)
    const slugToLabel = (slug) => slug.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

    // Auto-generate image filename from English text (Tissue paper → tissue_paper.jpg)
    const toImageFilename = (text) => text.trim().toLowerCase().replace(/\s+/g, '_') + '.jpg';

    // Admin user ID
    const ADMIN_USER_ID = 'd469efb7-f9e1-4b49-8b14-75a42b4d22e0';

    const loadFromStorage = (key, defaultValue) => {
      try {
        const saved = localStorage.getItem(key);
        return saved ? JSON.parse(saved) : defaultValue;
      } catch (e) { return defaultValue; }
    };

    // ==========================================
    // LANGUAGE CONVERTER SYSTEM
    // ==========================================
    
    // Shared language-utils repo base URL
    const LANG_UTILS_BASE = 'https://celeritas7.github.io/language-utils';

    // Registry of language converters
    const LanguageConverters = {};

    // Language code → file name + type mapping
    const LANG_FILES = {
      my: { file: 'burmese', type: 'standard' },
      zh: { file: 'chinese', type: 'chinese' },
      si: { file: 'sinhala', type: 'standard' },
      te: { file: 'telugu', type: 'standard' },
      ta: { file: 'tamil', type: 'standard' },
      ko: { file: 'korean', type: 'standard' },
      th: { file: 'thai', type: 'standard' },
      ms: { file: 'malay', type: 'standard' },
      mr: { file: 'marathi', type: 'standard' },
    };

    // Load a language converter from the shared repo via fetch
    async function loadLanguageConverter(langCode) {
      const info = LANG_FILES[langCode];
      if (!info) return null;
      if (LanguageConverters[langCode]) return LanguageConverters[langCode];

      try {
        const res = await fetch(`${LANG_UTILS_BASE}/${info.file}.js`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        let code = await res.text();
        // Strip ES module export keywords so code runs in browser
        code = code.replace(/export\s+function\s+/g, 'function ');
        code = code.replace(/export\s+\{[^}]*\};?/g, '');
        code = code.replace(/export\s+const\s+/g, 'const ');
        // Wrap and execute to extract toDev function
        const wrapper = new Function(`${code}\nreturn { toDev: typeof toDev === 'function' ? toDev : null, toRoman: typeof toRoman === 'function' ? toRoman : null, breakSyllables: typeof breakSyllables === 'function' ? breakSyllables : null };`);
        const mod = wrapper();
        const converter = {
          toDevanagari: mod.toDev || ((t) => t),
          toRoman: mod.toRoman || ((t) => t),
          breakSyllables: mod.breakSyllables || null,
          usePronunciation: info.type === 'chinese',
        };
        LanguageConverters[langCode] = converter;
        console.log(`✓ ${info.file} converter loaded from language-utils`);
        return converter;
      } catch (e) {
        console.warn(`⚠ Failed to load ${info.file}.js:`, e.message);
        return null;
      }
    }

    // Load all converters at startup
    async function loadAllConverters() {
      await Promise.all(Object.keys(LANG_FILES).map(loadLanguageConverter));
    }
    loadAllConverters();

    // Get converter for a language code
    function getConverter(langCode) {
      return LanguageConverters[langCode] || null;
    }

    // Convert text to Devanagari
    function convertToDevanagari(text, langCode) {
      const converter = getConverter(langCode);
      if (converter) {
        return converter.toDevanagari(text);
      }
      return text;
    }

    // Convert text to Roman
    function convertToRoman(text, langCode) {
      const converter = getConverter(langCode);
      if (converter) {
        return converter.toRoman(text);
      }
      return text;
    }

    // ==========================================
    // SUPABASE CLIENT
    // ==========================================
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const getImageUrl = (topicId, filename) => {
      if (!filename) return null;
      if (filename.startsWith('http')) return filename;
      return `${SUPABASE_URL}/storage/v1/object/public/${STORAGE_BUCKET}/${topicId}/${filename}`;
    };

    // ==========================================
    // CONSTANTS
    // ==========================================
    const RATINGS = [
      { id: 1, emoji: '✓', label: 'Monthly Review', description: 'Know well', color: 'bg-green-500', textColor: 'text-green-500' },
      { id: 2, emoji: '💬', label: "Can't use in conversation", description: 'Recognition only', color: 'bg-blue-500', textColor: 'text-blue-500' },
      { id: 3, emoji: '✍', label: "Can't write", description: 'Speaking only', color: 'bg-yellow-500', textColor: 'text-yellow-500' },
      { id: 4, emoji: '🤔', label: "Understand but can't use", description: 'Passive', color: 'bg-orange-500', textColor: 'text-orange-500' },
      { id: 5, emoji: '❌', label: "Don't know", description: 'Need to learn', color: 'bg-red-500', textColor: 'text-red-500' },
    ];

    const QUIZ_TYPES = [
      { id: 'native_to_image', label: 'Native → Image', icon: '🔤' },
      { id: 'image_to_native', label: 'Image → Native', icon: '🖼️' },
      { id: 'devanagari_to_image', label: 'Devanagari → Image', icon: '🕉️' },
      { id: 'english_to_native', label: 'English → Native', icon: '🌐' },
      { id: 'listen_to_image', label: 'Listen → Image', icon: '🔊' },
      { id: 'listen_to_native', label: 'Listen → Native', icon: '👂' },
      { id: 'word_builder', label: 'Build the Word', icon: '🧩' },
      { id: 'type_word', label: 'Type the Word', icon: '⌨️' },
    ];

    // Languages whose native script IS Devanagari: no separate Devanagari line / quiz (Phase 11: Marathi)
    const NO_DEVANAGARI_LANGS = ['mr'];

    const DAILY_TARGET_OPTIONS = [5, 10, 15, 20, 25, 30, 50, 0];

    // Unlock rule (Phase 8b): a word is "done" once it has been answered, right or wrong,
    // UNLOCK_MIN_ATTEMPTS times in EACH of these quiz types (since the learner's last reset).
    // Build the Word counts toward strength but is not required for unlocking.
    // Phase 9 step 3: 2× in each of 6 types (adds the two Listen quizzes). Topics already completed stay completed.
    const UNLOCK_MIN_ATTEMPTS = 2;
    const UNLOCK_QUIZ_TYPES = ['native_to_image', 'image_to_native', 'devanagari_to_image', 'english_to_native', 'listen_to_image', 'listen_to_native'];
    const UNLOCK_RULE_TEXT = `${UNLOCK_MIN_ATTEMPTS}× in each of the ${UNLOCK_QUIZ_TYPES.length} quiz types`;

    const LANGUAGE_FONTS = {
      my: 'font-burmese',
      ja: 'font-japanese',
      zh: 'font-chinese',
      te: 'font-devanagari',
      si: 'font-sinhala',
      ta: 'font-tamil',
      ko: 'font-korean',
      th: 'font-thai',
      mr: 'font-devanagari',
    };

    const getRatingById = (id) => RATINGS.find(r => r.id === id);

    // ==========================================
    // AUDIO (Phase 9): engine lives in js/kg-audio.js
    // ==========================================
    const useAudioState = () => React.useSyncExternalStore(window.KGAudio.subscribe, window.KGAudio.getVersion);

    // 🔊 (+ optional 🐢). A span, not a button, so it can sit inside quiz option buttons and clickable cards.
    function SpeakButton({ text, lang, slow = false, size = 'md', className = '' }) {
      useAudioState();
      const A = window.KGAudio;
      if (!text) return null;
      const avail = A.has(text, lang);
      const dims = { sm: 'w-7 h-7 text-sm', md: 'w-9 h-9 text-base', lg: 'w-11 h-11 text-xl' }[size];
      const tap = (isSlow) => (e) => {
        e.stopPropagation(); e.preventDefault();
        if (avail === true) A.play(text, lang, { slow: isSlow });
        else if (avail === false) A.toast('No audio for this yet');
      };
      const onKey = (isSlow) => (e) => { if (e.key === 'Enter' || e.key === ' ') tap(isSlow)(e); };
      const cls = (st) => `${dims} inline-flex items-center justify-center rounded-full select-none cursor-pointer transition-all ${
        avail === false ? 'border-2 border-dashed border-gray-300 text-gray-400 bg-white'
        : st === 'playing' ? 'bg-jade-600 text-white shadow-md scale-105'
        : (st === 'loading' || avail === 'loading') ? 'bg-jade-50 text-jade-400 animate-pulse'
        : 'bg-jade-50 text-jade-700 hover:bg-jade-100 active:scale-95'}`;
      return (
        <span className={`inline-flex items-center gap-1.5 align-middle ${className}`}>
          <span role="button" tabIndex={0} aria-label="Play audio" title={avail === false ? 'No audio for this yet' : 'Play'}
            onClick={tap(false)} onKeyDown={onKey(false)} className={cls(A.stateOf(text, lang, false))}>
            {avail === false ? '🔇' : '🔊'}
          </span>
          {slow && avail !== false && (
            <span role="button" tabIndex={0} aria-label="Play slowly" title="Play slowly"
              onClick={tap(true)} onKeyDown={onKey(true)} className={cls(A.stateOf(text, lang, true))}>🐢</span>
          )}
        </span>
      );
    }

    // Header: ♀/♂ voice + auto-play mute. Saved on the account (kg_chart_user_prefs).
    function AudioControls() {
      useAudioState();
      const A = window.KGAudio;
      const p = A.prefs;
      return (
        <div className="flex items-center bg-white/20 rounded-lg border border-white/30 overflow-hidden">
          <button onClick={() => A.setPrefs({ voice: p.voice === 'f' ? 'm' : 'f' })}
            title={`Voice: ${p.voice === 'f' ? 'female' : 'male'} (tap to switch)`}
            className="px-3 py-2 hover:bg-white/20 font-bold">{p.voice === 'f' ? '♀' : '♂'}</button>
          <button onClick={() => A.setPrefs({ muted: !p.muted })}
            title={p.muted ? 'Auto-play off (🔊 buttons still work)' : 'Auto-play on'}
            className="px-3 py-2 hover:bg-white/20 border-l border-white/30">{p.muted ? '🔇' : '🔈'}</button>
        </div>
      );
    }

    // ==========================================
    // AUTH CONTEXT
    // ==========================================
    const AuthContext = createContext({});
    const useAuth = () => useContext(AuthContext);

    function AuthProvider({ children }) {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [authError, setAuthError] = useState('');
      const verifiedRef = React.useRef(null);

      // Only approved emails (kg_chart_allowed_emails) or the admin may stay signed in.
      const verify = async (session) => {
        const u = session?.user ?? null;
        if (!u) { verifiedRef.current = null; setUser(null); return; }
        if (verifiedRef.current === u.id) { setUser(u); return; }
        if (u.id !== ADMIN_USER_ID) {
          const { data, error } = await supabase.rpc('kg_chart_is_allowed');
          if (error || data !== true) {
            setAuthError(error
              ? `Couldn't verify access: ${error.message}`
              : `${u.email || 'This account'} isn't approved for KG Chart. Ask the admin to add your email.`);
            verifiedRef.current = null;
            setUser(null);
            await supabase.auth.signOut();
            return;
          }
        }
        verifiedRef.current = u.id;
        setAuthError('');
        setUser(u);
      };

      useEffect(() => {
        supabase.auth.getSession().then(async ({ data: { session } }) => {
          await verify(session);
          setLoading(false);
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setTimeout(() => verify(session), 0); // defer: no Supabase calls inside the auth callback
        });

        return () => subscription.unsubscribe();
      }, []);

      const signInWithEmail = async (email, password) => {
        return await supabase.auth.signInWithPassword({ email, password });
      };

      const signUpWithEmail = async (email, password) => {
        return await supabase.auth.signUp({ email, password });
      };

      const signOut = async () => {
        return await supabase.auth.signOut();
      };

      const signInWithGoogle = async () => {
        return await supabase.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: window.location.origin + window.location.pathname }
        });
      };

      return (
        <AuthContext.Provider value={{ user, loading, authError, signInWithEmail, signUpWithEmail, signOut, signInWithGoogle }}>
          {!loading && children}
        </AuthContext.Provider>
      );
    }

    // ==========================================
    // DATA HOOKS
    // ==========================================
    function useLanguages() {
      const [languages, setLanguages] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        supabase
          .from(TABLES.languages)
          .select('*')
          .eq('is_active', true)
          .order('sort_order')
          .then(({ data, error }) => {
            if (!error) setLanguages(data || []);
            setLoading(false);
          });
      }, []);

      return { languages, loading };
    }

    function useTopics(languageCode) {
      const [topics, setTopics] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        if (!languageCode) return;
        setLoading(true);

        supabase
          .from(TABLES.topics)
          .select(`*, translations:${TABLES.topicTranslations}(*)`)
          .order('sort_order')
          .then(({ data, error }) => {
            if (!error && data) {
              const mapped = data.map(topic => {
                const translation = topic.translations?.find(t => t.language_code === languageCode);
                if (!translation) return { ...topic, translation: null };

                const converter = getConverter(languageCode);
                const usesPronunciation = converter?.usePronunciation;

                // Chinese: convert from pinyin column if available
                const titleSource = usesPronunciation
                  ? (translation.pinyin || translation.title_native)
                  : translation.title_native;

                const questionSource = usesPronunciation
                  ? (translation.pinyin_question || translation.question_native)
                  : translation.question_native;

                return {
                  ...topic,
                  translation: {
                    ...translation,
                    title_devanagari: convertToDevanagari(titleSource, languageCode),
                    question_devanagari: convertToDevanagari(questionSource, languageCode)
                  }
                };
              }).filter(t => t.translation);
              setTopics(mapped);
            }
            setLoading(false);
          });
      }, [languageCode]);

      return { topics, loading };
    }

    // Chinese: convert from the pinyin pronunciation field; Burmese/others: from native_text
    function autoDevanagari(translation, languageCode) {
      const usesPronunciation = getConverter(languageCode)?.usePronunciation;
      const sourceText = usesPronunciation ? (translation?.pronunciation?.pinyin || '') : (translation?.native_text || '');
      return convertToDevanagari(sourceText, languageCode);
    }

    function useVocabulary(languageCode) {
      const [vocabulary, setVocabulary] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        if (!languageCode) return;
        setLoading(true);

        supabase
          .from(TABLES.vocabulary)
          .select(`*, translations:${TABLES.vocabularyTranslations}(*)`)
          .order('sort_order')
          .then(({ data, error }) => {
            if (!error && data) {
              const mapped = data.map(vocab => {
                const translation = vocab.translations?.find(t => t.language_code === languageCode);
                if (!translation) return { ...vocab, translation: null };

                const converter = getConverter(languageCode);
                const usesPronunciation = converter?.usePronunciation;

                // DB override → converter fallback
                // If devanagari column has a human-verified value, use it.
                // Otherwise auto-generate from the JS converter.
                const generatedDev = autoDevanagari(translation, languageCode);
                const devanagari = translation.devanagari || generatedDev;
                const isDevOverridden = !!translation.devanagari;

                // Build pronunciation display
                // For pronunciation-based langs: keep DB pronunciation + add devanagari info
                // For char-based langs: generate roman from native text
                const pronunciation = usesPronunciation
                  ? { ...(translation.pronunciation || {}), roman: translation.pronunciation?.pinyin || '' }
                  : { roman: convertToRoman(translation.native_text, languageCode) };
                // Latin-script languages (Malay): the roman form is the word itself, so don't show it twice
                if (pronunciation.roman === translation.native_text) delete pronunciation.roman;

                return {
                  ...vocab,
                  translation: { ...translation, devanagari, isDevOverridden, pronunciation }
                };
              }).filter(v => v.translation);
              setVocabulary(mapped);
            }
            setLoading(false);
          });
      }, [languageCode]);

      return { vocabulary, loading };
    }

    function useUserRatings(languageCode) {
      const { user } = useAuth();
      const [ratings, setRatings] = useState({});

      useEffect(() => {
        if (!user || !languageCode) return;

        supabase
          .from(TABLES.userRatings)
          .select('*')
          .eq('user_id', user.id)
          .eq('language_code', languageCode)
          .then(({ data }) => {
            const map = {};
            (data || []).forEach(r => { map[r.vocabulary_id] = r; });
            setRatings(map);
          });
      }, [user, languageCode]);

      const updateRating = useCallback(async (vocabularyId, rating) => {
        if (!user) return false;

        const now = new Date().toISOString();
        const { error } = await supabase
          .from(TABLES.userRatings)
          .upsert({
            user_id: user.id,
            vocabulary_id: vocabularyId,
            language_code: languageCode,
            rating,
            last_reviewed_at: now,
          }, { onConflict: 'user_id,vocabulary_id,language_code' });

        if (!error) {
          setRatings(prev => ({
            ...prev,
            [vocabularyId]: { ...prev[vocabularyId], rating, last_reviewed_at: now }
          }));
        }
        return !error;
      }, [user, languageCode]);

      return { ratings, updateRating };
    }

    // ==========================================
    // COMPONENTS
    // ==========================================

    function LoadingSpinner({ message = 'Loading...' }) {
      return (
        <div className="flex flex-col items-center justify-center py-12">
          <div className="relative w-16 h-16">
            <div className="absolute inset-0 border-4 border-jade-200 rounded-full"></div>
            <div className="absolute inset-0 border-4 border-jade-600 rounded-full border-t-transparent animate-spin"></div>
          </div>
          <p className="mt-4 text-gray-500 font-medium">{message}</p>
        </div>
      );

    function AuthModal({ onClose }) {
      const { signInWithEmail, signUpWithEmail, signInWithGoogle, authError } = useAuth();
      const [isSignUp, setIsSignUp] = useState(false);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);
      const [showEmailForm, setShowEmailForm] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);
        const { error } = isSignUp
          ? await signUpWithEmail(email, password)
          : await signInWithEmail(email, password);
        if (error) setError(error.message);
        else onClose();
        setLoading(false);
      };

      const handleGoogle = async () => {
        setError('');
        setLoading(true);
        const { error } = await signInWithGoogle();
        if (error) { setError(error.message); setLoading(false); }
        // OAuth redirects away, so no need to setLoading(false) on success
      };

      return (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50" onClick={onClose}>
          <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl animate-scale-in" onClick={e => e.stopPropagation()}>

              </div>
              <h2 className="text-2xl font-bold text-gray-900">
                {isSignUp ? 'Create Account' : 'Welcome Back'}

            {(error || authError) && (
              <div className="bg-red-50 text-red-600 px-4 py-3 rounded-lg mb-4 text-sm">{error || authError}</div>
            )}

            <button onClick={handleGoogle} disabled={loading}
              className="w-full py-3 bg-white border-2 border-gray-200 rounded-xl font-semibold text-gray-700 hover:bg-gray-50 hover:border-gray-300 transition flex items-center justify-center gap-3 mb-4 disabled:opacity-50">
              <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
              Continue with Google
            </button>

            {!showEmailForm ? (
              <button onClick={() => setShowEmailForm(true)}
                className="w-full py-2 text-sm text-gray-400 hover:text-gray-600 transition">
                or use email & password
              </button>
            ) : (
              <>
                <div className="flex items-center gap-3 my-4">
                  <div className="flex-1 h-px bg-gray-200"></div>
                  <span className="text-xs text-gray-400 uppercase">or</span>
                  <div className="flex-1 h-px bg-gray-200"></div>
                </div>

                <form onSubmit={handleSubmit} className="space-y-4">
                  <input type="email" value={email} onChange={(e) => setEmail(e.target.value)}
                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-jade-500"
                    placeholder="Email" required />
                  <input type="password" value={password} onChange={(e) => setPassword(e.target.value)}
                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-jade-500"
                    placeholder="Password" required minLength={6} />
                  <button type="submit" disabled={loading}
                    className="w-full py-3 bg-jade-600 text-white rounded-lg font-semibold hover:bg-jade-700 transition disabled:opacity-50">
                    {loading ? 'Loading...' : (isSignUp ? 'Create Account' : 'Sign In')}
                  </button>
                </form>

                <p className="text-center text-sm text-gray-500 mt-4">
                  {isSignUp ? 'Have an account?' : "No account?"}
                  <button onClick={() => setIsSignUp(!isSignUp)} className="text-jade-600 font-medium ml-1 hover:underline">
                    {isSignUp ? 'Sign In' : 'Sign Up'}

                </p>

            )}
          </div>
        </div>
      );

    function TopicNav({ topics, activeTopic, onSelect, showEnglish, pathStatus }) {
      const scrollRef = React.useRef(null);
      const [canScrollRight, setCanScrollRight] = useState(false);
      const [canScrollLeft, setCanScrollLeft] = useState(false);

      const checkScroll = useCallback(() => {
        const el = scrollRef.current;
        if (!el) return;
        setCanScrollLeft(el.scrollLeft > 10);
        setCanScrollRight(el.scrollLeft < el.scrollWidth - el.clientWidth - 10);
      }, []);

      useEffect(() => {
        checkScroll();
        const el = scrollRef.current;
        if (el) el.addEventListener('scroll', checkScroll);
        window.addEventListener('resize', checkScroll);
        return () => { if (el) el.removeEventListener('scroll', checkScroll); window.removeEventListener('resize', checkScroll); };
      }, [topics, checkScroll]);

      useEffect(() => {
        const el = scrollRef.current;
        if (!el) return;
        const activeBtn = el.querySelector('[data-active="true"]');
        if (activeBtn) activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }, [activeTopic]);

      return (
        <div className="bg-white border-b sticky top-0 z-30 shadow-sm">
          <div className="max-w-7xl mx-auto px-2 relative">
            {canScrollLeft && <div className="absolute left-0 top-0 bottom-0 w-8 bg-gradient-to-r from-white to-transparent z-10 pointer-events-none" />}
            <div ref={scrollRef} className="flex overflow-x-auto py-3 gap-2 scrollbar-hide">
              {topics.map((topic) => (
                <button key={topic.id} data-active={activeTopic === topic.id ? 'true' : 'false'} onClick={() => onSelect(topic.id)}
                  className={`px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap transition-all flex items-center gap-2 ${
                    activeTopic === topic.id ? (topic.locked ? 'bg-gray-400 text-white shadow-lg' : 'bg-jade-600 text-white shadow-lg') : topic.locked ? 'bg-gray-50 text-gray-400 hover:bg-gray-100' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                  }`}>
                  <span className={topic.locked ? 'grayscale opacity-60' : ''}>{topic.locked ? '🔒' : topic.icon}</span>
                  <span>{showEnglish ? slugToLabel(topic.id) : (topic.translation?.title_native || slugToLabel(topic.id))}</span>
                  {pathStatus?.[topic.id] && !pathStatus[topic.id].empty && (
                    <span className="text-xs opacity-70">{pathStatus[topic.id].complete ? '✓' : `${pathStatus[topic.id].faced}/${pathStatus[topic.id].total}`}</span>
                  )}
                </button>
              ))}
            </div>
            {canScrollRight && <div className="absolute right-0 top-0 bottom-0 w-8 bg-gradient-to-l from-white to-transparent z-10 pointer-events-none" />}
          </div>
        </div>
      );
    }

    function DetailModal({ item, topicId, rating, onRate, onClose, onFlag, fontClass, languageCode }) {
      const { user } = useAuth();
      const [imageError, setImageError] = useState(false);
      const [editingDev, setEditingDev] = useState(false);
      const [devValue, setDevValue] = useState(item.translation?.devanagari || '');
      const [saving, setSaving] = useState(false);
      const [saved, setSaved] = useState(false);
      const colorCode = item.extra_data?.colorCode;
      const pronunciation = item.translation?.pronunciation || {};
      const isOverridden = item.translation?.isDevOverridden;

      const saveDevanagari = async () => {
        setSaving(true);
        const val = devValue.trim() || null;
        const { error } = await supabase
          .from(TABLES.vocabularyTranslations)
          .update({ devanagari: val, updated_at: new Date().toISOString() })
          .eq('vocabulary_id', item.id)
          .eq('language_code', languageCode);
        setSaving(false);
        if (error) { console.error(error); return; }
        item.translation.devanagari = val || item.translation.devanagari;
        item.translation.isDevOverridden = !!val;
        setSaved(true);
        setEditingDev(false);
        setTimeout(() => setSaved(false), 2000);
      };

      const clearOverride = async () => {
        setSaving(true);
        const { error } = await supabase
          .from(TABLES.vocabularyTranslations)
          .update({ devanagari: null, updated_at: new Date().toISOString() })
          .eq('vocabulary_id', item.id)
          .eq('language_code', languageCode);
        setSaving(false);
        if (error) { console.error(error); return; }
        item.translation.devanagari = autoDevanagari(item.translation, languageCode);
        item.translation.isDevOverridden = false;
        setDevValue(item.translation.devanagari);
        setEditingDev(false);
        setSaved(true);
        setTimeout(() => setSaved(false), 2000);
      };

      return (
        <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50" onClick={onClose}>
          <div className="bg-white rounded-3xl max-w-lg w-full p-8 shadow-2xl animate-scale-in" onClick={e => e.stopPropagation()}>

              {editingDev ? (
                <div className="mb-3">

                      <button onClick={clearOverride} disabled={saving}

                  <span className="text-2xl text-blue-600 font-devanagari">{item.translation?.devanagari}</span>

    const FLAG_REASONS = [
      { id: 'wrong_word', emoji: '❌', label: 'Wrong/Incorrect Word' },

      { id: 'needs_review', emoji: '🤔', label: 'Needs Review / Unsure' },
    ];

    function FlagModal({ item, languageCode, onClose }) {
      const [selectedReason, setSelectedReason] = useState('');
      const [notes, setNotes] = useState('');
      const [submitting, setSubmitting] = useState(false);
      const [submitted, setSubmitted] = useState(false);
      const [errMsg, setErrMsg] = useState('');

      const handleSubmit = async () => {
        if (!selectedReason) return;
        setSubmitting(true);
        const { error } = await supabase.from('kg_chart_flags').insert({
          vocabulary_id: item.id,
          language_code: languageCode,
          reason: selectedReason,
          notes: notes.trim() || null,
          status: 'open',
        });
        setSubmitting(false);
        if (error) { console.error(error); setErrMsg(error.message || 'Could not save flag'); return; }
        setSubmitted(true);
        setTimeout(onClose, 1500);
      };

      return (
        <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50" onClick={onClose}>
          <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl animate-scale-in" onClick={e => e.stopPropagation()}>
            {submitted ? (
              <div className="text-center py-8">
                <div className="text-5xl mb-4">✅</div>
                <h3 className="text-xl font-bold text-gray-800">Flag Submitted</h3>
                <p className="text-gray-500 mt-2">Thank you! This will be reviewed in the admin panel.</p>
              </div>
            ) : (
              <>
                <div className="text-center mb-6">
                  <div className="w-14 h-14 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-3">
                    <span className="text-2xl">🚩</span>
                  </div>
                  <h3 className="text-xl font-bold text-gray-800">Report Issue</h3>
                  <p className="text-gray-500 text-sm mt-1">Flag "{item.english_text}" for review</p>
                </div>
                <div className="space-y-2 mb-4">
                  {FLAG_REASONS.map(r => (
                    <button key={r.id} onClick={() => setSelectedReason(r.id)}
                      className={`w-full px-4 py-3 rounded-xl text-left text-sm font-medium transition-all flex items-center gap-3 ${
                        selectedReason === r.id ? 'bg-red-50 text-red-700 ring-2 ring-red-300' : 'bg-gray-50 text-gray-700 hover:bg-gray-100'
                      }`}>
                      <span className="text-lg">{r.emoji}</span>{r.label}
                    </button>
                  ))}

    function BatchFlagModal({ items, languageCode, onClose, onDone }) {
      const [selectedReason, setSelectedReason] = useState('');

      const [progress, setProgress] = useState(0);

      const handleSubmit = async () => {
        if (!selectedReason) return;
        setSubmitting(true);
        const flags = items.map(item => ({
          vocabulary_id: item.id,
          language_code: languageCode,
          reason: selectedReason,
          notes: notes.trim() || null,
          status: 'open',
        }));

        let completed = 0, failed = 0, lastErr = null;
        // Insert in batches of 10
        for (let i = 0; i < flags.length; i += 10) {
          const batch = flags.slice(i, i + 10);
          const { error } = await supabase.from('kg_chart_flags').insert(batch);
          if (error) { console.error(error); failed += batch.length; lastErr = error; }
          completed += batch.length;
          setProgress(Math.round((completed / flags.length) * 100));
        }
        if (failed) { setSubmitting(false); setFailMsg(`${failed} of ${flags.length} flags not saved — ${lastErr.message}`); return; }

    // ==========================================
    // LISTEN QUIZZES (Phase 9 step 3): clips come from js/kg-audio.js
    // ==========================================
    const LISTEN_TYPES = ['listen_to_image', 'listen_to_native'];
    const languageName = (langCode) => {
      try { return new Intl.DisplayNames(['en'], { type: 'language' }).of(langCode) || langCode; } catch (e) { return langCode; }
    };
    // Listen quizzes play even when auto-play is muted, and never toast
    const playListen = (text, lang, slow = false) => { if (text) window.KGAudio.play(text, lang, { slow, silent: true }); };

    // ==========================================
    // WORD BUILDER QUIZ
    // ==========================================
    const WB_STORAGE_KEY = 'kg_chart_word_builder';
    const WB_DEFAULTS = { prompt: 'mix', split: 'chars', tiles: 'distractors', distractors: 4, feedback: 'end', hints: true };
    const isCombiningMark = (s) => /^\p{M}/u.test(s);
    const tileLabel = (s) => (isCombiningMark(s) ? '\u25CC' + s : s);
    const shuffleArr = (arr) => {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    };

    // Characters: one tile per code point (consonants, vowel signs, medials, asat…). ZWJ/ZWNJ stay on the previous piece.
    function splitIntoChars(text) {
      const out = [];
      for (const ch of Array.from((text || '').normalize('NFC'))) {
        if (/\s/.test(ch)) continue;
        if ((ch === '\u200D' || ch === '\u200C') && out.length) { out[out.length - 1] += ch; continue; }
        out.push(ch);
      }
      return out;
    }

    // Syllables: language-utils breakSyllables() when available, else grapheme clusters.
    function splitIntoSyllables(text, langCode) {
      const conv = getConverter(langCode);
      const words = (text || '').normalize('NFC').split(/\s+/).filter(Boolean);
      const out = [];
      for (const w of words) {
        let parts = null;
        if (conv?.breakSyllables) {
          try {
            const r = conv.breakSyllables(w);
            parts = Array.isArray(r) ? r : typeof r === 'string' ? r.split(/[\s·|\-]+/) : null;
            parts = parts ? parts.map(p => String(p)).filter(Boolean) : null;
            if (parts && parts.join('') !== w) parts = null; // must rebuild the exact word
          } catch (e) { parts = null; }
        }
        if (!parts && typeof Intl !== 'undefined' && Intl.Segmenter) {
          parts = Array.from(new Intl.Segmenter(undefined, { granularity: 'grapheme' }).segment(w), s => s.segment);
        }
        out.push(...(parts || splitIntoChars(w)));
      }
      return out;
    }

    const splitWord = (text, mode, langCode) => (mode === 'syllables' ? splitIntoSyllables(text, langCode) : splitIntoChars(text));

    function WbOption({ label, value, options, onChange }) {
      return (
        <div>
          <div className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">{label}</div>

            ))}
          </div>
        </div>
      );
    }

    function WordBuilderRound({ item, index, total, score, settings, languageCode, unitPool, onBack, onAnswered, onNext }) {
      const fontClass = LANGUAGE_FONTS[languageCode] || 'font-body';
      const nativeText = item.translation?.native_text || '';
      const perTile = settings.feedback === 'tile';
      const [target] = useState(() => splitWord(nativeText, settings.split, languageCode));
      const hasImage = !!(item.extra_data?.colorCode || item.image_filename);
      const [promptKind] = useState(() =>
        settings.prompt === 'english' || !hasImage ? 'english'
          : settings.prompt === 'image' ? 'image'
          : (Math.random() < 0.5 ? 'image' : 'english'));
      const [imgFailed, setImgFailed] = useState(false);
      const showImage = promptKind === 'image' && !imgFailed;

      const [tiles] = useState(() => {
        const correct = target.map((t, i) => ({ key: 'c' + i, text: t }));
        let extra = [];
        if (settings.tiles === 'distractors') {
          const inWord = new Set(target);
          extra = shuffleArr(unitPool.filter(u => !inWord.has(u))).slice(0, Number(settings.distractors) || 0)
            .map((t, i) => ({ key: 'd' + i, text: t }));
        }
        let all = shuffleArr([...correct, ...extra]);
        for (let n = 0; n < 6 && all.length > 1 && all.map(t => t.text).join('') === target.join(''); n++) all = shuffleArr(all);
        return all;
      });
      const byKey = useMemo(() => Object.fromEntries(tiles.map(t => [t.key, t])), [tiles]);

      const [placed, setPlaced] = useState([]);
      const [hinted, setHinted] = useState([]);
      const [mistakes, setMistakes] = useState(0);
      const [result, setResult] = useState(null);

      const placedText = placed.map(k => byKey[k].text);
      const full = placed.length >= target.length;
      const rightAt = (i) => placedText[i] === target[i];

      // Any hint makes the word count as wrong, even if the finished word is right
      const finish = (correct, builtText, hintsUsed = hinted.length) => {
        if (result) return;
        const counted = correct && hintsUsed === 0;
        setResult({ correct: counted, solvedWithHints: correct && hintsUsed > 0 });
        onAnswered(counted, builtText);
        window.KGAudio.autoPlay(nativeText, languageCode);
      };

      const place = (key) => {
        if (result || full || placed.includes(key)) return;
        const next = [...placed, key];
        if (perTile && byKey[key].text !== target[placed.length]) setMistakes(m => m + 1);
        setPlaced(next);
        if (perTile && next.length === target.length && next.every((k, i) => byKey[k].text === target[i])) {
          finish(true, next.map(k => byKey[k].text).join(''));
        }
      };
      const remove = (key) => { if (!result) setPlaced(p => p.filter(k => k !== key)); };
      const clearAll = () => { if (!result) setPlaced([]); };
      const check = () => finish(placedText.length === target.length && placedText.every((t, i) => t === target[i]), placedText.join(''));
      const giveUp = () => finish(false, placedText.join(''));
      const hint = () => {
        if (result) return;
        let k = 0;
        while (k < placed.length && rightAt(k)) k++;
        if (k >= target.length) return;
        const keep = placed.slice(0, k);
        const tile = tiles.find(t => !keep.includes(t.key) && t.text === target[k]);
        if (!tile) return;
        const next = [...keep, tile.key];
        const nextHinted = [...hinted, tile.key];
        setPlaced(next);
        setHinted(nextHinted);
        if (next.length === target.length) finish(true, next.map(x => byKey[x].text).join(''), nextHinted.length);
      };

      useEffect(() => {
        const onKey = (e) => {
          if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
          if (result) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onNext(); } return; }
          if (e.key === 'Backspace' && placed.length) { e.preventDefault(); remove(placed[placed.length - 1]); }
          else if (e.key === 'Enter' && !perTile && full) { e.preventDefault(); check(); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      });

      const slotClass = (i) => {
        const k = placed[i];
        if (!k) return 'border-dashed border-gray-300 bg-gray-50';
        const judged = perTile || result;
        if (judged) return rightAt(i) ? 'border-green-500 bg-green-50 text-green-800' : 'border-red-500 bg-red-50 text-red-700';
        if (hinted.includes(k)) return 'border-amber-400 bg-amber-50';
        return 'border-jade-500 bg-jade-50';
      };
      const hasWrong = perTile && placed.some((_, i) => !rightAt(i));

      return (
        <div className="max-w-3xl mx-auto p-4">
          <div className="bg-white rounded-2xl shadow-lg p-4 mb-4">
            <div className="flex flex-wrap items-center justify-between gap-4">
              <button onClick={onBack} className="px-4 py-2 bg-gray-100 rounded-xl hover:bg-gray-200 font-medium">← Back</button>
              <div className="flex items-center gap-4">
                <div className="text-sm text-gray-500">{index + 1} / {total}</div>
                <div className="w-32 h-2 bg-gray-200 rounded-full overflow-hidden">
                  <div className="h-full bg-jade-500 transition-all duration-300" style={{ width: `${((index + 1) / total) * 100}%` }} />
                </div>
                <div className="bg-gradient-to-r from-jade-500 to-jade-600 text-white px-4 py-2 rounded-xl font-bold shadow-md">{score.correct}/{score.total}</div>
              </div>
            </div>
          </div>

          <div className="bg-white rounded-2xl shadow-lg p-6 mb-4 text-center">
            <div className="text-sm text-gray-400 mb-3">Build the word for:</div>
            {showImage ? (
              item.extra_data?.colorCode ? (
                <div className="w-24 h-24 rounded-xl shadow-lg mx-auto" style={{ backgroundColor: item.extra_data.colorCode }} />
              ) : (
                <div className="w-40 h-40 mx-auto flex items-center justify-center">
                  <img src={getImageUrl(item.topic_id, item.image_filename)} alt="" onError={() => setImgFailed(true)} className="max-w-full max-h-full object-contain" />
                </div>
              )
            ) : (
              <div className="text-3xl font-bold text-gray-800">{item.english_text}</div>
            )}
          </div>

          <div className="bg-white rounded-2xl shadow-lg p-6 mb-4">
            <div className="flex flex-wrap justify-center gap-2">
              {target.map((_, i) => {
                const k = placed[i];
                return (
                  <button key={i} onClick={() => k && remove(k)} disabled={!k || !!result}
                    title={k ? 'Tap to remove' : ''}
                    className={`min-w-[3.5rem] h-16 px-2 rounded-xl border-2 flex items-center justify-center text-3xl transition-all ${fontClass} ${slotClass(i)}`}>
                    {k ? tileLabel(byKey[k].text) : ''}
                  </button>
                );
              })}
            </div>
            <div className={`text-center mt-4 min-h-[3rem] text-4xl font-bold text-gray-800 ${fontClass}`}>
              {placed.length ? placedText.join('') : <span className="text-base font-normal text-gray-400 font-body">Tap the pieces below in order</span>}
            </div>
            {hasWrong && !result && <div className="text-center text-sm text-red-500 mt-1">Tap a red piece to remove it</div>}
          </div>

          {!result && (
            <>
              <div className="flex flex-wrap justify-center gap-3 mb-6">
                {tiles.map(t => {
                  const used = placed.includes(t.key);
                  return (
                    <button key={t.key} onClick={() => place(t.key)} disabled={used || full}
                      className={`min-w-[3.5rem] h-16 px-3 rounded-xl border-2 bg-white text-3xl shadow-sm transition-all ${fontClass} ${used ? 'opacity-20 border-gray-200' : 'border-gray-200 hover:border-jade-400 hover:shadow-md active:scale-95'} ${!used && full ? 'opacity-50' : ''}`}>
                      {tileLabel(t.text)}
                    </button>
                  );
                })}
              </div>
              {hinted.length > 0 && (
                <p className="text-center text-sm text-amber-700 mb-3">Hint used: this word will count as wrong.</p>
              )}
              <div className="flex flex-wrap justify-center gap-3">
                {settings.hints && (
                  <button onClick={hint} title="Using a hint marks this word wrong" className="px-5 py-3 bg-amber-50 text-amber-700 border-2 border-amber-200 rounded-xl font-medium hover:bg-amber-100">
                    💡 Hint{hinted.length ? ` (${hinted.length})` : ''}
                  </button>
                )}
                <button onClick={clearAll} disabled={!placed.length} className="px-5 py-3 bg-gray-100 rounded-xl font-medium hover:bg-gray-200 disabled:opacity-40">Clear</button>
                <button onClick={giveUp} className="px-5 py-3 bg-gray-100 rounded-xl font-medium hover:bg-gray-200">Show answer</button>
                {!perTile && (
                  <button onClick={check} disabled={!full} className="px-8 py-3 bg-jade-600 text-white rounded-xl font-bold hover:bg-jade-700 disabled:opacity-40">
                    Check <span className="text-jade-200 text-sm hidden sm:inline ml-1">↵</span>
                  </button>
                )}
              </div>
            </>
          )}

          {result && (
            <div className="bg-white rounded-2xl shadow-lg p-6 text-center animate-slide-up">
              <div className={`text-2xl font-bold mb-3 ${result.correct ? 'text-green-600' : result.solvedWithHints ? 'text-amber-600' : 'text-red-600'}`}>
                {result.correct ? '✅ Correct!' : result.solvedWithHints ? '💡 Solved with hints' : '❌ Not quite'}
              </div>
              {result.solvedWithHints && <div className="text-sm text-gray-500 -mt-2 mb-3">Counted as wrong because a hint was used.</div>}
              <div className={`text-4xl font-bold text-gray-800 ${fontClass}`}>{nativeText}</div>
              <div className="mt-3"><SpeakButton text={nativeText} lang={languageCode} slow size="lg" /></div>
              {item.translation?.devanagari && <div className="text-xl text-blue-600 font-devanagari mt-1">{item.translation.devanagari}</div>}
              <div className="text-sm text-gray-500 mt-1">{item.english_text}</div>
              {(mistakes > 0 || hinted.length > 0) && (
                <div className="text-xs text-gray-400 mt-2">
                  {[mistakes > 0 && `${mistakes} wrong tile${mistakes > 1 ? 's' : ''}`, hinted.length > 0 && `${hinted.length} hint${hinted.length > 1 ? 's' : ''}`].filter(Boolean).join(' · ')}
                </div>
              )}
              <button onClick={onNext} className="mt-5 px-8 py-3 bg-blue-600 text-white rounded-full font-bold hover:bg-blue-700">
                {index + 1 >= total ? 'See Results' : 'Next Word →'} <span className="text-blue-300 text-sm hidden sm:inline ml-1">↵</span>
              </button>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // TYPE THE WORD (Phase 10): learner types with the phone's own keyboard
    // ==========================================
    const TW_STORAGE_KEY = 'kg_type_word_settings';
    const TW_DEFAULTS = { level: 'copy', prompt: 'mix', feedback: 'end', hints: true, sound: false };
    const TW_LEVELS = [['copy', 'Copy'], ['dev', 'From Devanagari'], ['memory', 'From memory']];
    const twLevelFor = (level, lang) => (level === 'dev' && NO_DEVANAGARI_LANGS.includes(lang) ? 'copy' : level);
    const twGraphemes = (s) => (typeof Intl !== 'undefined' && Intl.Segmenter)
      ? Array.from(new Intl.Segmenter(undefined, { granularity: 'grapheme' }).segment(s || ''), x => x.segment)
      : Array.from(s || '');
    // Same rule for typed text and the stored word
    function twNorm(s, lang) {
      let t = (s || '').normalize('NFC').replace(/[\u200B-\u200D\uFEFF]/g, '').trim().replace(/\s+/g, ' ');
      t = t.replace(/[\u104B\u104A\u0964\u0965.,!?\uFF01\uFF1F\u3002\u3001]+$/u, '').trim();
      // Marathi: nasal consonant + virama before a consonant = anusvara (सन्त्रे → संत्रे)
      if (NO_DEVANAGARI_LANGS.includes(lang)) t = t.replace(/[\u0919\u091E\u0923\u0928\u092E]\u094D(?=[\u0915-\u0939])/g, '\u0902');
      return t;
    }
    // Japanese: also accept a kana reading if the pronunciation data has one
    function twAccepted(translation, lang) {
      const out = [translation?.native_text || ''];
      if (lang === 'ja' && translation?.pronunciation && typeof translation.pronunciation === 'object') {
        Object.values(translation.pronunciation).forEach(v => { if (typeof v === 'string' && /[\p{Script=Hiragana}\p{Script=Katakana}]/u.test(v)) out.push(v); });
      }
      return out.filter(Boolean);
    }

    function TypeWordRound({ item, index, total, score, settings, languageCode, trailingWrong, onBack, onAnswered, onNext }) {
      const fontClass = LANGUAGE_FONTS[languageCode] || 'font-body';
      const nativeText = item.translation?.native_text || '';
      const devText = item.translation?.devanagari || '';
      const showDev = !!devText && !NO_DEVANAGARI_LANGS.includes(languageCode) && devText !== nativeText;
      const level = twLevelFor(settings.level, languageCode);
      const live = settings.feedback === 'live';
      const target = useMemo(() => twGraphemes(twNorm(nativeText, languageCode)), [nativeText, languageCode]);
      const hasImage = !!(item.extra_data?.colorCode || item.image_filename);
      const promptKind = useMemo(() =>
        settings.prompt === 'english' || !hasImage ? 'english'
          : settings.prompt === 'image' ? 'image'
          : (Math.random() < 0.5 ? 'image' : 'english'), [item.id, index]);
      const [imgFailed, setImgFailed] = useState(false);
      const [value, setValue] = useState('');
      const [composing, setComposing] = useState(false);
      const [hints, setHints] = useState(0);
      const [result, setResult] = useState(null);
      const [practice, setPractice] = useState(null); // null | 'typing' | 'ok' | 'wrong'
      const inputRef = React.useRef(null);

      // Same input element across words so the phone keyboard stays open
      useEffect(() => {
        setValue(''); setHints(0); setResult(null); setPractice(null); setImgFailed(false); setComposing(false);
        inputRef.current?.focus();
      }, [item.id, index]);

      const typedG = twGraphemes(twNorm(value, languageCode));
      const isRight = (txt) => twAccepted(item.translation, languageCode).some(a => twNorm(a, languageCode) === twNorm(txt, languageCode));

      const finish = (correct) => {
        if (result) return;
        const counted = correct && hints === 0;
        setResult({ correct: counted, solvedWithHints: correct && hints > 0, typed: value });
        onAnswered(counted, value);
        window.KGAudio.autoPlay(nativeText, languageCode);
      };
      const check = () => {
        if (practice === 'typing' || practice === 'wrong') { setPractice(isRight(value) ? 'ok' : 'wrong'); return; }
        if (result) { onNext(); return; }
        if (!value.trim()) return;
        finish(isRight(value));
      };
      const hint = () => {
        if (result) return;
        let k = 0;
        while (k < typedG.length && k < target.length && typedG[k] === target[k]) k++;
        if (k >= target.length) return;
        setValue(target.slice(0, k + 1).join(''));
        setHints(h => h + 1);
        inputRef.current?.focus();
      };
      const retype = () => { setPractice('typing'); setValue(''); inputRef.current?.focus(); };
      const onKeyDown = (e) => {
        if (e.key !== 'Enter' || composing || e.nativeEvent.isComposing) return;
        e.preventDefault();
        if (practice === 'ok') { onNext(); return; }
        check();
      };
      const keep = (e) => e.preventDefault(); // tapping a button must not close the keyboard

      const charClass = (i) => (i >= target.length || typedG[i] !== target[i]) ? 'text-red-600 bg-red-50' : 'text-green-700';
      const inputLocked = !!result && !practice;
      const zawgyiHint = languageCode === 'my' && level === 'copy' && trailingWrong >= 3;

      const prompt = () => {
        if (level === 'copy') return (
          <>
            <div className="text-sm text-gray-400 mb-3">Type this word:</div>
            <div className={`text-4xl font-bold text-gray-800 ${fontClass}`}>{nativeText}</div>
            {showDev && <div className="text-xl text-blue-600 font-devanagari mt-1">{devText}</div>}
            <div className="mt-3"><SpeakButton text={nativeText} lang={languageCode} slow size="lg" /></div>
          </>
        );
        if (level === 'dev') return (
          <>
            <div className="text-sm text-gray-400 mb-3">Type it in {languageName(languageCode)} script:</div>
            {devText ? <div className="text-4xl font-bold text-blue-600 font-devanagari">{devText}</div> : <div className="text-3xl font-bold text-gray-800">{item.english_text}</div>}
            {devText && <div className="text-sm text-gray-500 mt-1">{item.english_text}</div>}
            <div className="mt-3"><SpeakButton text={nativeText} lang={languageCode} slow size="lg" /></div>
          </>
        );
        return (
          <>
            <div className="text-sm text-gray-400 mb-3">Type the word for:</div>
            {promptKind === 'image' && !imgFailed ? (
              item.extra_data?.colorCode ? (
                <div className="w-24 h-24 rounded-xl shadow-lg mx-auto" style={{ backgroundColor: item.extra_data.colorCode }} />
              ) : (
                <div className="w-40 h-40 mx-auto flex items-center justify-center">
                  <img src={getImageUrl(item.topic_id, item.image_filename)} alt="" onError={() => setImgFailed(true)} className="max-w-full max-h-full object-contain" />
                </div>
              )
            ) : (
              <div className="text-3xl font-bold text-gray-800">{item.english_text}</div>
            )}
            {settings.sound && <div className="mt-3"><SpeakButton text={nativeText} lang={languageCode} slow size="lg" /></div>}
          </>
        );
      };

      return (
        <div className="max-w-3xl mx-auto p-4">
          <div className="bg-white rounded-2xl shadow-lg p-4 mb-4">
            <div className="flex flex-wrap items-center justify-between gap-4">
              <button onClick={onBack} className="px-4 py-2 bg-gray-100 rounded-xl hover:bg-gray-200 font-medium">← Back</button>
              <div className="flex items-center gap-4">
                <div className="text-sm text-gray-500">{index + 1} / {total}</div>
                <div className="w-32 h-2 bg-gray-200 rounded-full overflow-hidden">
                  <div className="h-full bg-jade-500 transition-all duration-300" style={{ width: `${((index + 1) / total) * 100}%` }} />
                </div>
                <div className="bg-gradient-to-r from-jade-500 to-jade-600 text-white px-4 py-2 rounded-xl font-bold shadow-md">{score.correct}/{score.total}</div>
              </div>
            </div>
          </div>

          {!result && <div className="bg-white rounded-2xl shadow-lg p-6 mb-4 text-center">{prompt()}</div>}

          <div className="bg-white rounded-2xl shadow-lg p-6 mb-4">
            <input ref={inputRef} autoFocus value={value} readOnly={inputLocked}
              onChange={e => setValue(e.target.value)} onKeyDown={onKeyDown}
              onCompositionStart={() => setComposing(true)} onCompositionEnd={e => { setComposing(false); setValue(e.target.value); }}
              lang={languageCode} type="text" inputMode="text" enterKeyHint={result && !practice ? 'next' : 'done'}
              autoComplete="off" autoCorrect="off" autoCapitalize="none" spellCheck={false}
              placeholder={inputLocked ? '' : `Type in ${languageName(languageCode)}…`}
              className={`w-full text-center text-4xl font-bold px-4 py-4 rounded-xl border-2 outline-none transition-all ${fontClass} ${
                result ? (result.correct ? 'border-green-500 bg-green-50' : 'border-red-400 bg-red-50') : 'border-gray-200 focus:border-jade-500'}`} />
            {live && !result && value && !composing && (
              <div className={`flex flex-wrap justify-center gap-0.5 mt-3 text-3xl ${fontClass}`}>
                {typedG.map((g, i) => <span key={i} className={`px-0.5 rounded ${charClass(i)}`}>{g}</span>)}
              </div>
            )}
            {hints > 0 && !result && <p className="text-center text-sm text-amber-700 mt-3">Hint used: this word will count as wrong.</p>}
            {zawgyiHint && !result && (
              <p className="text-center text-sm text-gray-500 mt-3">Keep getting it wrong while copying? Your keyboard may be Zawgyi. Switch to a Unicode Myanmar keyboard (e.g. Gboard → Burmese).</p>
            )}
          </div>

          {!result && (
            <div className="flex flex-wrap justify-center gap-3">
              {settings.hints && (
                <button onPointerDown={keep} onClick={hint} title="Using a hint marks this word wrong" className="px-5 py-3 bg-amber-50 text-amber-700 border-2 border-amber-200 rounded-xl font-medium hover:bg-amber-100">
                  💡 Hint{hints ? ` (${hints})` : ''}
                </button>
              )}
              <button onPointerDown={keep} onClick={() => finish(false)} className="px-5 py-3 bg-gray-100 rounded-xl font-medium hover:bg-gray-200">Show word</button>
              <button onPointerDown={keep} onClick={check} disabled={!value.trim()} className="px-8 py-3 bg-jade-600 text-white rounded-xl font-bold hover:bg-jade-700 disabled:opacity-40">
                Check <span className="text-jade-200 text-sm hidden sm:inline ml-1">↵</span>
              </button>
            </div>
          )}

          {result && (
            <div className="bg-white rounded-2xl shadow-lg p-6 text-center animate-slide-up">
              <div className={`text-2xl font-bold mb-3 ${result.correct ? 'text-green-600' : result.solvedWithHints ? 'text-amber-600' : 'text-red-600'}`}>
                {result.correct ? '✅ Correct!' : result.solvedWithHints ? '💡 Solved with hints' : '❌ Not quite'}
              </div>
              {result.solvedWithHints && <div className="text-sm text-gray-500 -mt-2 mb-3">Counted as wrong because a hint was used.</div>}
              {!result.correct && !result.solvedWithHints && result.typed.trim() && (
                <div className="mb-3">
                  <div className="text-xs text-gray-400 uppercase tracking-wide mb-1">You typed</div>
                  <div className={`flex flex-wrap justify-center gap-0.5 text-3xl ${fontClass}`}>
                    {twGraphemes(twNorm(result.typed, languageCode)).map((g, i) => <span key={i} className={`px-0.5 rounded ${(i >= target.length || g !== target[i]) ? 'text-red-600 bg-red-50' : 'text-green-700'}`}>{g}</span>)}
                  </div>
                  <div className="text-xs text-gray-400 uppercase tracking-wide mt-3 mb-1">Correct</div>
                </div>
              )}
              <div className={`text-4xl font-bold text-gray-800 ${fontClass}`}>{nativeText}</div>
              <div className="mt-3"><SpeakButton text={nativeText} lang={languageCode} slow size="lg" /></div>
              {showDev && <div className="text-xl text-blue-600 font-devanagari mt-1">{devText}</div>}
              <div className="text-sm text-gray-500 mt-1">{item.english_text}</div>
              {practice === 'ok' && <div className="text-green-600 font-medium mt-3">✓ Typed correctly. Practice only, the score stays.</div>}
              {practice === 'wrong' && <div className="text-red-600 font-medium mt-3">Not yet. Try again or go on.</div>}
              <div className="flex flex-wrap justify-center gap-3 mt-5">
                {!result.correct && level !== 'copy' && practice !== 'ok' && (
                  practice ? (
                    <button onPointerDown={keep} onClick={check} disabled={!value.trim()} className="px-6 py-3 bg-jade-600 text-white rounded-full font-bold hover:bg-jade-700 disabled:opacity-40">Check retype</button>
                  ) : (
                    <button onPointerDown={keep} onClick={retype} className="px-6 py-3 bg-gray-100 rounded-full font-medium hover:bg-gray-200">✏️ Retype</button>
                  )
                )}
                <button onPointerDown={keep} onClick={onNext} className="px-8 py-3 bg-blue-600 text-white rounded-full font-bold hover:bg-blue-700">
                  {index + 1 >= total ? 'See Results' : 'Next Word →'} <span className="text-blue-300 text-sm hidden sm:inline ml-1">↵</span>
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function WordQuizView({ topics, vocabulary, poolVocabulary, ratings, onRate, languageCode, user, onSessionSaved, modeToggle }) {
      const pool = poolVocabulary || vocabulary;
      useAudioState();
      const savingRef = React.useRef(false);
      const [quizTopic, setQuizTopic] = useState('all');
      const [quizType, setQuizType] = useState('native_to_image');
      const isListen = LISTEN_TYPES.includes(quizType);
      const [dailyTarget, setDailyTarget] = useState(() => loadFromStorage(STORAGE_KEYS.quizTarget, 10));
      const [currentQuestion, setCurrentQuestion] = useState(null);
      const [options, setOptions] = useState([]);
      const [selectedAnswer, setSelectedAnswer] = useState(null);
      const [showResult, setShowResult] = useState(false);
      const [score, setScore] = useState({ correct: 0, total: 0 });
      const [quizStarted, setQuizStarted] = useState(false);
      const [quizWords, setQuizWords] = useState([]);
      const [currentWordIndex, setCurrentWordIndex] = useState(0);
      const [quizCompleted, setQuizCompleted] = useState(false);
      const [quizAnswers, setQuizAnswers] = useState([]);
      const [recentSessions, setRecentSessions] = useState([]);
      const [sessionSaved, setSessionSaved] = useState(false);

      const [wb, setWb] = useState(() => ({ ...WB_DEFAULTS, ...loadFromStorage(WB_STORAGE_KEY, {}) }));
      const setWbKey = (k, v) => setWb(s => ({ ...s, [k]: v }));
      const [tw, setTw] = useState(() => ({ ...TW_DEFAULTS, ...loadFromStorage(TW_STORAGE_KEY, {}) }));
      const setTwKey = (k, v) => setTw(s => ({ ...s, [k]: v }));
      const twLevel = twLevelFor(tw.level, languageCode);
      const isTyped = quizType === 'word_builder' || quizType === 'type_word';

      const fontClass = LANGUAGE_FONTS[languageCode] || 'font-body';
      const filteredVocab = useMemo(() => quizTopic === 'all' ? vocabulary : vocabulary.filter(v => v.topic_id === quizTopic), [vocabulary, quizTopic]);
      const playableVocab = useMemo(() => isTyped ? filteredVocab.filter(v => v.translation?.native_text?.trim()) : filteredVocab, [filteredVocab, quizType]);
      const [quizOptions, setQuizOptions] = useState([]);

      const wbUnitPool = useMemo(() => {
        if (quizType !== 'word_builder') return [];
        const set = new Set();
        pool.forEach(v => splitWord(v.translation?.native_text || '', wb.split, languageCode).forEach(u => set.add(u)));
        return [...set];
      }, [quizType, pool, wb.split, languageCode]);

      useEffect(() => { saveToStorage(STORAGE_KEYS.quizTarget, dailyTarget); }, [dailyTarget]);
      useEffect(() => { saveToStorage(WB_STORAGE_KEY, wb); }, [wb]);
      useEffect(() => { saveToStorage(TW_STORAGE_KEY, tw); }, [tw]);

      // Load recent quiz sessions
      useEffect(() => {
        if (!user) return;
        supabase
          .from(TABLES.quizSessions)
          .select('*')
          .eq('user_id', user.id)
          .eq('language_code', languageCode)
          .in('quiz_type', QUIZ_TYPES.map(q => q.id))
          .order('created_at', { ascending: false })
          .limit(5)
          .then(({ data }) => { if (data) setRecentSessions(data); });
      }, [user, languageCode, sessionSaved]);

      // Save the session once: on completion, or when leaving mid-quiz with answers (so every faced word counts)
      const persistSession = useCallback(async (sc, answers) => {
        if (!user || savingRef.current || sc.total === 0) return;
        savingRef.current = true;
        const sessionRow = {
          user_id: user.id,
          language_code: languageCode,
          topic_id: quizTopic === 'all' ? null : quizTopic,
          quiz_type: quizType,
          total_questions: sc.total,
          correct_answers: sc.correct,
          completed_at: new Date().toISOString(),
        };
        if (quizType === 'type_word') sessionRow.quiz_level = twLevel;
        let { data: session, error: sessionErr } = await supabase.from(TABLES.quizSessions).insert(sessionRow).select('id').single();
        // Fallback if kg-chart-phase10.sql (quiz_level column) hasn't been run yet
        if (sessionErr && sessionRow.quiz_level) {
          const { quiz_level, ...rest } = sessionRow;
          ({ data: session, error: sessionErr } = await supabase.from(TABLES.quizSessions).insert(rest).select('id').single());
        }
        if (!sessionErr && session && answers.length > 0) {
          const rows = answers.map(a => ({ ...a, session_id: session.id }));
          const { error: ansErr } = await supabase.from(TABLES.quizAnswers).insert(rows);
          // Fallback if the answer_text / answered_at columns haven't been added yet (users.sql / phase8b.sql)
          if (ansErr) await supabase.from(TABLES.quizAnswers).insert(rows.map(({ answer_text, answered_at, ...r }) => r));
        }
        setSessionSaved(true);
        if (onSessionSaved) onSessionSaved();
      }, [user, languageCode, quizTopic, quizType, twLevel, onSessionSaved]);

      useEffect(() => {
        if (quizCompleted && !sessionSaved) persistSession(score, quizAnswers);
      }, [quizCompleted]);

      // Leaving via a top tab (Chart/Cards/Progress) unmounts this view: save pending answers so faced words still count
      const pendingRef = React.useRef(null);
      pendingRef.current = quizStarted && !quizCompleted && quizAnswers.length ? { score, quizAnswers, persistSession } : null;
      useEffect(() => () => { const p = pendingRef.current; if (p) p.persistSession(p.score, p.quizAnswers); window.KGAudio.stop(); }, []);

      const startQuiz = useCallback(() => {
        const targetCount = dailyTarget === 0 ? playableVocab.length : Math.min(dailyTarget, playableVocab.length);
        const shuffled = shuffleArr(playableVocab);
        const selected = shuffled.slice(0, targetCount);
        // Freeze each question's options now so re-renders can't reshuffle them
        const frozen = selected.map(q => {
          const sameTopic = shuffleArr(filteredVocab.filter(v => v.id !== q.id));
          const otherTopics = shuffleArr(pool.filter(v => v.id !== q.id && v.topic_id !== q.topic_id));
          // Skip options that read the same as the answer or each other (Korean 배 = pear, ship, stomach)
          const textOf = v => (v.translation?.native_text || '').trim();
          const seen = new Set([textOf(q)]);
          const wrong = [];
          for (const v of [...sameTopic, ...otherTopics.filter(v => !sameTopic.includes(v))]) {
            const t = textOf(v);
            if (t && seen.has(t)) continue;
            if (t) seen.add(t);
            wrong.push(v);
            if (wrong.length === 3) break;
          }
          return shuffleArr([q, ...wrong]);
        });
        setQuizOptions(frozen);
        setQuizWords(selected);
        // Play inside the tap itself: phones block sound that doesn't start from a tap
        if (isListen && selected[0]) playListen(selected[0].translation?.native_text, languageCode);
        setCurrentWordIndex(0);
        setScore({ correct: 0, total: 0 });
        setQuizAnswers([]);
        savingRef.current = false;
        setSessionSaved(false);
        setQuizCompleted(false);
        setQuizStarted(true);
      }, [playableVocab, filteredVocab, pool, dailyTarget, isListen, languageCode]);

      const generateQuestion = useCallback(() => {
        if (pool.length < 4 || quizWords.length < 1 || currentWordIndex >= quizWords.length) {
          setQuizCompleted(true);
          return;
        }
        setCurrentQuestion(quizWords[currentWordIndex]);
        setOptions(quizOptions[currentWordIndex] || []);
        setSelectedAnswer(null);
        setShowResult(false);
      }, [quizWords, quizOptions, currentWordIndex, pool.length]);

      // Runs only when the quiz starts or the question index changes — not on every render
      useEffect(() => {
        if (quizStarted && quizWords.length >= 1 && pool.length >= 4 && !quizCompleted) generateQuestion();
      }, [quizStarted, quizWords, quizOptions, currentWordIndex, quizCompleted]);

      const handleAnswer = (item) => {
        if (showResult) return;
        setSelectedAnswer(item);
        setShowResult(true);
        window.KGAudio.autoPlay(currentQuestion.translation?.native_text, languageCode);
        const isCorrect = item.id === currentQuestion.id;
        setScore(prev => ({ correct: prev.correct + (isCorrect ? 1 : 0), total: prev.total + 1 }));
        // Track answer for session persistence
        setQuizAnswers(prev => [...prev, {
          vocabulary_id: currentQuestion.id,
          selected_vocabulary_id: item.id,
          is_correct: isCorrect,
          answered_at: new Date().toISOString(),
        }]);
        // Only auto-rate unrated words as "Don't know" — never overwrite an existing rating
        if (!isCorrect && user && !ratings[currentQuestion.id]?.rating) {
          onRate(currentQuestion.id, 5);
        }
      };

      const handleWbAnswer = (isCorrect, answerText) => {
        const item = quizWords[currentWordIndex];
        if (!item) return;
        setScore(prev => ({ correct: prev.correct + (isCorrect ? 1 : 0), total: prev.total + 1 }));
        setQuizAnswers(prev => [...prev, {
          vocabulary_id: item.id,
          selected_vocabulary_id: isCorrect ? item.id : null,
          is_correct: isCorrect,
          answer_text: answerText,
          answered_at: new Date().toISOString(),
        }]);
        if (!isCorrect && user && !ratings[item.id]?.rating) onRate(item.id, 5);
      };

      const nextQuestion = () => {
        if (currentWordIndex + 1 >= quizWords.length) { setQuizCompleted(true); return; }
        if (isListen) playListen(quizWords[currentWordIndex + 1]?.translation?.native_text, languageCode);
        setCurrentWordIndex(prev => prev + 1);
      };

      const leaveQuiz = () => {
        window.KGAudio.stop();
        if (!quizCompleted && quizAnswers.length) persistSession(score, quizAnswers);
        setQuizStarted(false);
      };

      // Keyboard support: 1-4 to pick answer, Enter/Space for next
      useEffect(() => {
        if (!quizStarted || quizCompleted || isTyped) return;
        const handleKey = (e) => {
          if (showResult) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); nextQuestion(); }
          } else {
            const num = parseInt(e.key);
            if (num >= 1 && num <= 4 && options[num - 1]) handleAnswer(options[num - 1]);
          }
          if ((e.key === 'r' || e.key === 'R') && isListen && currentQuestion) playListen(currentQuestion.translation?.native_text, languageCode);
        };
        window.addEventListener('keydown', handleKey);
        return () => window.removeEventListener('keydown', handleKey);
      }, [quizStarted, quizCompleted, showResult, options, currentQuestion]);

      if (!quizStarted) {
        return (
          <div className="max-w-2xl mx-auto p-6">
            <div className="bg-white rounded-3xl shadow-xl p-8">
              <div className="text-center mb-8">
                <div className="w-20 h-20 bg-jade-100 rounded-full flex items-center justify-center mx-auto mb-4">
                  <span className="text-4xl">🎯</span>
                </div>
                <h2 className="text-3xl font-bold text-gray-800">Quiz Mode</h2>
              </div>
              {modeToggle}

              <div className="space-y-6">
                <div>
                  <label className="block text-sm font-semibold text-gray-700 mb-2">Topic</label>
                  <select value={quizTopic} onChange={(e) => setQuizTopic(e.target.value)} className="w-full px-4 py-3 border rounded-xl">
                    <option value="all">{topics.some(t => t.locked) ? 'All unlocked topics' : 'All Topics'} ({vocabulary.length} words)</option>
                    {topics.map(t => {
                      const count = vocabulary.filter(v => v.topic_id === t.id).length;
                      return <option key={t.id} value={t.id} disabled={t.locked}>{t.locked ? '🔒' : t.icon} {t.translation?.title_native} {t.locked ? '(locked)' : `(${count})`}</option>;
                    })}
                  </select>
                </div>

                <div>
                  <label className="block text-sm font-semibold text-gray-700 mb-2">
                    Daily Target <span className="text-gray-400 font-normal ml-2">({dailyTarget === 0 ? 'All' : dailyTarget} words)</span>
                  </label>
                  <div className="grid grid-cols-4 gap-2">
                    {DAILY_TARGET_OPTIONS.map(target => (
                      <button key={target} onClick={() => setDailyTarget(target)}
                        className={`py-3 rounded-xl border-2 font-medium transition-all ${
                          dailyTarget === target ? 'border-jade-500 bg-jade-50 text-jade-700' : 'border-gray-200 hover:border-gray-300'
                        }`}>{target === 0 ? 'All' : target}</button>
                    ))}
                  </div>
                </div>

                <div>
                  <label className="block text-sm font-semibold text-gray-700 mb-2">Quiz Type</label>
                  <div className="grid grid-cols-2 gap-3">
                    {QUIZ_TYPES.map(type => (
                      <button key={type.id} onClick={() => setQuizType(type.id)}
                        className={`p-4 rounded-xl border-2 transition-all ${quizType === type.id ? 'border-jade-500 bg-jade-50' : 'border-gray-200'}`}>
                        <div className="text-2xl mb-1">{type.icon}</div>
                        <div className="text-sm font-medium">{type.label}</div>
                      </button>
                    ))}
                  </div>
                </div>

                {isListen && (() => {
                  const sample = playableVocab.find(v => v.translation?.native_text);
                  const avail = sample ? window.KGAudio.has(sample.translation.native_text, languageCode) : false;
                  return avail === false ? (
                    <div className="bg-yellow-50 text-yellow-800 rounded-2xl p-4 text-sm">
                      No recordings for {languageName(languageCode)} yet, so you'll {quizType === 'listen_to_image' ? 'read the word' : 'see the English word or picture'} instead of hearing it. Answers still count.
                    </div>
                  ) : (
                    <div className="bg-blue-50 text-blue-800 rounded-2xl p-4 text-sm">
                      🔊 You hear the word, then pick {quizType === 'listen_to_image' ? 'its picture' : 'how it is written'}. Turn your sound on. Plays even when auto-play is muted.
                    </div>
                  );
                })()}

                {quizType === 'word_builder' && (
                  <div className="bg-gray-50 rounded-2xl p-4 space-y-4">
                    <WbOption label="Prompt" value={wb.prompt} onChange={v => setWbKey('prompt', v)}
                      options={[['image', 'Image'], ['english', 'English word'], ['mix', 'Mix']]} />
                    <WbOption label="Split into" value={wb.split} onChange={v => setWbKey('split', v)}
                      options={[['chars', 'Characters'], ['syllables', 'Syllables']]} />
                    <WbOption label="Tiles" value={wb.tiles} onChange={v => setWbKey('tiles', v)}
                      options={[['exact', 'Correct pieces only'], ['distractors', 'Correct + extra tiles']]} />
                    {wb.tiles === 'distractors' && (
                      <WbOption label="Extra tiles" value={wb.distractors} onChange={v => setWbKey('distractors', v)}
                        options={[2, 3, 4, 5, 6].map(n => [n, String(n)])} />
                    )}
                    <WbOption label="Feedback" value={wb.feedback} onChange={v => setWbKey('feedback', v)}
                      options={[['end', 'Check at the end'], ['tile', 'Mark each tile']]} />
                    <WbOption label="Hint button" value={wb.hints} onChange={v => setWbKey('hints', v)}
                      options={[[true, 'On'], [false, 'Off']]} />
                  </div>
                )}

                {quizType === 'type_word' && (
                  <div className="bg-gray-50 rounded-2xl p-4 space-y-4">
                    <WbOption label="Level" value={twLevel} onChange={v => setTwKey('level', v)}
                      options={TW_LEVELS.filter(([v]) => !(v === 'dev' && NO_DEVANAGARI_LANGS.includes(languageCode)))} />
                    <div className="text-xs text-gray-500 -mt-2">
                      {twLevel === 'copy' ? 'See the word and copy it. Learns the keyboard.' : twLevel === 'dev' ? 'See only the Devanagari, type it in the native script.' : 'See a picture or English word. Type it from memory.'}
                    </div>
                    {twLevel === 'memory' && (
                      <>
                        <WbOption label="Prompt" value={tw.prompt} onChange={v => setTwKey('prompt', v)}
                          options={[['image', 'Image'], ['english', 'English word'], ['mix', 'Mix']]} />
                        <WbOption label="Sound button (plays the answer)" value={tw.sound} onChange={v => setTwKey('sound', v)}
