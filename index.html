                          options={[[true, 'On'], [false, 'Off']]} />
                      </>
                    )}
                    <WbOption label="Feedback" value={tw.feedback} onChange={v => setTwKey('feedback', v)}
                      options={[['end', 'Check at the end'], ['live', 'Mark as you type']]} />
                    <WbOption label="Hint button" value={tw.hints} onChange={v => setTwKey('hints', v)}
                      options={[[true, 'On'], [false, 'Off']]} />
                    <div className="text-xs text-gray-500">⌨️ Add the {languageName(languageCode)} keyboard in your phone settings first. Typing doesn't count toward unlocking topics.</div>
                  </div>
                )}

                <button onClick={startQuiz} disabled={playableVocab.length < 1 || pool.length < 4}
                  className="w-full py-4 bg-jade-600 text-white rounded-xl font-bold text-lg hover:bg-jade-700 disabled:opacity-50">
                  {pool.length < 4 ? 'Need 4+ words total' : playableVocab.length < 1 ? 'No words in topic' : `Start Quiz (${dailyTarget === 0 ? playableVocab.length : Math.min(dailyTarget, playableVocab.length)} words)`}
                </button>
              </div>
            </div>

            {recentSessions.length > 0 && (
              <div className="bg-white rounded-2xl shadow-lg p-6 mt-6">
                <h3 className="text-lg font-bold text-gray-800 mb-4">Recent Quizzes</h3>
                <div className="space-y-3">
                  {recentSessions.map(s => {
                    const pct = s.total_questions > 0 ? Math.round((s.correct_answers / s.total_questions) * 100) : 0;
                    const topicObj = topics.find(t => t.id === s.topic_id);
                    const topicLabel = s.topic_id ? (topicObj ? `${topicObj.icon} ${topicObj.translation?.title_native}` : s.topic_id) : 'All Topics';
                    const date = new Date(s.completed_at || s.created_at);
                    const dateStr = date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
                    const timeStr = date.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
                    return (
                      <div key={s.id} className="flex items-center justify-between p-3 bg-gray-50 rounded-xl">
                        <div className="flex items-center gap-3">
                          <div className={`w-10 h-10 rounded-full flex items-center justify-center text-white text-sm font-bold ${
                            pct >= 80 ? 'bg-green-500' : pct >= 60 ? 'bg-yellow-500' : 'bg-red-500'
                          }`}>{pct}%</div>
                          <div>
                            <div className="text-sm font-medium text-gray-800">{topicLabel}</div>
                            <div className="text-xs text-gray-400">{dateStr} {timeStr}</div>
                          </div>
                        </div>
                        <div className="text-sm text-gray-600 font-medium">{s.correct_answers}/{s.total_questions}</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </div>
        );
      }

      if (quizCompleted) {
        const percentage = score.total > 0 ? Math.round(score.correct / score.total * 100) : 0;
        let message = '', emoji = '';
        if (percentage >= 90) { message = 'Excellent!'; emoji = '🏆'; }
        else if (percentage >= 70) { message = 'Great job!'; emoji = '🌟'; }
        else if (percentage >= 50) { message = 'Good effort!'; emoji = '👍'; }
        else { message = 'Keep practicing!'; emoji = '💪'; }

        return (
          <div className="max-w-2xl mx-auto p-6">
            <div className="bg-white rounded-3xl shadow-xl p-8 text-center">
              <div className="text-6xl mb-4">{emoji}</div>
              <h2 className="text-3xl font-bold text-gray-800 mb-2">{message}</h2>
              <p className="text-gray-500 mb-6">Quiz Completed!</p>
              <div className="bg-gradient-to-r from-jade-500 to-jade-600 text-white rounded-2xl p-6 mb-6">
                <div className="text-5xl font-bold mb-2">{score.correct}/{score.total}</div>
                <div className="text-xl opacity-90">{percentage}% Correct</div>
              </div>
              {user && (
                <p className={`text-sm mb-4 ${sessionSaved ? 'text-green-600' : 'text-gray-400'}`}>
                  {sessionSaved ? '✓ Results saved' : 'Saving...'}
                </p>
              )}
              <div className="flex gap-4 justify-center">
                <button onClick={() => { setQuizStarted(false); setQuizCompleted(false); }}
                  className="px-6 py-3 bg-gray-100 rounded-xl font-medium hover:bg-gray-200">← Back to Setup</button>
                <button onClick={startQuiz}
                  className="px-6 py-3 bg-jade-600 text-white rounded-xl font-bold hover:bg-jade-700">Try Again</button>
              </div>
            </div>
          </div>
        );
      }

      if (quizType === 'word_builder') {
        const wbItem = quizWords[currentWordIndex];
        if (!wbItem) return <LoadingSpinner />;
        return (
          <WordBuilderRound key={`${wbItem.id}-${currentWordIndex}`} item={wbItem} index={currentWordIndex} total={quizWords.length}
            score={score} settings={wb} languageCode={languageCode} unitPool={wbUnitPool}
            onBack={leaveQuiz} onAnswered={handleWbAnswer} onNext={nextQuestion} />
        );
      }

      if (quizType === 'type_word') {
        const twItem = quizWords[currentWordIndex];
        if (!twItem) return <LoadingSpinner />;
        let trailingWrong = 0;
        for (let i = quizAnswers.length - 1; i >= 0 && !quizAnswers[i].is_correct; i--) trailingWrong++;
        // No key: the same input stays mounted so the phone keyboard doesn't close between words
        return (
          <TypeWordRound item={twItem} index={currentWordIndex} total={quizWords.length}
            score={score} settings={tw} languageCode={languageCode} trailingWrong={trailingWrong}
            onBack={leaveQuiz} onAnswered={handleWbAnswer} onNext={nextQuestion} />
        );
      }

      if (!currentQuestion) return <LoadingSpinner />;

      return (
        <div className="max-w-4xl mx-auto p-4">
          <div className="bg-white rounded-2xl shadow-lg p-4 mb-6">
            <div className="flex flex-wrap items-center justify-between gap-4">
              <button onClick={leaveQuiz} className="px-4 py-2 bg-gray-100 rounded-xl hover:bg-gray-200 font-medium">← Back</button>
              <div className="flex items-center gap-4">
                <div className="text-sm text-gray-500">{currentWordIndex + 1} / {quizWords.length}</div>
                <div className="w-32 h-2 bg-gray-200 rounded-full overflow-hidden">
                  <div className="h-full bg-jade-500 transition-all duration-300" style={{ width: `${((currentWordIndex + 1) / quizWords.length) * 100}%` }} />
                </div>
                <div className="bg-gradient-to-r from-jade-500 to-jade-600 text-white px-4 py-2 rounded-xl font-bold shadow-md">
                  {score.correct}/{score.total}
                </div>
              </div>
            </div>
          </div>

          <div className="bg-white rounded-2xl shadow-lg p-8 mb-6 text-center">
            <div className="text-sm text-gray-400 mb-4">Find the matching answer:</div>
            {quizType === 'native_to_image' && (
              <>
                <div className={`text-4xl font-bold text-gray-800 mb-2 ${fontClass}`}>{currentQuestion.translation?.native_text}</div>
                <div className="text-xl text-blue-600 font-devanagari">{currentQuestion.translation?.devanagari}</div>
                <div className="mt-4"><SpeakButton text={currentQuestion.translation?.native_text} lang={languageCode} slow size="lg" /></div>
              </>
            )}
            {quizType === 'image_to_native' && (
              <div className="w-32 h-32 mx-auto flex items-center justify-center">
                {currentQuestion.extra_data?.colorCode ? (
                  <div className="w-24 h-24 rounded-xl shadow-lg" style={{ backgroundColor: currentQuestion.extra_data.colorCode }} />
                ) : (
                  <img src={getImageUrl(currentQuestion.topic_id, currentQuestion.image_filename)} alt="" className="max-w-full max-h-full object-contain" />
                )}
              </div>
            )}
            {quizType === 'devanagari_to_image' && (
              <div className="text-4xl text-blue-600 font-devanagari">{currentQuestion.translation?.devanagari}</div>
            )}
            {isListen && (() => {
              const text = currentQuestion.translation?.native_text;
              const avail = window.KGAudio.has(text, languageCode);
              if (avail === false) {
                // No clip yet: show something else to answer from; the answer still counts
                return quizType === 'listen_to_image' ? (
                  <>
                    <div className="text-xs text-gray-400 mb-2">No recording for this word yet</div>
                    <div className={`text-4xl font-bold text-gray-800 mb-2 ${fontClass}`}>{text}</div>
                    <div className="text-xl text-blue-600 font-devanagari">{currentQuestion.translation?.devanagari}</div>
                  </>
                ) : (
                  <>
                    <div className="text-xs text-gray-400 mb-2">No recording for this word yet</div>
                    {currentQuestion.image_filename || currentQuestion.extra_data?.colorCode ? (
                      <div className="w-28 h-28 mx-auto flex items-center justify-center mb-2">
                        {currentQuestion.extra_data?.colorCode
                          ? <div className="w-24 h-24 rounded-xl shadow-lg" style={{ backgroundColor: currentQuestion.extra_data.colorCode }} />
                          : <img src={getImageUrl(currentQuestion.topic_id, currentQuestion.image_filename)} alt="" className="max-w-full max-h-full object-contain" />}
                      </div>
                    ) : null}
                    <div className="text-2xl font-bold text-gray-800">{currentQuestion.english_text}</div>
                  </>
                );
              }
              const st = window.KGAudio.stateOf(text, languageCode, false);
              return (
                <>
                  <div className="flex items-center justify-center gap-4">
                    <button onClick={() => playListen(text, languageCode)} title="Play (R)" disabled={avail === 'loading'}
                      className={`w-20 h-20 rounded-full text-white text-3xl shadow-lg active:scale-95 transition-all ${st === 'playing' ? 'bg-jade-700 scale-105' : 'bg-jade-600 hover:bg-jade-700'} ${avail === 'loading' ? 'opacity-50 animate-pulse' : ''}`}>🔊</button>
                    <button onClick={() => playListen(text, languageCode, true)} title="Play slowly" disabled={avail === 'loading'}
                      className="w-14 h-14 rounded-full bg-gray-100 text-2xl hover:bg-gray-200 active:scale-95 transition-transform">🐢</button>
                  </div>
                  <div className="text-xs text-gray-400 mt-3">Tap 🔊 to hear it again<span className="hidden sm:inline"> (R)</span></div>
                  {showResult && quizType === 'listen_to_image' && (
                    <div className="mt-4">
                      <div className={`text-3xl font-bold text-gray-800 ${fontClass}`}>{text}</div>
                      <div className="text-lg text-blue-600 font-devanagari">{currentQuestion.translation?.devanagari}</div>
                    </div>
                  )}
                </>
              );
            })()}
            {quizType === 'english_to_native' && (
              <div className="text-3xl font-bold text-gray-800">{currentQuestion.english_text}</div>
            )}
          </div>

          <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            {options.map((opt, idx) => {
              let borderClass = 'border-gray-200 hover:border-jade-300 hover:shadow-lg';
              if (showResult) {
                if (opt.id === currentQuestion.id) borderClass = 'border-green-500 border-4 bg-green-50';
                else if (selectedAnswer?.id === opt.id) borderClass = 'border-red-500 border-4 bg-red-50';
              }
              return (
                <button key={opt.id} onClick={() => { if (!showResult) handleAnswer(opt); }} aria-disabled={showResult}
                  className={`p-4 rounded-xl border-2 transition-all relative ${borderClass}`}>
                  <span className="absolute top-1.5 left-2 text-xs text-gray-300 font-mono hidden sm:inline">{idx + 1}</span>
                  {(quizType === 'native_to_image' || quizType === 'devanagari_to_image' || quizType === 'listen_to_image') ? (
                    <>
                      <div className="w-20 h-20 mx-auto flex items-center justify-center mb-2">
                        {opt.extra_data?.colorCode ? (
                          <div className="w-14 h-14 rounded-lg shadow" style={{ backgroundColor: opt.extra_data.colorCode }} />
                        ) : (
                          <img src={getImageUrl(opt.topic_id, opt.image_filename)} alt="" className="max-w-full max-h-full object-contain" />
                        )}
                      </div>
                      <div className="text-xs text-gray-500">{opt.english_text}</div>
                    </>
                  ) : (
                    <>
                      <div className={`text-lg font-semibold text-gray-800 ${fontClass}`}>{opt.translation?.native_text}</div>
                      <div className="text-sm text-blue-600 font-devanagari mt-1">{opt.translation?.devanagari}</div>
                      {(quizType !== 'listen_to_native' || showResult) && <div className="mt-2 flex justify-center"><SpeakButton text={opt.translation?.native_text} lang={languageCode} size="sm" /></div>}
                    </>
                  )}
                </button>
              );
            })}
          </div>

          {showResult && (
            <div className="text-center animate-slide-up">
              <div className={`text-2xl font-bold mb-4 ${selectedAnswer?.id === currentQuestion.id ? 'text-green-600' : 'text-red-600'}`}>
                {selectedAnswer?.id === currentQuestion.id ? '✅ Correct!' : `❌ Wrong! It was "${currentQuestion.english_text}"`}
              </div>
              <div className="flex items-center justify-center gap-3 mb-4">
                <span className={`text-2xl font-semibold text-gray-800 ${fontClass}`}>{currentQuestion.translation?.native_text}</span>
                <SpeakButton text={currentQuestion.translation?.native_text} lang={languageCode} slow />
              </div>
              <button onClick={nextQuestion} className="px-8 py-3 bg-blue-600 text-white rounded-full font-bold hover:bg-blue-700">
                {currentWordIndex + 1 >= quizWords.length ? 'See Results' : 'Next Question →'} <span className="text-blue-300 text-sm hidden sm:inline ml-1">↵</span>
              </button>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // SENTENCE QUIZ (kg_chart_sentences)
    // ==========================================
    // Sentence answers are saved with vocabulary_id = null, so they never count toward word strength or unlocking.
    const SENTENCE_QUIZ_TYPES = [
      { id: 'sentence_to_meaning', label: 'Sentence → Meaning', icon: '💬' },
      { id: 'meaning_to_sentence', label: 'Meaning → Sentence', icon: '🌐' },
      { id: 'build_sentence', label: 'Build the Sentence', icon: '🧩' },
    ];
    const QUIZ_MODE_KEY = 'kg_chart_quiz_mode';
    const SENTENCE_SETTINGS_KEY = 'kg_chart_sentence_quiz';
    // Scripts that don't put spaces between words: cut each chunk into words with Intl.Segmenter
    const NO_SPACE_LANGS = ['th', 'my', 'zh', 'ja', 'lo', 'km'];

    function splitSentence(text, langCode) {
      const t = (text || '').normalize('NFC').trim();
      if (!t) return [];
      let parts = t.split(/\s+/);
      if (NO_SPACE_LANGS.includes(langCode) && typeof Intl !== 'undefined' && Intl.Segmenter) {
        const seg = new Intl.Segmenter(langCode, { granularity: 'word' });
        parts = parts.flatMap(chunk => Array.from(seg.segment(chunk), x => x.segment).filter(x => x.trim()));
      }
      // Punctuation never gets a tile of its own: it sticks to the word before it
      const out = [];
      for (const p of parts) {
        if (out.length && /^[\p{P}\p{S}]+$/u.test(p)) out[out.length - 1] += p;
        else out.push(p);
      }
      return out;
    }

    const joinSentence = (pieces, langCode) => pieces.join(NO_SPACE_LANGS.includes(langCode) ? '' : ' ');

    function sentenceDevanagari(text, langCode) {
      const conv = getConverter(langCode);
      if (!conv || conv.usePronunciation || !text) return '';
      try { const d = conv.toDevanagari(text); return d && d !== text ? d : ''; } catch (e) { return ''; }
    }

    function QuizModeToggle({ mode, onChange }) {
      return (
        <div className="flex bg-gray-100 rounded-2xl p-1 mb-6">
          {[['words', '🔤 Words'], ['sentences', '💬 Sentences']].map(([id, label]) => (
            <button key={id} onClick={() => onChange(id)}
              className={`flex-1 py-2 rounded-xl font-medium transition-all ${mode === id ? 'bg-white shadow text-jade-700' : 'text-gray-500 hover:text-gray-700'}`}>{label}</button>
          ))}
        </div>
      );
    }

    function QuizView(props) {
      const [mode, setMode] = useState(() => (loadFromStorage(QUIZ_MODE_KEY, 'words') === 'sentences' ? 'sentences' : 'words'));
      useEffect(() => { saveToStorage(QUIZ_MODE_KEY, mode); }, [mode]);
      const toggle = <QuizModeToggle mode={mode} onChange={setMode} />;
      return mode === 'sentences'
        ? <SentenceQuizView languageCode={props.languageCode} user={props.user} modeToggle={toggle} />
        : <WordQuizView {...props} modeToggle={toggle} />;
    }

    function SentenceQuizView({ languageCode, user, modeToggle }) {
      const fontClass = LANGUAGE_FONTS[languageCode] || 'font-body';
      useAudioState();
      const savingRef = React.useRef(false);
      const saved0 = loadFromStorage(SENTENCE_SETTINGS_KEY, {});
      const [sentences, setSentences] = useState(null); // null = loading
      const [loadError, setLoadError] = useState(null);
      const [group, setGroup] = useState('all');
      const [count, setCount] = useState(() => (DAILY_TARGET_OPTIONS.includes(saved0.count) ? saved0.count : 10));
      const [sType, setSType] = useState(() => (SENTENCE_QUIZ_TYPES.some(t => t.id === saved0.type) ? saved0.type : 'sentence_to_meaning'));
      const [started, setStarted] = useState(false);
      const [completed, setCompleted] = useState(false);
      const [items, setItems] = useState([]);
      const [idx, setIdx] = useState(0);
      const [selected, setSelected] = useState(null);
      const [showResult, setShowResult] = useState(false);
      const [placed, setPlaced] = useState([]); // tile ids, build mode
      const [gaveUp, setGaveUp] = useState(false);
      const [score, setScore] = useState({ correct: 0, total: 0 });
      const [answers, setAnswers] = useState([]);
      const [sessionSaved, setSessionSaved] = useState(false);
      const [recent, setRecent] = useState([]);

      useEffect(() => { saveToStorage(SENTENCE_SETTINGS_KEY, { count, type: sType }); }, [count, sType]);

      useEffect(() => {
        let cancelled = false;
        setSentences(null); setLoadError(null); setGroup('all');
        supabase.from(TABLES.sentences).select('*').eq('language_code', languageCode)
          .order('sort_order').order('created_at')
          .then(({ data, error }) => {
            if (cancelled) return;
            if (error) { setLoadError(error); setSentences([]); return; }
            setSentences((data || []).filter(x => x.native_text?.trim() && x.english_text?.trim()));
          });
        return () => { cancelled = true; };
      }, [languageCode]);

      useEffect(() => {
        if (!user) return;
        supabase.from(TABLES.quizSessions).select('*')
          .eq('user_id', user.id).eq('language_code', languageCode)
          .in('quiz_type', SENTENCE_QUIZ_TYPES.map(t => t.id))
          .order('created_at', { ascending: false }).limit(5)
          .then(({ data }) => { if (data) setRecent(data); });
      }, [user, languageCode, sessionSaved]);

      const all = sentences || [];
      const groups = useMemo(() => [...new Set(all.map(x => x.group_name).filter(Boolean))], [sentences]);
      const filtered = useMemo(() => (group === 'all' ? all : all.filter(x => x.group_name === group)), [sentences, group]);
      const isBuild = sType === 'build_sentence';
      const needed = isBuild ? 1 : 4;
      const n = count === 0 ? filtered.length : Math.min(count, filtered.length);

      const persistSession = useCallback(async (sc, ans, type) => {
        if (!user || savingRef.current || sc.total === 0) return;
        savingRef.current = true;
        const { data: session, error } = await supabase.from(TABLES.quizSessions).insert({
          user_id: user.id,
          language_code: languageCode,
          topic_id: null,
          quiz_type: type,
          total_questions: sc.total,
          correct_answers: sc.correct,
          completed_at: new Date().toISOString(),
        }).select('id').single();
        if (!error && session && ans.length) {
          const rows = ans.map(a => ({ ...a, session_id: session.id }));
          const { error: ansErr } = await supabase.from(TABLES.quizAnswers).insert(rows);
          // Fallback if the sentence_id column hasn't been added yet (kg-chart-sentences.sql)
          if (ansErr) await supabase.from(TABLES.quizAnswers).insert(rows.map(({ sentence_id, ...r }) => r));
        }
        setSessionSaved(true);
      }, [user, languageCode]);

      useEffect(() => { if (completed && !sessionSaved) persistSession(score, answers, sType); }, [completed]);

      const pendingRef = React.useRef(null);
      pendingRef.current = started && !completed && answers.length ? { score, answers, sType, persistSession } : null;
      useEffect(() => () => { const p = pendingRef.current; if (p) p.persistSession(p.score, p.answers, p.sType); window.KGAudio.stop(); }, []);

      const startQuiz = () => {
        const picked = shuffleArr(filtered).slice(0, n);
        const frozen = picked.map(s => {
          if (isBuild) {
            let pieces = splitSentence(s.native_text, languageCode);
            if (pieces.length < 2) pieces = Array.from(s.native_text.trim()).filter(c => c.trim());
            const tiles = pieces.map((text, id) => ({ id, text }));
            let order = shuffleArr(tiles);
            for (let k = 0; k < 6 && order.length > 1 && order.every((t, i) => t.text === pieces[i]); k++) order = shuffleArr(tiles);
            return { s, pieces, tiles: order };
          }
          // Wrong options: same group first (same pattern, harder to guess), never two that read the same
          const key = sType === 'sentence_to_meaning' ? 'english_text' : 'native_text';
          const norm = x => (x[key] || '').trim().toLowerCase();
          const same = shuffleArr(all.filter(x => x.id !== s.id && s.group_name && x.group_name === s.group_name));
          const other = shuffleArr(all.filter(x => x.id !== s.id && !same.includes(x)));
          const seen = new Set([norm(s)]);
          const wrong = [];
          for (const x of [...same, ...other]) {
            const t = norm(x);
            if (!t || seen.has(t)) continue;
            seen.add(t);
            wrong.push(x);
            if (wrong.length === 3) break;
          }
          return { s, options: shuffleArr([s, ...wrong]) };
        });
        setItems(frozen);
        setIdx(0); setSelected(null); setShowResult(false); setPlaced([]); setGaveUp(false);
        setScore({ correct: 0, total: 0 }); setAnswers([]);
        savingRef.current = false; setSessionSaved(false);
        setCompleted(false); setStarted(true);
      };

      const item = items[idx];
      const record = (isCorrect, selectedId, answerText) => {
        setScore(prev => ({ correct: prev.correct + (isCorrect ? 1 : 0), total: prev.total + 1 }));
        setAnswers(prev => [...prev, {
          vocabulary_id: null,
          sentence_id: item.s.id,
          selected_vocabulary_id: selectedId,
          is_correct: isCorrect,
          answer_text: answerText,
          answered_at: new Date().toISOString(),
        }]);
      };

      const pick = (opt) => {
        if (showResult || !item) return;
        setSelected(opt);
        setShowResult(true);
        window.KGAudio.autoPlay(item.s.native_text, languageCode);
        record(opt.id === item.s.id, opt.id, sType === 'sentence_to_meaning' ? opt.english_text : opt.native_text);
      };

      const placeTile = (id) => { if (!showResult) setPlaced(p => (p.includes(id) ? p : [...p, id])); };
      const removeTile = (id) => { if (!showResult) setPlaced(p => p.filter(x => x !== id)); };
      const placedText = () => placed.map(id => item.tiles.find(t => t.id === id).text);
      const checkBuild = () => {
        if (showResult || !item || placed.length !== item.tiles.length) return;
        const built = placedText();
        const ok = built.length === item.pieces.length && built.every((t, i) => t === item.pieces[i]);
        setShowResult(true);
        window.KGAudio.autoPlay(item.s.native_text, languageCode);
        record(ok, ok ? item.s.id : null, joinSentence(built, languageCode));
      };
      const giveUp = () => {
        if (showResult || !item) return;
        setGaveUp(true);
        setShowResult(true);
        window.KGAudio.autoPlay(item.s.native_text, languageCode);
        record(false, null, joinSentence(placedText(), languageCode));
      };

      const next = () => {
        window.KGAudio.stop();
        if (idx + 1 >= items.length) { setCompleted(true); return; }
        setIdx(i => i + 1); setSelected(null); setShowResult(false); setPlaced([]); setGaveUp(false);
      };
      const leave = () => {
        window.KGAudio.stop();
        if (!completed && answers.length) persistSession(score, answers, sType);
        setStarted(false);
      };

      // Keyboard: 1-4 pick, Enter next (MCQ); Enter checks / next (build)
      useEffect(() => {
        if (!started || completed || !item) return;
        const onKey = (e) => {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
          if (e.key === 'Enter' || (e.key === ' ' && showResult)) {
            e.preventDefault();
            if (showResult) next(); else if (isBuild) checkBuild();
            return;
          }
          if (!isBuild && !showResult) {
            const num = parseInt(e.key);
            if (num >= 1 && num <= 4 && item.options[num - 1]) pick(item.options[num - 1]);
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [started, completed, item, showResult, placed, isBuild]);

      // 🔊 only when this sentence has a clip (run tools/gen_kg_audio.py after adding sentences)
      const SpeakBtn = ({ text, small }) => (window.KGAudio.has(text, languageCode) === true
        ? <SpeakButton text={text} lang={languageCode} slow={!small} size={small ? 'sm' : 'lg'} />
        : null);

      const NativeLine = ({ text, size }) => {
        const dev = sentenceDevanagari(text, languageCode);
        return (
          <>
            <div className={`${size} font-bold text-gray-800 ${fontClass}`}>{text}</div>
            {dev && <div className="text-base text-blue-600 font-devanagari mt-1">{dev}</div>}
          </>
        );
      };

      // ---------- Setup ----------
      if (!started) {
        const typeHelp = {
          sentence_to_meaning: 'Read the sentence, pick what it means.',
          meaning_to_sentence: 'Read the English, pick the right sentence.',
          build_sentence: 'Read the English, tap the words into the right order.',
        }[sType];
        return (
          <div className="max-w-2xl mx-auto p-6">
            <div className="bg-white rounded-3xl shadow-xl p-8">
              <div className="text-center mb-8">
                <div className="w-20 h-20 bg-jade-100 rounded-full flex items-center justify-center mx-auto mb-4">
                  <span className="text-4xl">💬</span>
                </div>
                <h2 className="text-3xl font-bold text-gray-800">Quiz Mode</h2>
              </div>
              {modeToggle}

              {sentences === null ? <LoadingSpinner /> : loadError ? (
                <div className="bg-yellow-50 text-yellow-800 rounded-2xl p-4 text-sm">
                  Sentences aren't set up yet. Run <span className="font-mono">kg-chart-sentences.sql</span> in the Supabase SQL editor, then reload.
                </div>
              ) : all.length === 0 ? (
                <div className="text-center text-gray-500 py-6">
                  <div className="text-4xl mb-2">📭</div>
                  No sentences for {languageName(languageCode)} yet. Add some in the admin panel under 💬 Sentences.
                </div>
              ) : (
                <div className="space-y-6">
                  {groups.length > 0 && (
                    <div>
                      <label className="block text-sm font-semibold text-gray-700 mb-2">Group</label>
                      <select value={group} onChange={(e) => setGroup(e.target.value)} className="w-full px-4 py-3 border rounded-xl">
                        <option value="all">All sentences ({all.length})</option>
                        {groups.map(g => <option key={g} value={g}>{g} ({all.filter(x => x.group_name === g).length})</option>)}
                      </select>
                    </div>
                  )}

                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-2">
                      How many <span className="text-gray-400 font-normal ml-2">({count === 0 ? 'All' : count} sentences)</span>
                    </label>
                    <div className="grid grid-cols-4 gap-2">
                      {DAILY_TARGET_OPTIONS.map(c => (
                        <button key={c} onClick={() => setCount(c)}
                          className={`py-3 rounded-xl border-2 font-medium transition-all ${count === c ? 'border-jade-500 bg-jade-50 text-jade-700' : 'border-gray-200 hover:border-gray-300'}`}>{c === 0 ? 'All' : c}</button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="block text-sm font-semibold text-gray-700 mb-2">Quiz Type</label>
                    <div className="grid grid-cols-3 gap-3">
                      {SENTENCE_QUIZ_TYPES.map(t => (
                        <button key={t.id} onClick={() => setSType(t.id)}
                          className={`p-3 rounded-xl border-2 transition-all ${sType === t.id ? 'border-jade-500 bg-jade-50' : 'border-gray-200'}`}>
                          <div className="text-2xl mb-1">{t.icon}</div>
                          <div className="text-xs sm:text-sm font-medium">{t.label}</div>
                        </button>
                      ))}
                    </div>
                    <p className="text-xs text-gray-400 mt-2">{typeHelp}</p>
                  </div>

                  <button onClick={startQuiz} disabled={n < 1 || all.length < needed}
                    className="w-full py-4 bg-jade-600 text-white rounded-xl font-bold text-lg hover:bg-jade-700 disabled:opacity-50">
                    {all.length < needed ? `Need ${needed}+ sentences` : n < 1 ? 'No sentences in group' : `Start Quiz (${n} sentences)`}
                  </button>
                  <p className="text-xs text-gray-400 text-center">Sentence quizzes don't count toward unlocking topics.</p>
                </div>
              )}
            </div>

            {recent.length > 0 && (
              <div className="bg-white rounded-2xl shadow-lg p-6 mt-6">
                <h3 className="text-lg font-bold text-gray-800 mb-4">Recent Sentence Quizzes</h3>
                <div className="space-y-3">
                  {recent.map(r => {
                    const pct = r.total_questions > 0 ? Math.round((r.correct_answers / r.total_questions) * 100) : 0;
                    const t = SENTENCE_QUIZ_TYPES.find(x => x.id === r.quiz_type);
                    const date = new Date(r.completed_at || r.created_at);
                    return (
                      <div key={r.id} className="flex items-center justify-between p-3 bg-gray-50 rounded-xl">
                        <div className="flex items-center gap-3">
                          <div className={`w-10 h-10 rounded-full flex items-center justify-center text-white text-sm font-bold ${pct >= 80 ? 'bg-green-500' : pct >= 60 ? 'bg-yellow-500' : 'bg-red-500'}`}>{pct}%</div>
                          <div>
                            <div className="text-sm font-medium text-gray-800">{t ? `${t.icon} ${t.label}` : r.quiz_type}</div>
                            <div className="text-xs text-gray-400">{date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })} {date.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' })}</div>
                          </div>
                        </div>
                        <div className="text-sm text-gray-600 font-medium">{r.correct_answers}/{r.total_questions}</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </div>
        );
      }

      // ---------- Done ----------
      if (completed) {
        const pct = score.total > 0 ? Math.round(score.correct / score.total * 100) : 0;
        const [msg, emoji] = pct >= 90 ? ['Excellent!', '🏆'] : pct >= 70 ? ['Great job!', '🌟'] : pct >= 50 ? ['Good effort!', '👍'] : ['Keep practicing!', '💪'];
        return (
          <div className="max-w-2xl mx-auto p-6">
            <div className="bg-white rounded-3xl shadow-xl p-8 text-center">
              <div className="text-6xl mb-4">{emoji}</div>
              <h2 className="text-3xl font-bold text-gray-800 mb-2">{msg}</h2>
              <p className="text-gray-500 mb-6">Sentence Quiz Completed!</p>
              <div className="bg-gradient-to-r from-jade-500 to-jade-600 text-white rounded-2xl p-6 mb-6">
                <div className="text-5xl font-bold mb-2">{score.correct}/{score.total}</div>
                <div className="text-xl opacity-90">{pct}% Correct</div>
              </div>
              {user && <p className={`text-sm mb-4 ${sessionSaved ? 'text-green-600' : 'text-gray-400'}`}>{sessionSaved ? '✓ Results saved' : 'Saving...'}</p>}
              <div className="flex gap-4 justify-center">
                <button onClick={() => { setStarted(false); setCompleted(false); }} className="px-6 py-3 bg-gray-100 rounded-xl font-medium hover:bg-gray-200">← Back to Setup</button>
                <button onClick={startQuiz} className="px-6 py-3 bg-jade-600 text-white rounded-xl font-bold hover:bg-jade-700">Try Again</button>
              </div>
            </div>
          </div>
        );
      }

      if (!item) return <LoadingSpinner />;
      const s = item.s;
      const isRight = showResult && (isBuild ? !gaveUp && answers[answers.length - 1]?.is_correct : selected?.id === s.id);

      // ---------- Question ----------
      return (
        <div className="max-w-3xl mx-auto p-4">
          <div className="bg-white rounded-2xl shadow-lg p-4 mb-6">
            <div className="flex flex-wrap items-center justify-between gap-4">
              <button onClick={leave} className="px-4 py-2 bg-gray-100 rounded-xl hover:bg-gray-200 font-medium">← Back</button>
              <div className="flex items-center gap-4">
                <div className="text-sm text-gray-500">{idx + 1} / {items.length}</div>
                <div className="w-32 h-2 bg-gray-200 rounded-full overflow-hidden">
                  <div className="h-full bg-jade-500 transition-all duration-300" style={{ width: `${((idx + 1) / items.length) * 100}%` }} />
                </div>
                <div className="bg-gradient-to-r from-jade-500 to-jade-600 text-white px-4 py-2 rounded-xl font-bold shadow-md">{score.correct}/{score.total}</div>
              </div>
            </div>
          </div>

          <div className="bg-white rounded-2xl shadow-lg p-8 mb-6 text-center">
            {s.group_name && <div className="text-xs text-gray-400 mb-2">{s.group_name}</div>}
            {sType === 'sentence_to_meaning' ? (
              <>
                <div className="text-sm text-gray-400 mb-4">What does this mean?</div>
                <NativeLine text={s.native_text} size="text-3xl" />
                <div className="mt-3"><SpeakBtn text={s.native_text} /></div>
              </>
            ) : (
              <>
                <div className="text-sm text-gray-400 mb-4">{isBuild ? 'Build this sentence:' : 'Which sentence says this?'}</div>
                <div className="text-2xl font-bold text-gray-800">{s.english_text}</div>
              </>
            )}
          </div>

          {!isBuild && (
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
              {item.options.map((opt, i) => {
                let cls = 'border-gray-200 hover:border-jade-300 hover:shadow-lg';
                if (showResult) {
                  if (opt.id === s.id) cls = 'border-green-500 border-4 bg-green-50';
                  else if (selected?.id === opt.id) cls = 'border-red-500 border-4 bg-red-50';
                }
                return (
                  <button key={opt.id} onClick={() => pick(opt)} disabled={showResult}
                    className={`p-4 rounded-xl border-2 transition-all relative text-left ${cls}`}>
                    <span className="absolute top-1.5 right-2 text-xs text-gray-300 font-mono hidden sm:inline">{i + 1}</span>
                    {sType === 'sentence_to_meaning'

    function FlashcardView({ topics, vocabulary, ratings, onRate, languageCode, user }) {
      const [selectedTopic, setSelectedTopic] = useState('all');
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);

      const fontClass = LANGUAGE_FONTS[languageCode] || 'font-body';
      const filteredVocab = selectedTopic === 'all' ? vocabulary : vocabulary.filter(v => v.topic_id === selectedTopic);
      const currentItem = filteredVocab[currentIndex];
      const currentRating = currentItem ? getRatingById(ratings[currentItem.id]?.rating) : null;

      useEffect(() => { setCurrentIndex(0); setIsFlipped(false); }, [selectedTopic]);

      const goNext = () => { setIsFlipped(false); setTimeout(() => setCurrentIndex(prev => (prev + 1) % filteredVocab.length), 100); };
      const goPrev = () => { setIsFlipped(false); setTimeout(() => setCurrentIndex(prev => (prev - 1 + filteredVocab.length) % filteredVocab.length), 100); };
      const goRandom = () => { setIsFlipped(false); setTimeout(() => setCurrentIndex(Math.floor(Math.random() * filteredVocab.length)), 100); };
      const handleRate = (ratingId) => { if (currentItem && user) { onRate(currentItem.id, ratingId); } };

      // Keyboard support: ←/→ prev/next, Space flip, 1-5 rate, R random
      useEffect(() => {
        const handleKey = (e) => {
          if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
          switch (e.key) {
            case 'ArrowLeft': e.preventDefault(); goPrev(); break;
            case 'ArrowRight': e.preventDefault(); goNext(); break;
            case ' ': e.preventDefault(); setIsFlipped(f => !f); break;
            case 'r': case 'R': e.preventDefault(); goRandom(); break;
            default:
              const num = parseInt(e.key);
              if (num >= 1 && num <= 5 && user) handleRate(num);
          }
        };
        window.addEventListener('keydown', handleKey);
        return () => window.removeEventListener('keydown', handleKey);
      }, [currentItem, user, filteredVocab]);

                {currentRating && (
                  <div className={`absolute top-4 right-4 px-4 py-2 rounded-full text-sm font-medium ${currentRating.color} text-white shadow-md`}>
                    {currentRating.emoji} {currentRating.label}

                <div className={`text-5xl font-bold text-gray-800 mb-4 ${fontClass}`}>{currentItem.translation?.native_text}</div>
                <div className="text-3xl text-blue-600 font-devanagari mb-4">{currentItem.translation?.devanagari}</div>
                <div className="absolute bottom-6 text-gray-400 text-sm">👆 Tap to flip <span className="hidden sm:inline text-gray-300 ml-1">(Space)</span></div>
              </div>
              <div className="flip-card-back absolute inset-0 bg-gradient-to-br from-jade-50 to-white rounded-3xl shadow-xl p-8 flex flex-col items-center justify-center">
                <div className="w-32 h-32 mb-4 flex items-center justify-center">

                    <img src={getImageUrl(currentItem.topic_id, currentItem.image_filename)} alt="" className="max-w-full max-h-full object-contain" />
                  )}
                </div>
                <div className="text-3xl font-bold text-gray-800">{currentItem.english_text}</div>
              </div>
            </div>
          </div>

          <div className="flex justify-center mb-4">
            <SpeakButton text={currentItem.translation?.native_text} lang={languageCode} slow size="lg" />
          </div>

          <div className="flex justify-center gap-3 mb-6">
            <button onClick={goPrev} className="px-6 py-3 bg-gray-100 rounded-xl hover:bg-gray-200 font-medium">← Prev</button>
            <button onClick={goRandom} className="px-6 py-3 bg-purple-500 text-white rounded-xl hover:bg-purple-600 font-medium shadow-md">🎲 Random <span className="text-purple-300 text-xs hidden sm:inline">(R)</span></button>
            <button onClick={goNext} className="px-6 py-3 bg-gray-100 rounded-xl hover:bg-gray-200 font-medium">Next →</button>
          </div>

          {user ? (
            <div className="bg-white rounded-2xl shadow-lg p-4">
              <div className="text-center text-sm text-gray-500 mb-3">How well do you know this?</div>
              <div className="flex flex-wrap justify-center gap-2">
                {RATINGS.map((r) => (
                  <button key={r.id} onClick={() => handleRate(r.id)}
                    className={`px-4 py-2 rounded-xl text-sm font-medium transition-all ${
                      ratings[currentItem.id]?.rating === r.id ? r.color + ' text-white shadow-lg' : 'bg-gray-100 hover:bg-gray-200'
                    }`}>{r.emoji} {r.label}</button>
                ))}

            <div className="bg-amber-50 rounded-2xl p-4 text-center">
              <p className="text-amber-700 text-sm">Sign in to save your progress</p>

    function ProgressView({ topics, vocabulary, ratings, languageCode, user, path }) {
      const fontClass = LANGUAGE_FONTS[languageCode] || 'font-body';

          result.byTopic[t.id] = { topic: t, total: 0, rated: 0, byRating: {} };
          RATINGS.forEach(r => { result.byTopic[t.id].byRating[r.id] = 0; });
        });

            result.byTopic[vocab.topic_id].total++;
            if (rating) { result.byTopic[vocab.topic_id].rated++; result.byTopic[vocab.topic_id].byRating[rating]++; }
          }

      if (!user) {
        return (
          <div className="max-w-4xl mx-auto p-6 text-center">

              </div>

      }

      const progressPercent = stats.total > 0 ? Math.round((stats.rated / stats.total) * 100) : 0;

      return (
        <div className="max-w-4xl mx-auto p-4 space-y-6">
          {path && <LearningPathCard path={path} vocabulary={vocabulary} ratings={ratings} fontClass={fontClass} />}
          <div className="bg-white rounded-3xl shadow-xl p-6">
            <h2 className="text-2xl font-bold text-gray-800 mb-6">Overall Progress</h2>
            <div className="mb-4">
              <div className="flex items-center justify-between mb-2">
                <span className="text-gray-600">Vocabulary Rated</span>
                <span className="font-bold text-jade-600">{progressPercent}%</span>
              </div>
              <div className="h-4 bg-gray-100 rounded-full overflow-hidden">
                <div className="h-full bg-gradient-to-r from-jade-400 to-jade-600 rounded-full" style={{ width: `${Math.max(progressPercent, 2)}%` }} />
              </div>
              <p className="text-sm text-gray-500 mt-2">{stats.rated} of {stats.total} items rated</p>
            </div>

            <div className="grid grid-cols-5 gap-3 mt-6">
              {RATINGS.map(r => (
                <div key={r.id} className={`p-4 rounded-xl text-center ${r.color} bg-opacity-10`}>
                  <div className="text-2xl mb-1">{r.emoji}</div>
                  <div className={`text-2xl font-bold ${r.textColor}`}>{stats.byRating[r.id]}</div>
                </div>
              ))}
            </div>
          </div>

          <div className="bg-white rounded-2xl shadow-lg p-6">
            <h3 className="text-lg font-bold text-gray-800 mb-4">Progress by Topic</h3>
            <div className="space-y-4">
              {Object.values(stats.byTopic).filter(ts => ts.total > 0).map(ts => {
                const topicPercent = Math.round((ts.rated / ts.total) * 100);
                return (
                  <div key={ts.topic.id} className="border-b border-gray-100 pb-4 last:border-b-0">
                    <div className="flex items-center justify-between mb-2">
                      <div className="flex items-center gap-2">
                        <span className="text-xl">{ts.topic.icon}</span>
                        <span className={`font-medium text-gray-800 ${fontClass}`}>{ts.topic.translation?.title_native}</span>
                      </div>
                      <div className="text-sm text-gray-500">{ts.rated}/{ts.total} ({topicPercent}%)</div>
                    </div>
                    <div className="h-3 bg-gray-100 rounded-full overflow-hidden flex">
                      {RATINGS.map(r => {
                        const percent = (ts.byRating[r.id] / ts.total) * 100;
                        return percent > 0 ? <div key={r.id} className={r.color} style={{ width: `${percent}%` }} /> : null;
                      })}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // LEARNING PATH (Phase 8): topic unlocking + word strength
    // ==========================================
    const STRENGTH_WINDOW = 5;
    const ratingScore = (r) => (r == null ? null : r <= 2 ? 1 : r === 3 ? 0.5 : 0);
    function strengthPct(list) {
      if (!list || !list.length) return null;
      const last = list.slice(-STRENGTH_WINDOW);
      return Math.round(100 * last.filter(a => a.c).length / last.length);
    }
    function overallPct(byType, rating) {
      const all = Object.values(byType || {}).flat().sort((a, b) => a.t - b.t).slice(-STRENGTH_WINDOW).map(a => (a.c ? 1 : 0));
      const rs = ratingScore(rating);
      if (rs != null) all.push(rs);
      return all.length ? Math.round(100 * all.reduce((s, x) => s + x, 0) / all.length) : null;
    }
    const strengthClass = (p) => (p == null ? 'bg-gray-100 text-gray-400' : p >= 80 ? 'bg-green-500 text-white' : p >= 40 ? 'bg-amber-400 text-gray-900' : 'bg-red-500 text-white');
    const topicTitle = (t) => t?.translation?.title_native || slugToLabel(t?.id || '');

    function useLearningPath({ user, languageCode, topics, vocabulary }) {
      const [raw, setRaw] = useState(null);
      const [tick, setTick] = useState(0);
      const [celebration, setCelebration] = useState(null);
      const recordedRef = React.useRef(new Set());
      const refresh = useCallback(() => setTick(n => n + 1), []);

      useEffect(() => { setRaw(null); recordedRef.current = new Set(); }, [user?.id, languageCode]);

      useEffect(() => {
        if (!user || !languageCode) return;
        let cancelled = false;
        const email = (user.email || '').toLowerCase();
        Promise.all([
          supabase.rpc('kg_chart_my_answers', { p_lang: languageCode }),
          supabase.from(TABLES.topicUnlocks).select('topic_id').eq('email', email).in('language_code', [languageCode, '*']),
          supabase.from(TABLES.progressResets).select('*').in('language_code', [languageCode, '*']),
          supabase.from(TABLES.topicCompletions).select('*').eq('user_id', user.id).eq('language_code', languageCode),
          supabase.from(TABLES.settings).select('value').eq('key', 'admin_bypass_lock').maybeSingle(),
          supabase.rpc('kg_chart_is_admin'),
        ]).then(([ans, unl, rst, cmp, set, adm]) => {
          if (cancelled) return;
          const failed = [ans, unl, rst, cmp].find(r => r.error);
          if (failed) console.warn('Learning path is off until kg-chart-phase8.sql is run:', failed.error.message);
          setRaw({
            ready: !failed,
            answers: ans.data || [],
            unlocks: new Set((unl.data || []).map(u => u.topic_id)),
            resetAt: Math.max(0, ...(rst.data || []).filter(r => !r.email || r.email === email).map(r => Date.parse(r.reset_at) || 0)),
            completions: cmp.data || [],
            bypass: adm.data === true && set.data?.value === true,
          });
        });
        return () => { cancelled = true; };
      }, [user, languageCode, tick]);

      const computed = useMemo(() => {
        const visible = topics.filter(t => !t.is_hidden);
        const visibleIds = new Set(visible.map(t => t.id));
        const visibleVocab = vocabulary.filter(v => visibleIds.has(v.topic_id));
        const resetAt = raw?.resetAt || 0;
        const attempts = {};
        const counts = {}; // word id -> quiz type -> answers since last reset (drives unlocking)
        (raw?.answers || []).forEach(a => {
          const id = String(a.vocabulary_id);
          const ts = Date.parse(a.answered_at) || 0;
          const w = (attempts[id] = attempts[id] || {});
          (w[a.quiz_type] = w[a.quiz_type] || []).push({ c: !!a.is_correct, t: ts });
          if (ts > resetAt) { const c = (counts[id] = counts[id] || {}); c[a.quiz_type] = (c[a.quiz_type] || 0) + 1; }
        });
        const stepsPerWord = UNLOCK_QUIZ_TYPES.length * UNLOCK_MIN_ATTEMPTS;
        const wordSteps = (id) => UNLOCK_QUIZ_TYPES.reduce((s, q) => s + Math.min(counts[id]?.[q] || 0, UNLOCK_MIN_ATTEMPTS), 0);
        const wordDone = (id) => wordSteps(id) === stepsPerWord;
        const open = !raw?.ready || raw?.bypass;
        const done = new Set((raw?.completions || []).filter(c => (Date.parse(c.completed_at) || 0) > resetAt).map(c => c.topic_id));
        const status = {};
        const newlyComplete = [];
        let prevComplete = true;
        visible.forEach(t => {
          const words = visibleVocab.filter(v => v.topic_id === t.id);
          if (!words.length) { status[t.id] = { unlocked: true, complete: true, faced: 0, total: 0, steps: 0, stepsTotal: 0, empty: true }; return; }
          const facedCount = words.filter(w => wordDone(String(w.id))).length;
          const steps = words.reduce((s, w) => s + wordSteps(String(w.id)), 0);
          const nowComplete = raw?.ready && facedCount === words.length;
          const complete = done.has(t.id) || !!nowComplete;
          const manual = !!raw?.unlocks?.has(t.id);
          if (nowComplete && !done.has(t.id)) newlyComplete.push(t.id);
          status[t.id] = { unlocked: open || prevComplete || manual || complete, complete, faced: facedCount, total: words.length, steps, stepsTotal: words.length * stepsPerWord, manual };
          prevComplete = complete;
        });
        const annotated = visible.map(t => ({ ...t, locked: !status[t.id].unlocked }));
        const unlockedIds = new Set(annotated.filter(t => !t.locked).map(t => t.id));
        const unlockedVocab = visibleVocab.filter(v => unlockedIds.has(v.topic_id));
        return { topics: annotated, status, attempts, counts, visibleVocab, unlockedVocab, newlyComplete, enabled: !!raw?.ready && !raw?.bypass, bypass: !!raw?.bypass };
      }, [topics, vocabulary, raw]);

      useEffect(() => {
        if (!user || !computed.newlyComplete.length) return;
        const fresh = computed.newlyComplete.filter(id => !recordedRef.current.has(id));
        if (!fresh.length) return;
        fresh.forEach(id => recordedRef.current.add(id));
        const now = new Date().toISOString();
        supabase.from(TABLES.topicCompletions)
          .upsert(fresh.map(topic_id => ({ user_id: user.id, language_code: languageCode, topic_id, completed_at: now })), { onConflict: 'user_id,language_code,topic_id' })
          .then(({ error }) => { if (error) console.warn('Could not save topic completion:', error.message); });
        const idx = computed.topics.findIndex(t => t.id === fresh[fresh.length - 1]);
        const next = computed.topics.slice(idx + 1).find(t => !computed.status[t.id].complete && !computed.status[t.id].empty);
        setCelebration({ topic: computed.topics[idx], next });
      }, [computed]);

      return { ...computed, loading: !!user && !raw, refresh, celebration, dismissCelebration: () => setCelebration(null) };
    }

    function LockedTopicPanel({ topic, prevTopic, prevStatus, fontClass, onGoQuiz }) {
      const pct = prevStatus?.stepsTotal ? Math.round(100 * prevStatus.steps / prevStatus.stepsTotal) : 0;
      return (
        <div className="max-w-xl mx-auto p-6">
          <div className="bg-white rounded-3xl shadow-xl p-8 text-center">
            <div className="text-5xl mb-3">🔒</div>
            <h2 className="text-2xl font-bold text-gray-800 mb-2">{topic.icon} <span className={fontClass}>{topicTitle(topic)}</span> is locked</h2>
            {prevTopic ? (
              <>
                <p className="text-gray-500 mb-5">Answer every word in <b className={fontClass}>{topicTitle(prevTopic)}</b> {UNLOCK_RULE_TEXT} to unlock it. Right or wrong both count.</p>
                <div className="h-3 bg-gray-100 rounded-full overflow-hidden mb-2"><div className="h-full bg-jade-500 rounded-full" style={{ width: Math.max(pct, 2) + '%' }} /></div>
                <p className="text-sm text-gray-500 mb-6">{prevStatus.faced} of {prevStatus.total} words done · {prevStatus.steps}/{prevStatus.stepsTotal} answers</p>
                <button onClick={onGoQuiz} className="px-6 py-3 bg-jade-600 text-white rounded-xl font-bold hover:bg-jade-700">Go to Quiz →</button>
              </>
            ) : <p className="text-gray-500">Ask the admin to unlock this topic.</p>}
          </div>
        </div>
      );
    }

    function CelebrationModal({ topic, next, fontClass, onOpen, onClose }) {
      const [secs, setSecs] = useState(6);
      useEffect(() => {
        if (!next) return;
        if (secs <= 0) { onOpen(); return; }
        const id = setTimeout(() => setSecs(s => s - 1), 1000);
        return () => clearTimeout(id);
      }, [secs, next]);
      return (
        <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
          <div className="bg-white rounded-3xl shadow-2xl p-8 max-w-md w-full text-center animate-slide-up">
            <div className="text-6xl mb-3">🎉</div>
            <h2 className="text-2xl font-bold text-gray-800 mb-1">Topic complete!</h2>
            <p className="text-gray-500 mb-6">{topic?.icon} <span className={fontClass}>{topicTitle(topic)}</span>: every word answered {UNLOCK_RULE_TEXT}.</p>
            {next ? (
              <>
                <div className="bg-jade-50 rounded-2xl p-4 mb-6">
                  <div className="text-xs font-semibold text-jade-700 uppercase tracking-wide mb-1">Unlocked</div>
                  <div className="text-xl font-bold text-gray-800">{next.icon} <span className={fontClass}>{topicTitle(next)}</span></div>
                </div>
                <div className="flex gap-3 justify-center">
                  <button onClick={onClose} className="px-5 py-3 bg-gray-100 rounded-xl font-medium hover:bg-gray-200">Stay here</button>
                  <button onClick={onOpen} className="px-5 py-3 bg-jade-600 text-white rounded-xl font-bold hover:bg-jade-700">Open now ({secs})</button>
                </div>
              </>
            ) : (
              <>
                <p className="text-gray-700 font-medium mb-6">You've completed every topic.</p>
                <button onClick={onClose} className="px-6 py-3 bg-jade-600 text-white rounded-xl font-bold hover:bg-jade-700">Close</button>
              </>
            )}
          </div>
        </div>
      );
    }

    function WordStrengthModal({ item, byType, rating, fontClass, onClose }) {
      const r = getRatingById(rating);
      const overall = overallPct(byType, rating);
      return (
        <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
          <div className="bg-white rounded-3xl shadow-2xl p-6 max-w-md w-full max-h-[90vh] overflow-y-auto">
            <div className="flex items-start justify-between gap-4 mb-5">
              <div>
                <div className={'text-3xl font-bold text-gray-800 ' + fontClass}>{item.translation?.native_text}</div>
                <div className="text-gray-500">{item.english_text}</div>
              </div>
              <div className={'w-16 h-16 rounded-2xl flex flex-col items-center justify-center shrink-0 ' + strengthClass(overall)}>
                <div className="text-lg font-bold leading-none">{overall == null ? '–' : overall + '%'}</div>
                <div className="text-[10px] mt-1 opacity-80">overall</div>
              </div>
            </div>
            <div className="space-y-2">
              {QUIZ_TYPES.map(q => {
                const list = byType?.[q.id] || [];
                const pct = strengthPct(list);
                const last = list.slice(-STRENGTH_WINDOW);
                return (
                  <div key={q.id} className="flex items-center gap-3 p-3 bg-gray-50 rounded-xl">
                    <span className="text-xl w-7 text-center">{q.icon}</span>
                    <div className="flex-1 min-w-0">
                      <div className="text-sm font-medium text-gray-800">{q.label}</div>
                      <div className="text-xs text-gray-400">{list.length ? list.length + ' attempt' + (list.length === 1 ? '' : 's') : 'Not faced yet'}</div>
                    </div>
                    <div className="flex gap-1">{last.map((a, i) => <span key={i} className={'w-2.5 h-2.5 rounded-full ' + (a.c ? 'bg-green-500' : 'bg-red-500')} />)}</div>
                    <span className={'w-12 text-center text-xs font-bold py-1 rounded-lg ' + strengthClass(pct)}>{pct == null ? '–' : pct + '%'}</span>
                  </div>
                );
              })}
              <div className="flex items-center gap-3 p-3 bg-gray-50 rounded-xl">
                <span className="text-xl w-7 text-center">🃏</span>
                <div className="flex-1 min-w-0">
                  <div className="text-sm font-medium text-gray-800">Flashcard rating</div>
                  <div className="text-xs text-gray-400">{r ? r.label : 'Not rated'}</div>
                </div>
                <span className="text-lg">{r?.emoji || ''}</span>
              </div>
            </div>
            <p className="text-xs text-gray-400 mt-4">Strength = % correct over the last {STRENGTH_WINDOW} attempts. Overall mixes all quiz types with the flashcard rating counted as one attempt.</p>
            <button onClick={onClose} className="w-full mt-4 py-3 bg-gray-100 rounded-xl font-medium hover:bg-gray-200">Close</button>
          </div>
        </div>
      );
    }

    function LearningPathCard({ path, vocabulary, ratings, fontClass }) {
      const firstOpen = path.topics.find(t => !t.locked && !path.status[t.id].complete && !path.status[t.id].empty);
      const [open, setOpen] = useState(firstOpen?.id || null);
      const [word, setWord] = useState(null);
      const rows = path.topics.filter(t => !path.status[t.id].empty);
      return (
        <div className="bg-white rounded-3xl shadow-xl p-6">
          <div className="flex flex-wrap items-center justify-between gap-2 mb-4">
            <h2 className="text-2xl font-bold text-gray-800">Learning Path</h2>
            {path.bypass && <span className="text-xs font-semibold px-2 py-1 rounded-lg bg-amber-100 text-amber-800">Admin bypass on: all topics open</span>}
          </div>
          <div className="flex flex-wrap gap-3 text-xs text-gray-500 mb-4">
            {[[null, 'Not faced'], [20, '<40%'], [60, '40–79%'], [90, '≥80%']].map(([p, l]) => (
              <span key={l} className="flex items-center gap-1.5"><span className={'w-3 h-3 rounded ' + strengthClass(p)} />{l}</span>
            ))}
            <span>· last {STRENGTH_WINDOW} attempts</span>
            <span>· unlock: every word {UNLOCK_RULE_TEXT} (★ = done)</span>
          </div>
          <div className="space-y-2">
            {rows.map(t => {
              const st = path.status[t.id];
              const isOpen = open === t.id && !t.locked;
              const words = vocabulary.filter(v => v.topic_id === t.id);
              return (
                <div key={t.id} className={'border rounded-2xl ' + (t.locked ? 'bg-gray-50 border-gray-100' : 'border-gray-200')}>
                  <button disabled={t.locked} onClick={() => setOpen(isOpen ? null : t.id)} className="w-full flex items-center gap-3 p-3 text-left disabled:cursor-not-allowed">
                    <span className={'text-xl ' + (t.locked ? 'grayscale opacity-50' : '')}>{t.locked ? '🔒' : t.icon}</span>
                    <span className={'flex-1 font-medium ' + fontClass + (t.locked ? ' text-gray-400' : ' text-gray-800')}>{topicTitle(t)}</span>
                    <span className={'text-xs font-semibold px-2 py-1 rounded-lg ' + (st.complete ? 'bg-green-100 text-green-700' : t.locked ? 'bg-gray-100 text-gray-400' : 'bg-jade-50 text-jade-700')}>
                      {st.complete ? '✓ Complete' : t.locked ? 'Locked · ' + st.total + ' words' : st.faced + '/' + st.total + ' done'}
                    </span>
                    {!t.locked && <span className="text-gray-400 text-sm">{isOpen ? '▲' : '▼'}</span>}
                  </button>
                  {isOpen && (
                    <div className="px-3 pb-3 overflow-x-auto">
                      <table className="w-full text-sm border-separate" style={{ borderSpacing: '4px' }}>
                        <thead><tr>
                          <th className="text-left text-xs font-semibold text-gray-400 px-1">Word</th>
                          {QUIZ_TYPES.map(q => <th key={q.id} title={q.label} className="text-center text-base w-12">{q.icon}</th>)}
                          <th className="text-center text-xs font-semibold text-gray-400 w-14">Overall</th>
                        </tr></thead>
                        <tbody>
                          {words.map(w => {
                            const byType = path.attempts[String(w.id)];
                            const cnt = path.counts[String(w.id)] || {};
                            const ov = overallPct(byType, ratings[w.id]?.rating);
                            return (
                              <tr key={w.id} onClick={() => setWord(w)} className="cursor-pointer hover:opacity-80">
                                <td className="px-1 py-1"><div className={'font-medium text-gray-800 ' + fontClass}>{w.translation?.native_text}</div><div className="text-xs text-gray-400">{w.english_text}</div></td>
                                {QUIZ_TYPES.map(q => { const p = strengthPct(byType?.[q.id]); const req = UNLOCK_QUIZ_TYPES.includes(q.id); const n = cnt[q.id] || 0; return <td key={q.id} title={req ? n + '/' + UNLOCK_MIN_ATTEMPTS + ' answers toward unlock' : n + ' answers (not needed to unlock)'} className={'text-center text-xs font-bold rounded-lg ' + strengthClass(p)}>{p == null ? '' : p}{req && n >= UNLOCK_MIN_ATTEMPTS ? '★' : ''}</td>; })}
                                <td className={'text-center text-xs font-bold rounded-lg ' + strengthClass(ov)}>{ov == null ? '–' : ov + '%'}</td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
          {word && <WordStrengthModal item={word} byType={path.attempts[String(word.id)]} rating={ratings[word.id]?.rating} fontClass={fontClass} onClose={() => setWord(null)} />}
        </div>
      );
    }

    function AppContent() {
      const { user } = useAuth();
      const [currentLanguage, setCurrentLanguage] = useState(() => loadFromStorage(STORAGE_KEYS.language, 'my'));
      const [activeView, setActiveView] = useState(() => loadFromStorage(STORAGE_KEYS.view, 'chart'));
      const [activeTopic, setActiveTopic] = useState(() => loadFromStorage(STORAGE_KEYS.topic, null));
      const [showEnglish, setShowEnglish] = useState(() => loadFromStorage(STORAGE_KEYS.showEnglish, true));

      const { languages, loading: loadingLangs } = useLanguages();
      const { topics, loading: loadingTopics } = useTopics(currentLanguage);
      const { vocabulary, loading: loadingVocab } = useVocabulary(currentLanguage);
      const { ratings, updateRating } = useUserRatings(currentLanguage);
      const path = useLearningPath({ user, languageCode: currentLanguage, topics, vocabulary });
      const visibleTopics = path.topics;
      const fontClassApp = LANGUAGE_FONTS[currentLanguage] || 'font-body';

      useEffect(() => { saveToStorage(STORAGE_KEYS.language, currentLanguage); }, [currentLanguage]);
      useEffect(() => { saveToStorage(STORAGE_KEYS.view, activeView); }, [activeView]);
      useEffect(() => { saveToStorage(STORAGE_KEYS.topic, activeTopic); }, [activeTopic]);
      useEffect(() => { saveToStorage(STORAGE_KEYS.showEnglish, showEnglish); }, [showEnglish]);
      useEffect(() => { window.KGAudio.loadManifest(currentLanguage); }, [currentLanguage]);
      useEffect(() => { if (user) window.KGAudio.initPrefs(supabase, user.id); }, [user]);
      useEffect(() => { window.KGAudio.stop(); }, [activeView, currentLanguage]);

      useEffect(() => {
        if (visibleTopics.length > 0) {
          const savedTopicExists = visibleTopics.some(t => t.id === activeTopic);
          if (!activeTopic || !savedTopicExists) setActiveTopic((visibleTopics.find(t => !t.locked) || visibleTopics[0]).id);
        }
      }, [visibleTopics, activeTopic]);

      const topicVocabulary = activeTopic ? vocabulary.filter(v => v.topic_id === activeTopic) : [];
      const currentTopic = visibleTopics.find(t => t.id === activeTopic);
      const prevPathTopic = currentTopic?.locked
        ? visibleTopics.slice(0, visibleTopics.indexOf(currentTopic)).reverse().find(t => !path.status[t.id]?.empty)
        : null;

      if (loadingLangs) return <div className="min-h-screen flex items-center justify-center"><LoadingSpinner message="Loading..." /></div>;

      return (
        <div className="min-h-screen bg-gray-50">
          <Header currentLanguage={currentLanguage} languages={languages} onLanguageChange={setCurrentLanguage}
            activeView={activeView} onViewChange={setActiveView} />

          {activeView === 'chart' && !loadingTopics && visibleTopics.length > 0 && (
            <TopicNav topics={visibleTopics} activeTopic={activeTopic} onSelect={setActiveTopic} showEnglish={showEnglish} pathStatus={path.enabled ? path.status : null} />
          )}

          <main className="pb-8">
            {(loadingTopics || loadingVocab || path.loading) ? (
              <div className="py-12"><LoadingSpinner message="Loading vocabulary..." /></div>
            ) : (
              <>
                {activeView === 'chart' && currentTopic?.locked && (
                  <LockedTopicPanel topic={currentTopic} prevTopic={prevPathTopic} prevStatus={prevPathTopic ? path.status[prevPathTopic.id] : null}
                    fontClass={fontClassApp} onGoQuiz={() => setActiveView('quiz')} />
                )}
                {activeView === 'chart' && !currentTopic?.locked && (
                  <ChartView topic={currentTopic} vocabulary={topicVocabulary} ratings={ratings} onRate={updateRating}
                    languageCode={currentLanguage} showEnglish={showEnglish} onToggleEnglish={setShowEnglish} />
                )}
                {activeView === 'quiz' && (
                  <QuizView topics={visibleTopics} vocabulary={path.unlockedVocab} poolVocabulary={path.visibleVocab} ratings={ratings} onRate={updateRating} languageCode={currentLanguage} user={user} onSessionSaved={path.refresh} />
                )}
                {activeView === 'flashcard' && (
                  <FlashcardView topics={visibleTopics} vocabulary={path.unlockedVocab} ratings={ratings} onRate={updateRating} languageCode={currentLanguage} user={user} />
                )}
                {activeView === 'progress' && (
                  <ProgressView topics={visibleTopics} vocabulary={path.visibleVocab} ratings={ratings} languageCode={currentLanguage} user={user} path={path.enabled || path.bypass ? path : null} />
                )}
              </>
            )}
          </main>

          {path.celebration && (
            <CelebrationModal topic={path.celebration.topic} next={path.celebration.next} fontClass={fontClassApp}
              onClose={path.dismissCelebration}
              onOpen={() => { const n = path.celebration.next; path.dismissCelebration(); if (n) { setActiveTopic(n.id); setActiveView('chart'); } }} />
          )}

          <footer className="bg-gray-800 text-white py-6 px-4">
            <div className="max-w-7xl mx-auto text-center">
              <p className="text-gray-300 text-sm">KG Vocabulary Learning System</p>
              <p className="text-gray-400 text-xs mt-1">Multi-language vocabulary with Devanagari transliteration</p>
            </div>
          </footer>
        </div>
      );
    }

    // Signed-out (or unapproved) visitors only see the sign-in card.
    function AuthGate({ children }) {
      const { user } = useAuth();
      if (user) return children;
      return <div className="min-h-screen bg-jade-700"><AuthModal onClose={() => {}} /></div>;
    }

    function App() {
      return (
        <AuthProvider>
          <AuthGate>
            <AppContent />
          </AuthGate>
        </AuthProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
