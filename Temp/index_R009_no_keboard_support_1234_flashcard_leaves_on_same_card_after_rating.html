    // ==========================================
    // LANGUAGE CONVERTER SYSTEM
    // ==========================================
    
    // Registry of language converters
    const LanguageConverters = {};

    // Build converter from language data (consonants, vowels, medials, finals)
    function buildConverter(langData) {
      // Build mapping tables
      const charToDevanagari = {};
      const charToRoman = {};
      
      // Add consonants
      if (langData.consonants) {
        langData.consonants.forEach(c => {
          if (c.char && c.devanagari) charToDevanagari[c.char] = c.devanagari;
          if (c.char && c.roman) charToRoman[c.char] = c.roman;
        });
      }
      
      // Add vowels (matras)
      if (langData.vowels) {
        langData.vowels.forEach(v => {
          if (v.char && v.devanagari) charToDevanagari[v.char] = v.devanagari;
          if (v.char && v.roman) charToRoman[v.char] = v.roman;
        });
      }
      
      // Add medials
      if (langData.medials) {
        langData.medials.forEach(m => {
          if (m.char && m.devanagari) charToDevanagari[m.char] = m.devanagari;
          if (m.char && m.roman) charToRoman[m.char] = m.roman;
        });
      }
      
      // Add finals
      if (langData.finals) {
        langData.finals.forEach(f => {
          if (f.char && f.devanagari) charToDevanagari[f.char] = f.devanagari;
          if (f.char && f.roman) charToRoman[f.char] = f.roman;
        });
      }

      // Add combinations (multi-char sequences like ုန် that must match as a unit)
      if (langData.combinations) {
        langData.combinations.forEach(c => {
          if (c.char && c.devanagari) charToDevanagari[c.char] = c.devanagari;
          if (c.char && c.roman) charToRoman[c.char] = c.roman;
        });
      }

      // Sort keys by length (longer first) for proper multi-char matching
      const sortedKeys = Object.keys(charToDevanagari).sort((a, b) => b.length - a.length);
      const sortedRomanKeys = Object.keys(charToRoman).sort((a, b) => b.length - a.length);

      return {
        toDevanagari: (text) => {
          if (!text) return '';
          let result = '';
          let i = 0;
          
          while (i < text.length) {
            let matched = false;
            
            // Try to match longer sequences first
            for (const key of sortedKeys) {
              if (text.substring(i, i + key.length) === key) {
                result += charToDevanagari[key];
                i += key.length;
                matched = true;
                break;
              }
            }
            
            if (!matched) {
              // Keep the character as-is if no mapping found
              result += text[i];
              i++;
            }
          }
          
          return result;
        },
        
        toRoman: (text) => {
          if (!text) return '';
          let result = '';
          let i = 0;
          
          while (i < text.length) {
            let matched = false;
            
            for (const key of sortedRomanKeys) {
              if (text.substring(i, i + key.length) === key) {
                result += charToRoman[key];
                i += key.length;
                matched = true;
                break;
              }
            }
            
            if (!matched) {
              result += text[i];
              i++;
            }
          }
          
          return result;
        },
        
        langData
      };
    }

    // Register Burmese converter (loaded from ./js/languages/burmese.js)
    if (typeof burmese !== 'undefined') {
      LanguageConverters['my'] = buildConverter(burmese);
      console.log('✓ Burmese converter loaded');
    } else {
      console.warn('⚠ Burmese language file not loaded');
    }

    // Build Chinese converter (syllable-based: pinyin → Devanagari)
    // Unlike Burmese (char-based), Chinese converts from PRONUNCIATION, not native text
    function buildChineseConverter(langData) {
      const { syllables, toneMarks, toneSuffixes } = langData;
      const syllableKeys = Object.keys(syllables).sort((a, b) => b.length - a.length);

      return {
        // Flag: this converter needs pronunciation field, not native_text
        usePronunciation: true,

        toDevanagari: (pinyinText) => {
          if (!pinyinText) return '';

          const words = pinyinText.trim().split(/\s+/);
          return words.map(word => {
            // Strip tone marks, record tone per character position
            let bare = '';
            const toneAt = []; // { pos, tone }

            for (const ch of word) {
              const lower = ch.toLowerCase();
              if (toneMarks[lower]) {
                toneAt.push({ pos: bare.length, tone: toneMarks[lower].tone });
                bare += toneMarks[lower].base;
              } else {
                bare += lower;
              }
            }

            // Greedy longest-match split into syllables
            const parts = [];
            let i = 0;
            while (i < bare.length) {
              let matched = false;
              for (const key of syllableKeys) {
                if (bare.substring(i, i + key.length) === key) {
                  // Find tone that falls within this syllable's range
                  let tone = 0;
                  for (const t of toneAt) {
                    if (t.pos >= i && t.pos < i + key.length) { tone = t.tone; break; }
                  }
                  const dev = syllables[key] || key;
                  const suffix = tone && toneSuffixes[tone] ? toneSuffixes[tone] : '';
                  parts.push(dev + suffix);
                  i += key.length;
                  matched = true;
                  break;
                }
              }
              if (!matched) { parts.push(bare[i]); i++; }
            }
            return parts.join('');
          }).join(' ');
        },

        toRoman: (pinyinText) => {
          // Pinyin IS the romanization — just return it cleaned
          return pinyinText || '';
        },

        langData
      };
    }

    // Register Chinese converter (loaded from ./js/languages/chinese.js)
    if (typeof chinese !== 'undefined') {
      LanguageConverters['zh'] = buildChineseConverter(chinese);
      console.log('✓ Chinese converter loaded');
    } else {
      console.warn('⚠ Chinese language file not loaded');
    }

    // Get converter for a language code
    function getConverter(langCode) {
      return LanguageConverters[langCode] || null;
    }

    // Convert text to Devanagari
    function convertToDevanagari(text, langCode) {
      const converter = getConverter(langCode);
      if (converter) {
        return converter.toDevanagari(text);
      }
      return text; // Return original if no converter
    }

    // Convert text to Roman
    function convertToRoman(text, langCode) {
      const converter = getConverter(langCode);
      if (converter) {
        return converter.toRoman(text);
      }
      return text;
    }

    // ==========================================
    // SUPABASE CLIENT
    // ==========================================
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const getImageUrl = (topicId, filename) => {
      if (!filename) return null;
      if (filename.startsWith('http')) return filename;
      return `${SUPABASE_URL}/storage/v1/object/public/${STORAGE_BUCKET}/${topicId}/${filename}`;
    };

    // ==========================================
    // CONSTANTS
    // ==========================================
    const RATINGS = [
      { id: 1, emoji: '✓', label: 'Monthly Review', description: 'Know well', color: 'bg-green-500', textColor: 'text-green-500' },
      { id: 2, emoji: '💬', label: "Can't use in conversation", description: 'Recognition only', color: 'bg-blue-500', textColor: 'text-blue-500' },
      { id: 3, emoji: '✍', label: "Can't write", description: 'Speaking only', color: 'bg-yellow-500', textColor: 'text-yellow-500' },
      { id: 4, emoji: '🤔', label: "Understand but can't use", description: 'Passive', color: 'bg-orange-500', textColor: 'text-orange-500' },
      { id: 5, emoji: '❌', label: "Don't know", description: 'Need to learn', color: 'bg-red-500', textColor: 'text-red-500' },
    ];

    const QUIZ_TYPES = [
      { id: 'native_to_image', label: 'Native → Image', icon: '🔤' },
      { id: 'image_to_native', label: 'Image → Native', icon: '🖼️' },
      { id: 'devanagari_to_image', label: 'Devanagari → Image', icon: '🕉️' },
      { id: 'english_to_native', label: 'English → Native', icon: '🌐' },
    ];

    const DAILY_TARGET_OPTIONS = [5, 10, 15, 20, 25, 30, 50, 0];

    const LANGUAGE_FONTS = {
      my: 'font-burmese',
      ja: 'font-japanese',
      zh: 'font-chinese',
      te: 'font-devanagari',
    };

    const getRatingById = (id) => RATINGS.find(r => r.id === id);

    // ==========================================
    // AUTH CONTEXT
    // ==========================================
    const AuthContext = createContext({});
    const useAuth = () => useContext(AuthContext);

    function AuthProvider({ children }) {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => {
          setUser(session?.user ?? null);
          setLoading(false);
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setUser(session?.user ?? null);
        });

        return () => subscription.unsubscribe();
      }, []);

      const signInWithEmail = async (email, password) => {
        return await supabase.auth.signInWithPassword({ email, password });
      };

      const signUpWithEmail = async (email, password) => {
        return await supabase.auth.signUp({ email, password });
      };

      const signOut = async () => {
        return await supabase.auth.signOut();
      };

      return (
        <AuthContext.Provider value={{ user, loading, signInWithEmail, signUpWithEmail, signOut }}>
          {!loading && children}
        </AuthContext.Provider>
      );
    }

    // ==========================================
    // DATA HOOKS
    // ==========================================
    function useLanguages() {
      const [languages, setLanguages] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        supabase
          .from(TABLES.languages)
          .select('*')
          .eq('is_active', true)
          .order('sort_order')
          .then(({ data, error }) => {
            if (!error) setLanguages(data || []);
            setLoading(false);
          });
      }, []);

      return { languages, loading };
    }

    function useTopics(languageCode) {
      const [topics, setTopics] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        if (!languageCode) return;
        setLoading(true);

        supabase
          .from(TABLES.topics)
          .select(`*, translations:${TABLES.topicTranslations}(*)`)
          .order('sort_order')
          .then(({ data, error }) => {
            if (!error && data) {
              const mapped = data.map(topic => {
                const translation = topic.translations?.find(t => t.language_code === languageCode);
                if (!translation) return { ...topic, translation: null };

                const converter = getConverter(languageCode);
                const usesPronunciation = converter?.usePronunciation;

                // Chinese: convert from pronunciation.pinyin if available
                const titleSource = usesPronunciation
                  ? (translation.pronunciation?.pinyin || translation.title_native)
                  : translation.title_native;

                const questionSource = usesPronunciation
                  ? (translation.pronunciation?.pinyin_question || translation.question_native)
                  : translation.question_native;

                return {
                  ...topic,
                  translation: {
                    ...translation,
                    title_devanagari: convertToDevanagari(titleSource, languageCode),
                    question_devanagari: convertToDevanagari(questionSource, languageCode)
                  }
                };
              }).filter(t => t.translation);
              setTopics(mapped);
            }
            setLoading(false);
          });
      }, [languageCode]);

      return { topics, loading };
    }

    function useVocabulary(languageCode) {
      const [vocabulary, setVocabulary] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        if (!languageCode) return;
        setLoading(true);

        supabase
          .from(TABLES.vocabulary)
          .select(`*, translations:${TABLES.vocabularyTranslations}(*)`)
          .order('sort_order')
          .then(({ data, error }) => {
            if (!error && data) {
              const mapped = data.map(vocab => {
                const translation = vocab.translations?.find(t => t.language_code === languageCode);
                if (!translation) return { ...vocab, translation: null };

                const converter = getConverter(languageCode);
                const usesPronunciation = converter?.usePronunciation;

                // Chinese: convert from pinyin pronunciation field
                // Burmese/others: convert from native_text
                const sourceText = usesPronunciation
                  ? (translation.pronunciation?.pinyin || '')
                  : translation.native_text;

                const devanagari = convertToDevanagari(sourceText, languageCode);

                // Build pronunciation display
                // For pronunciation-based langs: keep DB pronunciation + add devanagari info
                // For char-based langs: generate roman from native text
                const pronunciation = usesPronunciation
                  ? { ...(translation.pronunciation || {}), roman: translation.pronunciation?.pinyin || '' }
                  : { roman: convertToRoman(translation.native_text, languageCode) };

                return {
                  ...vocab,
                  translation: { ...translation, devanagari, pronunciation }
                };
              }).filter(v => v.translation);
              setVocabulary(mapped);
            }
            setLoading(false);
          });
      }, [languageCode]);

      return { vocabulary, loading };
    }

    function useUserRatings(languageCode) {
      const { user } = useAuth();
      const [ratings, setRatings] = useState({});

      useEffect(() => {
        if (!user || !languageCode) return;

        supabase
          .from(TABLES.userRatings)
          .select('*')
          .eq('user_id', user.id)
          .eq('language_code', languageCode)
          .then(({ data }) => {
            const map = {};
            (data || []).forEach(r => { map[r.vocabulary_id] = r; });
            setRatings(map);
          });
      }, [user, languageCode]);

      const updateRating = useCallback(async (vocabularyId, rating) => {
        if (!user) return false;

        const now = new Date().toISOString();
        const { error } = await supabase
          .from(TABLES.userRatings)
          .upsert({
            user_id: user.id,
            vocabulary_id: vocabularyId,
            language_code: languageCode,
            rating,
            last_reviewed_at: now,
          }, { onConflict: 'user_id,vocabulary_id,language_code' });

        if (!error) {
          setRatings(prev => ({
            ...prev,
            [vocabularyId]: { ...prev[vocabularyId], rating, last_reviewed_at: now }
          }));
        }
        return !error;
      }, [user, languageCode]);

      return { ratings, updateRating };
    }

    function LoadingSpinner({ message = 'Loading...' }) {

        setLoading(true);
        const { error } = isSignUp
          ? await signUpWithEmail(email, password)
          : await signInWithEmail(email, password);
        if (error) setError(error.message);
        else onClose();
        setLoading(false);
      };

      return (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50" onClick={onClose}>
          <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl animate-scale-in" onClick={e => e.stopPropagation()}>
            <div className="text-center mb-6">
              <div className="w-16 h-16 bg-jade-100 rounded-full flex items-center justify-center mx-auto mb-4">

                {isSignUp ? 'Create Account' : 'Welcome Back'}
              </h2>
            </div>

            {error && (
              <div className="bg-red-50 text-red-600 px-4 py-3 rounded-lg mb-4 text-sm">{error}</div>
            )}

            <form onSubmit={handleSubmit} className="space-y-4">
              <input type="email" value={email} onChange={(e) => setEmail(e.target.value)}
                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-jade-500"
                placeholder="Email" required />
              <input type="password" value={password} onChange={(e) => setPassword(e.target.value)}
                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-jade-500"
                placeholder="Password" required minLength={6} />
              <button type="submit" disabled={loading}
                className="w-full py-3 bg-jade-600 text-white rounded-lg font-semibold hover:bg-jade-700 transition disabled:opacity-50">
                {loading ? 'Loading...' : (isSignUp ? 'Create Account' : 'Sign In')}
              </button>
            </form>

            <p className="text-center text-sm text-gray-500 mt-4">
              {isSignUp ? 'Have an account?' : "No account?"}
              <button onClick={() => setIsSignUp(!isSignUp)} className="text-jade-600 font-medium ml-1 hover:underline">
                {isSignUp ? 'Sign In' : 'Sign Up'}
              </button>
            </p>
          </div>
        </div>
      );
    }

    function Header({ currentLanguage, languages, onLanguageChange, activeView, onViewChange }) {
      const { user, signOut } = useAuth();
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [showUserMenu, setShowUserMenu] = useState(false);

      const views = [
        { id: 'chart', icon: '📊', label: 'Chart' },
        { id: 'quiz', icon: '🎯', label: 'Quiz' },
        { id: 'flashcard', icon: '🃏', label: 'Cards' },
        { id: 'progress', icon: '📈', label: 'Progress' },
      ];

      return (
        <>
          <header className="bg-gradient-to-r from-jade-700 to-jade-800 text-white shadow-lg">
            <div className="max-w-7xl mx-auto px-4 py-4">
              <div className="flex items-center justify-between flex-wrap gap-4">
                <div className="flex items-center gap-3">
                  <div className="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center text-2xl">📚</div>
                  <div>
                    <h1 className="text-xl md:text-2xl font-bold">KG Vocabulary Chart</h1>
                    <p className="text-jade-200 text-sm">Multi-language learning</p>

              {item.translation?.devanagari}

            {showEnglish && (
              <div className="text-center text-xs text-gray-400 mt-1">{item.english_text}</div>

          <div className="absolute bottom-0 left-0 right-0 bg-white/95 border-t border-gray-200 p-2 opacity-0 group-hover:opacity-100 transition-opacity">
            <div className="flex justify-center gap-1">
              {RATINGS.map((r) => (

                  }`} title={r.label}>{r.emoji}</button>

            <div className="text-center">

                {colorCode ? (
                  <div className="w-24 h-24 rounded-xl shadow-lg" style={{ backgroundColor: colorCode }} />
                ) : imageError || !item.image_filename ? (
                  <div className="text-6xl opacity-50">📷</div>
                ) : (
                  <img src={getImageUrl(topicId, item.image_filename)} alt={item.english_text}
                    className="max-w-full max-h-full object-contain" onError={() => setImageError(true)} />

              <h2 className={`text-4xl font-bold text-gray-800 mb-2 ${fontClass}`}>
                {item.translation?.native_text}

                {item.translation?.devanagari}

              {Object.keys(pronunciation).length > 0 && (
                <div className="flex flex-wrap justify-center gap-2 mb-3">
                  {Object.entries(pronunciation).map(([key, value]) => (
                    <span key={key} className="px-3 py-1 bg-gray-100 rounded-full text-sm text-gray-600">
                      <span className="text-gray-400 mr-1">{key}:</span>{value}

                  ))}

              <div className="text-xl text-gray-600 mb-8">{item.english_text}</div>

              <div className="mb-6">
                <p className="text-sm text-gray-500 mb-3">How well do you know this?</p>
                <div className="flex flex-wrap justify-center gap-2">
                  {RATINGS.map((r) => (
                    <button key={r.id} onClick={() => onRate(item.id, r.id)}
                      className={`px-4 py-2 rounded-xl text-sm font-medium transition-all ${
                        rating === r.id ? r.color + ' text-white shadow-lg' : 'bg-gray-100 hover:bg-gray-200'
                      }`}>{r.emoji} {r.label}</button>
                  ))}

              </div>

              <button onClick={onClose} className="px-8 py-3 bg-jade-600 text-white rounded-full font-semibold hover:bg-jade-700 transition shadow-lg">
                Close

    function ChartView({ topic, vocabulary, ratings, onRate, languageCode, showEnglish, onToggleEnglish }) {
      const [selectedItem, setSelectedItem] = useState(null);
      const fontClass = LANGUAGE_FONTS[languageCode] || 'font-body';

      if (!topic) {
        return (
          <div className="flex items-center justify-center h-64">
            <p className="text-gray-500">Select a topic to view vocabulary</p>
          </div>
        );
      }

      return (
        <div className="max-w-7xl mx-auto px-4 py-6">
          <div className="bg-white rounded-2xl shadow-lg mb-6 overflow-hidden border border-gray-100">
            <div className="grid grid-cols-1 md:grid-cols-4">
              <div className="bg-gradient-to-r from-jade-700 to-jade-800 p-6 flex items-center justify-center">
                <div className="text-5xl">{topic.icon}</div>
              </div>
              <div className="p-4 flex flex-col justify-center items-center border-b md:border-b-0 md:border-r border-gray-100">
                <div className={`text-2xl font-bold text-gray-800 ${fontClass}`}>{topic.translation?.title_native}</div>
                <div className="text-lg text-blue-600 font-devanagari mt-1">{topic.translation?.title_devanagari}</div>
              </div>
              <div className="p-4 flex items-center justify-center border-b md:border-b-0 md:border-r border-gray-100 bg-gray-50">
                <p className="text-center text-gray-700 font-medium">{topic.translation?.question_english}</p>
              </div>
              <div className="p-4 flex flex-col justify-center items-center">
                <div className={`text-sm text-red-700 text-center ${fontClass}`}>{topic.translation?.question_native}</div>
                <div className="text-xs text-red-500 text-center mt-1 font-devanagari">
                  {topic.translation?.question_devanagari}
                </div>
              </div>
            </div>
          </div>

          <div className="flex items-center justify-between mb-4 bg-white rounded-xl p-3 shadow-sm">
            <label className="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" checked={showEnglish} onChange={(e) => onToggleEnglish(e.target.checked)}
                className="w-5 h-5 rounded border-gray-300 text-jade-600" />
              <span className="text-sm text-gray-700 font-medium">Show English</span>
            </label>
            <div className="text-sm text-gray-500">{vocabulary.length} items</div>
          </div>

          <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
            {vocabulary.map((item) => (
              <VocabCard key={item.id} item={item} topicId={topic.id} rating={ratings[item.id]?.rating}
                onRate={onRate} onClick={() => setSelectedItem(item)} showEnglish={showEnglish} fontClass={fontClass} />
            ))}
          </div>

          {selectedItem && (
            <DetailModal item={selectedItem} topicId={topic.id} rating={ratings[selectedItem.id]?.rating}
              onRate={onRate} onClose={() => setSelectedItem(null)} fontClass={fontClass} />

    }

    function QuizView({ topics, vocabulary, ratings, onRate, languageCode, user }) {
      const [quizTopic, setQuizTopic] = useState('all');
      const [quizType, setQuizType] = useState('native_to_image');
      const [dailyTarget, setDailyTarget] = useState(() => loadFromStorage(STORAGE_KEYS.quizTarget, 10));
      const [currentQuestion, setCurrentQuestion] = useState(null);
      const [options, setOptions] = useState([]);
      const [selectedAnswer, setSelectedAnswer] = useState(null);
      const [showResult, setShowResult] = useState(false);
      const [score, setScore] = useState({ correct: 0, total: 0 });
      const [quizStarted, setQuizStarted] = useState(false);
      const [quizWords, setQuizWords] = useState([]);
      const [currentWordIndex, setCurrentWordIndex] = useState(0);
      const [quizCompleted, setQuizCompleted] = useState(false);
      const [quizAnswers, setQuizAnswers] = useState([]);
      const [recentSessions, setRecentSessions] = useState([]);
      const [sessionSaved, setSessionSaved] = useState(false);

      const fontClass = LANGUAGE_FONTS[languageCode] || 'font-body';
      const filteredVocab = quizTopic === 'all' ? vocabulary : vocabulary.filter(v => v.topic_id === quizTopic);

      useEffect(() => { saveToStorage(STORAGE_KEYS.quizTarget, dailyTarget); }, [dailyTarget]);

      // Load recent quiz sessions
      useEffect(() => {
        if (!user) return;
        supabase
          .from(TABLES.quizSessions)
          .select('*')
          .eq('user_id', user.id)
          .eq('language_code', languageCode)
          .order('completed_at', { ascending: false })
          .limit(5)
          .then(({ data }) => { if (data) setRecentSessions(data); });
      }, [user, languageCode, sessionSaved]);

      // Save quiz session on completion
      useEffect(() => {
        if (!quizCompleted || !user || sessionSaved || score.total === 0) return;

        const saveSession = async () => {
          const { data: session, error: sessionErr } = await supabase
            .from(TABLES.quizSessions)
            .insert({
              user_id: user.id,
              language_code: languageCode,
              topic_id: quizTopic === 'all' ? null : quizTopic,
              quiz_type: quizType,
              total_questions: score.total,
              correct_answers: score.correct,
            })
            .select('id')
            .single();

          if (!sessionErr && session && quizAnswers.length > 0) {
            await supabase
              .from(TABLES.quizAnswers)
              .insert(quizAnswers.map(a => ({ ...a, session_id: session.id })));
          }
          setSessionSaved(true);
        };
        saveSession();
      }, [quizCompleted]);

      const startQuiz = useCallback(() => {
        const targetCount = dailyTarget === 0 ? filteredVocab.length : Math.min(dailyTarget, filteredVocab.length);
        const shuffled = [...filteredVocab].sort(() => Math.random() - 0.5);
        const selected = shuffled.slice(0, targetCount);
        setQuizWords(selected);
        setCurrentWordIndex(0);
        setScore({ correct: 0, total: 0 });
        setQuizAnswers([]);
        setSessionSaved(false);
        setQuizCompleted(false);
        setQuizStarted(true);
      }, [filteredVocab, dailyTarget]);

      const generateQuestion = useCallback(() => {
        if (vocabulary.length < 4 || quizWords.length < 1 || currentWordIndex >= quizWords.length) {
          setQuizCompleted(true);
          return;
        }
        const questionItem = quizWords[currentWordIndex];
        // Pull wrong options from ALL vocabulary for variety
        // Prefer same-topic words first, then fill from other topics
        const sameTopic = filteredVocab.filter(v => v.id !== questionItem.id).sort(() => Math.random() - 0.5);
        const otherTopics = vocabulary.filter(v => v.id !== questionItem.id && v.topic_id !== questionItem.topic_id).sort(() => Math.random() - 0.5);
        const wrongPool = [...sameTopic, ...otherTopics];
        const wrongOptions = wrongPool.slice(0, 3);
        const allOptions = [questionItem, ...wrongOptions].sort(() => Math.random() - 0.5);
        setCurrentQuestion(questionItem);
        setOptions(allOptions);
        setSelectedAnswer(null);
        setShowResult(false);
      }, [quizWords, currentWordIndex, filteredVocab, vocabulary]);

      useEffect(() => {
        if (quizStarted && quizWords.length >= 1 && vocabulary.length >= 4 && !quizCompleted) generateQuestion();
      }, [quizStarted, quizWords, currentWordIndex, generateQuestion, quizCompleted]);

      const handleAnswer = (item) => {
        if (showResult) return;
        setSelectedAnswer(item);
        setShowResult(true);
        const isCorrect = item.id === currentQuestion.id;
        setScore(prev => ({ correct: prev.correct + (isCorrect ? 1 : 0), total: prev.total + 1 }));
        // Track answer for session persistence
        setQuizAnswers(prev => [...prev, {
          vocabulary_id: currentQuestion.id,
          selected_vocabulary_id: item.id,
          is_correct: isCorrect,
        }]);
        // Only auto-rate unrated words as "Don't know" — never overwrite an existing rating
        if (!isCorrect && user && !ratings[currentQuestion.id]?.rating) {
          onRate(currentQuestion.id, 5);
        }
      };

      const nextQuestion = () => {
        if (currentWordIndex + 1 >= quizWords.length) setQuizCompleted(true);
        else setCurrentWordIndex(prev => prev + 1);
      };

      if (!quizStarted) {
        return (
          <div className="max-w-2xl mx-auto p-6">
            <div className="bg-white rounded-3xl shadow-xl p-8">
              <div className="text-center mb-8">
                <div className="w-20 h-20 bg-jade-100 rounded-full flex items-center justify-center mx-auto mb-4">
                  <span className="text-4xl">🎯</span>
                </div>
                <h2 className="text-3xl font-bold text-gray-800">Quiz Mode</h2>
              </div>

              <div className="space-y-6">
                <div>
                  <label className="block text-sm font-semibold text-gray-700 mb-2">Topic</label>
                  <select value={quizTopic} onChange={(e) => setQuizTopic(e.target.value)} className="w-full px-4 py-3 border rounded-xl">
                    <option value="all">All Topics ({vocabulary.length} words)</option>
                    {topics.map(t => {
                      const count = vocabulary.filter(v => v.topic_id === t.id).length;
                      return <option key={t.id} value={t.id}>{t.icon} {t.translation?.title_native} ({count})</option>;
                    })}
                  </select>
                </div>

                <div>
                  <label className="block text-sm font-semibold text-gray-700 mb-2">
                    Daily Target <span className="text-gray-400 font-normal ml-2">({dailyTarget === 0 ? 'All' : dailyTarget} words)</span>
                  </label>
                  <div className="grid grid-cols-4 gap-2">
                    {DAILY_TARGET_OPTIONS.map(target => (
                      <button key={target} onClick={() => setDailyTarget(target)}
                        className={`py-3 rounded-xl border-2 font-medium transition-all ${
                          dailyTarget === target ? 'border-jade-500 bg-jade-50 text-jade-700' : 'border-gray-200 hover:border-gray-300'
                        }`}>{target === 0 ? 'All' : target}</button>
                    ))}
                  </div>
                </div>

                <div>
                  <label className="block text-sm font-semibold text-gray-700 mb-2">Quiz Type</label>
                  <div className="grid grid-cols-2 gap-3">
                    {QUIZ_TYPES.map(type => (
                      <button key={type.id} onClick={() => setQuizType(type.id)}
                        className={`p-4 rounded-xl border-2 transition-all ${quizType === type.id ? 'border-jade-500 bg-jade-50' : 'border-gray-200'}`}>
                        <div className="text-2xl mb-1">{type.icon}</div>
                        <div className="text-sm font-medium">{type.label}</div>
                      </button>
                    ))}
                  </div>
                </div>

                <button onClick={startQuiz} disabled={filteredVocab.length < 1 || vocabulary.length < 4}
                  className="w-full py-4 bg-jade-600 text-white rounded-xl font-bold text-lg hover:bg-jade-700 disabled:opacity-50">
                  {vocabulary.length < 4 ? 'Need 4+ words total' : filteredVocab.length < 1 ? 'No words in topic' : `Start Quiz (${dailyTarget === 0 ? filteredVocab.length : Math.min(dailyTarget, filteredVocab.length)} words)`}
                </button>
              </div>
            </div>

            {recentSessions.length > 0 && (
              <div className="bg-white rounded-2xl shadow-lg p-6 mt-6">
                <h3 className="text-lg font-bold text-gray-800 mb-4">Recent Quizzes</h3>
                <div className="space-y-3">
                  {recentSessions.map(s => {
                    const pct = s.total_questions > 0 ? Math.round((s.correct_answers / s.total_questions) * 100) : 0;
                    const topicObj = topics.find(t => t.id === s.topic_id);
                    const topicLabel = s.topic_id ? (topicObj ? `${topicObj.icon} ${topicObj.translation?.title_native}` : s.topic_id) : 'All Topics';
                    const date = new Date(s.completed_at);
                    const dateStr = date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
                    const timeStr = date.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
                    return (
                      <div key={s.id} className="flex items-center justify-between p-3 bg-gray-50 rounded-xl">
                        <div className="flex items-center gap-3">
                          <div className={`w-10 h-10 rounded-full flex items-center justify-center text-white text-sm font-bold ${
                            pct >= 80 ? 'bg-green-500' : pct >= 60 ? 'bg-yellow-500' : 'bg-red-500'
                          }`}>{pct}%</div>
                          <div>
                            <div className="text-sm font-medium text-gray-800">{topicLabel}</div>
                            <div className="text-xs text-gray-400">{dateStr} {timeStr}</div>
                          </div>
                        </div>
                        <div className="text-sm text-gray-600 font-medium">{s.correct_answers}/{s.total_questions}</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </div>
        );
      }

      if (quizCompleted) {
        const percentage = score.total > 0 ? Math.round(score.correct / score.total * 100) : 0;
        let message = '', emoji = '';
        if (percentage >= 90) { message = 'Excellent!'; emoji = '🏆'; }
        else if (percentage >= 70) { message = 'Great job!'; emoji = '🌟'; }
        else if (percentage >= 50) { message = 'Good effort!'; emoji = '👍'; }
        else { message = 'Keep practicing!'; emoji = '💪'; }

        return (
          <div className="max-w-2xl mx-auto p-6">
            <div className="bg-white rounded-3xl shadow-xl p-8 text-center">
              <div className="text-6xl mb-4">{emoji}</div>
              <h2 className="text-3xl font-bold text-gray-800 mb-2">{message}</h2>
              <p className="text-gray-500 mb-6">Quiz Completed!</p>
              <div className="bg-gradient-to-r from-jade-500 to-jade-600 text-white rounded-2xl p-6 mb-6">
                <div className="text-5xl font-bold mb-2">{score.correct}/{score.total}</div>
                <div className="text-xl opacity-90">{percentage}% Correct</div>
              </div>
              {user && (
                <p className={`text-sm mb-4 ${sessionSaved ? 'text-green-600' : 'text-gray-400'}`}>
                  {sessionSaved ? '✓ Results saved' : 'Saving...'}
                </p>
              )}
              <div className="flex gap-4 justify-center">
                <button onClick={() => { setQuizStarted(false); setQuizCompleted(false); }}
                  className="px-6 py-3 bg-gray-100 rounded-xl font-medium hover:bg-gray-200">← Back to Setup</button>
                <button onClick={startQuiz}
                  className="px-6 py-3 bg-jade-600 text-white rounded-xl font-bold hover:bg-jade-700">Try Again</button>
              </div>
            </div>
          </div>
        );
      }

      if (!currentQuestion) return <LoadingSpinner />;

      return (
        <div className="max-w-4xl mx-auto p-4">
          <div className="bg-white rounded-2xl shadow-lg p-4 mb-6">
            <div className="flex flex-wrap items-center justify-between gap-4">
              <button onClick={() => setQuizStarted(false)} className="px-4 py-2 bg-gray-100 rounded-xl hover:bg-gray-200 font-medium">← Back</button>
              <div className="flex items-center gap-4">
                <div className="text-sm text-gray-500">{currentWordIndex + 1} / {quizWords.length}</div>
                <div className="w-32 h-2 bg-gray-200 rounded-full overflow-hidden">
                  <div className="h-full bg-jade-500 transition-all duration-300" style={{ width: `${((currentWordIndex + 1) / quizWords.length) * 100}%` }} />
                </div>
                <div className="bg-gradient-to-r from-jade-500 to-jade-600 text-white px-4 py-2 rounded-xl font-bold shadow-md">
                  {score.correct}/{score.total}
                </div>
              </div>
            </div>
          </div>

          <div className="bg-white rounded-2xl shadow-lg p-8 mb-6 text-center">
            <div className="text-sm text-gray-400 mb-4">Find the matching answer:</div>
            {quizType === 'native_to_image' && (
              <>
                <div className={`text-4xl font-bold text-gray-800 mb-2 ${fontClass}`}>{currentQuestion.translation?.native_text}</div>
                <div className="text-xl text-blue-600 font-devanagari">{currentQuestion.translation?.devanagari}</div>
              </>
            )}
            {quizType === 'image_to_native' && (
              <div className="w-32 h-32 mx-auto flex items-center justify-center">
                {currentQuestion.extra_data?.colorCode ? (
                  <div className="w-24 h-24 rounded-xl shadow-lg" style={{ backgroundColor: currentQuestion.extra_data.colorCode }} />
                ) : (
                  <img src={getImageUrl(currentQuestion.topic_id, currentQuestion.image_filename)} alt="" className="max-w-full max-h-full object-contain" />
                )}
              </div>
            )}
            {quizType === 'devanagari_to_image' && (
              <div className="text-4xl text-blue-600 font-devanagari">{currentQuestion.translation?.devanagari}</div>
            )}
            {quizType === 'english_to_native' && (
              <div className="text-3xl font-bold text-gray-800">{currentQuestion.english_text}</div>
            )}
          </div>

          <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            {options.map((opt) => {
              let borderClass = 'border-gray-200 hover:border-jade-300 hover:shadow-lg';
              if (showResult) {
                if (opt.id === currentQuestion.id) borderClass = 'border-green-500 border-4 bg-green-50';
                else if (selectedAnswer?.id === opt.id) borderClass = 'border-red-500 border-4 bg-red-50';
              }
              return (
                <button key={opt.id} onClick={() => handleAnswer(opt)} disabled={showResult}
                  className={`p-4 rounded-xl border-2 transition-all ${borderClass}`}>
                  {(quizType === 'native_to_image' || quizType === 'devanagari_to_image') ? (
                    <>
                      <div className="w-20 h-20 mx-auto flex items-center justify-center mb-2">
                        {opt.extra_data?.colorCode ? (
                          <div className="w-14 h-14 rounded-lg shadow" style={{ backgroundColor: opt.extra_data.colorCode }} />
                        ) : (
                          <img src={getImageUrl(opt.topic_id, opt.image_filename)} alt="" className="max-w-full max-h-full object-contain" />
                        )}
                      </div>
                      <div className="text-xs text-gray-500">{opt.english_text}</div>
                    </>
                  ) : (
                    <>
                      <div className={`text-lg font-semibold text-gray-800 ${fontClass}`}>{opt.translation?.native_text}</div>
                      <div className="text-sm text-blue-600 font-devanagari mt-1">{opt.translation?.devanagari}</div>
                    </>
                  )}
                </button>
              );
            })}
          </div>

          {showResult && (
            <div className="text-center animate-slide-up">
              <div className={`text-2xl font-bold mb-4 ${selectedAnswer?.id === currentQuestion.id ? 'text-green-600' : 'text-red-600'}`}>
                {selectedAnswer?.id === currentQuestion.id ? '✅ Correct!' : `❌ Wrong! It was "${currentQuestion.english_text}"`}
              </div>
              <button onClick={nextQuestion} className="px-8 py-3 bg-blue-600 text-white rounded-full font-bold hover:bg-blue-700">
                {currentWordIndex + 1 >= quizWords.length ? 'See Results' : 'Next Question →'}
              </button>
            </div>
          )}
        </div>
      );
    }

    function FlashcardView({ topics, vocabulary, ratings, onRate, languageCode, user }) {
      const [selectedTopic, setSelectedTopic] = useState('all');
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);

      const fontClass = LANGUAGE_FONTS[languageCode] || 'font-body';
      const filteredVocab = selectedTopic === 'all' ? vocabulary : vocabulary.filter(v => v.topic_id === selectedTopic);
      const currentItem = filteredVocab[currentIndex];
      const currentRating = currentItem ? getRatingById(ratings[currentItem.id]?.rating) : null;

      useEffect(() => { setCurrentIndex(0); setIsFlipped(false); }, [selectedTopic]);

      const goNext = () => { setIsFlipped(false); setTimeout(() => setCurrentIndex(prev => (prev + 1) % filteredVocab.length), 100); };
      const goPrev = () => { setIsFlipped(false); setTimeout(() => setCurrentIndex(prev => (prev - 1 + filteredVocab.length) % filteredVocab.length), 100); };
      const goRandom = () => { setIsFlipped(false); setTimeout(() => setCurrentIndex(Math.floor(Math.random() * filteredVocab.length)), 100); };
      const handleRate = (ratingId) => { if (currentItem && user) { onRate(currentItem.id, ratingId); goNext(); } };

      if (!currentItem) return <div className="text-center py-12 text-gray-500">No flashcards available</div>;

      return (
        <div className="max-w-2xl mx-auto p-4">
          <div className="bg-white rounded-2xl shadow-lg p-4 mb-6 flex flex-wrap items-center justify-between gap-4">
            <select value={selectedTopic} onChange={(e) => setSelectedTopic(e.target.value)} className="px-4 py-2 border rounded-xl font-medium">
              <option value="all">All Topics ({vocabulary.length} words)</option>
              {topics.map(t => {
                const count = vocabulary.filter(v => v.topic_id === t.id).length;
                return <option key={t.id} value={t.id}>{t.icon} {t.translation?.title_native} ({count})</option>;
              })}
            </select>
            <div className="text-gray-600 font-medium">{currentIndex + 1} / {filteredVocab.length}</div>
          </div>

          <div className={`flip-card ${isFlipped ? 'flipped' : ''} cursor-pointer mb-6`} onClick={() => setIsFlipped(!isFlipped)}>
            <div className="flip-card-inner relative" style={{ minHeight: '350px' }}>
              <div className="flip-card-front absolute inset-0 bg-white rounded-3xl shadow-xl p-8 flex flex-col items-center justify-center">
                {currentRating && (
                  <div className={`absolute top-4 right-4 px-4 py-2 rounded-full text-sm font-medium ${currentRating.color} text-white shadow-md`}>
                    {currentRating.emoji} {currentRating.label}
                  </div>
                )}
                <div className={`text-5xl font-bold text-gray-800 mb-4 ${fontClass}`}>{currentItem.translation?.native_text}</div>
                <div className="text-3xl text-blue-600 font-devanagari mb-4">{currentItem.translation?.devanagari}</div>
                <div className="absolute bottom-6 text-gray-400 text-sm">👆 Tap to flip</div>
              </div>
              <div className="flip-card-back absolute inset-0 bg-gradient-to-br from-jade-50 to-white rounded-3xl shadow-xl p-8 flex flex-col items-center justify-center">
                <div className="w-32 h-32 mb-4 flex items-center justify-center">
                  {currentItem.extra_data?.colorCode ? (
                    <div className="w-24 h-24 rounded-xl shadow-lg" style={{ backgroundColor: currentItem.extra_data.colorCode }} />
                  ) : (
                    <img src={getImageUrl(currentItem.topic_id, currentItem.image_filename)} alt="" className="max-w-full max-h-full object-contain" />
                  )}
                </div>
                <div className="text-3xl font-bold text-gray-800">{currentItem.english_text}</div>
              </div>
            </div>
          </div>

          <div className="flex justify-center gap-3 mb-6">
            <button onClick={goPrev} className="px-6 py-3 bg-gray-100 rounded-xl hover:bg-gray-200 font-medium">← Prev</button>
            <button onClick={goRandom} className="px-6 py-3 bg-purple-500 text-white rounded-xl hover:bg-purple-600 font-medium shadow-md">🎲 Random</button>
            <button onClick={goNext} className="px-6 py-3 bg-gray-100 rounded-xl hover:bg-gray-200 font-medium">Next →</button>
          </div>

          {user ? (
            <div className="bg-white rounded-2xl shadow-lg p-4">
              <div className="text-center text-sm text-gray-500 mb-3">How well do you know this?</div>
              <div className="flex flex-wrap justify-center gap-2">
                {RATINGS.map((r) => (
                  <button key={r.id} onClick={() => handleRate(r.id)}
                    className={`px-4 py-2 rounded-xl text-sm font-medium transition-all ${
                      ratings[currentItem.id]?.rating === r.id ? r.color + ' text-white shadow-lg' : 'bg-gray-100 hover:bg-gray-200'
                    }`}>{r.emoji} {r.label}</button>
                ))}
              </div>
            </div>
          ) : (
            <div className="bg-amber-50 rounded-2xl p-4 text-center">
              <p className="text-amber-700 text-sm">Sign in to save your progress</p>
            </div>
          )}
        </div>
      );
    }

    function ProgressView({ topics, vocabulary, ratings, languageCode, user }) {
      const fontClass = LANGUAGE_FONTS[languageCode] || 'font-body';

      const stats = useMemo(() => {
        const result = { total: vocabulary.length, rated: 0, byRating: {}, byTopic: {} };
        RATINGS.forEach(r => { result.byRating[r.id] = 0; });
        topics.forEach(t => {
          result.byTopic[t.id] = { topic: t, total: 0, rated: 0, byRating: {} };
          RATINGS.forEach(r => { result.byTopic[t.id].byRating[r.id] = 0; });
        });
        vocabulary.forEach(vocab => {
          const rating = ratings[vocab.id]?.rating;
          if (result.byTopic[vocab.topic_id]) {
            result.byTopic[vocab.topic_id].total++;
            if (rating) { result.byTopic[vocab.topic_id].rated++; result.byTopic[vocab.topic_id].byRating[rating]++; }
          }
          if (rating) { result.rated++; result.byRating[rating]++; }
        });
        return result;
      }, [topics, vocabulary, ratings]);

      if (!user) {
        return (
          <div className="max-w-4xl mx-auto p-6 text-center">
            <div className="bg-white rounded-3xl shadow-xl p-8">
              <div className="w-24 h-24 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-6">
                <span className="text-5xl">📊</span>
              </div>
              <h2 className="text-2xl font-bold text-gray-800 mb-2">Track Your Progress</h2>
              <p className="text-gray-500">Sign in to track your vocabulary ratings.</p>
            </div>
          </div>
        );
      }

      const progressPercent = stats.total > 0 ? Math.round((stats.rated / stats.total) * 100) : 0;

      return (
        <div className="max-w-4xl mx-auto p-4 space-y-6">
          <div className="bg-white rounded-3xl shadow-xl p-6">
            <h2 className="text-2xl font-bold text-gray-800 mb-6">Overall Progress</h2>
            <div className="mb-4">
              <div className="flex items-center justify-between mb-2">
                <span className="text-gray-600">Vocabulary Rated</span>
                <span className="font-bold text-jade-600">{progressPercent}%</span>
              </div>
              <div className="h-4 bg-gray-100 rounded-full overflow-hidden">
                <div className="h-full bg-gradient-to-r from-jade-400 to-jade-600 rounded-full" style={{ width: `${Math.max(progressPercent, 2)}%` }} />
              </div>
              <p className="text-sm text-gray-500 mt-2">{stats.rated} of {stats.total} items rated</p>
            </div>

            <div className="grid grid-cols-5 gap-3 mt-6">
              {RATINGS.map(r => (
                <div key={r.id} className={`p-4 rounded-xl text-center ${r.color} bg-opacity-10`}>
                  <div className="text-2xl mb-1">{r.emoji}</div>
                  <div className={`text-2xl font-bold ${r.textColor}`}>{stats.byRating[r.id]}</div>
                </div>
              ))}
            </div>
          </div>

          <div className="bg-white rounded-2xl shadow-lg p-6">
            <h3 className="text-lg font-bold text-gray-800 mb-4">Progress by Topic</h3>
            <div className="space-y-4">
              {Object.values(stats.byTopic).filter(ts => ts.total > 0).map(ts => {
                const topicPercent = Math.round((ts.rated / ts.total) * 100);
                return (
                  <div key={ts.topic.id} className="border-b border-gray-100 pb-4 last:border-b-0">
                    <div className="flex items-center justify-between mb-2">
                      <div className="flex items-center gap-2">
                        <span className="text-xl">{ts.topic.icon}</span>
                        <span className={`font-medium text-gray-800 ${fontClass}`}>{ts.topic.translation?.title_native}</span>
                      </div>
                      <div className="text-sm text-gray-500">{ts.rated}/{ts.total} ({topicPercent}%)</div>
                    </div>
                    <div className="h-3 bg-gray-100 rounded-full overflow-hidden flex">
                      {RATINGS.map(r => {
                        const percent = (ts.byRating[r.id] / ts.total) * 100;
                        return percent > 0 ? <div key={r.id} className={r.color} style={{ width: `${percent}%` }} /> : null;
                      })}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    function AppContent() {
      const { user } = useAuth();
      const [currentLanguage, setCurrentLanguage] = useState(() => loadFromStorage(STORAGE_KEYS.language, 'my'));
      const [activeView, setActiveView] = useState(() => loadFromStorage(STORAGE_KEYS.view, 'chart'));
      const [activeTopic, setActiveTopic] = useState(() => loadFromStorage(STORAGE_KEYS.topic, null));
      const [showEnglish, setShowEnglish] = useState(() => loadFromStorage(STORAGE_KEYS.showEnglish, true));

      const { languages, loading: loadingLangs } = useLanguages();
      const { topics, loading: loadingTopics } = useTopics(currentLanguage);
      const { vocabulary, loading: loadingVocab } = useVocabulary(currentLanguage);
      const { ratings, updateRating } = useUserRatings(currentLanguage);

      useEffect(() => { saveToStorage(STORAGE_KEYS.language, currentLanguage); }, [currentLanguage]);
      useEffect(() => { saveToStorage(STORAGE_KEYS.view, activeView); }, [activeView]);
      useEffect(() => { saveToStorage(STORAGE_KEYS.topic, activeTopic); }, [activeTopic]);
      useEffect(() => { saveToStorage(STORAGE_KEYS.showEnglish, showEnglish); }, [showEnglish]);

      useEffect(() => {
        if (topics.length > 0) {
          const savedTopicExists = topics.some(t => t.id === activeTopic);
          if (!activeTopic || !savedTopicExists) setActiveTopic(topics[0].id);
        }
      }, [topics, activeTopic]);

      const topicVocabulary = activeTopic ? vocabulary.filter(v => v.topic_id === activeTopic) : [];
      const currentTopic = topics.find(t => t.id === activeTopic);

      if (loadingLangs) return <div className="min-h-screen flex items-center justify-center"><LoadingSpinner message="Loading..." /></div>;

      return (
        <div className="min-h-screen bg-gray-50">
          <Header currentLanguage={currentLanguage} languages={languages} onLanguageChange={setCurrentLanguage}
            activeView={activeView} onViewChange={setActiveView} />

          {activeView === 'chart' && !loadingTopics && topics.length > 0 && (
            <TopicNav topics={topics} activeTopic={activeTopic} onSelect={setActiveTopic} />
          )}

          <main className="pb-8">
            {(loadingTopics || loadingVocab) ? (
              <div className="py-12"><LoadingSpinner message="Loading vocabulary..." /></div>
            ) : (
              <>
                {activeView === 'chart' && (
                  <ChartView topic={currentTopic} vocabulary={topicVocabulary} ratings={ratings} onRate={updateRating}
                    languageCode={currentLanguage} showEnglish={showEnglish} onToggleEnglish={setShowEnglish} />
                )}
                {activeView === 'quiz' && (
                  <QuizView topics={topics} vocabulary={vocabulary} ratings={ratings} onRate={updateRating} languageCode={currentLanguage} user={user} />
                )}
                {activeView === 'flashcard' && (
                  <FlashcardView topics={topics} vocabulary={vocabulary} ratings={ratings} onRate={updateRating} languageCode={currentLanguage} user={user} />
                )}
                {activeView === 'progress' && (
                  <ProgressView topics={topics} vocabulary={vocabulary} ratings={ratings} languageCode={currentLanguage} user={user} />
                )}
              </>
            )}
          </main>

          <footer className="bg-gray-800 text-white py-6 px-4">
            <div className="max-w-7xl mx-auto text-center">
              <p className="text-gray-300 text-sm">KG Vocabulary Learning System</p>
              <p className="text-gray-400 text-xs mt-1">Multi-language vocabulary with Devanagari transliteration</p>
            </div>
          </footer>
        </div>
      );
    }

    function App() {
      return (
        <AuthProvider>
          <AppContent />
        </AuthProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
